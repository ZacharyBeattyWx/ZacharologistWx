<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live National Radar | ZacharologistWx</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07111f;
    }

    #radarEngine {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 1;
      transition: none;
      background: #07111f;
    }

    #radarEngine.is-ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <iframe
    id="radarEngine"
    src="./mosaic-radar-canvas-test.html?v=20260902f"
    title="Live national radar"
    allowfullscreen>
  </iframe>

  <script>
    (() => {
      const engine = document.getElementById("radarEngine");
      const MANIFEST_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)
      ? "./mrms-mosaic-loop-output/manifest.json"
      : "https://dt0cd6bl1yqh2.cloudfront.net/mrms/manifest.json";
      const HISTORY_OPTIONS = [
        [30, "30 min"],
        [60, "1 hr"],
        [120, "2 hrs"],
        [180, "3 hrs"],
        [240, "4 hrs"],
        [360, "6 hrs"],
        [720, "12 hrs"],
        [1080, "18 hrs"],
        [1440, "24 hrs"]
      ];

      let badgeFreshness = null;
      let freshnessTimer = null;
      let historySyncTimer = null;

      function relativeUpdateText(value) {
        const time = new Date(value).getTime();
        if (!Number.isFinite(time)) return "Updating automatically";

        const minutes = Math.max(0, Math.round((Date.now() - time) / 60000));
        if (minutes <= 1) return "Updated just now";
        if (minutes < 60) return `Updated ${minutes} min ago`;
        return `Updated at ${new Date(time).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
      }

      async function updateFreshness() {
        if (!badgeFreshness) return;
        try {
          const response = await fetch(`${MANIFEST_URL}?_=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const manifest = await response.json();
          const observations = Array.isArray(manifest.frames) ? manifest.frames : [];
          const newest = observations
            .map(frame => new Date(frame?.valid_time).getTime())
            .filter(Number.isFinite)
            .sort((a, b) => b - a)[0];

          badgeFreshness.textContent = Number.isFinite(newest)
            ? relativeUpdateText(newest)
            : "Updating automatically";
        } catch (_) {
          badgeFreshness.textContent = "Live radar";
        }
      }

      function installHistoryBehavior(doc) {
        if (doc.getElementById("homepage-radar-history-behavior")) return;

        const behavior = doc.createElement("script");
        behavior.id = "homepage-radar-history-behavior";
        behavior.textContent = `
          (() => {
            const ZWX_HISTORY_OPTIONS = [30,60,120,180,240,360,720,1080,1440];

            function historyTickLabel(minutes) {
              if (minutes < 60) return \`-\${minutes}m\`;
              const hours = minutes / 60;
              return \`-\${Number.isInteger(hours) ? hours : hours.toFixed(1)}h\`;
            }

            function historyStatusLabel(minutes) {
              if (minutes < 60) return \`\${minutes} min\`;
              const hours = minutes / 60;
              return \`\${Number.isInteger(hours) ? hours : hours.toFixed(1)} hr\`;
            }

            updateHistoryButtons = function() {
              historyStartLabel.textContent = historyTickLabel(historyMinutes);
              window.dispatchEvent(new CustomEvent("zwx-history-change", {
                detail: { minutes: historyMinutes }
              }));
            };

            applyHistoryWindow = function(minutes, preserveKey = currentFrameKey()) {
              const requested = Number(minutes);
              const available = Math.max(30, Number(manifest?.historyWindowMinutes || 60));
              const choices = ZWX_HISTORY_OPTIONS.filter(value => value <= available);
              const fallback = choices[choices.length - 1] || 60;
              historyMinutes = choices.includes(requested) ? requested : fallback;

              frames = filterHistory(allFrames, historyMinutes);
              let nextIndex = frames.findIndex(frame => frameKey(frame) === preserveKey);
              if (nextIndex < 0) nextIndex = frames.length - 1;
              currentFrameIndex = Math.max(0, nextIndex);

              updateHistoryButtons();
              updateFrameUi();
              warmAround(currentFrameIndex);
            };

            window.zwxSetHistoryWindow = async function(minutes) {
              const preserveKey = currentFrameKey();
              applyHistoryWindow(minutes, preserveKey);

              if (!frames.some(frame => frameKey(frame) === preserveKey)) {
                await showFrame(frames.length - 1, { quiet: true });
              }

              setStatus(\`MRMS playback window • \${historyStatusLabel(historyMinutes)}\`, "live");
              return historyMinutes;
            };

            window.zwxAvailableHistoryMinutes = function() {
              return Math.max(30, Number(manifest?.historyWindowMinutes || 60));
            };

            window.zwxCurrentHistoryMinutes = function() {
              return historyMinutes;
            };
          })();
        `;
        doc.body.appendChild(behavior);
      }

      function installHistorySelect(doc) {
        const row = doc.querySelector(".history-row");
        if (!row) return null;

        const existing = doc.getElementById("homeRadarHistorySelect");
        if (existing) return existing;

        const select = doc.createElement("select");
        select.id = "homeRadarHistorySelect";
        select.className = "home-radar-history-select";
        select.setAttribute("aria-label", "Radar history length");
        select.innerHTML = HISTORY_OPTIONS
          .map(([minutes, label]) => `<option value="${minutes}"${minutes === 180 ? " selected" : ""}>${label}</option>`)
          .join("");

        row.appendChild(select);

        select.addEventListener("change", async () => {
          const win = engine.contentWindow;
          if (typeof win?.zwxSetHistoryWindow !== "function") return;
          select.disabled = true;
          try {
            const selected = await win.zwxSetHistoryWindow(Number(select.value));
            select.value = String(selected);
          } finally {
            select.disabled = false;
          }
        });

        return select;
      }

      function syncHistorySelect(select) {
        if (!select) return;
        const win = engine.contentWindow;
        if (!win) return;

        const available = typeof win.zwxAvailableHistoryMinutes === "function"
          ? Number(win.zwxAvailableHistoryMinutes())
          : 60;
        const current = typeof win.zwxCurrentHistoryMinutes === "function"
          ? Number(win.zwxCurrentHistoryMinutes())
          : 60;

        [...select.options].forEach(option => {
          option.disabled = Number(option.value) > available;
        });

        if ([...select.options].some(option => Number(option.value) === current)) {
          select.value = String(current);
        }
      }

      function installHomepageUi() {
        const doc = engine.contentDocument;
        if (!doc?.head || !doc?.body) return;

        if (doc.documentElement.dataset.homepageRadarUiInstalled === "1") {
          engine.classList.add("is-ready");
          return;
        }
        doc.documentElement.dataset.homepageRadarUiInstalled = "1";
        doc.documentElement.classList.add("homepage-radar-mode");

        const style = doc.createElement("style");
        style.id = "homepage-radar-mode-style";
        style.textContent = `
          .homepage-radar-mode .panel {
            display: contents !important;
          }

          .homepage-radar-mode .panel > .eyebrow,
          .homepage-radar-mode .panel > h1,
          .homepage-radar-mode .panel > .subtitle,
          .homepage-radar-mode .panel > .status-row,
          .homepage-radar-mode .button-row,
          .homepage-radar-mode .range-row,
          .homepage-radar-mode .meta {
            display: none !important;
          }

          .homepage-radar-mode .home-radar-badge {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 9px;
            min-width: 186px;
            padding: 9px 12px;
            border: 1px solid rgba(148,163,184,.28);
            border-radius: 11px;
            background: rgba(4,10,22,.88);
            box-shadow: 0 10px 26px rgba(0,0,0,.28);
            backdrop-filter: blur(10px);
            pointer-events: none;
          }

          .homepage-radar-mode .home-radar-live-dot {
            width: 8px;
            height: 8px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px rgba(74,222,128,.7);
          }

          .homepage-radar-mode .home-radar-badge-copy {
            min-width: 0;
          }

          .homepage-radar-mode .home-radar-badge strong {
            display: block;
            color: #f8fafc;
            font-size: .72rem;
            font-weight: 900;
            letter-spacing: .055em;
            text-transform: uppercase;
            line-height: 1.1;
          }

          .homepage-radar-mode .home-radar-badge span:last-child {
            display: block;
            margin-top: 3px;
            color: #94a3b8;
            font-size: .62rem;
            font-weight: 700;
            line-height: 1.1;
          }

          .homepage-radar-mode .playback {
            position: fixed !important;
            left: 50% !important;
            bottom: 14px !important;
            z-index: 30 !important;
            width: min(520px, calc(100vw - 28px)) !important;
            transform: translateX(-50%) !important;
            display: grid !important;
            grid-template-columns: 112px 1fr !important;
            grid-template-areas:
              "history controls"
              "readout readout"
              "timeline timeline" !important;
            gap: 7px 9px !important;
            padding: 9px 10px 8px !important;
            border: 1px solid rgba(148,163,184,.28) !important;
            border-radius: 13px !important;
            background: rgba(4,10,22,.90) !important;
            box-shadow: 0 14px 34px rgba(0,0,0,.34) !important;
            backdrop-filter: blur(12px) !important;
          }

          .homepage-radar-mode .history-row {
            grid-area: history !important;
            display: block !important;
          }

          .homepage-radar-mode .history-label,
          .homepage-radar-mode .history-buttons {
            display: none !important;
          }

          .homepage-radar-mode .home-radar-history-select {
            width: 100% !important;
            min-height: 31px !important;
            padding: 5px 28px 5px 9px !important;
            border: 1px solid rgba(56,189,248,.55) !important;
            border-radius: 8px !important;
            background: rgba(14,116,144,.22) !important;
            color: #e0f2fe !important;
            font-size: .68rem !important;
            font-weight: 900 !important;
            cursor: pointer !important;
          }

          .homepage-radar-mode .home-radar-history-select:disabled {
            opacity: .72 !important;
            cursor: wait !important;
          }

          .homepage-radar-mode .playback-buttons {
            grid-area: controls !important;
            display: grid !important;
            grid-template-columns: 36px 1fr 36px 68px !important;
            gap: 5px !important;
          }

          .homepage-radar-mode .playback-buttons button,
          .homepage-radar-mode .playback-buttons select {
            min-height: 31px !important;
            padding: 5px !important;
            border-radius: 8px !important;
            font-size: .68rem !important;
          }

          .homepage-radar-mode .frame-readout {
            grid-area: readout !important;
            display: flex !important;
            justify-content: space-between !important;
            padding-inline: 2px !important;
            color: #dbeafe !important;
            font-size: .67rem !important;
          }

          .homepage-radar-mode .timeline {
            grid-area: timeline !important;
            gap: 2px !important;
          }

          .homepage-radar-mode .timeline input[type="range"] {
            margin: 0 !important;
          }

          .homepage-radar-mode .timeline-labels {
            font-size: .52rem !important;
          }

          .homepage-radar-mode .legend {
            position: fixed !important;
            top: 14px !important;
            right: 14px !important;
            z-index: 30 !important;
            width: 224px !important;
            margin: 0 !important;
            padding: 8px 10px !important;
            border: 1px solid rgba(148,163,184,.24) !important;
            border-radius: 10px !important;
            background: rgba(4,10,22,.82) !important;
            box-shadow: 0 10px 24px rgba(0,0,0,.24) !important;
            backdrop-filter: blur(10px) !important;
          }

          .homepage-radar-mode .legend-title {
            margin-bottom: 5px !important;
            color: #cbd5e1 !important;
            font-size: .60rem !important;
            text-transform: uppercase !important;
            letter-spacing: .06em !important;
          }

          .homepage-radar-mode .legend-bar {
            height: 7px !important;
          }

          .homepage-radar-mode .legend-labels {
            margin-top: 3px !important;
            font-size: .50rem !important;
          }

          @media (max-width: 720px), (max-height: 440px) {
            .homepage-radar-mode .home-radar-badge {
              top: 9px !important;
              left: 9px !important;
              min-width: 0 !important;
              padding: 7px 9px !important;
            }

            .homepage-radar-mode .home-radar-badge strong {
              font-size: .65rem !important;
            }

            .homepage-radar-mode .home-radar-badge span:last-child {
              font-size: .56rem !important;
            }

            .homepage-radar-mode .legend {
              display: none !important;
            }

            .homepage-radar-mode .playback {
              bottom: 9px !important;
              width: calc(100vw - 18px) !important;
              grid-template-columns: 100px 1fr !important;
              padding: 7px 8px !important;
              gap: 5px 7px !important;
            }

            .homepage-radar-mode .playback-buttons {
              grid-template-columns: 32px 1fr 32px 60px !important;
            }
          }

          @media (max-width: 380px) {
            .homepage-radar-mode .playback {
              grid-template-columns: 1fr !important;
              grid-template-areas:
                "history"
                "controls"
                "readout"
                "timeline" !important;
            }
          }
        `;
        doc.head.appendChild(style);

        installHistoryBehavior(doc);
        const historySelect = installHistorySelect(doc);

        // Homepage defaults: full opacity, 3-hour history, and 2x timelapse.
        const opacityControl = doc.getElementById("radarOpacity");
        if (opacityControl) {
          opacityControl.value = "1";
          opacityControl.dispatchEvent(new Event("input", { bubbles: true }));
        }

        const speedControl = doc.getElementById("speedSelect");
        if (speedControl) {
          speedControl.value = "2";
          speedControl.dispatchEvent(new Event("change", { bubbles: true }));
        }

        let startupHistoryApplied = false;
        const applyStartupHistory = async () => {
          if (startupHistoryApplied || !historySelect) return;
          const win = engine.contentWindow;
          const available = typeof win?.zwxAvailableHistoryMinutes === "function"
            ? Number(win.zwxAvailableHistoryMinutes())
            : 0;
          if (available < 180 || typeof win?.zwxSetHistoryWindow !== "function") return;
          startupHistoryApplied = true;
          const selected = await win.zwxSetHistoryWindow(180);
          historySelect.value = String(selected);
        };

        const oldBadge = doc.getElementById("homeRadarBadge");
        if (oldBadge) oldBadge.remove();

        const badge = doc.createElement("div");
        badge.id = "homeRadarBadge";
        badge.className = "home-radar-badge";
        badge.innerHTML = `
          <span class="home-radar-live-dot" aria-hidden="true"></span>
          <span class="home-radar-badge-copy">
            <strong>Live National Radar</strong>
            <span id="homeRadarFreshness">Updating automatically</span>
          </span>
        `;
        doc.body.appendChild(badge);

        badgeFreshness = doc.getElementById("homeRadarFreshness");

        const legendTitle = doc.querySelector(".legend-title");
        if (legendTitle) legendTitle.textContent = "Radar Intensity (dBZ)";

        engine.classList.add("is-ready");
        updateFreshness();
        syncHistorySelect(historySelect);

        if (freshnessTimer) clearInterval(freshnessTimer);
        freshnessTimer = setInterval(updateFreshness, 30000);

        if (historySyncTimer) clearInterval(historySyncTimer);
        historySyncTimer = setInterval(() => {
          syncHistorySelect(historySelect);
          applyStartupHistory().catch(() => {});
        }, 1000);
        applyStartupHistory().catch(() => {});
      }

      engine.addEventListener("load", installHomepageUi);
      // The child iframe can finish before this script attaches its load handler, especially from production/browser cache.
      if (engine.contentDocument?.readyState === "complete") {
        installHomepageUi();
      }
    })();
  </script>
</body>
</html>
