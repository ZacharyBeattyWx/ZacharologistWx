<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZacharologistWx Mapbox Radar + Alerts</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #07111f;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #07111f;
    }

    #radarOverlayCanvas,
    #alertOverlayCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #radarOverlayCanvas {
      z-index: 1;
    }

    #alertOverlayCanvas {
      z-index: 2;
    }

    #omegaAlertPopupLayer {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      position: fixed;
      z-index: 3;
      background: rgba(5, 10, 22, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }

    .right-ui-rail {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 6;
      width: clamp(340px, 26vw, 430px);
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }

    .right-ui-rail > .panel {
      position: relative;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      width: 100%;
      transform: none;
      pointer-events: auto;
    }

    .control-card {
      max-height: min(52vh, 440px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      overflow-y: auto;
    }

    .control-title {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.2;
    }

    .status {
      color: #cbd5e1;
      font-size: 0.78rem;
      line-height: 1.35;
      min-height: 1.35em;
      overflow-wrap: anywhere;
    }

    .card-title {
      margin: 0;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.2;
    }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .card-actions {
      display: inline-flex;
      gap: 6px;
    }

    .card-actions button {
      padding: 6px 8px;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    label {
      display: grid;
      gap: 5px;
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    select,
    button,
    input[type="range"] {
      min-width: 0;
      font: inherit;
    }

    select,
    button {
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 5px;
      background: rgba(15, 23, 42, 0.95);
      color: #ffffff;
    }

    select {
      width: 100%;
      padding: 8px;
    }

    button {
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover {
      border-color: rgba(56, 189, 248, 0.72);
    }

    .toolbar-field {
      min-width: 0;
    }

    .primary-controls-row,
    .select-row {
      display: grid;
      grid-template-columns: minmax(120px, 1fr) auto;
      gap: 8px;
      align-items: end;
    }

    .select-row {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .playback-controls {
      display: inline-flex;
      gap: 6px;
      align-items: center;
    }

    .playback-controls button {
      min-width: 56px;
      padding: 7px 8px;
    }

    .speed-toolbar {
      display: grid;
      grid-template-columns: auto minmax(90px, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .speed-toolbar span,
    .opacity-toolbar span {
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .speed-toolbar output {
      color: #ffffff;
      font-size: 0.76rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .opacity-toolbar {
      display: grid;
      grid-template-columns: auto minmax(90px, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .opacity-toolbar output {
      color: #ffffff;
      font-size: 0.78rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      accent-color: #38bdf8;
    }

    .readout {
      color: #e2e8f0;
      font-size: 0.76rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .alert-readout {
      color: #bfdbfe;
    }

    .right-alerts-panel {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      max-height: min(46vh, 430px);
    }

    .alerts-drawer-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      min-width: 0;
    }

    .alerts-drawer-title {
      margin: 0;
      color: #ffffff;
      font-size: 0.82rem;
      line-height: 1.2;
      font-weight: 800;
    }

    .alerts-drawer-summary {
      color: #dbeafe;
      font-size: 0.74rem;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .alerts-drawer-toggle {
      min-width: 70px;
      padding: 5px 10px;
      font-size: 0.72rem;
      white-space: nowrap;
    }

    .active-alerts-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 auto;
      min-height: 0;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .right-alerts-panel.is-collapsed .active-alerts-panel {
      max-height: 0;
      overflow: hidden;
      padding-right: 0;
    }

    .active-alert-group {
      display: grid;
      gap: 6px;
    }

    .active-alert-group-title {
      color: #93c5fd;
      margin: 0;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .active-alert-list {
      display: grid;
      gap: 6px;
    }

    .active-alert-item {
      display: grid;
      gap: 2px;
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-left: 4px solid var(--alert-color, #7c4dff);
      border-radius: 5px;
      background: rgba(15, 23, 42, 0.82);
      color: #e2e8f0;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .active-alert-item:hover {
      border-color: rgba(56, 189, 248, 0.72);
      background: rgba(30, 41, 59, 0.9);
    }

    .active-alert-event {
      color: #ffffff;
      font-size: 0.74rem;
      font-weight: 800;
      line-height: 1.2;
    }

    .active-alert-area,
    .active-alert-meta {
      font-size: 0.66rem;
      line-height: 1.2;
    }

    .active-alert-area {
      color: #cbd5e1;
    }

    .active-alert-meta {
      color: #93c5fd;
    }

    .active-alert-empty {
      color: #cbd5e1;
      font-size: 0.72rem;
      line-height: 1.35;
    }

    .details-panel {
      right: calc(clamp(340px, 26vw, 430px) + 28px);
      top: 16px;
      display: none;
      width: min(42vw, 480px);
      max-height: calc(100vh - 32px);
      padding: 12px;
      overflow: auto;
      z-index: 7;
    }

    .details-panel.is-visible {
      display: grid;
      gap: 10px;
    }

    .details-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: start;
    }

    .details-title {
      margin: 0;
      color: #ffffff;
      font-size: 0.98rem;
      line-height: 1.25;
    }

    .details-close {
      width: 32px;
      height: 32px;
      padding: 0;
      line-height: 1;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 7px 10px;
      color: #dbeafe;
      font-size: 0.76rem;
      line-height: 1.35;
    }

    .details-label {
      color: #93c5fd;
      font-weight: 800;
    }

    .details-value {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mapboxgl-popup-content {
      width: 340px;
      max-width: calc(100vw - 28px);
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #f8fafc;
      box-shadow: none;
    }

    .mapboxgl-popup {
      z-index: 4;
    }

    .mapboxgl-ctrl-top-left {
      top: 12px;
      left: 12px;
    }

    .mapboxgl-popup-tip {
      display: none;
    }

    .mapboxgl-popup-close-button {
      top: 4px;
      right: 5px;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      line-height: 17px;
    }

    .mapboxgl-popup-close-button:hover {
      background: rgba(0, 0, 0, 0.34);
      color: #ffffff;
    }

    .omega-alert-popup {
      position: absolute;
      width: 238px;
      max-width: min(245px, calc(100vw - 24px));
      overflow: hidden;
      background: #303236;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.42);
      pointer-events: auto;
      transform: translate(-50%, calc(-100% - 8px));
    }

    .omega-alert-stack {
      display: grid;
      background: #303236;
    }

    .omega-alert-card {
      background: #303236;
    }

    .omega-alert-card + .omega-alert-card {
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .omega-alert-header {
      position: relative;
      min-height: 28px;
      padding: 0 22px 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--alert-color, #7c4dff);
      color: #ffffff;
      font-size: 0.64rem;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
      overflow-wrap: anywhere;
    }

    .omega-alert-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .omega-alert-close {
      position: absolute;
      top: 3px;
      right: 4px;
      width: 17px;
      height: 17px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      line-height: 1;
    }

    .omega-alert-body {
      display: grid;
      background: #303236;
    }

    .omega-alert-summary-row {
      min-height: 38px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 8px 8px 8px 10px;
    }

    .omega-alert-headline {
      color: #f8fafc;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .omega-alert-issued {
      min-height: 28px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #c7ccd6;
      font-size: 0.66rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .omega-alert-expires {
      min-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      font-size: 0.7rem;
      font-weight: 800;
      line-height: 1.25;
      text-align: center;
    }

    .omega-alert-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      min-height: 40px;
      gap: 10px;
      align-items: center;
      padding: 8px 8px 8px 10px;
      background: #303236;
    }

    .omega-alert-row-text {
      min-width: 0;
      color: #d7dbe3;
      font-size: 0.7rem;
      font-weight: 700;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .omega-alert-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }

    .omega-alert-icon-btn {
      width: 26px;
      height: 26px;
      min-height: 26px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }

    .omega-alert-icon-btn:hover {
      border-color: var(--alert-color, #7c4dff);
      background: #1b1d21;
    }

    .omega-alert-radar-btn,
    .omega-alert-details-btn {
      flex: 0 0 auto;
    }

    .token-message {
      position: fixed;
      inset: auto 14px 14px 14px;
      z-index: 5;
      max-width: 620px;
      padding: 12px;
      background: rgba(127, 29, 29, 0.95);
      border: 1px solid rgba(248, 113, 113, 0.55);
      border-radius: 6px;
      color: #ffffff;
      font-size: 0.86rem;
      line-height: 1.45;
    }

    @media (max-width: 720px) {
      .right-ui-rail {
        top: 10px;
        left: 8px;
        right: 8px;
        width: auto;
        max-height: calc(100vh - 20px);
        gap: 10px;
      }

      .primary-controls-row,
      .select-row {
        grid-template-columns: 1fr;
      }

      .card-header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .card-actions {
        justify-content: flex-start;
      }

      .control-card {
        max-height: 44vh;
      }

      .right-alerts-panel {
        padding: 10px;
        max-height: 42vh;
      }

      .active-alerts-panel {
        max-height: 30vh;
      }

      .details-panel {
        top: auto;
        left: 8px;
        right: 8px;
        bottom: 8px;
        width: auto;
        max-height: 35vh;
      }
    }
  </style>
</head>
<body>
  <div id="map" aria-label="Mapbox radar map"></div>
  <canvas id="radarOverlayCanvas" aria-hidden="true"></canvas>
  <canvas id="alertOverlayCanvas" aria-hidden="true"></canvas>
  <div id="omegaAlertPopupLayer" aria-live="polite"></div>

  <div class="right-ui-rail">
  <section class="panel control-card" aria-label="Radar controls">
    <div class="card-header">
      <h1 class="card-title">Mapbox Radar + Alerts</h1>
      <div class="card-actions">
        <button id="refreshNowButton" type="button">Refresh</button>
      </div>
    </div>

    <div class="speed-toolbar">
      <span>Playback speed</span>
      <input
        id="playbackSpeedSlider"
        type="range"
        min="0.5"
        max="6"
        step="0.25"
        value="1"
        aria-label="Playback speed"
      >
      <output id="playbackSpeedValue">1x</output>
    </div>

    <div class="primary-controls-row">
      <label class="toolbar-field">
        Site
        <select id="siteSelect">
          <option value="">Loading...</option>
        </select>
      </label>
      <div class="playback-controls" aria-label="Radar playback controls">
        <button id="previousFrameButton" type="button">Prev</button>
        <button id="playPauseButton" type="button" aria-pressed="false">Play</button>
        <button id="nextFrameButton" type="button">Next</button>
      </div>
    </div>

    <div class="select-row">
      <label class="toolbar-field">
        Product
        <select id="productSelect">
          <option value="">Loading...</option>
        </select>
      </label>
      <label class="toolbar-field">
        Frame
        <select id="frameSelect">
          <option value="">Loading...</option>
        </select>
      </label>
    </div>

    <div class="opacity-toolbar">
      <span>Opacity</span>
      <input id="opacityRange" type="range" min="0" max="1" step="0.05" value="1">
      <output id="opacityValue">100%</output>
    </div>

    <div class="status" id="statusText">Loading map...</div>
    <div class="readout" id="frameReadout">Frame time unavailable</div>
    <div class="readout alert-readout" id="alertReadout">Alerts: waiting for NWS refresh...</div>

  </section>

  <section class="panel right-alerts-panel" aria-label="Active alerts list">
    <div class="alerts-drawer-header">
      <h2 class="alerts-drawer-title">Active Alerts</h2>
      <button
        id="toggleAlertsPanelButton"
        class="alerts-drawer-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="activeAlertsPanel"
      >Hide</button>
    </div>
    <div class="alerts-drawer-summary" id="alertsDrawerSummary">Active Alerts: none</div>
    <div class="active-alerts-panel" id="activeAlertsPanel" aria-live="polite"></div>
  </section>
  </div>

  <section class="panel details-panel" id="detailsPanel" aria-label="NWS alert details" aria-live="polite">
    <div class="details-header">
      <h2 class="details-title" id="detailsTitle">Alert Details</h2>
      <button class="details-close" id="detailsCloseButton" type="button" aria-label="Close alert details">&times;</button>
    </div>
    <div class="details-grid" id="detailsGrid"></div>
  </section>

  <script>
    window.MAPBOX_PUBLIC_TOKEN = "pk.eyJ1IjoiemFjaGFyeWJlYXR0eXd4IiwiYSI6ImNtcGRpOHFxOTBja2Iyc29nOXBtNDJkOTgifQ.A5PX2kdbDFzGYOoHmmnrKg";
  </script>

    <script>
    // constants
    const MAPBOX_TOKEN = window.MAPBOX_PUBLIC_TOKEN;
    const MAPBOX_STYLE = "mapbox://styles/zacharybeattywx/cmpdipwzh00fq01sccdj806xy";
    const RADAR_DATA_BASE_URL = "https://radar.zacharologistwx.com";
    const RADAR_CATALOG_URL = `${RADAR_DATA_BASE_URL}/radar/frames.json`;
    const LOCAL_RADAR_CATALOG_URL = "/radar/frames.json";
    const NWS_ALERT_AREAS = ["NC", "SC", "VA", "GA"];
    const NWS_ALERTS_URL = `https://api.weather.gov/alerts/active?${NWS_ALERT_AREAS.map((area) => `area=${area}`).join("&")}`;
    const NWS_ALERT_SOURCE_ID = "nws-alert-polygons";
    const NWS_ALERT_FILL_LAYER_ID = "nws-alert-polygons-fill";
    const NWS_ALERT_LINE_LAYER_ID = "nws-alert-polygons-line";
    const NWS_ALERT_REFRESH_MS = 60000;
    const RADAR_CATALOG_REFRESH_MS = 60000;
    const DEFAULT_SITE = "KFCX";
    const DEFAULT_PRODUCT = "N0B";
    const BASE_PLAY_INTERVAL_MS = 360;
    const MIN_PLAY_INTERVAL_MS = 60;
    const MIN_MOBILE_PLAY_INTERVAL_MS = 120;
    const LOOP_END_PAUSE_MS = 1200;
    const MOBILE_PRELOAD_RADIUS = 3;
    const DESKTOP_PRELOAD_FRAME_LIMIT = 25;

    const statusText = document.querySelector("#statusText");
    const siteSelect = document.querySelector("#siteSelect");
    const productSelect = document.querySelector("#productSelect");
    const frameSelect = document.querySelector("#frameSelect");
    const previousFrameButton = document.querySelector("#previousFrameButton");
    const playPauseButton = document.querySelector("#playPauseButton");
    const nextFrameButton = document.querySelector("#nextFrameButton");
    const playbackSpeedSlider = document.querySelector("#playbackSpeedSlider");
    const playbackSpeedValue = document.querySelector("#playbackSpeedValue");
    const opacityRange = document.querySelector("#opacityRange");
    const opacityValue = document.querySelector("#opacityValue");
    const radarOverlayCanvas = document.querySelector("#radarOverlayCanvas");
    const radarOverlayContext = radarOverlayCanvas.getContext("2d");
    const alertOverlayCanvas = document.querySelector("#alertOverlayCanvas");
    const alertOverlayContext = alertOverlayCanvas.getContext("2d");
    const omegaAlertPopupLayer = document.querySelector("#omegaAlertPopupLayer");
    const frameReadout = document.querySelector("#frameReadout");
    const alertReadout = document.querySelector("#alertReadout");
    const rightAlertsPanel = document.querySelector(".right-alerts-panel");
    const alertsDrawerSummary = document.querySelector("#alertsDrawerSummary");
    const toggleAlertsPanelButton = document.querySelector("#toggleAlertsPanelButton");
    const activeAlertsPanel = document.querySelector("#activeAlertsPanel");
    const refreshNowButton = document.querySelector("#refreshNowButton");
    const detailsPanel = document.querySelector("#detailsPanel");
    const detailsTitle = document.querySelector("#detailsTitle");
    const detailsGrid = document.querySelector("#detailsGrid");
    const detailsCloseButton = document.querySelector("#detailsCloseButton");

    let map = null;
    let radarCatalog = null;
    let selectedSite = DEFAULT_SITE;
    let selectedProduct = DEFAULT_PRODUCT;
    let selectedFrames = [];
    let selectedFrameIndex = 0;
    let radarFrameApplyToken = 0;
    let activeRadarFrame = null;
    let activeRadarImage = null;
    let activeRadarCanvas = null;
    let activeAlertFeatures = [];
    let activeAlertsWithoutGeometry = [];
    let overlayRedrawFrame = null;
    let activeAlertsById = new Map();
    let alertRefreshTimer = null;
    let activeOmegaAlertPopup = null;
    let suppressNextPopupClose = false;
    let alertDiagnostics = {
      totalFetched: 0,
      withGeometry: 0,
      withoutGeometry: 0,
      geoJsonPolygons: 0,
      drawnPolygons: 0,
      states: NWS_ALERT_AREAS,
      lastUpdated: "",
      lastError: ""
    };
    let radarCatalogRefreshTimer = null;
    let lastCatalogSignature = "";
    let lastRadarCatalogCheckText = "";
    let activeRadarCatalogSource = "external";
    let isRadarPlaying = false;
    let radarPlaybackTimer = null;
    let radarPlaybackToken = 0;
    const radarImageCache = new Map();
    let radarPreloadToken = 0;
    let isAlertsPanelExpanded = false;
    let hasLoggedDirectRadarDraw = false;

    function setStatus(message) {
      statusText.textContent = message;
    }

    function showTokenMessage() {
      const message = document.createElement("div");
      message.className = "token-message";
      message.innerHTML = `
        <strong>Missing Mapbox public token</strong><br>
        Create a local ignored file named <code>mapbox-token.local.js</code> that defines
        <code>window.MAPBOX_PUBLIC_TOKEN</code> with a public <code>pk.*</code> token.
      `;
      document.body.appendChild(message);
    }

    function option(label, value) {
      const optionEl = document.createElement("option");
      optionEl.value = value;
      optionEl.textContent = label;
      return optionEl;
    }

    function alertValue(value) {
      return value === undefined || value === null || value === "" ? "Unavailable" : String(value);
    }

    function formatTime(value) {
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? alertValue(value) : date.toLocaleString();
    }

    function formatShortTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return alertValue(value);

      return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function resolveRadarFrameUrl(url) {
      const rawUrl = String(url || "").trim();

      if (!rawUrl) {
        return "";
      }

      if (/^https?:\/\//i.test(rawUrl)) {
        return rawUrl;
      }

      if (rawUrl.startsWith("/radar/")) {
        return `${RADAR_DATA_BASE_URL}${rawUrl}`;
      }

      return new URL(rawUrl, `${RADAR_DATA_BASE_URL}/`).toString();
    }

    function isMobilePlaybackMode() {
      return window.matchMedia("(max-width: 760px)").matches;
    }

    function isMobileRadarPlaybackMode() {
      return isMobilePlaybackMode();
    }

    function normalizePlaybackSpeed(value) {
      const rawSpeed = Number(value);
      const finiteSpeed = Number.isFinite(rawSpeed) ? rawSpeed : 1;
      const quarterStepSpeed = Math.round(finiteSpeed * 4) / 4;
      return Math.min(6, Math.max(0.5, quarterStepSpeed));
    }

    function formatPlaybackSpeed(speed) {
      return Number.isInteger(speed)
        ? `${speed}x`
        : `${speed.toFixed(2).replace(/0+$/, "").replace(/\.$/, "")}x`;
    }

    function getRadarFrameUrl(frame) {
      return frame ? resolveRadarFrameUrl(frame.url) : "";
    }

    function selectedFrameUrl(index) {
      return getRadarFrameUrl(selectedFrames[index]);
    }

    function validateBounds(bounds) {
      return Array.isArray(bounds) &&
        bounds.length === 2 &&
        Array.isArray(bounds[0]) &&
        Array.isArray(bounds[1]) &&
        bounds[0].length === 2 &&
        bounds[1].length === 2 &&
        bounds.flat().every(Number.isFinite);
    }

    // map setup
    function overlayCeilingLayerId() {
      const layers = map?.getStyle().layers || [];
      const ceilingLayer = layers.find((layer) => {
        const id = String(layer.id || "").toLowerCase();
        const sourceLayer = String(layer["source-layer"] || "").toLowerCase();
        return layer.type === "symbol" ||
          id.includes("label") ||
          id.includes("boundary") ||
          id.includes("admin") ||
          sourceLayer.includes("boundary") ||
          sourceLayer.includes("admin");
      });
      return ceilingLayer ? ceilingLayer.id : undefined;
    }

    function lockMapOrientation() {
      if (!map) return;

      if (Math.abs(map.getBearing()) > 0.01) {
        map.setBearing(0);
      }

      if (Math.abs(map.getPitch()) > 0.01) {
        map.setPitch(0);
      }
    }

    function initializeMap() {
      if (!MAPBOX_TOKEN || !String(MAPBOX_TOKEN).startsWith("pk.")) {
        setStatus("Missing Mapbox public token.");
        showTokenMessage();
        return;
      }

      mapboxgl.accessToken = MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: "map",
        style: MAPBOX_STYLE,
        center: [-79.4, 35.5],
        zoom: 5.5,
        projection: "mercator",
        renderWorldCopies: false,
        bearing: 0,
        pitch: 0,
        pitchWithRotate: false,
        attributionControl: true
      });

      map.addControl(new mapboxgl.NavigationControl(), "top-left");
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      if (map.setMaxPitch) {
        map.setMaxPitch(0);
      }
      map.on("move", scheduleOverlayRedraw);
      map.on("zoom", scheduleOverlayRedraw);
      map.on("render", scheduleOverlayRedraw);
      map.on("moveend", scheduleOverlayRedraw);
      map.on("zoomend", scheduleOverlayRedraw);
      map.on("move", positionOmegaAlertPopup);
      map.on("zoom", positionOmegaAlertPopup);
      map.on("render", positionOmegaAlertPopup);
      map.on("resize", positionOmegaAlertPopup);
      map.on("click", () => {
        if (suppressNextPopupClose) {
          suppressNextPopupClose = false;
          return;
        }

        closeOmegaAlertPopup();
      });
      map.on("rotate", lockMapOrientation);
      map.on("pitch", lockMapOrientation);
      map.on("resize", () => {
        scheduleOverlayRedraw();
      });
      window.addEventListener("resize", () => {
        scheduleOverlayRedraw();
        positionOmegaAlertPopup();
      });

      map.on("load", async () => {
        console.log("map loaded");
        resizeRadarCanvas();
        resizeAlertCanvas();
        setStatus("Loading radar catalog...");
        await loadRadarCatalog();
        startRadarCatalogRefresh();
        await loadNwsAlerts();
        alertRefreshTimer = window.setInterval(loadNwsAlerts, NWS_ALERT_REFRESH_MS);
      });
    }

    // radar catalog loading
    function availableSites() {
      return Object.keys(radarCatalog?.frames || {}).sort();
    }

    function availableProducts(site) {
      return Object.keys(radarCatalog?.frames?.[site] || {}).sort();
    }

    function productFrames(site, product) {
      const frames = radarCatalog?.frames?.[site]?.[product];

      if (!Array.isArray(frames)) {
        return [];
      }

      return frames
        .map((frame) => ({
          ...frame,
          validTimeDate: new Date(frame?.validTime)
        }))
        .filter((frame) => frame.url && validateBounds(frame.bounds) && !Number.isNaN(frame.validTimeDate.getTime()))
        .sort((a, b) => b.validTimeDate - a.validTimeDate);
    }

    function populateSiteSelect() {
      const sites = availableSites();
      siteSelect.replaceChildren(...sites.map((site) => option(site, site)));
      selectedSite = sites.includes(DEFAULT_SITE) ? DEFAULT_SITE : sites[0] || "";
      siteSelect.value = selectedSite;
    }

    function populateProductSelect(preferredProduct = DEFAULT_PRODUCT) {
      const products = availableProducts(selectedSite);
      productSelect.replaceChildren(...products.map((product) => option(product, product)));
      selectedProduct = products.includes(preferredProduct) ? preferredProduct : products[0] || "";
      productSelect.value = selectedProduct;
    }

    function populateFrameSelect() {
      frameSelect.replaceChildren(
        ...selectedFrames.map((frame, index) => {
          const label = `${index === 0 ? "Latest - " : ""}${formatTime(frame.validTime)} (${frame.slug || "frame"})`;
          return option(label, String(index));
        })
      );
      frameSelect.value = String(selectedFrameIndex);
    }

    function refreshSelectedFrames() {
      stopRadarPlayback();
      clearRadarFrameImageCache();
      selectedFrames = productFrames(selectedSite, selectedProduct);
      selectedFrameIndex = 0;
      lastCatalogSignature = radarCatalogSignatureFor(selectedSite, selectedProduct);
      populateFrameSelect();
      preloadSelectedFrameSet();
      applySelectedFrame();
    }

    function frameIdentity(frame) {
      return [
        frame?.slug || "",
        frame?.url || "",
        frame?.validTime || ""
      ].join("|");
    }

    function radarCatalogSignatureFor(site, product) {
      return productFrames(site, product).map(frameIdentity).join("||");
    }

    function catalogUrlWithTimestamp(baseUrl) {
      const url = new URL(baseUrl, window.location.href);
      url.searchParams.set("ts", String(Date.now()));
      return url.toString();
    }

    async function fetchRadarCatalogWithFallback() {
      const externalUrl = catalogUrlWithTimestamp(RADAR_CATALOG_URL);

      try {
        const response = await fetch(externalUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Radar catalog failed: ${response.status}`);
        }
        const catalog = await response.json();
        console.log("Radar catalog loaded: external radar data source", externalUrl);
        activeRadarCatalogSource = "external";
        return { catalog, source: "external" };
      } catch (externalError) {
        console.warn("External radar catalog failed, falling back to local /radar/frames.json", externalError);
      }

      const localUrl = catalogUrlWithTimestamp(LOCAL_RADAR_CATALOG_URL);
      const response = await fetch(localUrl, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Local fallback radar catalog failed: ${response.status}`);
      }
      const catalog = await response.json();
      console.log("Radar catalog loaded: local fallback", localUrl);
      activeRadarCatalogSource = "local";
      return { catalog, source: "local" };
    }

    function updateCatalogCheckedStatus(message = "Radar catalog checked") {
      const checkedAt = new Date().toLocaleTimeString();
      lastRadarCatalogCheckText = formatShortTime(new Date());
      setStatus(`${message}: ${checkedAt}`);

      const frame = selectedFrames[selectedFrameIndex];
      if (frame) {
        updateFrameReadout(frame);
      }
    }

    function updateSelectedFramesFromCatalog(options = {}) {
      const { forceLatest = false, catalogChanged = false } = options;
      const wasPlaying = isRadarPlaying;
      const previousFrame = selectedFrames[selectedFrameIndex];
      const previousIdentity = frameIdentity(previousFrame);
      const nextFrames = productFrames(selectedSite, selectedProduct);

      if (nextFrames.length === 0) {
        if (catalogChanged) {
          updateCatalogCheckedStatus("Catalog refreshed, no usable frames found");
        }
        return;
      }

      selectedFrames = nextFrames;
      clearRadarFrameImageCache();
      const newestIndex = getNewestFrameIndex();
      const newestFrame = selectedFrames[newestIndex];
      const hasNewerFrame = previousFrame
        ? newestFrame.validTimeDate > previousFrame.validTimeDate
        : true;
      const previousIndex = selectedFrames.findIndex((frame) => frameIdentity(frame) === previousIdentity);

      if (forceLatest || (!wasPlaying && hasNewerFrame)) {
        selectedFrameIndex = newestIndex;
      } else if (previousIndex !== -1) {
        selectedFrameIndex = previousIndex;
      } else {
        selectedFrameIndex = newestIndex;
      }

      populateFrameSelect();
      preloadSelectedFrameSet(selectedFrameIndex);
      applySelectedFrame();

      if (catalogChanged) {
        updateCatalogCheckedStatus(hasNewerFrame ? "Radar catalog refreshed with new frames" : "Radar catalog refreshed");
      }
    }

    function syncFrameSelectToSelection() {
      frameSelect.value = String(selectedFrameIndex);
    }

    function updatePlaybackButton() {
      playPauseButton.textContent = isRadarPlaying ? "Pause" : "Play";
      playPauseButton.setAttribute("aria-pressed", String(isRadarPlaying));
    }

    function updatePlaybackSpeedDisplay() {
      const speed = normalizePlaybackSpeed(playbackSpeedSlider.value);
      playbackSpeedSlider.value = String(speed);
      playbackSpeedValue.textContent = formatPlaybackSpeed(speed);
      return speed;
    }

    function playbackIntervalMs() {
      const speed = updatePlaybackSpeedDisplay();
      const minimumInterval = isMobilePlaybackMode()
        ? MIN_MOBILE_PLAY_INTERVAL_MS
        : MIN_PLAY_INTERVAL_MS;
      return Math.max(minimumInterval, Math.round(BASE_PLAY_INTERVAL_MS / speed));
    }

    function playbackDelayAfterAdvance(didShowNewestFrame) {
      return didShowNewestFrame ? LOOP_END_PAUSE_MS : playbackIntervalMs();
    }

    function playbackDelayForCurrentFrame() {
      return selectedFrameIndex === getNewestFrameIndex()
        ? LOOP_END_PAUSE_MS
        : playbackIntervalMs();
    }

    function chronologicalFrameIndices() {
      return selectedFrames
        .map((frame, index) => ({
          index,
          time: frame.validTimeDate?.getTime?.() ?? Number.NaN
        }))
        .filter((frame) => Number.isFinite(frame.time))
        .sort((a, b) => a.time - b.time || a.index - b.index)
        .map((frame) => frame.index);
    }

    function getOldestFrameIndex() {
      const indices = chronologicalFrameIndices();
      return indices[0] ?? 0;
    }

    function getNewestFrameIndex() {
      const indices = chronologicalFrameIndices();
      return indices[indices.length - 1] ?? 0;
    }

    function getNextChronologicalFrameIndex(currentIndex) {
      const indices = chronologicalFrameIndices();
      if (indices.length === 0) return 0;

      const currentPosition = indices.indexOf(currentIndex);
      if (currentPosition === -1) return getOldestFrameIndex();

      return indices[(currentPosition + 1) % indices.length];
    }

    function getPreviousChronologicalFrameIndex(currentIndex) {
      const indices = chronologicalFrameIndices();
      if (indices.length === 0) return 0;

      const currentPosition = indices.indexOf(currentIndex);
      if (currentPosition === -1) return getNewestFrameIndex();

      return indices[(currentPosition - 1 + indices.length) % indices.length];
    }

    function stopRadarPlayback() {
      if (radarPlaybackTimer !== null) {
        window.clearTimeout(radarPlaybackTimer);
        radarPlaybackTimer = null;
      }

      radarPlaybackToken += 1;
      isRadarPlaying = false;
      updatePlaybackButton();
    }

    function startRadarPlayback() {
      if (selectedFrames.length < 2) {
        setStatus("Playback needs at least two radar frames.");
        return;
      }

      if (radarPlaybackTimer !== null) {
        window.clearTimeout(radarPlaybackTimer);
        radarPlaybackTimer = null;
      }

      isRadarPlaying = true;
      updatePlaybackButton();
      const playbackToken = ++radarPlaybackToken;
      if (selectedFrameIndex === getNewestFrameIndex()) {
        selectedFrameIndex = getOldestFrameIndex();
        syncFrameSelectToSelection();
        applySelectedFrame();
      }

      preloadSelectedFrameSet(selectedFrameIndex);
      scheduleRadarPlaybackTick(playbackToken, playbackIntervalMs());
    }

    function scheduleRadarPlaybackTick(playbackToken, delayMs) {
      if (!isRadarPlaying || playbackToken !== radarPlaybackToken) return;

      radarPlaybackTimer = window.setTimeout(async () => {
        radarPlaybackTimer = null;

        if (!isRadarPlaying || playbackToken !== radarPlaybackToken) return;

        const didShowNewestFrame = await advanceRadarPlaybackFrame();

        if (!isRadarPlaying || playbackToken !== radarPlaybackToken) return;

        scheduleRadarPlaybackTick(playbackToken, playbackDelayAfterAdvance(didShowNewestFrame));
      }, delayMs);
    }

    function toggleRadarPlayback() {
      if (isRadarPlaying) {
        stopRadarPlayback();
      } else {
        startRadarPlayback();
      }
    }

    function restartRadarPlayback() {
      updatePlaybackSpeedDisplay();
      if (!isRadarPlaying) return;

      if (radarPlaybackTimer !== null) {
        window.clearTimeout(radarPlaybackTimer);
        radarPlaybackTimer = null;
      }

      scheduleRadarPlaybackTick(++radarPlaybackToken, playbackDelayForCurrentFrame());
    }

    async function stepRadarFrame(direction, options = {}) {
      if (selectedFrames.length === 0) {
        setStatus("No usable radar frames found.");
        return false;
      }

      if (!options.fromPlayback) {
        stopRadarPlayback();
      }

      selectedFrameIndex = direction === "previous"
        ? getPreviousChronologicalFrameIndex(selectedFrameIndex)
        : getNextChronologicalFrameIndex(selectedFrameIndex);
      syncFrameSelectToSelection();
      return applySelectedFrame({ fromPlayback: Boolean(options.fromPlayback) });
    }

    async function advanceRadarPlaybackFrame() {
      const frameCount = selectedFrames.length;
      if (frameCount < 2) return false;

      for (let attempt = 0; attempt < frameCount; attempt += 1) {
        const didApplyFrame = await stepRadarFrame("next", { fromPlayback: true });
        if (didApplyFrame) {
          return selectedFrameIndex === getNewestFrameIndex();
        }
      }

      setStatus("Radar playback skipped unavailable frames.");
      return false;
    }

    async function loadRadarCatalog() {
      try {
        const { catalog, source } = await fetchRadarCatalogWithFallback();
        radarCatalog = catalog;
        console.log("radar catalog loaded");
        populateSiteSelect();
        populateProductSelect();
        refreshSelectedFrames();
        updateCatalogCheckedStatus(source === "local" ? "Radar catalog loaded (local fallback)" : "Radar catalog loaded");
      } catch (error) {
        setStatus(error.message || "Unable to load radar catalog.");
      }
    }

    async function refreshRadarCatalog(options = {}) {
      const { forceLatest = false } = options;

      try {
        const { catalog: nextCatalog, source } = await fetchRadarCatalogWithFallback();
        const previousSignature = lastCatalogSignature;
        radarCatalog = nextCatalog;
        const nextSignature = radarCatalogSignatureFor(selectedSite, selectedProduct);
        const catalogChanged = nextSignature !== previousSignature;
        lastCatalogSignature = nextSignature;
        const sourceSuffix = source === "local" ? " (local fallback)" : "";

        if (catalogChanged || forceLatest) {
          updateSelectedFramesFromCatalog({ forceLatest, catalogChanged });
          if (source === "local") {
            updateCatalogCheckedStatus(`Radar catalog refreshed${sourceSuffix}`);
          }
        } else {
          updateCatalogCheckedStatus(`Radar catalog checked, no new frames${sourceSuffix}`);
        }
      } catch (error) {
        setStatus(error.message || "Unable to refresh radar catalog.");
      }
    }

    function startRadarCatalogRefresh() {
      stopRadarCatalogRefresh();
      radarCatalogRefreshTimer = window.setInterval(refreshRadarCatalog, RADAR_CATALOG_REFRESH_MS);
    }

    function stopRadarCatalogRefresh() {
      if (radarCatalogRefreshTimer) {
        window.clearInterval(radarCatalogRefreshTimer);
        radarCatalogRefreshTimer = null;
      }
    }

    // radar overlay handling
    function mapCanvasMetrics() {
      const mapCanvas = map?.getCanvas?.();
      const cssWidth = Math.max(1, mapCanvas?.clientWidth || radarOverlayCanvas.clientWidth || 1);
      const cssHeight = Math.max(1, mapCanvas?.clientHeight || radarOverlayCanvas.clientHeight || 1);
      const backingWidth = Math.max(1, mapCanvas?.width || cssWidth);
      const backingHeight = Math.max(1, mapCanvas?.height || cssHeight);

      return {
        cssWidth,
        cssHeight,
        backingWidth,
        backingHeight,
        scaleX: backingWidth / cssWidth,
        scaleY: backingHeight / cssHeight
      };
    }

    function resizeOverlayCanvas(canvas, context) {
      const { cssWidth, cssHeight, backingWidth, backingHeight } = mapCanvasMetrics();

      canvas.style.right = "auto";
      canvas.style.bottom = "auto";
      canvas.style.left = "0px";
      canvas.style.top = "0px";
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;

      if (canvas.width !== backingWidth || canvas.height !== backingHeight) {
        canvas.width = backingWidth;
        canvas.height = backingHeight;
      }

      context.setTransform(1, 0, 0, 1, 0, 0);
    }

    function scheduleOverlayRedraw(options = {}) {
      if (options.deferDuringMotion && (map?.isMoving?.() || map?.isZooming?.())) {
        return;
      }

      if (overlayRedrawFrame !== null) {
        return;
      }

      overlayRedrawFrame = window.requestAnimationFrame(() => {
        overlayRedrawFrame = null;
        drawRadarOverlay();
        drawAlertOverlay();
      });
    }

    function resizeRadarCanvas() {
      resizeOverlayCanvas(radarOverlayCanvas, radarOverlayContext);
    }

    function resizeAlertCanvas() {
      resizeOverlayCanvas(alertOverlayCanvas, alertOverlayContext);
    }

    function clearRadarOverlay() {
      resizeRadarCanvas();
      radarOverlayContext.clearRect(0, 0, radarOverlayCanvas.width, radarOverlayCanvas.height);
    }

    function clearAlertOverlay() {
      resizeAlertCanvas();
      alertOverlayContext.clearRect(0, 0, alertOverlayCanvas.width, alertOverlayCanvas.height);
    }



    function clearRadarFrameImageCache() {
      radarPreloadToken += 1;
      radarImageCache.clear();
      console.debug("Radar image cache cleared");
    }

    function radarImageCacheStats() {
      const entries = [...radarImageCache.values()];
      return {
        size: radarImageCache.size,
        loaded: entries.filter((entry) => entry.status === "loaded").length,
        loading: entries.filter((entry) => entry.status === "loading").length,
        error: entries.filter((entry) => entry.status === "error").length
      };
    }

    function logRadarImageCacheStats(label) {
      console.debug(`Radar image cache ${label}`, radarImageCacheStats());
    }

    function preloadRadarFrame(frame) {
      const frameUrl = getRadarFrameUrl(frame);
      if (!frameUrl) {
        return Promise.reject(new Error("Radar frame URL unavailable."));
      }

      const cacheToken = radarPreloadToken;
      const cachedFrame = radarImageCache.get(frameUrl);
      if (cachedFrame?.status === "loaded") {
        return Promise.resolve(cachedFrame.image);
      }

      if (cachedFrame?.status === "loading") {
        return cachedFrame.promise;
      }

      if (cachedFrame?.status === "error") {
        return Promise.reject(cachedFrame.error || new Error("Radar frame image failed to load."));
      }

      const image = new Image();
      image.decoding = "async";

      const loadEvents = new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
      });

      const loadPromise = (async () => {
        image.src = frameUrl;

        try {
          if (image.decode) {
            await image.decode();
          } else {
            await loadEvents;
          }
        } catch (error) {
          if (!image.complete) {
            await loadEvents;
          } else if (!image.naturalWidth) {
            throw error;
          }
        }

        if (!image.naturalWidth) {
          throw new Error("Radar frame image failed to decode.");
        }

        if (cacheToken === radarPreloadToken) {
          radarImageCache.set(frameUrl, {
            url: frameUrl,
            status: "loaded",
            image
          });
          logRadarImageCacheStats("loaded frame");
        }
        return image;
      })().catch((error) => {
        if (cacheToken === radarPreloadToken) {
          radarImageCache.set(frameUrl, {
            url: frameUrl,
            status: "error",
            error
          });
          logRadarImageCacheStats("frame error");
        }
        throw error;
      });

      radarImageCache.set(frameUrl, {
        url: frameUrl,
        status: "loading",
        promise: loadPromise
      });
      logRadarImageCacheStats("started load");

      return loadPromise;
    }

    function getCachedRadarImage(frame) {
      const frameUrl = getRadarFrameUrl(frame);
      const cachedFrame = radarImageCache.get(frameUrl);
      return cachedFrame?.status === "loaded" ? cachedFrame.image : null;
    }

    function preloadRadarFrames(frames, token = radarPreloadToken) {
      frames.forEach((frame) => {
        preloadRadarFrame(frame).catch(() => {
          if (token === radarPreloadToken) {
            console.warn("Radar frame preload failed", getRadarFrameUrl(frame));
          }
        });
      });
    }

    function pruneMobileRadarFrameCache(keepUrls) {
      if (!isMobileRadarPlaybackMode()) return;

      radarImageCache.forEach((_cachedFrame, frameUrl) => {
        if (!keepUrls.has(frameUrl)) {
          radarImageCache.delete(frameUrl);
        }
      });
    }

    function preloadFramesAround(index = selectedFrameIndex) {
      if (!selectedFrames.length) return [];

      const frameCount = selectedFrames.length;
      const frames = [];

      for (let offset = -MOBILE_PRELOAD_RADIUS; offset <= MOBILE_PRELOAD_RADIUS; offset += 1) {
        const frameIndex = (index + offset + frameCount) % frameCount;
        const frame = selectedFrames[frameIndex];
        if (frame && !frames.includes(frame)) {
          frames.push(frame);
        }
      }

      return frames;
    }

    function preloadRadarFramesAround(index = selectedFrameIndex) {
      const frames = preloadFramesAround(index);
      const keepUrls = new Set(frames.map(getRadarFrameUrl).filter(Boolean));
      pruneMobileRadarFrameCache(keepUrls);
      preloadRadarFrames(frames);
      logRadarImageCacheStats("preloading nearby frames");
    }

    function preloadSelectedFrameSet(index = selectedFrameIndex) {
      if (!selectedFrames.length) return;

      const preloadToken = radarPreloadToken;
      const frames = isMobileRadarPlaybackMode()
        ? preloadFramesAround(index)
        : selectedFrames
          .slice(0, DESKTOP_PRELOAD_FRAME_LIMIT);
      const keepUrls = new Set(frames.map(getRadarFrameUrl).filter(Boolean));

      pruneMobileRadarFrameCache(keepUrls);
      preloadRadarFrames(frames, preloadToken);
      logRadarImageCacheStats("preloading selected set");
    }

    async function loadRadarFrameImage(frameUrl) {
      return preloadRadarFrame({ url: frameUrl });
    }

    function drawRadarOverlay() {
      clearRadarOverlay();

      if (!map || !activeRadarFrame || !activeRadarCanvas) {
        return;
      }

      const { scaleX, scaleY } = mapCanvasMetrics();
      const [[south, west], [north, east]] = activeRadarFrame.bounds;
      const northwest = map.project([west, north]);
      const southeast = map.project([east, south]);
      const left = Math.min(northwest.x, southeast.x) * scaleX;
      const top = Math.min(northwest.y, southeast.y) * scaleY;
      const width = Math.abs(southeast.x - northwest.x) * scaleX;
      const height = Math.abs(southeast.y - northwest.y) * scaleY;
      const opacity = Math.min(1, Math.max(0, Number(opacityRange.value)));

      if (width <= 0 || height <= 0 || opacity <= 0) {
        return;
      }

      radarOverlayContext.save();
      radarOverlayContext.globalAlpha = opacity;
      radarOverlayContext.imageSmoothingEnabled = false;
      radarOverlayContext.drawImage(activeRadarCanvas, left, top, width, height);
      radarOverlayContext.restore();
    }

    function applyRadarOverlay(frame, image) {
      activeRadarFrame = frame;
      activeRadarImage = image;
      activeRadarCanvas = image;
      if (!hasLoggedDirectRadarDraw) {
        console.log("Drawing external radar frame directly; skipping pixel readback to avoid CORS taint.");
        hasLoggedDirectRadarDraw = true;
      }
      scheduleOverlayRedraw();
      console.log("radar frame applied");
    }

    function updateFrameReadout(frame) {
      const checkedText = lastRadarCatalogCheckText ? ` · checked ${lastRadarCatalogCheckText}` : "";
      frameReadout.textContent = `Radar: updated ${formatShortTime(frame.validTime)}${checkedText}`;
    }

    async function applySelectedFrame(options = {}) {
      const { fromPlayback = false } = options;
      const frame = selectedFrames[selectedFrameIndex];
      const applyToken = ++radarFrameApplyToken;

      if (!map || !frame) {
        activeRadarFrame = null;
        activeRadarImage = null;
        activeRadarCanvas = null;
        clearRadarOverlay();
        frameReadout.textContent = "No usable radar frame selected.";
        setStatus("No usable radar frames found.");
        return false;
      }

      const frameUrl = selectedFrameUrl(selectedFrameIndex);
      updateFrameReadout(frame);
      setStatus(`Preparing radar frame: ${selectedSite} ${selectedProduct}`);
      preloadRadarFramesAround(selectedFrameIndex);

      const cachedRadarImage = getCachedRadarImage(frame);
      if (cachedRadarImage) {
        console.debug("Radar frame drawn from cache", {
          frameUrl,
          cache: radarImageCacheStats()
        });
        applyRadarOverlay(frame, cachedRadarImage);
        setStatus(`Radar frame loaded: ${selectedSite} ${selectedProduct}`);
        preloadRadarFramesAround(selectedFrameIndex);
        return true;
      }

      const cachedFrame = radarImageCache.get(frameUrl);
      if (fromPlayback && cachedFrame?.status === "loading") {
        console.debug("Radar playback waiting for loading frame; keeping current frame visible", {
          frameUrl,
          cache: radarImageCacheStats()
        });
        return false;
      }

      if (fromPlayback && cachedFrame?.status === "error") {
        console.debug("Radar playback skipped errored frame", {
          frameUrl,
          cache: radarImageCacheStats()
        });
        return false;
      }

      try {
        const radarImagePromise = loadRadarFrameImage(frameUrl);

        if (fromPlayback) {
          console.debug("Radar playback started frame load; keeping current frame visible", {
            frameUrl,
            cache: radarImageCacheStats()
          });
          return false;
        }

        const radarImage = await radarImagePromise;

        if (applyToken !== radarFrameApplyToken) {
          return false;
        }

        console.debug("Radar frame drawn after network/decode", {
          frameUrl,
          cache: radarImageCacheStats()
        });
        applyRadarOverlay(frame, radarImage);
        setStatus(`Radar frame loaded: ${selectedSite} ${selectedProduct}`);
        preloadRadarFramesAround(selectedFrameIndex);
        return true;
      } catch (error) {
        if (applyToken !== radarFrameApplyToken) {
          return false;
        }

        setStatus("Radar frame failed to load; keeping current frame visible.");
        return false;
      }
    }

    function updateRadarOpacity() {
      const opacity = Math.min(1, Math.max(0, Number(opacityRange.value)));
      opacityRange.value = opacity.toFixed(2);
      opacityValue.textContent = `${Math.round(opacity * 100)}%`;
      scheduleOverlayRedraw();
    }

    // alert loading
    const HOMEPAGE_ALERT_COLORS = {
      storm: "#ffb21c",
      tropical: "#a13671",
      winter: "#3b9dff",
      hydro: "#00a008",
      fire: "#b83d18",
      default: "#7c4dff"
    };

    const HOMEPAGE_ALERT_COLOR_OVERRIDES = {
      "Severe Thunderstorm Warning": "#ffb21c",
      "Special Weather Statement": "#58b7ff"
    };

    const HOMEPAGE_ALERT_EVENTS = {
      storm: [
        "Severe Thunderstorm Warning"
      ],
      tropical: [
        "Hurricane Warning",
        "Tropical Storm Warning",
        "Storm Surge Warning"
      ],
      winter: [
        "Winter Storm Warning",
        "Blizzard Warning",
        "Ice Storm Warning",
        "Winter Weather Advisory",
        "Freeze Warning",
        "Frost Advisory"
      ],
      hydro: [
        "Flood Warning",
        "Flood Watch",
        "Coastal Flood Warning",
        "Flood Advisory",
        "Areal Flood Warning",
        "Areal Flood Watch",
        "Flash Flood Warning",
        "Flash Flood Watch",
        "Flash Flood Statement"
      ],
      fire: [
        "Red Flag Warning",
        "Fire Weather Watch"
      ]
    };

    const HOMEPAGE_ALERT_CATEGORY_ORDER = ["tropical", "winter", "hydro", "fire", "storm"];

    function alertCategory(eventName) {
      return HOMEPAGE_ALERT_CATEGORY_ORDER.find((category) =>
        HOMEPAGE_ALERT_EVENTS[category].includes(eventName)
      ) || "default";
    }

    function alertColor(eventName) {
      if (HOMEPAGE_ALERT_COLOR_OVERRIDES[eventName]) {
        return HOMEPAGE_ALERT_COLOR_OVERRIDES[eventName];
      }

      return HOMEPAGE_ALERT_COLORS[alertCategory(eventName)];
    }

    function alertColorExpression() {
      const expression = ["case"];

      Object.entries(HOMEPAGE_ALERT_COLOR_OVERRIDES).forEach(([eventName, color]) => {
        expression.push(["==", ["get", "event"], eventName], color);
      });

      HOMEPAGE_ALERT_CATEGORY_ORDER.forEach((category) => {
        expression.push(
          ["in", ["get", "event"], ["literal", HOMEPAGE_ALERT_EVENTS[category]]],
          HOMEPAGE_ALERT_COLORS[category]
        );
      });

      expression.push(HOMEPAGE_ALERT_COLORS.default);
      return expression;
    }

    function hexToRgb(hexColor) {
      const normalized = hexColor.replace("#", "");
      return {
        red: parseInt(normalized.slice(0, 2), 16),
        green: parseInt(normalized.slice(2, 4), 16),
        blue: parseInt(normalized.slice(4, 6), 16)
      };
    }

    function rgba(hexColor, alpha) {
      const { red, green, blue } = hexToRgb(hexColor);
      return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
    }

    function hasAlertGeometry(feature) {
      return feature?.geometry?.type === "Polygon" || feature?.geometry?.type === "MultiPolygon";
    }

    function countAlertGeometryPolygons(features) {
      return features.reduce((count, feature) => {
        const geometry = feature.geometry;

        if (geometry?.type === "Polygon") {
          return count + 1;
        }

        if (geometry?.type === "MultiPolygon") {
          return count + geometry.coordinates.length;
        }

        return count;
      }, 0);
    }

    function alertSummaryMeta(properties, isMapped) {
      const parts = [
        properties.severity,
        properties.certainty,
        properties.urgency
      ].filter((value) => value && value !== "Unknown");
      const expires = properties.expires ? `expires ${formatTime(properties.expires)}` : "";
      const mapping = isMapped ? "mapped" : "listed only";

      return [...parts, expires, mapping].filter(Boolean).join(" · ");
    }

    function alertCoordinates(geometry) {
      if (geometry?.type === "Polygon") {
        return geometry.coordinates.flat(1);
      }

      if (geometry?.type === "MultiPolygon") {
        return geometry.coordinates.flat(2);
      }

      return [];
    }

    function alertBounds(feature) {
      const coordinates = alertCoordinates(feature.geometry)
        .filter((coordinate) => Array.isArray(coordinate) && coordinate.length >= 2);

      if (!coordinates.length) {
        return null;
      }

      const bounds = coordinates.reduce((boundsBox, coordinate) => {
        return boundsBox.extend([coordinate[0], coordinate[1]]);
      }, new mapboxgl.LngLatBounds([coordinates[0][0], coordinates[0][1]], [coordinates[0][0], coordinates[0][1]]));

      return bounds.isEmpty?.() ? null : bounds;
    }

    const ALERT_ISSUER_RADAR_SITES = {
      "NWS Raleigh NC": "KRAX",
      "NWS Blacksburg VA": "KFCX",
      "NWS Greenville-Spartanburg SC": "KGSP",
      "NWS Wilmington NC": "KLTX",
      "NWS Newport/Morehead City NC": "KMHX",
      "NWS Wakefield VA": "KAKQ",
      "NWS Jacksonville FL": "KJAX",
      "NWS Charleston SC": "KCLX",
      "NWS Columbia SC": "KCAE",
      "NWS Peachtree City GA": "KFFC",
      "NWS Birmingham AL": "KBMX"
    };

    const RADAR_SITE_COORDINATES = {
      KAKQ: [-77.0074, 36.9841],
      KBMX: [-86.7697, 33.1719],
      KCAE: [-81.1183, 33.9486],
      KCLX: [-81.0422, 32.6556],
      KFCX: [-80.2742, 37.0244],
      KFFC: [-84.5659, 33.3636],
      KGSP: [-82.2201, 34.8833],
      KJAX: [-81.7019, 30.4847],
      KLTX: [-78.4291, 33.9892],
      KMHX: [-76.8763, 34.7759],
      KRAX: [-78.4898, 35.6655]
    };

    function alertCentroid(feature) {
      const coordinates = alertCoordinates(feature.geometry)
        .filter((coordinate) =>
          Array.isArray(coordinate) &&
          coordinate.length >= 2 &&
          Number.isFinite(Number(coordinate[0])) &&
          Number.isFinite(Number(coordinate[1]))
        );

      if (!coordinates.length) return null;

      const totals = coordinates.reduce((sum, coordinate) => ({
        longitude: sum.longitude + Number(coordinate[0]),
        latitude: sum.latitude + Number(coordinate[1])
      }), { longitude: 0, latitude: 0 });

      return {
        longitude: totals.longitude / coordinates.length,
        latitude: totals.latitude / coordinates.length
      };
    }

    function distanceSquared(from, to) {
      const longitudeDelta = from.longitude - to[0];
      const latitudeDelta = from.latitude - to[1];
      return longitudeDelta * longitudeDelta + latitudeDelta * latitudeDelta;
    }

    function radarSiteForAlert(properties, feature) {
      const sites = availableSites();
      const senderName = String(properties.senderName || "").toLowerCase();
      const mappedEntry = Object.entries(ALERT_ISSUER_RADAR_SITES)
        .find(([issuer]) => senderName.includes(issuer.toLowerCase()));

      if (mappedEntry && sites.includes(mappedEntry[1])) {
        return mappedEntry[1];
      }

      const centroid = alertCentroid(feature);
      if (!centroid) return "";

      return Object.entries(RADAR_SITE_COORDINATES)
        .filter(([site]) => sites.includes(site))
        .sort(([, firstCoordinates], [, secondCoordinates]) =>
          distanceSquared(centroid, firstCoordinates) - distanceSquared(centroid, secondCoordinates)
        )[0]?.[0] || "";
    }

    function switchRadarToAlert(properties, feature) {
      const site = radarSiteForAlert(properties, feature);

      if (!site) {
        setStatus("No matching radar site available for this alert.");
        return;
      }

      stopRadarPlayback();
      selectedSite = site;
      siteSelect.value = site;
      populateProductSelect(DEFAULT_PRODUCT);
      refreshSelectedFrames();
      setStatus(`Switched radar to ${site} for ${alertValue(properties.event)}`);
    }

    function focusMappedAlert(feature) {
      const bounds = alertBounds(feature);

      if (bounds && map) {
        const isNarrow = window.innerWidth <= 900;
        const fitPadding = isNarrow
          ? { top: 52, right: 52, bottom: 52, left: 40 }
          : { top: 62, right: 470, bottom: 62, left: 48 };
        map.fitBounds(bounds, {
          padding: fitPadding,
          maxZoom: 9,
          duration: 650
        });
      }

      showAlertDetails(feature.properties?._alertId);
    }

    function createAlertItem(feature, isMapped) {
      const properties = feature.properties || {};
      const button = document.createElement("button");
      button.type = "button";
      button.className = "active-alert-item";
      button.style.setProperty("--alert-color", alertColor(properties.event));

      const event = document.createElement("div");
      event.className = "active-alert-event";
      event.textContent = alertValue(properties.event);

      const area = document.createElement("div");
      area.className = "active-alert-area";
      area.textContent = alertValue(properties.headline || properties.areaDesc);

      const meta = document.createElement("div");
      meta.className = "active-alert-meta";
      meta.textContent = alertSummaryMeta(properties, isMapped);

      button.replaceChildren(event, area, meta);
      button.addEventListener("click", () => {
        if (isMapped) {
          focusMappedAlert(feature);
        } else {
          showAlertDetails(properties._alertId);
        }
      });

      return button;
    }

    function createAlertGroup(title, features, isMapped) {
      const group = document.createElement("div");
      group.className = "active-alert-group";

      const heading = document.createElement("div");
      heading.className = "active-alert-group-title";
      heading.textContent = `${title} (${features.length})`;

      const list = document.createElement("div");
      list.className = "active-alert-list";

      if (features.length) {
        list.replaceChildren(...features.map((feature) => createAlertItem(feature, isMapped)));
      } else {
        const empty = document.createElement("div");
        empty.className = "active-alert-empty";
        empty.textContent = isMapped ? "No mapped alerts." : "No listed-only alerts.";
        list.replaceChildren(empty);
      }

      group.replaceChildren(heading, list);
      return group;
    }

    function updateAlertsDrawerSummary() {
      if (!alertsDrawerSummary) return;

      const total = alertDiagnostics.totalFetched || 0;
      const mapped = alertDiagnostics.withGeometry || 0;
      const listedOnly = alertDiagnostics.withoutGeometry || 0;

      if (total === 0) {
        alertsDrawerSummary.textContent = "Active Alerts: none";
        return;
      }

      alertsDrawerSummary.textContent =
        `Active Alerts: ${total} · ${mapped} mapped · ${listedOnly} listed only`;
    }

    function setAlertsPanelExpanded(expanded) {
      isAlertsPanelExpanded = expanded;
      rightAlertsPanel?.classList.toggle("is-collapsed", !expanded);
      if (toggleAlertsPanelButton) {
        toggleAlertsPanelButton.textContent = expanded ? "Hide" : "Show";
        toggleAlertsPanelButton.setAttribute("aria-expanded", String(expanded));
      }
    }

    function toggleAlertsPanel() {
      setAlertsPanelExpanded(!isAlertsPanelExpanded);
    }

    function updateActiveAlertsPanel() {
      const allAlerts = [...activeAlertFeatures, ...activeAlertsWithoutGeometry];

      if (!allAlerts.length) {
        const empty = document.createElement("div");
        empty.className = "active-alert-empty";
        empty.textContent = "No active alerts";
        activeAlertsPanel.replaceChildren(empty);
        updateAlertsDrawerSummary();
        return;
      }

      activeAlertsPanel.replaceChildren(
        createAlertGroup("Mapped Alerts", activeAlertFeatures, true),
        createAlertGroup("Listed Alerts", activeAlertsWithoutGeometry, false)
      );
      updateAlertsDrawerSummary();
    }

    function updateAlertReadout() {
      const updatedText = alertDiagnostics.lastUpdated
        ? `updated ${formatShortTime(alertDiagnostics.lastUpdated)}`
        : "not updated yet";
      const errorText = alertDiagnostics.lastError ? " · refresh issue" : "";

      alertReadout.textContent =
        `Alerts: ${alertDiagnostics.totalFetched} active · ${alertDiagnostics.withGeometry} mapped` +
        ` · ${alertDiagnostics.withoutGeometry} listed only · ${updatedText}${errorText}`;
      updateActiveAlertsPanel();
      updateAlertsDrawerSummary();
    }

    function drawAlertRing(ring) {
      const { scaleX, scaleY } = mapCanvasMetrics();

      ring.forEach((coordinate, index) => {
        const point = map.project(coordinate);
        const x = point.x * scaleX;
        const y = point.y * scaleY;

        if (index === 0) {
          alertOverlayContext.moveTo(x, y);
        } else {
          alertOverlayContext.lineTo(x, y);
        }
      });
      alertOverlayContext.closePath();
    }

    function drawAlertPolygonRings(rings) {
      if (!Array.isArray(rings) || !rings.length) return;

      alertOverlayContext.beginPath();
      rings.forEach(drawAlertRing);
      alertOverlayContext.fill("evenodd");
      alertOverlayContext.stroke();
    }

    function drawAlertOverlay() {
      clearAlertOverlay();

      if (!map || !activeAlertFeatures.length) {
        alertDiagnostics.drawnPolygons = 0;
        updateAlertReadout();
        return;
      }

      let drawnPolygons = 0;
      alertOverlayContext.save();
      alertOverlayContext.lineWidth = 2.5;
      alertOverlayContext.lineJoin = "round";
      alertOverlayContext.lineCap = "round";

      activeAlertFeatures.forEach((feature) => {
        const geometry = feature.geometry;
        const color = alertColor(feature.properties?.event);

        alertOverlayContext.fillStyle = rgba(color, 0.13);
        alertOverlayContext.strokeStyle = rgba(color, 0.95);

        if (geometry?.type === "Polygon") {
          drawAlertPolygonRings(geometry.coordinates);
          drawnPolygons += 1;
        } else if (geometry?.type === "MultiPolygon") {
          geometry.coordinates.forEach((rings) => {
            drawAlertPolygonRings(rings);
            drawnPolygons += 1;
          });
        }
      });

      alertOverlayContext.restore();
      alertDiagnostics.drawnPolygons = drawnPolygons;
      updateAlertReadout();
    }

    function placeAlertLayersAboveRadar() {
      if (!map?.getLayer(NWS_ALERT_FILL_LAYER_ID) || !map.getLayer(NWS_ALERT_LINE_LAYER_ID)) return;

      const beforeLayerId = overlayCeilingLayerId();
      map.moveLayer(NWS_ALERT_FILL_LAYER_ID, beforeLayerId);
      map.moveLayer(NWS_ALERT_LINE_LAYER_ID, beforeLayerId);
    }

    function ensureAlertLayers() {
      if (!map || map.getSource(NWS_ALERT_SOURCE_ID)) return;

      map.addSource(NWS_ALERT_SOURCE_ID, {
        type: "geojson",
        data: {
          type: "FeatureCollection",
          features: []
        }
      });

      map.addLayer(
        {
          id: NWS_ALERT_FILL_LAYER_ID,
          type: "fill",
          source: NWS_ALERT_SOURCE_ID,
          paint: {
            "fill-color": alertColorExpression(),
            "fill-opacity": 0
          }
        },
        overlayCeilingLayerId()
      );

      map.addLayer(
        {
          id: NWS_ALERT_LINE_LAYER_ID,
          type: "line",
          source: NWS_ALERT_SOURCE_ID,
          paint: {
            "line-color": alertColorExpression(),
            "line-opacity": 0,
            "line-width": [
              "interpolate",
              ["linear"],
              ["zoom"],
              4,
              1.5,
              8,
              2.7
            ]
          }
        },
        overlayCeilingLayerId()
      );

      map.on("click", NWS_ALERT_FILL_LAYER_ID, handleAlertClick);
      map.on("click", NWS_ALERT_LINE_LAYER_ID, handleAlertClick);
      map.on("mouseenter", NWS_ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", NWS_ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("mouseenter", NWS_ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", NWS_ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });

      placeAlertLayersAboveRadar();
    }

    function normalizeAlertFeature(feature, index) {
      const properties = feature.properties || {};
      const alertId = String(feature.id || properties.id || `${properties.event || "alert"}-${index}`);

      return {
        ...feature,
        id: alertId,
        properties: {
          ...properties,
          _alertId: alertId
        }
      };
    }

    async function loadNwsAlerts() {
      try {
        ensureAlertLayers();
        const response = await fetch(NWS_ALERTS_URL, {
          headers: {
            Accept: "application/geo+json"
          },
          cache: "no-cache"
        });

        if (!response.ok) {
          throw new Error(`NWS alerts failed: ${response.status}`);
        }

        const collection = await response.json();
        const fetchedFeatures = collection.features || [];
        const featuresWithGeometry = fetchedFeatures
          .filter(hasAlertGeometry)
          .map(normalizeAlertFeature);
        const featuresWithoutGeometry = fetchedFeatures
          .filter((feature) => !hasAlertGeometry(feature))
          .map(normalizeAlertFeature);

        activeAlertFeatures = featuresWithGeometry;
        activeAlertsWithoutGeometry = featuresWithoutGeometry;
        activeAlertsById = new Map(
          [...featuresWithGeometry, ...featuresWithoutGeometry]
            .map((feature) => [feature.properties._alertId, feature.properties])
        );
        map.getSource(NWS_ALERT_SOURCE_ID).setData({
          type: "FeatureCollection",
          features: featuresWithGeometry
        });
        alertDiagnostics = {
          totalFetched: fetchedFeatures.length,
          withGeometry: featuresWithGeometry.length,
          withoutGeometry: featuresWithoutGeometry.length,
          geoJsonPolygons: countAlertGeometryPolygons(featuresWithGeometry),
          drawnPolygons: countAlertGeometryPolygons(featuresWithGeometry),
          states: NWS_ALERT_AREAS,
          lastUpdated: new Date().toISOString(),
          lastError: ""
        };
        placeAlertLayersAboveRadar();
        scheduleOverlayRedraw();
        updateAlertReadout();
        console.log({
          totalFetched: alertDiagnostics.totalFetched,
          withGeometry: alertDiagnostics.withGeometry,
          withoutGeometry: alertDiagnostics.withoutGeometry,
          polygonsAddedToGeoJsonSource: alertDiagnostics.geoJsonPolygons,
          drawnPolygons: alertDiagnostics.drawnPolygons,
          states: alertDiagnostics.states,
          lastUpdated: alertDiagnostics.lastUpdated
        });
      } catch (error) {
        alertDiagnostics.lastError = error.message || "Unable to load NWS alert polygons.";
        updateAlertReadout();
        setStatus(alertDiagnostics.lastError);
      }
    }

    // popup/details handling
    function fieldPair(label, value, labelClass, valueClass) {
      const labelEl = document.createElement("div");
      labelEl.className = labelClass;
      labelEl.textContent = label;

      const valueEl = document.createElement("div");
      valueEl.className = valueClass;
      valueEl.textContent = alertValue(value);

      return [labelEl, valueEl];
    }

    function showAlertDetails(alertId) {
      const properties = activeAlertsById.get(alertId);
      if (!properties) return;

      detailsTitle.textContent = alertValue(properties.event);
      detailsGrid.replaceChildren(
        ...fieldPair("Event", properties.event, "details-label", "details-value"),
        ...fieldPair("Headline", properties.headline, "details-label", "details-value"),
        ...fieldPair("Area", properties.areaDesc, "details-label", "details-value"),
        ...fieldPair("Description", properties.description, "details-label", "details-value"),
        ...fieldPair("Instruction", properties.instruction, "details-label", "details-value"),
        ...fieldPair("Severity", properties.severity, "details-label", "details-value"),
        ...fieldPair("Urgency", properties.urgency, "details-label", "details-value"),
        ...fieldPair("Certainty", properties.certainty, "details-label", "details-value"),
        ...fieldPair("Effective", formatTime(properties.effective), "details-label", "details-value"),
        ...fieldPair("Expires", formatTime(properties.expires), "details-label", "details-value")
      );
      detailsPanel.classList.add("is-visible");
    }

    function formatPopupTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return alertValue(value);

      return date.toLocaleString([], {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function alertPopupExpiresText(properties) {
      return `Expires: ${formatPopupTime(properties.expires || properties.ends)}`;
    }

    function alertPopupSummary(properties) {
      switch (properties.event) {
        case "Flash Flood Warning":
          return "Flash flooding possible";
        case "Flood Warning":
          return "Flooding possible";
        case "Flood Advisory":
          return "Minor flooding possible";
        case "Special Weather Statement":
          return "Special weather conditions";
        case "Severe Thunderstorm Warning":
          return "Severe thunderstorms possible";
        case "Tornado Warning":
          return "Tornado warning";
        default:
          return alertValue(properties.event);
      }
    }

    function alertPopupRelativeExpiresText(properties) {
      const expires = properties.expires || properties.ends;
      const date = new Date(expires);

      if (Number.isNaN(date.getTime())) {
        return alertPopupExpiresText(properties);
      }

      const minutes = Math.round((date.getTime() - Date.now()) / 60000);
      if (minutes <= 0) return "Expires now";
      if (minutes < 60) return `Expires in ${minutes} min`;

      const hours = Math.floor(minutes / 60);
      const remainingMinutes = minutes % 60;
      return remainingMinutes
        ? `Expires in ${hours}h ${remainingMinutes}m`
        : `Expires in ${hours}h`;
    }

    function dedupePopupAlertFeatures(features) {
      const seen = new Set();
      return features.filter((feature) => {
        const alertId = feature.properties?._alertId;
        if (!alertId || seen.has(alertId)) return false;
        seen.add(alertId);
        return true;
      });
    }

    function alertPopupActions(feature) {
      const properties = feature.properties || {};
      const alertId = properties._alertId;
      const actions = document.createElement("div");
      actions.className = "omega-alert-actions";

      const radarButton = document.createElement("button");
      radarButton.type = "button";
      radarButton.className = "omega-alert-icon-btn omega-alert-radar-btn";
      radarButton.textContent = "\u25C9";
      radarButton.title = "Switch radar";
      radarButton.addEventListener("click", (event) => {
        event.stopPropagation();
        switchRadarToAlert(properties, feature);
      });

      const detailsButton = document.createElement("button");
      detailsButton.type = "button";
      detailsButton.className = "omega-alert-icon-btn omega-alert-details-btn";
      detailsButton.textContent = ">";
      detailsButton.title = "Details";
      detailsButton.addEventListener("click", (event) => {
        event.stopPropagation();
        showAlertDetails(alertId);
      });

      actions.replaceChildren(radarButton, detailsButton);
      return actions;
    }

    function closeOmegaAlertPopup() {
      activeOmegaAlertPopup = null;
      omegaAlertPopupLayer.replaceChildren();
    }

    function positionOmegaAlertPopup() {
      if (!activeOmegaAlertPopup || !map) return;

      const point = map.project(activeOmegaAlertPopup.lngLat);
      const mapRect = map.getContainer().getBoundingClientRect();
      activeOmegaAlertPopup.element.style.left = `${mapRect.left + point.x}px`;
      activeOmegaAlertPopup.element.style.top = `${mapRect.top + point.y}px`;
    }

    function alertPopupHeader(properties, includeCloseButton = false) {
      const header = document.createElement("div");
      header.className = "omega-alert-header";
      header.style.setProperty("--alert-color", alertColor(properties.event));

      const title = document.createElement("span");
      title.className = "omega-alert-title";
      title.textContent = alertValue(properties.event);

      if (includeCloseButton) {
        const closeButton = document.createElement("button");
        closeButton.type = "button";
        closeButton.className = "omega-alert-close";
        closeButton.textContent = "x";
        closeButton.title = "Close";
        closeButton.addEventListener("click", (event) => {
          event.stopPropagation();
          closeOmegaAlertPopup();
        });
        header.replaceChildren(title, closeButton);
        return header;
      }

      header.replaceChildren(title);
      return header;
    }

    function expandedAlertPopupCard(feature) {
      const properties = feature.properties || {};
      const card = document.createElement("div");
      card.className = "omega-alert-card is-expanded";
      card.style.setProperty("--alert-color", alertColor(properties.event));

      const body = document.createElement("div");
      body.className = "omega-alert-body";

      const summaryRow = document.createElement("div");
      summaryRow.className = "omega-alert-summary-row";

      const headline = document.createElement("div");
      headline.className = "omega-alert-headline";
      headline.textContent = alertPopupSummary(properties);

      const expires = document.createElement("div");
      expires.className = "omega-alert-expires";
      expires.textContent = alertPopupExpiresText(properties);

      summaryRow.replaceChildren(headline, alertPopupActions(feature));
      body.replaceChildren(summaryRow, expires);
      card.replaceChildren(alertPopupHeader(properties, true), body);
      return card;
    }

    function collapsedAlertPopupCard(feature) {
      const properties = feature.properties || {};
      const card = document.createElement("div");
      card.className = "omega-alert-card";
      card.style.setProperty("--alert-color", alertColor(properties.event));

      const row = document.createElement("div");
      row.className = "omega-alert-row";

      const expires = document.createElement("div");
      expires.className = "omega-alert-row-text";
      expires.textContent = alertPopupRelativeExpiresText(properties);

      row.replaceChildren(expires, alertPopupActions(feature));
      card.replaceChildren(alertPopupHeader(properties), row);
      return card;
    }

    function showAlertPopup(feature, lngLat, overlappingFeatures = [feature]) {
      const popupFeatures = dedupePopupAlertFeatures([
        feature,
        ...overlappingFeatures.filter((overlappingFeature) =>
          overlappingFeature.properties?._alertId !== feature.properties?._alertId
        )
      ]);
      const popupContent = document.createElement("div");
      popupContent.className = "omega-alert-popup";

      const stack = document.createElement("div");
      stack.className = "omega-alert-stack";
      stack.replaceChildren(
        expandedAlertPopupCard(popupFeatures[0] || feature),
        ...popupFeatures.slice(1).map(collapsedAlertPopupCard)
      );

      popupContent.replaceChildren(stack);

      closeOmegaAlertPopup();
      omegaAlertPopupLayer.replaceChildren(popupContent);
      activeOmegaAlertPopup = {
        element: popupContent,
        lngLat
      };
      positionOmegaAlertPopup();
    }

    function handleAlertClick(event) {
      const feature = event.features?.[0];
      if (!feature) return;

      event.preventDefault();
      suppressNextPopupClose = true;
      window.setTimeout(() => {
        suppressNextPopupClose = false;
      }, 0);
      const overlappingFeatures = map.queryRenderedFeatures(event.point, {
        layers: [NWS_ALERT_FILL_LAYER_ID, NWS_ALERT_LINE_LAYER_ID]
      });
      showAlertPopup(feature, event.lngLat, overlappingFeatures);
    }

    // controls
    siteSelect.addEventListener("change", () => {
      selectedSite = siteSelect.value;
      populateProductSelect(selectedProduct);
      refreshSelectedFrames();
    });

    productSelect.addEventListener("change", () => {
      selectedProduct = productSelect.value;
      refreshSelectedFrames();
    });

    frameSelect.addEventListener("change", () => {
      stopRadarPlayback();
      selectedFrameIndex = Number(frameSelect.value) || 0;
      applySelectedFrame();
    });

    previousFrameButton.addEventListener("click", () => {
      stepRadarFrame("previous");
    });

    playPauseButton.addEventListener("click", toggleRadarPlayback);

    nextFrameButton.addEventListener("click", () => {
      stepRadarFrame("next");
    });

    playbackSpeedSlider.addEventListener("input", restartRadarPlayback);

    updatePlaybackSpeedDisplay();

    opacityRange.addEventListener("input", updateRadarOpacity);

    detailsCloseButton.addEventListener("click", () => {
      detailsPanel.classList.remove("is-visible");
    });

    if (toggleAlertsPanelButton) {
      toggleAlertsPanelButton.addEventListener("click", toggleAlertsPanel);
    }
    setAlertsPanelExpanded(false);
    updateAlertsDrawerSummary();

    if (refreshNowButton) {
      refreshNowButton.addEventListener("click", async () => {
        setStatus("Refreshing radar and alerts...");
        await refreshRadarCatalog({ forceLatest: !isRadarPlaying });
        await loadNwsAlerts();
      });
    }

    window.addEventListener("beforeunload", () => {
      if (alertRefreshTimer) {
        window.clearInterval(alertRefreshTimer);
      }
      stopRadarCatalogRefresh();
      stopRadarPlayback();
    });

    initializeMap();
  </script>
</body>
</html>
