AWSTemplateFormatVersion: '2010-09-09'
Description: ZacharologistWx MRMS and NEXRAD radar publisher

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI for the radar Lambda worker
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
  ScheduleExpression:
    Type: String
    Default: rate(2 minutes)
  HistoryMinutes:
    Type: Number
    Default: 1440
  MaxRenderPerRun:
    Type: Number
    Default: 4
  LivePriorityCount:
    Type: Number
    Default: 2

Resources:
  RadarBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldRadarFrames
            Status: Enabled
            Prefix: mrms/frames/
            ExpirationInDays: 2
          - Id: ExpireOrphanedDetailRevisions
            Status: Enabled
            Prefix: mrms-detail/revisions/
            ExpirationInDays: 2
          - Id: ExpireOldNexradFrames
            Status: Enabled
            Prefix: nexrad-n0b/frames/
            ExpirationInDays: 2

  PublisherRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: RadarBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt RadarBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${RadarBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'

  PublisherFunction:
    Type: AWS::Lambda::Function
    Properties:
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Role: !GetAtt PublisherRole.Arn
      Architectures:
        - x86_64
      MemorySize: 3008
      Timeout: 600
      EphemeralStorage:
        Size: 2048
      Environment:
        Variables:
          RADAR_BUCKET: !Ref RadarBucket
          RADAR_PREFIX: mrms
          RADAR_DETAIL_PREFIX: mrms-detail
          DETAIL_CHUNK_PIXELS: '1024'
          HISTORY_MINUTES: !Ref HistoryMinutes
          MAX_WIDTH: '4096'
          MAX_RENDER_PER_RUN: !Ref MaxRenderPerRun
          LIVE_PRIORITY_COUNT: !Ref LivePriorityCount
          NEXRAD_PREFIX: nexrad-n0b
          NEXRAD_HISTORY_MINUTES: !Ref HistoryMinutes
          NEXRAD_MAX_WIDTH: '4096'
          NEXRAD_BOUNDS: '-130,20,-60,55'

  PublisherSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Poll NOAA MRMS and Unidata NEXRAD and publish radar frames
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      Targets:
        - Arn: !GetAtt PublisherFunction.Arn
          Id: RadarPublisherLambda

  ScheduleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PublisherFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PublisherSchedule.Arn

Outputs:
  RadarBucketName:
    Description: Private S3 bucket containing the radar archives
    Value: !Ref RadarBucket
  PublisherFunctionName:
    Description: Lambda function name
    Value: !GetAtt PublisherFunction.Arn
  PublisherScheduleName:
    Description: EventBridge scheduled rule name
    Value: !Ref PublisherSchedule
  ManifestS3Uri:
    Description: S3 URI for the generated MRMS manifest
    Value: !Sub 's3://${RadarBucket}/mrms/manifest.json'

  NativeDetailManifestS3Uri:
    Description: S3 URI for the MRMS native-resolution detail manifest
    Value: !Sub 's3://${RadarBucket}/mrms-detail/manifest.json'

  NexradManifestS3Uri:
    Description: S3 URI for the NEXRAD N0B base-reflectivity archive
    Value: !Sub 's3://${RadarBucket}/nexrad-n0b/manifest.json'
