<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Wx Updates | Zacharologist Wx</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      padding: 28px 20px;
      background: #0b1220;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      color: #cbd5e1;
      margin-top: 8px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px 50px;
    }

    .section {
      background: #162033;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .section h2 {
      margin-top: 0;
    }

    .alert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .alert-card {
      border-radius: 14px;
      padding: 16px;
      background: #1f2937;
      border-left: 6px solid #64748b;
    }

    .alert-card.tornado-warning {
      border-left-color: #dc2626;
      background: rgba(127, 29, 29, 0.45);
    }

    .alert-card.tornado-watch {
      border-left-color: #f97316;
      background: rgba(124, 45, 18, 0.45);
    }

    .alert-card.severe-warning {
      border-left-color: #facc15;
      background: rgba(113, 63, 18, 0.45);
    }

    .alert-card.flood-warning {
      border-left-color: #22c55e;
      background: rgba(20, 83, 45, 0.45);
    }

    .alert-card h3 {
      margin: 0 0 8px;
    }

    .alert-card p {
      color: #e5e7eb;
      line-height: 1.45;
    }

    .meta {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-top: 10px;
    }

    .forecast-note {
      color: #d1d5db;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #93c5fd;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .spc-img {
  width: 100%;
  max-width: 900px;
  display: block;
  margin-top: 15px;
  border-radius: 12px;
}
  </style>
</head>

<body>
  <header>
    <h1>Storm Desk</h1>
    <p>Forecast briefings, chase thoughts, and live weather alerts</p>
  </header>

  <main>
    <a class="back-link" href="index.html">← Back to Home</a>

    <section class="section">
      <h2>Latest Forecast Briefing</h2>
      <p class="forecast-note">
        
      </p>
    </section>

    <section class="section">
      <h2>Live Severe Weather Alerts</h2>
      <p id="alert-status">Loading active alerts...</p>
      <div id="alerts" class="alert-grid"></div>
    </section>

    <section class="section">
      <h2>SPC Day 1 Outlook</h2>
      <p class="forecast-note">
        This graphic updates from SPC. Click the image to open the official outlook page.
      </p>

      <a href="https://www.spc.noaa.gov/products/outlook/day1otlk.html" target="_blank">
  <img
    class="spc-img"
    src="https://www.spc.noaa.gov/products/outlook/day1otlk_1200.gif"
    alt="SPC Day 1 Convective Outlook"
    loading="lazy"
  >
</a>
    </section>
  </main>

  <script>
    const alertsContainer = document.getElementById("alerts");
    const alertStatus = document.getElementById("alert-status");

    const importantEvents = [
      "Tornado Warning",
      "Tornado Watch",
      "Severe Thunderstorm Warning",
      "Severe Thunderstorm Watch",
      "Flash Flood Warning",
      "Special Weather Statement"
    ];

    async function loadAlerts() {
      alertStatus.textContent = "Loading active alerts...";
      alertsContainer.innerHTML = "";

      try {
        const response = await fetch("https://api.weather.gov/alerts/active?area=NC");

        if (!response.ok) {
          throw new Error("NWS API error");
        }

        const data = await response.json();

        const alerts = data.features.filter(item =>
          importantEvents.includes(item.properties.event)
        );

        if (alerts.length === 0) {
          alertStatus.textContent = "No active severe alerts for this region right now.";
          return;
        }

        alertStatus.textContent = `${alerts.length} active severe alert(s) found.`;

        alerts.forEach(item => {
          const props = item.properties;

          const card = document.createElement("div");
          card.className = "alert-card " + getAlertClass(props.event);

          card.innerHTML = `
            <h3>${props.event}</h3>
            <p><strong>${props.areaDesc}</strong></p>
            <p>${props.headline || "No headline available."}</p>
            <div class="meta">
              Issued: ${formatTime(props.sent)}<br>
              Expires: ${formatTime(props.expires)}
            </div>
          `;

          alertsContainer.appendChild(card);
        });

      } catch (error) {
        alertStatus.textContent = "Could not load alerts right now. Try refreshing the page.";
        console.error(error);
      }
    }

    function getAlertClass(eventName) {
      if (eventName === "Tornado Warning") return "tornado-warning";
      if (eventName === "Tornado Watch") return "tornado-watch";
      if (eventName === "Severe Thunderstorm Warning") return "severe-warning";
      if (eventName === "Flash Flood Warning") return "flood-warning";
      return "";
    }

    function formatTime(timeString) {
      if (!timeString) return "Unknown";

      return new Date(timeString).toLocaleString("en-US", {
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    loadAlerts();

    setInterval(loadAlerts, 300000);
  </script>
</body>
</html>
