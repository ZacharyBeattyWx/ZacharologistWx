<!DOCTYPE html>
<html>
<head>
<title>Zacharologist Wx Page</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e5e5;
}

header {
  background: #d9d9d9;
  padding: 10px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
  font-size: 26px;
  font-weight: bold;
}

nav a {
  margin-left: 20px;
  text-decoration: none;
  color: black;
  font-size: 20px;
}

.hero {
  position: relative;
  height: 700px;
  overflow: hidden;
}

.hero img {
  width: 100%;
  height: 700px;
  object-fit: cover;
  object-position: center center;
  display: block;
}

.overlay {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  color: white;
  width: 80%;
  z-index: 2;
}

.overlay h2 {
  font-size: 42px;
  max-width: 800px;
  margin: auto;
}

.overlay p {
  font-size: 18px;
  margin-top: 10px;
}

.button {
  display: inline-block;
  margin-top: 20px;
  padding: 15px 40px;
  background: black;
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 40px;
}

.card {
  background: #1b2735;
  padding: 20px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  transition: 0.3s;
}

.card:hover {
  background: #22324d;
}
  .card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 10px;
}
  @media (max-width: 768px) {
  header {
    padding: 10px 14px;
    flex-direction: row;
    align-items: center;
  }

  header h1 {
    font-size: 16px;
  }

  nav a {
    margin-left: 12px;
    font-size: 12px;
  }

  .hero {
    height: 520px;
    overflow: hidden;
  }

  .hero img {
    width: 100%;
    height: 520px;
    object-fit: cover;
    object-position: center top;
  }

  .overlay {
    width: 90%;
    top: 58%;
  }

  .overlay h2 {
    font-size: 28px;
    line-height: 1.1;
  }

  .overlay p {
    font-size: 14px;
    margin-top: 8px;
  }

  .button {
    padding: 12px 28px;
    font-size: 14px;
  }

  .grid {
    grid-template-columns: 1fr;
    padding: 20px;
    gap: 16px;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>Zacharologist Wx Page</h1>
  <nav>
    <a href="#">Home</a>
    <a href="#">Wx Updates</a>
    <a href="#">Maps &amp; Models</a>
  </nav>
</header>

<div class="hero">
  <img src="hero.jpg" alt="Weather collage">

  <div class="overlay">
    <h2>Access To My Weather World!</h2>
    <p>Storms, forecasts, sky, and live weather tools.</p>
    <a class="button" href="#">GET STARTED</a>
  </div>
</div>

<div class="grid">
  <a class="card" href="https://www.weather.gov/" target="_blank">
  <img src="https://www.weather.gov/images/erh/gis/WatchWarningMap.png">
  <h2>NWS Hazard Map</h2>
  <p>Live watches and warnings</p>
</a>

  <a class="card" href="https://www.spc.noaa.gov/" target="_blank">
    <h2>SPC Outlook</h2>
    <p>Storm Prediction Center forecasts</p>
  </a>

  <a class="card" href="https://radar.weather.gov/" target="_blank">
    <h2>Radar</h2>
    <p>Live radar viewer</p>
  </a>
</div>

</body>
</html>
