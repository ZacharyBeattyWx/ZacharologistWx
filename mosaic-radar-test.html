<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="hero.jpg" type="image/jpeg">
  <meta name="robots" content="noindex">
  <title>Radar viewer moved | Zacharologist Wx</title>
  <link rel="canonical" href="https://zacharologistwx.com/mosaic-radar-home.html">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #101416; color: #eef6fa; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 560px); padding: 28px; border: 1px solid #35434b; border-top: 3px solid #ff6a2c; background: #13191c; }
    h1 { margin: 0 0 12px; font-size: clamp(24px, 6vw, 36px); line-height: 1.2; }
    a { color: #8bd9ef; }
    a:focus-visible { outline: 2px solid #ff6a2c; outline-offset: 5px; }
  </style>
</head>
<body>
  <main>
    <h1>This radar viewer has moved</h1>
    <p>The original MRMS tile prototype has moved to the current numeric radar viewer.</p>
    <p><a id="currentRadar" href="mosaic-radar-home.html">Open live national radar</a></p>
  </main>
  <script>
    (() => {
      const target = new URL("mosaic-radar-home.html", location.href);
      target.search = location.search;
      target.hash = location.hash;
      document.getElementById("currentRadar").href = target.href;
      location.replace(target.href);
    })();
  </script>
</body>
</html>
