name: Test Chase GPS and OBS feed
on:
  pull_request:
    paths:
      - "cloudflare/chase-api/**"
      - "admin.html"
      - ".github/workflows/test-chase-gps-obs.yml"
  push:
    branches: [main]
    paths:
      - "cloudflare/chase-api/**"
      - "admin.html"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Chase Worker JavaScript
        run: |
          node --check cloudflare/chase-api/src/index.js
          node --check cloudflare/chase-api/src/chase-obs.js
      - name: Test GPS and alert matching
        run: node --test cloudflare/chase-api/tests/chase-obs.test.mjs
      - name: Validate Chase Admin inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('admin.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/g)];
          if (!scripts.length) throw new Error('No Chase Admin inline scripts found');
          for (const [, source] of scripts) new vm.Script(source);
          console.log('Parsed', scripts.length, 'inline scripts');
          NODE
