name: One-shot COD satellite playback and brightness upgrade

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-satellite-cod-upgrade.yml

permissions:
  contents: write

jobs:
  patch-satellite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply satellite playback and True Color upgrade
        shell: bash
        run: |
          python3 -c 'import base64; exec(compile(base64.b64decode(""), "<satellite-upgrade>", "exec"))'

          python3 -m py_compile \
            aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py

          rm -rf aws/satellite-truecolor-publisher/__pycache__

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("weather-viewer.html").read_text()
          scripts = re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.S | re.I,
          )
          if not scripts:
              raise SystemExit("No inline script found in weather-viewer.html")
          Path("/tmp/weather-viewer-inline.js").write_text(scripts[-1])
          PY

          node --check /tmp/weather-viewer-inline.js
          git diff --check
          git diff --stat

      - name: Commit upgrade
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            weather-viewer.html \
            aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py
          git commit -m "Smooth satellite playback and brighten True Color"
          git push origin HEAD:main
