name: Set MRMS 12h homepage default once

on:
  push:
    paths:
      - .github/workflows/set-mrms-12h-default-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set 12-hour default and proportional 2x stride
        run: |
          python3 - <<'PY'
          from pathlib import Path

          player = Path('scripts/radar/mrms-timelapse-playback-v2.js')
          text = player.read_text(encoding='utf-8')

          old = '''  function playbackStride() {
    if (speedValue() < 2 || !Array.isArray(frames) || frames.length < 2) return 1;
    // Same 2x meteorological timelapse rate at every history length.
    // Eight ~2-minute MRMS scans equals about 16 weather-minutes per transition.
    return Math.max(1, Math.min(TIMELAPSE_FRAME_STRIDE, frames.length - 1));
  }'''
          new = '''  function playbackStride() {
    if (speedValue() < 2 || !Array.isArray(frames) || frames.length < 2) return 1;
    // Keep the overall 2x timelapse feel consistent while preserving smoother
    // motion on shorter windows. With ~2-minute MRMS observations this yields:
    // 3h=1 scan, 6h=2, 12h=4, 18h=6, 24h=8.
    const selectedMinutes = Math.max(30, Number(historyMinutes) || 60);
    const proportionalStride = Math.max(1, Math.round(selectedMinutes / 180));
    return Math.max(1, Math.min(TIMELAPSE_FRAME_STRIDE, proportionalStride, frames.length - 1));
  }'''
          if old not in text:
              raise SystemExit('2x playbackStride marker not found')
          player.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('scripts/radar/mrms-homepage-mode.js')
          text = home.read_text(encoding='utf-8')
          replacements = [
              ('minutes === 180 ? " selected" : ""', 'minutes === 720 ? " selected" : ""'),
              ('// Exact homepage defaults requested: 3 hr, 2x, 100% opacity.', '// Homepage defaults: 12 hr, 2x, 100% opacity.'),
              ('historyMinutes = 180;', 'historyMinutes = 720;'),
              ('available >= 180', 'available >= 720'),
              ('applyHistoryWindow(180, preserveKey);', 'applyHistoryWindow(720, preserveKey);'),
              ('select.value = "180";', 'select.value = "720";'),
              ('MRMS native homepage mode: 3 hr / 2x / 100% opacity', 'MRMS native homepage mode: 12 hr / 2x / 100% opacity'),
          ]
          for old_value, new_value in replacements:
              if old_value not in text:
                  raise SystemExit(f'Homepage default marker not found: {old_value}')
              text = text.replace(old_value, new_value)
          home.write_text(text, encoding='utf-8')
          PY

      - name: Commit MRMS defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/mrms-timelapse-playback-v2.js scripts/radar/mrms-homepage-mode.js
          git diff --cached --quiet && exit 0
          git commit -m "Use 12-hour MRMS homepage timelapse"
          git push
