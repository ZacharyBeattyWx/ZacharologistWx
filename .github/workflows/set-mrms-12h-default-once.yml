name: Set MRMS 12h homepage default once

on:
  push:
    paths:
      - .github/workflows/set-mrms-12h-default-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set 12-hour default and proportional 2x stride
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          player = Path('scripts/radar/mrms-timelapse-playback-v2.js')
          text = player.read_text(encoding='utf-8')
          pattern = r'  function playbackStride\(\) \{\n    if \(speedValue\(\) < 2 \|\| !Array\.isArray\(frames\) \|\| frames\.length < 2\) return 1;\n    // Same 2x meteorological timelapse rate at every history length\.\n    // Eight ~2-minute MRMS scans equals about 16 weather-minutes per transition\.\n    return Math\.max\(1, Math\.min\(TIMELAPSE_FRAME_STRIDE, frames\.length - 1\)\);\n  \}'
          replacement = '  function playbackStride() {\n    if (speedValue() < 2 || !Array.isArray(frames) || frames.length < 2) return 1;\n    // Scale 2x stride with the selected history: 3h=1, 6h=2, 12h=4, 18h=6, 24h=8.\n    const selectedMinutes = Math.max(30, Number(historyMinutes) || 60);\n    const proportionalStride = Math.max(1, Math.round(selectedMinutes / 180));\n    return Math.max(1, Math.min(TIMELAPSE_FRAME_STRIDE, proportionalStride, frames.length - 1));\n  }'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one playbackStride replacement, got {count}')
          text = text.replace('fixed ${TIMELAPSE_FRAME_STRIDE}-scan stride', 'history-scaled stride up to ${TIMELAPSE_FRAME_STRIDE} scans')
          player.write_text(text, encoding='utf-8')

          home = Path('scripts/radar/mrms-homepage-mode.js')
          text = home.read_text(encoding='utf-8')
          replacements = [
              ('minutes === 180 ? " selected" : ""', 'minutes === 720 ? " selected" : ""'),
              ('// Exact homepage defaults requested: 3 hr, 2x, 100% opacity.', '// Homepage defaults: 12 hr, 2x, 100% opacity.'),
              ('historyMinutes = 180;', 'historyMinutes = 720;'),
              ('available >= 180', 'available >= 720'),
              ('applyHistoryWindow(180, preserveKey);', 'applyHistoryWindow(720, preserveKey);'),
              ('select.value = "180";', 'select.value = "720";'),
              ('MRMS native homepage mode: 3 hr / 2x / 100% opacity', 'MRMS native homepage mode: 12 hr / 2x / 100% opacity'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Homepage default marker not found: {old}')
              text = text.replace(old, new)
          home.write_text(text, encoding='utf-8')
          PY

      - name: Commit MRMS defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/mrms-timelapse-playback-v2.js scripts/radar/mrms-homepage-mode.js
          git diff --cached --quiet && exit 0
          git commit -m "Use 12-hour MRMS homepage timelapse"
          git push
