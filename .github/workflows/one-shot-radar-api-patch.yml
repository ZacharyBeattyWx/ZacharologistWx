name: Fast one-shot radar API patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-radar-api-patch.yml

permissions:
  contents: write

jobs:
  patch-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Patch radar through GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = 'mosaic-radar-alerts-current-test.html'
          api = f'https://api.github.com/repos/{repo}/contents/{target}'

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zwx-radar-patch',
          }

          req = urllib.request.Request(api, headers=headers)
          with urllib.request.urlopen(req) as response:
              payload = json.load(response)

          original_sha = payload['sha']
          text = base64.b64decode(payload['content']).decode('utf-8')

          replacements = [
              ('<div class="legend-title">Python Level II GPU Reflectivity (dBZ)</div>',
               '<div class="legend-title">MRMS MRALA GPU Reflectivity (dBZ)</div>'),
              ('const MANIFEST_URL="https://dt0cd6bl1yqh2.cloudfront.net/mrms-native-numeric/manifest-playback-test.json";',
               'const MANIFEST_URL="https://dt0cd6bl1yqh2.cloudfront.net/mrms-native-numeric/manifest.json";'),
              ('const BASE_TIER="playback";', 'const BASE_TIER="overview";'),
              ('const GPU_DEPTH_OVERVIEW=MOBILE?10:36;', 'const GPU_DEPTH_OVERVIEW=MOBILE?6:18;'),
              ('const DISABLE_NATIVE_LOD_TEST=true;', 'const DISABLE_NATIVE_LOD_TEST=false;'),
              ('const LOOP_END_PAUSE_MS=1500;', 'const LOOP_END_PAUSE_MS=450;'),
              (
                  '      Hold the newest frame for 2.5 seconds. During that hold,\n'
                  '      the normal overview/native buffers can preload the beginning\n'
                  '      of the next loop. Once frame zero is resident, jump directly\n'
                  '      back to it and resume the animation clock.',
                  '      Briefly hold the newest frame. During that hold, the circular\n'
                  '      overview buffer already contains the beginning of the next loop.\n'
                  '      Once frame zero is resident, jump directly back to it and keep\n'
                  '      the animation clock running.'
              ),
              (
                  '      const restartNativeReady=\n'
                  '        activeTier!=="native"\n'
                  '        ||chunkLayer.hasFrame(\n'
                  '          String(\n'
                  '            frames[\n'
                  '              restartIndex\n'
                  '            ]?.id||""\n'
                  '          ),\n'
                  '          visibleChunkIds\n'
                  '        );',
                  '      // Playback is overview-exclusive. Never wait for native chunks\n'
                  '      // at the loop boundary because native loading is intentionally\n'
                  '      // paused while the animation clock is running.\n'
                  '      const restartNativeReady=true;'
              ),
              (
                  '      /*\n'
                  '        If either tier somehow missed the prefetch, extend the\n'
                  '        hold slightly rather than showing mismatched timestamps.\n'
                  '      */',
                  '      /*\n'
                  '        If the circular overview buffer somehow missed frame zero,\n'
                  '        extend the hold slightly without stopping playback.\n'
                  '      */'
              ),
              (
                  '      if(\n'
                  '        activeTier==="native"\n'
                  '      ){\n'
                  '        chunkLayer.setEnabled(\n'
                  '          true\n'
                  '        );\n'
                  '\n'
                  '        refreshNativeViewport(\n'
                  '          false\n'
                  '        ).catch(\n'
                  '          error=>\n'
                  '            console.warn(\n'
                  '              "Native startup prefetch failed",\n'
                  '              error\n'
                  '            )\n'
                  '        );\n'
                  '      }\n'
                  '\n'
                  '      updateUi();\n'
                  '\n'
                  '      playing=true;',
                  '      if(\n'
                  '        activeTier==="native"\n'
                  '        &&chunkLayer\n'
                  '      ){\n'
                  '        // Native is inspection quality only while paused. Keeping it\n'
                  '        // disabled here avoids competing with the 3500x1750 loop.\n'
                  '        chunkLayer.setEnabled(\n'
                  '          false\n'
                  '        );\n'
                  '      }\n'
                  '\n'
                  '      updateUi();\n'
                  '\n'
                  '      playing=true;'
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected patch target missing: {old[:160]}')
              text = text.replace(old, new, 1)

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/radar-inline.js').write_text(scripts[0], encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/radar-inline.js'], check=True)

          body = json.dumps({
              'message': 'Restore radar quality and circular playback',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': original_sha,
              'branch': 'main',
          }).encode('utf-8')

          put = urllib.request.Request(api, data=body, headers={**headers, 'Content-Type': 'application/json'}, method='PUT')
          with urllib.request.urlopen(put) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
