name: Fix homepage radar reveal once

on:
  push:
    paths:
      - .github/workflows/fix-homepage-radar-reveal-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make radar wrapper initialization race-proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mosaic-radar-home.html')
          text = path.read_text(encoding='utf-8')

          old_start = '''      function installHomepageUi() {
        const doc = engine.contentDocument;
        if (!doc?.head || !doc?.body) return;

        doc.documentElement.classList.add("homepage-radar-mode");'''
          new_start = '''      function installHomepageUi() {
        const doc = engine.contentDocument;
        if (!doc?.head || !doc?.body) return;

        if (doc.documentElement.dataset.homepageRadarUiInstalled === "1") {
          engine.classList.add("is-ready");
          return;
        }
        doc.documentElement.dataset.homepageRadarUiInstalled = "1";
        doc.documentElement.classList.add("homepage-radar-mode");'''

          old_end = '''      engine.addEventListener("load", installHomepageUi);
    })();'''
          new_end = '''      engine.addEventListener("load", installHomepageUi);
      // The child iframe can finish before this script attaches its load handler,
      // especially from production/browser cache. Reveal and initialize it either way.
      if (engine.contentDocument?.readyState === "complete") {
        installHomepageUi();
      }
    })();'''

          if old_start not in text:
              raise SystemExit('installHomepageUi start marker not found')
          if old_end not in text:
              raise SystemExit('iframe load marker not found')

          text = text.replace(old_start, new_start, 1)
          text = text.replace(old_end, new_end, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit wrapper fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-home.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix homepage radar iframe reveal race"
          git push
