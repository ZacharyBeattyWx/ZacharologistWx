name: Apply radar homepage refresh once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-radar-homepage-refresh-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch radar homepage refresh versions
        run: python scripts/radar/patch_radar_homepage_refresh_once.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mosaic-radar-canvas-test.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refresh homepage radar style and scripts"
          git push origin main
