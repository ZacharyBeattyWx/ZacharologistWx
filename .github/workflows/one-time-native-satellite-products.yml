name: Native satellite products upgrade

on:
  push:
    paths:
      - .github/workflows/one-time-native-satellite-products.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply native satellite upgrade
        run: python3 .github/scripts/native_satellite_upgrade.py

      - name: Validate satellite upgrade
        shell: bash
        run: |
          python3 -m py_compile aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py
          rm -rf aws/satellite-truecolor-publisher/__pycache__
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('weather-viewer.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate final inline script')
          Path('/tmp/weather-viewer-inline.js').write_text(
              s[start + len('<script>'):end],
              encoding='utf-8'
          )
          PY
          node --check /tmp/weather-viewer-inline.js
          grep -n -F 'NATIVE_SOURCE_RE' aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py
          grep -n -F 'def air_mass_rgb' aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py
          grep -n -F 'nativeProduct:"air-mass"' weather-viewer.html
          grep -n -F 'SATELLITE_NATIVE_PREFIX' aws/satellite-truecolor-publisher/template.yaml

      - name: Commit upgrade and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aws/satellite-truecolor-publisher/satellite_truecolor_publisher.py \
            aws/satellite-truecolor-publisher/template.yaml \
            aws/satellite-truecolor-publisher/deploy-cloudshell.sh \
            weather-viewer.html
          git rm \
            .github/workflows/one-time-native-satellite-products.yml \
            .github/scripts/native_satellite_upgrade.py
          git commit -m "Add native Clean IR and Air Mass satellite products"
          git push origin HEAD:main
