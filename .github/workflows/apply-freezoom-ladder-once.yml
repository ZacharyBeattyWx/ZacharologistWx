name: Apply free zoom loading ladder once

on:
  push:
    paths:
      - scripts/radar/patch_freezoom_ladder_once.py
      - .github/workflows/apply-freezoom-ladder-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch renderer and tile server
        run: python3 scripts/radar/patch_freezoom_ladder_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-freezoom-webgl.js scripts/radar/serve_nexrad_detail_tiles.py
          git diff --cached --quiet && exit 0
          git commit -m "Make free zoom radar detail load progressively"
          git push
