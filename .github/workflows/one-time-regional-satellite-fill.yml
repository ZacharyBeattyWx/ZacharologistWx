name: Regional satellite fill

on:
  push:
    paths:
      - .github/workflows/one-time-regional-satellite-fill.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Expand desktop satellite media to stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('weather-viewer.html')
          text = path.read_text(encoding='utf-8')

          old = '''      #satelliteStage #satelliteImage,
      #satelliteStage #satelliteCanvas{
        max-width:100%;
        max-height:100%;
      }'''

          new = '''      #satelliteStage #satelliteImage,
      #satelliteStage #satelliteCanvas{
        width:100%;
        height:100%;
        max-width:none;
        max-height:none;
        object-fit:contain;
      }'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected one desktop satellite sizing block, found {text.count(old)}')

          if 'function fitSatelliteBboxToStage' not in text:
              raise SystemExit('Regional stage-fit geometry helper is missing')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Expanded desktop satellite media to stage.')
          PY

      - name: Validate viewer
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('weather-viewer.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate final inline script')
          Path('/tmp/weather-viewer-inline.js').write_text(
              s[start + len('<script>'):end],
              encoding='utf-8'
          )
          PY
          node --check /tmp/weather-viewer-inline.js
          grep -A8 -F '#satelliteStage #satelliteImage,' weather-viewer.html | grep -F 'width:100%;'
          grep -A8 -F '#satelliteStage #satelliteImage,' weather-viewer.html | grep -F 'height:100%;'
          grep -n -F 'function fitSatelliteBboxToStage' weather-viewer.html

      - name: Commit stage fill and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-regional-satellite-fill.yml
          git commit -m "Fill desktop satellite stage"
          git push origin HEAD:main
