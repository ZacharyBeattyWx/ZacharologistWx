name: Force mobile radar refresh once

on:
  push:
    paths:
      - '.github/workflows/force-mobile-radar-refresh-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Bump radar cache versions
        shell: python
        run: |
          from pathlib import Path

          radar = Path('mosaic-radar-canvas-test.html')
          text = radar.read_text(encoding='utf-8')
          old = 'mapbox-token.js?v=20260830b'
          new = 'mapbox-token.js?v=20260830d'
          if old not in text:
              raise SystemExit(f'Missing expected radar loader reference: {old}')
          radar.write_text(text.replace(old, new), encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'mosaic-radar-canvas-test.html?home=1&v=20260830c'
          new = 'mosaic-radar-canvas-test.html?home=1&v=20260830d'
          count = text.count(old)
          if count < 1:
              raise SystemExit(f'Missing expected homepage radar reference: {old}')
          index.write_text(text.replace(old, new), encoding='utf-8')
          print(f'Updated {count} homepage radar reference(s).')

      - name: Remove one-off workflow and push
        run: |
          rm .github/workflows/force-mobile-radar-refresh-once.yml
          git config user.name "ZacharyBeattyWx"
          git config user.email "115194840+ZacharyBeattyWx@users.noreply.github.com"
          git add mosaic-radar-canvas-test.html index.html .github/workflows/force-mobile-radar-refresh-once.yml
          git commit -m "Force mobile radar layout refresh"
          git push origin main
