name: Apply parallel radar startup once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-parallel-radar-startup-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch radar startup
        run: python scripts/radar/patch_parallel_radar_startup_once.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-canvas-test.html scripts/radar/nexrad-main-live-overlay.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Load homepage map and radar in parallel"
          git push origin main
