name: Patch radar v14 hot path

on:
  push:
    paths:
      - '.github/workflows/patch-radar-v14-hotpath.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove native playback hot-path queue churn
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # The core native buffer is an older steady-state owner. Under v14,
          # frame activation already refills the ready queue, so don't launch
          # another fetch/evict pass at every committed playback frame.
          replace_once(
              'mosaic-radar-home.html',
              '''  async function maintainNativeChunkBuffer(){\n    if(\n      activeTier!=="native"\n      ||!chunkLayer\n    ){''',
              '''  async function maintainNativeChunkBuffer(){\n    if(window.__ZWX_MRALA_V14_READY_QUEUE__){\n      return;\n    }\n\n    if(\n      activeTier!=="native"\n      ||!chunkLayer\n    ){'''
          )

          # v9 still owns archive/startup behavior, but its blend-time runway
          # request must not wake v14 on every interpolation paint.
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm-v9-core.js',
              '''      if (wanted.length) {\n        scheduleRunway(this, wanted, 0);\n        scheduleArchiveCache(this, wanted, 120, "native");\n      }''',
              '''      if (wanted.length) {\n        if (!window.__ZWX_MRALA_V14_READY_QUEUE__) {\n          scheduleRunway(this, wanted, 0);\n        }\n        scheduleArchiveCache(this, wanted, 120, "native");\n      }'''
          )
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm-v9-core.js',
              '''      scheduleRunway(this, this.__zwxRequestedVisibleIds, 30);''',
              '''      if (!window.__ZWX_MRALA_V14_READY_QUEUE__) {\n        scheduleRunway(this, this.__zwxRequestedVisibleIds, 30);\n      }'''
          )

          # hasFrame() is a readiness query and setBlendFrames() is the 60fps
          # presentation path. Neither should schedule or cancel queue work.
          replace_once(
              'scripts/radar/mrms-native-ready-queue-v14.js',
              '''    const originalHasFrame = layer.hasFrame;\n    if (typeof originalHasFrame === "function") {\n      layer.hasFrame = function (...args) {\n        const output = originalHasFrame.apply(this, args);\n        cancelLegacyRunway(this);\n        if (this.enabled && this.__zwxHdLocked) schedule(0);\n        return output;\n      };\n    }\n\n''',
              ''''''
          )
          replace_once(
              'scripts/radar/mrms-native-ready-queue-v14.js',
              '''    const originalSetBlendFrames = layer.setBlendFrames;\n    if (typeof originalSetBlendFrames === "function") {\n      layer.setBlendFrames = function (...args) {\n        const output = originalSetBlendFrames.apply(this, args);\n        cancelLegacyRunway(this);\n        schedule(0);\n        return output;\n      };\n    }\n\n''',
              ''''''
          )
          replace_once(
              'scripts/radar/mrms-native-ready-queue-v14.js',
              '''MRALA archive player v14: COD-style sequential ready queue''',
              '''MRALA archive player v14.1: frame-commit ready queue'''
          )

          # Cache-bust the files touched in this pass, all the way back to the
          # production HTML so normal reloads cannot mix old/new playback code.
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm.js',
              'mrms-native-loop-prewarm-v9-core.js?v=20260915d',
              'mrms-native-loop-prewarm-v9-core.js?v=20260915e'
          )
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm.js',
              'mrms-native-ready-queue-v14.js?v=20260915d',
              'mrms-native-ready-queue-v14.js?v=20260915e'
          )
          replace_once(
              'mapbox-token.js',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260915d',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260915e'
          )
          replace_once(
              'mosaic-radar-home.html',
              'mapbox-token.js?v=20260915d',
              'mapbox-token.js?v=20260915e'
          )
          PY

      - name: Verify hot-path cleanup
        shell: bash
        run: |
          grep -F 'if(window.__ZWX_MRALA_V14_READY_QUEUE__){' mosaic-radar-home.html
          grep -F 'mapbox-token.js?v=20260915e' mosaic-radar-home.html
          grep -F 'mrms-native-loop-prewarm-v9-core.js?v=20260915e' scripts/radar/mrms-native-loop-prewarm.js
          grep -F 'mrms-native-ready-queue-v14.js?v=20260915e' scripts/radar/mrms-native-loop-prewarm.js
          grep -F 'mrms-native-loop-prewarm.js?v=20260915e' mapbox-token.js
          grep -F 'MRALA archive player v14.1: frame-commit ready queue' scripts/radar/mrms-native-ready-queue-v14.js
          if grep -Fq 'const originalHasFrame = layer.hasFrame;' scripts/radar/mrms-native-ready-queue-v14.js; then
            echo 'v14 still wraps hasFrame'
            exit 1
          fi
          if grep -Fq 'const originalSetBlendFrames = layer.setBlendFrames;' scripts/radar/mrms-native-ready-queue-v14.js; then
            echo 'v14 still wraps setBlendFrames'
            exit 1
          fi
          git diff --check

      - name: Commit production cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mosaic-radar-home.html mapbox-token.js scripts/radar/mrms-native-loop-prewarm-v9-core.js scripts/radar/mrms-native-loop-prewarm.js scripts/radar/mrms-native-ready-queue-v14.js
          git commit -m 'Stop v14 queue churn during interpolation'
          git push
