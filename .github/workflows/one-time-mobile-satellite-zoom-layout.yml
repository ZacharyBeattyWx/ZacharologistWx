name: Mobile satellite Zoom-style layout

on:
  push:
    paths:
      - .github/workflows/one-time-mobile-satellite-zoom-layout.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile satellite layout
        shell: bash
        env:
          OLD_BLOCK_B64: ""
          NEW_BLOCK_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os

          path = Path('weather-viewer.html')
          text = path.read_text(encoding='utf-8')
          old = base64.b64decode(os.environ['OLD_BLOCK_B64']).decode('utf-8')
          new = base64.b64decode(os.environ['NEW_BLOCK_B64']).decode('utf-8')

          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one old mobile media block, found {text.count(old)}')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F 'object-fit:cover;' weather-viewer.html
          grep -F 'grid-template-rows:auto auto;' weather-viewer.html
          grep -F '#satTimeline{grid-column:1/-1;grid-row:2;width:100%;height:24px}' weather-viewer.html

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-mobile-satellite-zoom-layout.yml
          git commit -m "Make mobile satellite viewer full screen"
          git push
