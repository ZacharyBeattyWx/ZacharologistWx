name: Revert radar native presentation smoothing

on:
  push:
    paths:
      - '.github/workflows/revert-radar-native-presentation.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert native presentation smoothing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'mapbox-token.js',
              '''    if (\n      MOBILE ||\n      !layer ||\n      layer.__zwx60HzBlendPatched\n    ) return;\n    const originalBlend = layer[blendMethod];\n    if (typeof originalBlend !== "function") return;\n\n    const nativeViewport =\n      layer.id === "mrms-native-numeric-viewport-chunks";\n\n    const shouldAnimate = () =>\n      !nativeViewport ||\n      String(\n        document.getElementById("speedSelect")\n          ?.selectedOptions?.[0]?.textContent || ""\n      ).trim() === "2×";''',
              '''    if (\n      MOBILE ||\n      !layer ||\n      layer.id === "mrms-native-numeric-viewport-chunks" ||\n      layer.__zwx60HzBlendPatched\n    ) return;\n    const originalBlend = layer[blendMethod];\n    if (typeof originalBlend !== "function") return;'''
          )

          replace_once(
              'mapbox-token.js',
              '''    layer[blendMethod] = function (from, to, amount) {\n      const numericAmount = Math.max(0, Math.min(1, Number(amount) || 0));\n\n      if (!shouldAnimate()) {\n        cancelPresentation();\n        return originalBlend.call(this, from, to, numericAmount);\n      }\n\n      const nextPair = String(from) + "\\u0000" + String(to);''',
              '''    layer[blendMethod] = function (from, to, amount) {\n      const numericAmount = Math.max(0, Math.min(1, Number(amount) || 0));\n      const nextPair = String(from) + "\\u0000" + String(to);'''
          )

          replace_once(
              'mapbox-token.js',
              '''    console.info(\n      "MRALA desktop presentation: display-refresh GPU interpolation enabled for " +\n        layer.id +\n        (nativeViewport ? " • 2x only" : "")\n    );''',
              '''    console.info(\n      "MRALA desktop presentation: display-refresh GPU interpolation enabled for " +\n        layer.id\n    );'''
          )

          replace_once(
              'mosaic-radar-home.html',
              'mapbox-token.js?v=20260915c',
              'mapbox-token.js?v=20260915b'
          )
          PY

      - name: Verify revert
        shell: bash
        run: |
          grep -F 'layer.id === "mrms-native-numeric-viewport-chunks" ||' mapbox-token.js
          grep -F 'mapbox-token.js?v=20260915b' mosaic-radar-home.html
          if grep -Fq 'const nativeViewport =' mapbox-token.js; then
            echo 'Native presentation smoothing code still present'
            exit 1
          fi
          if grep -Fq 'if (!shouldAnimate()) {' mapbox-token.js; then
            echo '2x-only smoothing guard still present'
            exit 1
          fi

      - name: Commit revert
        shell: bash
        run: |
          if git diff --quiet -- mapbox-token.js mosaic-radar-home.html; then
            echo 'No production changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapbox-token.js mosaic-radar-home.html
          git commit -m 'Revert native 2x presentation smoothing'
          git push
