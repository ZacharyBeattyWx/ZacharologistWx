name: Apply all high-res radar pyramid once

on:
  push:
    paths:
      - scripts/radar/patch_all_highres_pyramid_once.py
      - .github/workflows/apply-all-highres-pyramid-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch free-zoom renderer and tile server
        run: python3 scripts/radar/patch_all_highres_pyramid_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-freezoom-webgl.js scripts/radar/serve_nexrad_detail_tiles.py
          git diff --cached --quiet && exit 0
          git commit -m "Use high-resolution NEXRAD tiles at every zoom"
          git push
