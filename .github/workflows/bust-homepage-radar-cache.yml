name: Bust homepage radar viewer cache

on:
  push:
    paths:
      - .github/workflows/bust-homepage-radar-cache.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version homepage radar script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_href = 'href="scripts/homepage-ops-reference.js"'
          new_href = 'href="scripts/homepage-ops-reference.js?v=20260928c"'
          old_src = 'src="scripts/homepage-ops-reference.js"'
          new_src = 'src="scripts/homepage-ops-reference.js?v=20260928c"'

          if text.count(old_href) != 1:
              raise SystemExit(f'Expected one preload href, found {text.count(old_href)}')
          if text.count(old_src) != 1:
              raise SystemExit(f'Expected one script src, found {text.count(old_src)}')

          text = text.replace(old_href, new_href, 1)
          text = text.replace(old_src, new_src, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify cache-busted URLs
        shell: bash
        run: |
          grep -F 'href="scripts/homepage-ops-reference.js?v=20260928c"' index.html
          grep -F 'src="scripts/homepage-ops-reference.js?v=20260928c"' index.html

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/bust-homepage-radar-cache.yml
          git commit -m "Bust homepage radar viewer script cache"
          git push
