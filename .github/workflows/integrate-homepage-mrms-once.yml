name: Integrate homepage MRMS

on:
  push:
    paths:
      - .github/workflows/integrate-homepage-mrms-once.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace homepage Windy embed
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_embed = '''title="Regional live radar"
        src="https://embed.windy.com/embed2.html?lat=39.50&lon=-98.35&zoom=4&level=surface&overlay=radar&product=radar"'''
          new_embed = '''title="Live national radar"
        src="./mosaic-radar-home.html"'''

          old_clean = 'clean: "https://embed.windy.com/embed2.html?lat=39.5&lon=-96&zoom=4&level=surface&overlay=radar&product=radar"'
          new_clean = 'clean: "./mosaic-radar-home.html"'

          if old_embed not in text:
              raise SystemExit('Homepage Windy iframe snippet not found')
          if old_clean not in text:
              raise SystemExit('Homepage clean radar URL snippet not found')

          text = text.replace(old_embed, new_embed)
          text = text.replace(old_clean, new_clean)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage MRMS radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Replace homepage Windy radar with MRMS"
          git push
