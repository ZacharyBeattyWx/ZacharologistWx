name: Apply progressive free zoom LOD once

on:
  push:
    paths:
      - .github/workflows/apply-progressive-freezoom-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply progressive LOD patch
        run: python3 scripts/radar/apply_progressive_freezoom_patch.py
      - name: Commit progressive LOD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-freezoom-webgl.js scripts/radar/serve_nexrad_detail_tiles.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore progressive free zoom radar detail"
          git push
