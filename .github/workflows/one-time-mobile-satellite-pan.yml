name: Mobile satellite bounded pan

on:
  push:
    paths:
      - .github/workflows/one-time-mobile-satellite-pan.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add bounded mobile satellite panning
        shell: bash
        env:
          PAN_CODE_B64: ""
          LISTENER_CODE_B64: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, os
          path = Path('weather-viewer.html')
          text = path.read_text(encoding='utf-8')
          pan_code = base64.b64decode(os.environ['PAN_CODE_B64']).decode('utf-8')
          listener_code = base64.b64decode(os.environ['LISTENER_CODE_B64']).decode('utf-8')

          old_css = '#satelliteStage{display:block;padding:0;background:#02060c}'
          new_css = '#satelliteStage{display:block;padding:0;background:#02060c;touch-action:none;overscroll-behavior:none;cursor:grab}#satelliteStage.sat-panning{cursor:grabbing}'
          if text.count(old_css) != 1:
              raise SystemExit(f'Expected one mobile satellite stage CSS anchor, found {text.count(old_css)}')
          text = text.replace(old_css, new_css, 1)

          state_anchor = '    let lightningFlashes=[],lightningDisplayedFlashes=[],lightningDisplayedKeys=new Set(),lightningLatestMs=0,lightningFetchPromise=null,lightningInitialFitDone=false;'
          if text.count(state_anchor) != 1:
              raise SystemExit(f'Expected one satellite state anchor, found {text.count(state_anchor)}')
          text = text.replace(state_anchor, state_anchor + pan_code, 1)

          listener_anchor = '    satProductButtons.forEach(button=>button.addEventListener("click",()=>{satProduct=button.dataset.satProduct;activate(satProductButtons,item=>item===button);if(activeProduct==="satellite")resetSatelliteViewer();}));'
          if text.count(listener_anchor) != 1:
              raise SystemExit(f'Expected one satellite listener anchor, found {text.count(listener_anchor)}')
          text = text.replace(listener_anchor, listener_code + listener_anchor, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -F 'function satellitePanBounds()' weather-viewer.html
          grep -F 'satelliteStage.addEventListener("pointerdown",beginSatellitePan);' weather-viewer.html
          grep -F 'touch-action:none' weather-viewer.html

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-mobile-satellite-pan.yml
          git commit -m "Add bounded pan to mobile satellite viewer"
          git push
