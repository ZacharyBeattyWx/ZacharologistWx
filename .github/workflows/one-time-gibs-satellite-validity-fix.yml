name: GIBS satellite validity fix

on:
  push:
    paths:
      - .github/workflows/one-time-gibs-satellite-validity-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden GIBS satellite frame handling
        run: python3 .github/scripts/one-time-gibs-satellite-validity-fix.py

      - name: Validate viewer
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('weather-viewer.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('Could not locate final inline script')
          Path('/tmp/weather-viewer-inline.js').write_text(
              s[start + len('<script>'):end],
              encoding='utf-8'
          )
          PY
          node --check /tmp/weather-viewer-inline.js
          grep -n -F 'TRANSPARENT:"true"' weather-viewer.html
          grep -n -F 'opaqueCoverage>.08' weather-viewer.html
          grep -n -F 'ageGateValid' weather-viewer.html

      - name: Commit fix and remove one-time files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-gibs-satellite-validity-fix.yml
          git rm .github/scripts/one-time-gibs-satellite-validity-fix.py
          git commit -m "Fix GIBS satellite blank and no-data frames"
          git push origin HEAD:main
