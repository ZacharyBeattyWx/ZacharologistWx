name: Apply direct NEXRAD main integration once

on:
  push:
    paths:
      - scripts/radar/patch_direct_nexrad_main_integration_once.py
      - .github/workflows/apply-direct-nexrad-main-integration-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply direct NEXRAD main integration
        run: python3 scripts/radar/patch_direct_nexrad_main_integration_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-canvas-test.html mapbox-token.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load NEXRAD overlay directly in main radar"
          git push
