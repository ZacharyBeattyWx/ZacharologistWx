name: One-shot radar recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-radar-recover.yml

permissions:
  contents: write

jobs:
  patch-radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore quality and circular playback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('mosaic-radar-alerts-current-test.html')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<div class="legend-title">Python Level II GPU Reflectivity (dBZ)</div>',
                  '<div class="legend-title">MRMS MRALA GPU Reflectivity (dBZ)</div>',
              ),
              (
                  'const MANIFEST_URL="https://dt0cd6bl1yqh2.cloudfront.net/mrms-native-numeric/manifest-playback-test.json";',
                  'const MANIFEST_URL="https://dt0cd6bl1yqh2.cloudfront.net/mrms-native-numeric/manifest.json";',
              ),
              (
                  'const BASE_TIER="playback";',
                  'const BASE_TIER="overview";',
              ),
              (
                  'const GPU_DEPTH_OVERVIEW=MOBILE?10:36;',
                  'const GPU_DEPTH_OVERVIEW=MOBILE?6:18;',
              ),
              (
                  'const DISABLE_NATIVE_LOD_TEST=true;',
                  'const DISABLE_NATIVE_LOD_TEST=false;',
              ),
              (
                  'const LOOP_END_PAUSE_MS=1500;',
                  'const LOOP_END_PAUSE_MS=450;',
              ),
              (
                  '      Hold the newest frame for 2.5 seconds. During that hold,\n'
                  '      the normal overview/native buffers can preload the beginning\n'
                  '      of the next loop. Once frame zero is resident, jump directly\n'
                  '      back to it and resume the animation clock.',
                  '      Briefly hold the newest frame. During that hold, the circular\n'
                  '      overview buffer already contains the beginning of the next loop.\n'
                  '      Once frame zero is resident, jump directly back to it and keep\n'
                  '      the animation clock running.',
              ),
              (
                  '      const restartNativeReady=\n'
                  '        activeTier!=="native"\n'
                  '        ||chunkLayer.hasFrame(\n'
                  '          String(\n'
                  '            frames[\n'
                  '              restartIndex\n'
                  '            ]?.id||""\n'
                  '          ),\n'
                  '          visibleChunkIds\n'
                  '        );',
                  '      // Playback is overview-exclusive. Never wait for native chunks\n'
                  '      at the loop boundary because native loading is intentionally\n'
                  '      paused while the animation clock is running.\n'
                  '      const restartNativeReady=true;',
              ),
              (
                  '      /*\n'
                  '        If either tier somehow missed the prefetch, extend the\n'
                  '        hold slightly rather than showing mismatched timestamps.\n'
                  '      */',
                  '      /*\n'
                  '        If the circular overview buffer somehow missed frame zero,\n'
                  '        extend the hold slightly without stopping playback.\n'
                  '      */',
              ),
              (
                  '      if(\n'
                  '        activeTier==="native"\n'
                  '      ){\n'
                  '        chunkLayer.setEnabled(\n'
                  '          true\n'
                  '        );\n'
                  '\n'
                  '        refreshNativeViewport(\n'
                  '          false\n'
                  '        ).catch(\n'
                  '          error=>\n'
                  '            console.warn(\n'
                  '              "Native startup prefetch failed",\n'
                  '              error\n'
                  '            )\n'
                  '        );\n'
                  '      }\n'
                  '\n'
                  '      updateUi();\n'
                  '\n'
                  '      playing=true;',
                  '      if(\n'
                  '        activeTier==="native"\n'
                  '        &&chunkLayer\n'
                  '      ){\n'
                  '        // Native is inspection quality only while paused. Keeping it\n'
                  '        // disabled here avoids competing with the 3500x1750 loop.\n'
                  '        chunkLayer.setEnabled(\n'
                  '          false\n'
                  '        );\n'
                  '      }\n'
                  '\n'
                  '      updateUi();\n'
                  '\n'
                  '      playing=true;',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected radar patch target not found:\n{old[:180]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Syntax-check inline radar JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('mosaic-radar-alerts-current-test.html').read_text(encoding='utf-8')
          matches = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(matches) != 1:
              raise SystemExit(f'Expected one inline script, found {len(matches)}')
          Path('/tmp/radar-inline.js').write_text(matches[0], encoding='utf-8')
          PY
          node --check /tmp/radar-inline.js

      - name: Commit radar fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-alerts-current-test.html
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Restore radar quality and circular playback"
          git push
