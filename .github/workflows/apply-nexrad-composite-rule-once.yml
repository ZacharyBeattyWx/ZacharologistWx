name: Apply NEXRAD composite rule once

on:
  push:
    paths:
      - scripts/radar/patch_nexrad_composite_rule_once.py
      - .github/workflows/apply-nexrad-composite-rule-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch composite rule
        run: python3 scripts/radar/patch_nexrad_composite_rule_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/serve_nexrad_detail_tiles.py scripts/radar/render_unidata_nexrad_site_mosaic.py
          git diff --cached --quiet && exit 0
          git commit -m "Preserve storms in NEXRAD detail mosaic"
          git push
