name: Patch radar v14 live window

on:
  push:
    paths:
      - '.github/workflows/patch-radar-v14-live-window.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stabilize live playback queue window
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = 'scripts/radar/mrms-native-ready-queue-v14.js'

          replace_once(
              path,
              '  const ACTIVE_BACKGROUND_FRAMES = MOBILE ? 1 : 3;\n',
              '  const ACTIVE_UPLOAD_TEXTURES = MOBILE ? 6 : 12;\n'
          )

          replace_once(
              path,
              '''    const count = queueCount(ids);\n    const frames = sequentialFrames(count);\n    if (!frames.length) return { ready: 0, target: 0 };''',
              '''    const count = queueCount(ids);\n    const startAnchor = sliderIndex();\n    const frames = sequentialFrames(count, startAnchor);\n    if (!frames.length) return { ready: 0, target: 0 };'''
          )

          replace_once(
              path,
              '''    const remaining = frames.slice(gateFrames.length);\n    const backgroundFrames = aggressive || !isPlaying()\n      ? remaining\n      : remaining.filter(frame => !frameComplete(layer, frame, chunks)).slice(0, ACTIVE_BACKGROUND_FRAMES);\n\n    const backgroundLoaded = backgroundFrames.length\n      ? await loadFrameSet(layer, backgroundFrames, chunks)\n      : 0;\n\n    layer.__zwxV14QueueKeys = nextPins;\n\n    const keep = new Set([...nextPins, ...currentPins(layer, chunks)]);\n    layer.evictExcept?.(keep);\n    layer.map?.triggerRepaint?.();\n\n    let complete = 0;\n    for (const frame of frames) {\n      if (!frameComplete(layer, frame, chunks)) break;\n      complete += 1;\n    }''',
              '''    const remaining = frames.slice(gateFrames.length);\n    const activeFrameLimit = Math.max(\n      1,\n      Math.floor(ACTIVE_UPLOAD_TEXTURES / Math.max(1, chunks.length))\n    );\n    const backgroundFrames = aggressive || !isPlaying()\n      ? remaining\n      : remaining.filter(frame => !frameComplete(layer, frame, chunks)).slice(0, activeFrameLimit);\n\n    const backgroundLoaded = backgroundFrames.length\n      ? await loadFrameSet(layer, backgroundFrames, chunks)\n      : 0;\n\n    // Playback may advance while the async load above is running. Never trim\n    // against the stale window captured at fill start; recompute from the live\n    // playhead so a completed fill cannot evict newly-ahead observations.\n    const liveFrames = sequentialFrames(count);\n    const livePins = queuePins(liveFrames, chunks);\n    layer.__zwxV14QueueKeys = livePins;\n\n    const keep = new Set([...livePins, ...currentPins(layer, chunks)]);\n    layer.evictExcept?.(keep);\n    layer.map?.triggerRepaint?.();\n\n    let complete = 0;\n    for (const frame of liveFrames) {\n      if (!frameComplete(layer, frame, chunks)) break;\n      complete += 1;\n    }'''
          )

          replace_once(
              path,
              '''    const signature = `${document.getElementById("frameSlider")?.value || ""}:${ids.join("|")}:${complete}:${count}`;''',
              '''    const liveAnchor = sliderIndex();\n    const signature = `${document.getElementById("frameSlider")?.value || ""}:${ids.join("|")}:${complete}:${count}`;'''
          )

          replace_once(
              path,
              '''    return { ready: complete, target: count };''',
              '''    return { ready: complete, target: count, anchorMoved: liveAnchor !== startAnchor };'''
          )

          replace_once(
              path,
              '''          if (result.ready < result.target) {\n            pending = true;\n            if (isPlaying()) break;\n          }''',
              '''          if (result.ready < result.target || result.anchorMoved) {\n            pending = true;\n            if (isPlaying()) break;\n          }'''
          )

          replace_once(
              path,
              '''    const ids = visibleIds(layer);\n    const needed = Math.min(PLAY_GATE, queueCount(ids));\n    if (readyAhead(layer) >= needed) return true;''',
              '''    const ids = visibleIds(layer);\n    const needed = queueCount(ids);\n    if (readyAhead(layer) >= needed) return true;'''
          )

          replace_once(
              path,
              '''    return readyAhead(layer) >= Math.min(3, needed);''',
              '''    return readyAhead(layer) >= needed;'''
          )

          replace_once(
              path,
              '''MRALA archive player v14.1: frame-commit ready queue''',
              '''MRALA archive player v14.2: live-window ready queue'''
          )

          replace_once(
              path,
              '''    primeForPlay()\n      .catch(() => false)\n      .finally(() => {\n        button.disabled = false;\n        button.textContent = originalText;\n        bypassPlayGate = true;\n        button.click();\n        bypassPlayGate = false;\n      });''',
              '''    primeForPlay()\n      .catch(() => false)\n      .then(ready => {\n        button.disabled = false;\n        button.textContent = originalText;\n        if (!ready) {\n          schedule(0, true);\n          return;\n        }\n        bypassPlayGate = true;\n        button.click();\n        bypassPlayGate = false;\n      });'''
          )

          # Cache-bust only the changed ready-queue file and its loader chain.
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm.js',
              'mrms-native-ready-queue-v14.js?v=20260915e',
              'mrms-native-ready-queue-v14.js?v=20260915f'
          )
          replace_once(
              'mapbox-token.js',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260915e',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260915f'
          )
          replace_once(
              'mosaic-radar-home.html',
              'mapbox-token.js?v=20260915e',
              'mapbox-token.js?v=20260915f'
          )
          PY

      - name: Verify live-window stabilization
        shell: bash
        run: |
          grep -F 'MRALA archive player v14.2: live-window ready queue' scripts/radar/mrms-native-ready-queue-v14.js
          grep -F 'const startAnchor = sliderIndex();' scripts/radar/mrms-native-ready-queue-v14.js
          grep -F 'const liveFrames = sequentialFrames(count);' scripts/radar/mrms-native-ready-queue-v14.js
          grep -F 'const needed = queueCount(ids);' scripts/radar/mrms-native-ready-queue-v14.js
          grep -F 'mrms-native-ready-queue-v14.js?v=20260915f' scripts/radar/mrms-native-loop-prewarm.js
          grep -F 'mrms-native-loop-prewarm.js?v=20260915f' mapbox-token.js
          grep -F 'mapbox-token.js?v=20260915f' mosaic-radar-home.html
          if grep -Fq 'ACTIVE_BACKGROUND_FRAMES' scripts/radar/mrms-native-ready-queue-v14.js; then
            echo 'old fixed background-frame limiter still present'
            exit 1
          fi
          git diff --check

      - name: Commit live-window stabilization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/radar/mrms-native-ready-queue-v14.js scripts/radar/mrms-native-loop-prewarm.js mapbox-token.js mosaic-radar-home.html
          git commit -m 'Keep v14 queue aligned with live playhead'
          git push
