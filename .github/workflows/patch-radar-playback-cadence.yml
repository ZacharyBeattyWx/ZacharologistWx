name: Patch radar playback cadence

on:
  push:
    paths:
      - '.github/workflows/patch-radar-playback-cadence.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production cadence patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "mapbox-token.js",
              '["1×", "170"]',
              '["1×", "240"]'
          )
          replace_once(
              "mapbox-token.js",
              '["1.5×", "115"]',
              '["1.5×", "160"]'
          )
          replace_once(
              "mapbox-token.js",
              'MRALA playback cadence: 0.5x 340ms • 1x 170ms • 1.5x 115ms • 2x 210ms with 5-minute scan steps',
              'MRALA playback cadence: 0.5x 340ms • 1x 240ms • 1.5x 160ms • 2x 210ms with 5-minute scan steps'
          )
          replace_once(
              "mosaic-radar-home.html",
              'mapbox-token.js?v=20260914c',
              'mapbox-token.js?v=20260915b'
          )
          replace_once(
              "mosaic-radar-home.html",
              '<option value="100" selected>1×</option>',
              '<option value="240" selected>1×</option>'
          )
          replace_once(
              "mosaic-radar-home.html",
              '<option value="67">1.5×</option>',
              '<option value="160">1.5×</option>'
          )
          PY

      - name: Verify production cadence patch
        shell: bash
        run: |
          grep -F '["1×", "240"]' mapbox-token.js
          grep -F '["1.5×", "160"]' mapbox-token.js
          grep -F '0.5x 340ms • 1x 240ms • 1.5x 160ms • 2x 210ms with 5-minute scan steps' mapbox-token.js
          grep -F 'mapbox-token.js?v=20260915b' mosaic-radar-home.html
          grep -F '<option value="240" selected>1×</option>' mosaic-radar-home.html
          grep -F '<option value="160">1.5×</option>' mosaic-radar-home.html

      - name: Commit production patch
        shell: bash
        run: |
          if git diff --quiet -- mapbox-token.js mosaic-radar-home.html; then
            echo "No production changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapbox-token.js mosaic-radar-home.html
          git commit -m "Slow 1x and 1.5x radar playback"
          git push
