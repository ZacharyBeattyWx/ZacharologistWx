name: Apply NEXRAD main ready gate once

on:
  push:
    paths:
      - scripts/radar/patch_nexrad_main_ready_gate_once.py
      - .github/workflows/apply-nexrad-main-ready-gate-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch NEXRAD main overlay ready gate
        run: python3 scripts/radar/patch_nexrad_main_ready_gate_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-main-live-overlay.js
          git diff --cached --quiet && exit 0
          git commit -m "Wait for main radar before NEXRAD overlay"
          git push
