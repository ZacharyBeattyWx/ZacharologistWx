name: Wire production MRMS radar source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/wire-production-mrms-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point production radar at generated data branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          prod_url = 'https://raw.githubusercontent.com/ZacharyBeattyWx/ZacharologistWx/radar-data/manifest.json'
          local_line = 'const MANIFEST_URL = "./mrms-mosaic-loop-output/manifest.json";'
          replacement = (
              'const MANIFEST_URL = ["localhost", "127.0.0.1"].includes(window.location.hostname)\n'
              '      ? "./mrms-mosaic-loop-output/manifest.json"\n'
              f'      : "{prod_url}";'
          )

          for filename in ['mosaic-radar-canvas-test.html', 'mosaic-radar-home.html']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if local_line not in text:
                  raise SystemExit(f'MANIFEST_URL line not found in {filename}')
              text = text.replace(local_line, replacement, 1)
              path.write_text(text, encoding='utf-8')

          player = Path('scripts/radar/mrms-timelapse-playback-v2.js')
          text = player.read_text(encoding='utf-8')
          old = '`${TIMELAPSE_TRANSITION_MS}ms linear alpha-correct blends, target ~${TARGET_2X_KEYFRAMES} key scans`'
          new = '`${TIMELAPSE_TRANSITION_MS}ms linear alpha-correct blends, fixed ${TIMELAPSE_FRAME_STRIDE}-scan stride`'
          if old not in text:
              raise SystemExit('Legacy 2x console reference not found')
          player.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit production radar wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-canvas-test.html mosaic-radar-home.html scripts/radar/mrms-timelapse-playback-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Use generated MRMS feed in production"
          git push
