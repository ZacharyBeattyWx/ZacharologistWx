name: One-shot radar state fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-radar-state-fix.yml

permissions:
  contents: write

jobs:
  patch-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Patch radar playback/native state handling
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = os.environ['GH_REPOSITORY']
          token = os.environ['GH_TOKEN']
          target = 'mosaic-radar-alerts-current-test.html'
          api = f'https://api.github.com/repos/{repo}/contents/{target}'
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zwx-radar-state-fix',
          }

          with urllib.request.urlopen(urllib.request.Request(api, headers=headers)) as response:
              payload = json.load(response)

          original_sha = payload['sha']
          text = base64.b64decode(payload['content']).decode('utf-8')

          # 1) A playing loop must never launch native viewport I/O.
          old = '''    if(DISABLE_NATIVE_LOD_TEST){
      return false;
    }
    if(
      activeTier!=="native"
      ||!chunkLayer
    ){
      return;
    }'''
          new = '''    if(DISABLE_NATIVE_LOD_TEST){
      return false;
    }

    // Native chunks are inspection quality. During animation the
    // 3500x1750 overview owns the clock and all native I/O is suppressed.
    if(playing){
      if(chunkLayer?.enabled){
        chunkLayer.setEnabled(false);
      }
      return false;
    }

    if(
      activeTier!=="native"
      ||!chunkLayer
    ){
      return;
    }'''
          if old not in text:
              raise SystemExit('refreshNativeViewport guard target missing')
          text = text.replace(old, new, 1)

          # 2) Restore exactly one busy/pending lock around native rolling-buffer work.
          pattern = re.compile(
              r'  async function maintainNativeChunkBuffer\(\)\{.*?\n  \}\n\n  async function refreshNativeViewport',
              re.S,
          )
          replacement = '''  async function maintainNativeChunkBuffer(){
    if(
      playing
      ||activeTier!=="native"
      ||!chunkLayer
    ){
      return;
    }

    if(chunkBufferBusy){
      chunkBufferPending=true;
      return;
    }

    chunkBufferBusy=true;

    try{
      do{
        chunkBufferPending=false;

        try{
          await fillNativeChunkBuffer();
        }catch(error){
          console.warn(
            "Native viewport rolling buffer failed",
            error
          );
        }
      }while(
        chunkBufferPending
        &&!playing
        &&activeTier==="native"
      );
    }finally{
      chunkBufferBusy=false;
    }
  }

  async function refreshNativeViewport'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'maintainNativeChunkBuffer replacement count={count}')

          # 3) Manual frame changes in native mode hide stale native pixels, then
          #    restore the exact selected observation once its viewport chunks load.
          old = '''  async function showFrame(
    index,
    {
      buffer=true,
      tier=BASE_TIER
    }={}
  ){'''
          new = '''  async function showFrame(
    index,
    {
      buffer=true,
      tier=BASE_TIER,
      nativeDetail=true
    }={}
  ){'''
          if old not in text:
              raise SystemExit('showFrame signature target missing')
          text = text.replace(old, new, 1)

          old = '''    if(
      activeTier==="native"
    ){
      refreshNativeViewport(
        false
      ).catch(
        error=>
          console.warn(
            "Native viewport refresh failed",
            error
          )
      );
    }

    return true;
  }

  async function switchTierForZoom(){'''
          new = '''    if(
      activeTier==="native"
      &&nativeDetail
    ){
      // Never leave a previous native timestamp covering a newly selected
      // overview frame. Show the overview until this exact native frame is ready.
      chunkLayer?.setEnabled(false);

      refreshNativeViewport(
        true
      )
        .then(()=>{
          if(
            !playing
            &&activeTier==="native"
            &&syncNativeCurrent()
          ){
            chunkLayer.setEnabled(true);
          }
        })
        .catch(
          error=>
            console.warn(
              "Native viewport refresh failed",
              error
            )
        );
    }

    return true;
  }

  async function switchTierForZoom(){'''
          if old not in text:
              raise SystemExit('showFrame native refresh target missing')
          text = text.replace(old, new, 1)

          # 4) Entering deep zoom while playing remains overview-only and nonblocking.
          old = '''      if(desired==="native"){
        activeTier="native";

        chunkLayer.setEnabled(
          true
        );

        setStatus(
          "Preparing native viewport chunks…"
        );

        await refreshNativeViewport(
          true
        );

        if(
          generation
          !==tierSwitchGeneration
        ){
          return;
        }

        setStatus(
          "Native viewport MRALA active • "
          +visibleChunkIds.length
          +" chunks • z"
          +map.getZoom().toFixed(2),
          "live"
        );
      }else{'''
          new = '''      if(desired==="native"){
        activeTier="native";

        // The overview remains visible until a complete native viewport exists.
        // During playback we do not request native chunks at all.
        chunkLayer.setEnabled(false);

        if(playing){
          setStatus(
            "High-resolution overview playback • native detail resumes on pause",
            "live"
          );

          updateUi();
          maintainBuffer();
          return;
        }

        setStatus(
          "Preparing native viewport chunks…"
        );

        await refreshNativeViewport(
          true
        );

        if(
          generation
          !==tierSwitchGeneration
          ||playing
        ){
          return;
        }

        const nativeReady=
          syncNativeCurrent();

        chunkLayer.setEnabled(
          nativeReady
        );

        setStatus(
          nativeReady
            ? "Native viewport MRALA active • "
              +visibleChunkIds.length
              +" chunks • z"
              +map.getZoom().toFixed(2)
            : "Overview active • native detail unavailable for this frame",
          "live"
        );
      }else{'''
          if old not in text:
              raise SystemExit('switchTierForZoom native branch target missing')
          text = text.replace(old, new, 1)

          # 5) Pause: keep overview visible while loading the exact native frame,
          #    then reveal native only if playback is still paused.
          old = '''    if(
      activeTier==="native"
      &&chunkLayer
    ){
      chunkLayer.setEnabled(
        true
      );

      refreshNativeViewport(
        false
      )
        .then(
          ()=>{
            syncNativeCurrent();
          }
        )
        .catch(
          error=>
            console.warn(
              "Native pause-detail refresh failed",
              error
            )
        );
    }'''
          new = '''    if(
      activeTier==="native"
      &&chunkLayer
    ){
      chunkLayer.setEnabled(false);

      refreshNativeViewport(
        true
      )
        .then(
          ()=>{
            if(
              !playing
              &&activeTier==="native"
              &&syncNativeCurrent()
            ){
              chunkLayer.setEnabled(true);
            }
          }
        )
        .catch(
          error=>
            console.warn(
              "Native pause-detail refresh failed",
              error
            )
        );
    }'''
          if old not in text:
              raise SystemExit('stopPlayback native restore target missing')
          text = text.replace(old, new, 1)

          # 6) Startup should not accidentally begin a native fetch before playback.
          old = '''      await showFrame(
        start,
        {
          buffer:false,
          tier:BASE_TIER
        }
      );'''
          new = '''      await showFrame(
        start,
        {
          buffer:false,
          tier:BASE_TIER,
          nativeDetail:false
        }
      );'''
          if old not in text:
              raise SystemExit('startPlayback showFrame target missing')
          text = text.replace(old, new, 1)

          # 7) Status text should describe what is actually rendering during deep-zoom playback.
          old = '''          activeTier==="native"
            ? "Overview clock + native viewport ready • "
            : "Overview video-style MRALA ready • "'''
          new = '''          activeTier==="native"
            ? "High-resolution overview playback • native detail on pause • "
            : "Overview video-style MRALA ready • "'''
          if old not in text:
              raise SystemExit('playback status target missing')
          text = text.replace(old, new, 1)

          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          if len(scripts) != 1:
              raise SystemExit(f'Expected one inline script, found {len(scripts)}')
          Path('/tmp/radar-inline.js').write_text(scripts[0], encoding='utf-8')
          subprocess.run(['node', '--check', '/tmp/radar-inline.js'], check=True)

          body = json.dumps({
              'message': 'Fix radar native playback state transitions',
              'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
              'sha': original_sha,
              'branch': 'main',
          }).encode('utf-8')

          req = urllib.request.Request(
              api,
              data=body,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          print(result['commit']['sha'])
          PY
