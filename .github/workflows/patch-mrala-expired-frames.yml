name: Patch MRALA expired frame handling

on:
  push:
    paths:
      - '.github/workflows/patch-mrala-expired-frames.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch expired-frame handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # -----------------------------------------------------------------
          # Core playback: share a session-local retired-frame set across the
          # overview renderer, native renderer, v15 queue, and wrap reserve.
          # -----------------------------------------------------------------
          replace_once(
              'mosaic-radar-home.html',
              '''  const loading=new Map();
  const chunkLoading=new Map();

  // Precompiled full RadarScope palette LUT.''',
              '''  const loading=new Map();
  const chunkLoading=new Map();

  const unavailableFrameIds=
    window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__=
      window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__
      ||new Set();

  function retireUnavailableFrame(
    frame,
    status,
    source
  ){
    const id=
      String(
        frame?.id
        ||""
      );

    if(!id){
      return false;
    }

    const first=
      !unavailableFrameIds.has(id);

    unavailableFrameIds.add(id);

    if(first){
      console.warn(
        "MRALA retired unavailable frame",
        id,
        "• HTTP "+status,
        "• "+source
      );
    }

    return first;
  }

  function frameUnavailable(frame){
    return unavailableFrameIds.has(
      String(frame?.id||"")
    );
  }

  // Precompiled full RadarScope palette LUT.'''
          )

          replace_once(
              'mosaic-radar-home.html',
              '''      if(!response.ok){
        throw new Error(
          `${tierLabel(tier)} frame HTTP ${response.status}`
        );
      }''',
              '''      if(!response.ok){
        if(
          response.status===403
          ||response.status===404
        ){
          retireUnavailableFrame(
            frame,
            response.status,
            tierLabel(tier)
          );
          return false;
        }

        throw new Error(
          `${tierLabel(tier)} frame HTTP ${response.status}`
        );
      }'''
          )

          replace_once(
              'mosaic-radar-home.html',
              '''        if(!response.ok){
          throw new Error(
            "Native chunk "
            +chunk.id
            +" HTTP "
            +response.status
          );
        }''',
              '''        if(!response.ok){
          if(
            response.status===403
            ||response.status===404
          ){
            retireUnavailableFrame(
              frame,
              response.status,
              "native chunk "+chunk.id
            );
            return false;
          }

          throw new Error(
            "Native chunk "
            +chunk.id
            +" HTTP "
            +response.status
          );
        }'''
          )

          replace_once(
              'mosaic-radar-home.html',
              '''  function nextPlaybackIndex(
    index=currentIndex
  ){
    if(!frames.length){
      return 0;
    }

    const normalized=
      (
        Number(index)
        +frames.length
      )%frames.length;

    return (normalized+1)%frames.length;
  }''',
              '''  function nextPlaybackIndex(
    index=currentIndex
  ){
    if(!frames.length){
      return 0;
    }

    const normalized=
      (
        Number(index)
        +frames.length
      )%frames.length;

    let next=
      (normalized+1)
      %frames.length;

    for(
      let attempts=0;
      attempts<frames.length;
      attempts++
    ){
      if(
        !frameUnavailable(
          frames[next]
        )
      ){
        return next;
      }

      next=
        (next+1)
        %frames.length;
    }

    return normalized;
  }'''
          )

          replace_once(
              'mosaic-radar-home.html',
              '''      const restartIndex=0;''',
              '''      const restartIndex=
        nextPlaybackIndex(
          frames.length-1
        );'''
          )

          # ---------------------------------------------------------------
          # v15 rolling queue: blacklist 403/404 frame IDs and never schedule
          # queue work from the 60fps blend path.
          # ---------------------------------------------------------------
          replace_once(
              'scripts/radar/mrms-native-bandwidth-v15.js',
              '''  const inflight = new Map();
  const originalFetch = window.fetch.bind(window);''',
              '''  const inflight = new Map();
  const unavailableFrameIds =
    window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__ =
      window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__ || new Set();
  const originalFetch = window.fetch.bind(window);

  function retireFrameId(frameId, status, source) {
    const id = String(frameId || "");
    if (!id) return false;
    const first = !unavailableFrameIds.has(id);
    unavailableFrameIds.add(id);
    if (first) {
      console.warn(
        "MRALA v15 retired unavailable frame",
        id,
        "• HTTP " + status,
        "• " + source
      );
    }
    return first;
  }

  function frameIdFromChunkUrl(url) {
    const match = String(url || "").match(
      /\\/native-chunks\\/([^/]+)\\//
    );
    return match ? decodeURIComponent(match[1]) : "";
  }'''
          )

          replace_once(
              'scripts/radar/mrms-native-bandwidth-v15.js',
              '''    const valid = frames
      .filter(frame => frame?.id && Number.isFinite(frameMs(frame)))
      .sort((a, b) => frameMs(a) - frameMs(b));''',
              '''    const valid = frames
      .filter(
        frame =>
          frame?.id &&
          !unavailableFrameIds.has(String(frame.id)) &&
          Number.isFinite(frameMs(frame))
      )
      .sort((a, b) => frameMs(a) - frameMs(b));'''
          )

          replace_once(
              'scripts/radar/mrms-native-bandwidth-v15.js',
              '''      if (!response.ok) {
        throw new Error(`Native chunk HTTP ${response.status}`);
      }
      return response.arrayBuffer();''',
              '''      if (!response.ok) {
        if (response.status === 403 || response.status === 404) {
          retireFrameId(
            frameIdFromChunkUrl(url),
            response.status,
            "native chunk"
          );
        }
        throw new Error(`Native chunk HTTP ${response.status}`);
      }
      return response.arrayBuffer();'''
          )

          replace_once(
              'scripts/radar/mrms-native-bandwidth-v15.js',
              '''    const originalSetBlendFrames = layer.setBlendFrames;
    if (typeof originalSetBlendFrames === "function") {
      layer.setBlendFrames = function(...blendArgs) {
        const output = originalSetBlendFrames.apply(this, blendArgs);
        if (this.enabled) schedule(0);
        return output;
      };
    }

''',
              ''''''
          )

          replace_once(
              'scripts/radar/mrms-native-bandwidth-v15.js',
              '''MRALA bandwidth controller v15: one native prefetch owner • no predictive warm • no full 3h cache • speed-aware rolling queue''',
              '''MRALA bandwidth controller v15.1: one native prefetch owner • expired-frame skip • blend path read-only • speed-aware rolling queue'''
          )

          # ---------------------------------------------------------------
          # Wrap reserve: share the same blacklist so a missing oldest frame
          # cannot be repeatedly warmed at loop start.
          # ---------------------------------------------------------------
          replace_once(
              'scripts/radar/mrms-native-wrap-reserve-v15.js',
              '''  const inflight = new Map();

  function isPlaying() {''',
              '''  const inflight = new Map();
  const unavailableFrameIds =
    window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__ =
      window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__ || new Set();

  function retireFrameId(frameId, status) {
    const id = String(frameId || "");
    if (!id) return false;
    const first = !unavailableFrameIds.has(id);
    unavailableFrameIds.add(id);
    if (first) {
      console.warn(
        "MRALA v15 wrap reserve retired frame",
        id,
        "• HTTP " + status
      );
    }
    return first;
  }

  function frameIdFromChunkUrl(url) {
    const match = String(url || "").match(
      /\\/native-chunks\\/([^/]+)\\//
    );
    return match ? decodeURIComponent(match[1]) : "";
  }

  function isPlaying() {'''
          )

          replace_once(
              'scripts/radar/mrms-native-wrap-reserve-v15.js',
              '''          frame?.id &&
          frame?.nativeChunksReady &&
          Number.isFinite(frameMs(frame))''',
              '''          frame?.id &&
          !unavailableFrameIds.has(String(frame.id)) &&
          frame?.nativeChunksReady &&
          Number.isFinite(frameMs(frame))'''
          )

          replace_once(
              'scripts/radar/mrms-native-wrap-reserve-v15.js',
              '''      const response = await window.fetch(url, { cache: "force-cache" });
      if (!response.ok) throw new Error(`Wrap reserve HTTP ${response.status}`);
      return response.arrayBuffer();''',
              '''      const response = await window.fetch(url, { cache: "force-cache" });
      if (!response.ok) {
        if (response.status === 403 || response.status === 404) {
          retireFrameId(
            frameIdFromChunkUrl(url),
            response.status
          );
        }
        throw new Error(`Wrap reserve HTTP ${response.status}`);
      }
      return response.arrayBuffer();'''
          )

          replace_once(
              'scripts/radar/mrms-native-wrap-reserve-v15.js',
              '''MRALA v15 wrap reserve: ${RESERVE_DEPTH} loop-start native frames pinned only during playback''',
              '''MRALA v15.1 wrap reserve: ${RESERVE_DEPTH} loop-start native frames pinned only during playback'''
          )

          # Cache bust the changed playback chain.
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm.js',
              'mrms-native-bandwidth-v15.js?v=20260916a',
              'mrms-native-bandwidth-v15.js?v=20260917a'
          )
          replace_once(
              'scripts/radar/mrms-native-loop-prewarm.js',
              'mrms-native-wrap-reserve-v15.js?v=20260916b',
              'mrms-native-wrap-reserve-v15.js?v=20260917a'
          )
          replace_once(
              'mapbox-token.js',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260915f',
              'scripts/radar/mrms-native-loop-prewarm.js?v=20260917a'
          )
          replace_once(
              'mosaic-radar-home.html',
              'mapbox-token.js?v=20260915f',
              'mapbox-token.js?v=20260917a'
          )
          PY

      - name: Verify expired-frame patch
        shell: bash
        run: |
          grep -F 'MRALA bandwidth controller v15.1' scripts/radar/mrms-native-bandwidth-v15.js
          grep -F 'MRALA v15.1 wrap reserve' scripts/radar/mrms-native-wrap-reserve-v15.js
          grep -F 'window.__ZWX_MRALA_UNAVAILABLE_FRAME_IDS__' mosaic-radar-home.html
          grep -F 'nextPlaybackIndex(' mosaic-radar-home.html
          grep -F 'frames.length-1' mosaic-radar-home.html
          grep -F 'mrms-native-bandwidth-v15.js?v=20260917a' scripts/radar/mrms-native-loop-prewarm.js
          grep -F 'mrms-native-wrap-reserve-v15.js?v=20260917a' scripts/radar/mrms-native-loop-prewarm.js
          grep -F 'mrms-native-loop-prewarm.js?v=20260917a' mapbox-token.js
          grep -F 'mapbox-token.js?v=20260917a' mosaic-radar-home.html
          if grep -Fq 'const originalSetBlendFrames = layer.setBlendFrames;' scripts/radar/mrms-native-bandwidth-v15.js; then
            echo 'v15 still schedules from blend hot path'
            exit 1
          fi
          git diff --check

      - name: Commit production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mosaic-radar-home.html mapbox-token.js scripts/radar/mrms-native-loop-prewarm.js scripts/radar/mrms-native-bandwidth-v15.js scripts/radar/mrms-native-wrap-reserve-v15.js
          git commit -m 'Skip expired MRALA frames during playback'
          git push
