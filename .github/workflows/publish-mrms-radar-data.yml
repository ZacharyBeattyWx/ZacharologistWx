name: Publish rolling MRMS radar data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-mrms-radar-data.yml
      - .github/mrms-requirements.txt
      - scripts/radar/render_mrms_loop.py
      - scripts/radar/render_mrms_loop_archive.py
      - scripts/radar/render_mrms_mosaic.py
      - scripts/radar/palettes/**
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, where GitHub documents the heaviest cron delays.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zacharologist-mrms-radar-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/mrms-requirements.txt

      - name: Install MRMS renderer dependencies
        run: python -m pip install -r .github/mrms-requirements.txt

      - name: Check ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Restore radar-data as an incremental worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin radar-data:refs/remotes/origin/radar-data
          rm -rf mrms-mosaic-loop-output
          git worktree add --detach mrms-mosaic-loop-output refs/remotes/origin/radar-data

      - name: Render rolling 24-hour MRMS archive
        run: |
          python scripts/radar/render_mrms_loop_archive.py \
            --output "$GITHUB_WORKSPACE/mrms-mosaic-loop-output"

      - name: Validate published manifest
        shell: python
        run: |
          import json
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("mrms-mosaic-loop-output")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          frames = manifest.get("frames") or []
          if len(frames) < 2:
              raise SystemExit("MRMS manifest has fewer than two observations")

          missing = [
              frame.get("image")
              for frame in frames
              if not (root / frame.get("image", "")).exists()
          ]
          if missing:
              raise SystemExit(
                  f"MRMS manifest references {len(missing)} missing frame files"
              )

          end_time = datetime.fromisoformat(manifest["endTime"])
          age_minutes = (datetime.now(UTC) - end_time).total_seconds() / 60.0
          print(
              f"Validated {len(frames)} observations; "
              f"history={manifest.get('historyWindowMinutes')} minutes; "
              f"latest source age={age_minutes:.1f} minutes"
          )

          # Do not publish a silently ancient snapshot if NOAA's listing or the
          # renderer ever gets stuck. Normal source latency is only a few minutes.
          if age_minutes > 20:
              raise SystemExit(
                  f"Newest MRMS observation is unexpectedly stale ({age_minutes:.1f} minutes)"
              )

      - name: Publish only changed radar-data files
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/mrms-mosaic-loop-output"
          touch .nojekyll

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No MRMS data changes to publish"
            exit 0
          fi

          git commit -m "Update rolling MRMS radar data"
          git push origin HEAD:radar-data
