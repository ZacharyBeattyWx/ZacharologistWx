name: Publish rolling MRMS radar data

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-mrms-radar-data.yml
      - .github/mrms-requirements.txt
      - scripts/radar/render_mrms_loop.py
      - scripts/radar/render_mrms_loop_archive.py
      - scripts/radar/render_mrms_mosaic.py
      - scripts/radar/update_mrms_archive_incremental.py
      - scripts/radar/palettes/**
  workflow_dispatch:
  schedule:
    # Avoid the top of the hour, where GitHub documents the heaviest cron delays.
    - cron: "2-57/5 * * * *"

permissions:
  contents: write

concurrency:
  group: zacharologist-mrms-radar-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/mrms-requirements.txt

      - name: Install MRMS renderer dependencies
        run: python -m pip install -r .github/mrms-requirements.txt

      - name: Check ecCodes runtime
        run: python -m eccodes selfcheck

      - name: Sparse-clone current radar-data index
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf mrms-mosaic-loop-output
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone \
            --filter=blob:none \
            --depth=1 \
            --single-branch \
            --branch radar-data \
            --sparse \
            "$REPO_URL" \
            mrms-mosaic-loop-output

      - name: Render only missing MRMS observations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/radar/update_mrms_archive_incremental.py \
            --output "$GITHUB_WORKSPACE/mrms-mosaic-loop-output" \
            --new-ids-file "$RUNNER_TEMP/mrms-new-ids.txt" \
            --prune-ids-file "$RUNNER_TEMP/mrms-prune-ids.txt"

      - name: Stage incremental radar-data changes
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/mrms-mosaic-loop-output"
          touch .nojekyll

          while IFS= read -r frame_id; do
            [ -n "$frame_id" ] || continue
            git update-index --force-remove -- \
              "frames/${frame_id}.webp" \
              "meta/${frame_id}.json"
          done < "$RUNNER_TEMP/mrms-prune-ids.txt"

          git add manifest.json .nojekyll

          while IFS= read -r frame_id; do
            [ -n "$frame_id" ] || continue
            git add --sparse -- \
              "frames/${frame_id}.webp" \
              "meta/${frame_id}.json"
          done < "$RUNNER_TEMP/mrms-new-ids.txt"

      - name: Validate staged manifest
        shell: python
        run: |
          import json
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          root = Path("mrms-mosaic-loop-output")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          frames = manifest.get("frames") or []
          if len(frames) < 2:
              raise SystemExit("MRMS manifest has fewer than two observations")

          tracked = set(
              subprocess.check_output(
                  ["git", "-C", str(root), "ls-files"],
                  text=True,
              ).splitlines()
          )
          missing = [
              frame.get("image")
              for frame in frames
              if frame.get("image") not in tracked
          ]
          if missing:
              raise SystemExit(
                  f"MRMS manifest references {len(missing)} untracked frame files"
              )

          end_time = datetime.fromisoformat(manifest["endTime"])
          age_minutes = (datetime.now(UTC) - end_time).total_seconds() / 60.0
          print(
              f"Validated {len(frames)} observations; "
              f"history={manifest.get('historyWindowMinutes')} minutes; "
              f"latest source age={age_minutes:.1f} minutes"
          )
          if age_minutes > 20:
              raise SystemExit(
                  f"Newest MRMS observation is unexpectedly stale ({age_minutes:.1f} minutes)"
              )

      - name: Publish incremental radar-data commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/mrms-mosaic-loop-output"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No MRMS data changes to publish"
            exit 0
          fi

          git commit -m "Update rolling MRMS radar data"
          git push origin HEAD:radar-data
