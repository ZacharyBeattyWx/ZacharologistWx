name: Apply static manifest wait once

on:
  push:
    paths:
      - scripts/radar/patch_static_manifest_wait_once.py
      - .github/workflows/apply-static-manifest-wait-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch startup manifest polling
        run: python3 scripts/radar/patch_static_manifest_wait_once.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-static-pyramid-webgl.js
          git diff --cached --quiet && exit 0
          git commit -m "Wait for first static radar manifest"
          git push
