name: Render RTMA Temperature

on:
  workflow_dispatch:
  schedule:
    # RTMA is an hourly analysis. Run once per hour to stay fresh while
    # keeping R2 write operations comfortably low.
    - cron: "17 * * * *"

concurrency:
  group: rtma-temperature
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BUCKET: zacharologistwx-weather-previews

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/weather/requirements.txt

      - name: Install renderer dependencies
        run: python -m pip install -r scripts/weather/requirements.txt

      - name: Render RTMA temperature tiles
        shell: bash
        run: |
          set +e
          python scripts/weather/render_current_wx_previews.py --output rtma-build --only temperature
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            exit 0
          fi

          if [ "$rc" -eq 134 ] || [ "$rc" -eq 139 ]; then
            ROOT="rtma-build/temp-tiles"

            test -s "$ROOT/manifest.json"
            test -s "$ROOT/stations.geojson"
            test -s "$ROOT/states.geojson"

            expected_tiles="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["tileCount"]))' "$ROOT/manifest.json")"
            actual_tiles="$(find "$ROOT" -type f -name '*.webp' | wc -l | tr -d ' ')"

            if [ "$expected_tiles" -lt 1 ] || [ "$actual_tiles" -ne "$expected_tiles" ]; then
              echo "::error::RTMA exited $rc and the generated tile tree is incomplete."
              echo "Manifest expects $expected_tiles tiles; found $actual_tiles."
              exit "$rc"
            fi

            echo "::warning::RTMA exited $rc after completing output generation."
            echo "Verified $actual_tiles/$expected_tiles temperature tiles plus manifest and GeoJSON files."
            echo "Continuing to publish the completed RTMA dataset."
            exit 0
          fi

          echo "::error::RTMA renderer failed with exit code $rc."
          exit "$rc"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Upload RTMA tile tree to R2
        shell: bash
        run: |
          set -euo pipefail

          ROOT="rtma-build/temp-tiles"

          test -f "$ROOT/manifest.json"
          test -f "$ROOT/stations.geojson"
          test -f "$ROOT/states.geojson"

          # Upload every tile/data object first. The manifest is published LAST
          # so browsers never discover a new revision before its files exist.
          export ROOT BUCKET

          find "$ROOT" -type f ! -name manifest.json -print0 |
            xargs -0 -n1 -P8 bash -c '
              set -euo pipefail
              file="$1"
              rel="${file#"$ROOT"/}"
              key="temp-tiles/$rel"

              case "$file" in
                *.webp) type="image/webp" ;;
                *.json|*.geojson) type="application/json" ;;
                *) type="application/octet-stream" ;;
              esac

              wrangler r2 object put "$BUCKET/$key" \
                --file="$file" \
                --content-type="$type" \
                --cache-control="public, max-age=120, stale-while-revalidate=600" \
                --remote \
                --force >/dev/null
            ' _

          wrangler r2 object put "$BUCKET/temp-tiles/manifest.json" \
            --file="$ROOT/manifest.json" \
            --content-type="application/json" \
            --cache-control="public, max-age=30, stale-while-revalidate=120" \
            --remote \
            --force

      - name: Verify published RTMA manifest
        shell: bash
        run: |
          set -euo pipefail
          wrangler r2 object get "$BUCKET/temp-tiles/manifest.json" \
            --pipe \
            --remote |
            python -m json.tool