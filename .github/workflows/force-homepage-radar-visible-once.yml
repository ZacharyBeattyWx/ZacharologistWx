name: Force homepage radar visible once

on:
  push:
    paths:
      - .github/workflows/force-homepage-radar-visible-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove hidden iframe state and bust wrapper cache
        run: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path('mosaic-radar-home.html')
          text = wrapper.read_text(encoding='utf-8')
          old = '''      opacity: 0;\n      transition: opacity 160ms ease;'''
          new = '''      opacity: 1;\n      transition: none;'''
          if old not in text:
              raise SystemExit('wrapper opacity marker not found')
          text = text.replace(old, new, 1)
          wrapper.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('src="./mosaic-radar-home.html"', 'src="./mosaic-radar-home.html?v=20260827b"')
          text = text.replace('clean: "./mosaic-radar-home.html"', 'clean: "./mosaic-radar-home.html?v=20260827b"')
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit visibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-home.html index.html
          git diff --cached --quiet && exit 0
          git commit -m "Force homepage radar iframe visible"
          git push
