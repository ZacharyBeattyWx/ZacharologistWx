name: Desktop satellite fit

on:
  push:
    paths:
      - .github/workflows/one-time-desktop-satellite-fit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scale desktop satellite imagery to stage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('weather-viewer.html')
          text = path.read_text(encoding='utf-8')

          old = '''      #satelliteStage #satelliteImage,
      #satelliteStage #satelliteCanvas{
        max-width:100%;
        max-height:100%;
      }'''

          new = '''      #satelliteStage #satelliteImage,
      #satelliteStage #satelliteCanvas{
        width:100%;
        height:100%;
        max-width:none;
        max-height:none;
        object-fit:contain;
      }'''

          if text.count(old) != 1:
              raise SystemExit(f'Expected one desktop satellite sizing block, found {text.count(old)}')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -A7 -F '#satelliteStage #satelliteImage,' weather-viewer.html | grep -F 'object-fit:contain;'

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-desktop-satellite-fit.yml
          git commit -m "Scale desktop satellite imagery to viewer"
          git push
