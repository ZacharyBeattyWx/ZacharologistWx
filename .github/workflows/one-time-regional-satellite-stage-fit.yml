name: Regional satellite stage fit

on:
  push:
    paths:
      - .github/workflows/one-time-regional-satellite-stage-fit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fit regional satellite sectors to desktop stage
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch-regional-sat.py
          python3 /tmp/patch-regional-sat.py

      - name: Validate viewer
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          s = Path('weather-viewer.html').read_text(encoding='utf-8')
          start = s.rfind('<script>')
          end = s.rfind('</script>')
          if start < 0 or end < 0 or end <= start:
            raise SystemExit('Could not locate final inline script')
          Path('/tmp/weather-viewer-inline.js').write_text(
              s[start + len('<script>'):end],
              encoding='utf-8'
          )
          PY
          node --check /tmp/weather-viewer-inline.js
          grep -n -F 'function fitSatelliteBboxToStage' weather-viewer.html
          grep -n -F 'const target=context.bbox;' weather-viewer.html

      - name: Commit regional stage fit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git rm .github/workflows/one-time-regional-satellite-stage-fit.yml
          git commit -m "Fit regional satellite sectors to desktop stage"
          git push origin HEAD:main
