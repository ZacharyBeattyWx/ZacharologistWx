name: Render Radar JSON-H2

on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      site:
        description: "Radar site"
        required: true
        default: "all"
      product:
        description: "Level III product"
        required: true
        default: "N0B"
      min_visible_dbz:
        description: "Minimum dBZ rendered as visible"
        required: true
        default: "10"
      min_component_pixels:
        description: "Minimum connected pixel blob size to keep"
        required: true
        default: "6"
      commit_outputs:
        description: "Commit generated radar frames and catalog back to the repository"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      force_rebuild:
        description: "Force a full rebuild for the selected site/product"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

concurrency:
  group: radar-json-h2
  cancel-in-progress: false

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build radar site matrix
        id: sites
        shell: bash
        run: |
          set -euo pipefail

          SITE_INPUT="${{ github.event.inputs.site || 'all' }}"
          EVENT_NAME="${{ github.event_name }}"
          export SITE_INPUT
          export EVENT_NAME

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def normalize_site(site):
              normalized = str(site or "").strip().upper()
              if re.fullmatch(r"[A-Z0-9]{3}", normalized):
                  return f"K{normalized}"
              if re.fullmatch(r"[A-Z0-9]{4}", normalized):
                  return normalized
              raise ValueError(f"Unsupported radar site ID: {site}")

          def normalize_sites(sites):
              return [normalize_site(site) for site in sites]

          def limit_sites(sites, limit):
              if limit is None:
                  return sites

              try:
                  limit = int(limit)
              except (TypeError, ValueError):
                  return sites

              return sites[:limit] if limit > 0 else sites

          config = json.loads(Path("scripts/radar/radar_config.json").read_text(encoding="utf-8"))
          legacy_sites = config.get("renderSites") or config.get("sites") or []
          core_sites = config.get("coreRenderSites") or legacy_sites
          regional_sites = config.get("regionalRenderSites") or legacy_sites
          render_policy = config.get("renderPolicy") or {}
          event_name = os.environ.get("EVENT_NAME", "")
          site_input = os.environ.get("SITE_INPUT", "all").strip()

          if event_name == "schedule":
              mode = render_policy.get("scheduledMode") or "core-only"
              sites = limit_sites(
                  normalize_sites(core_sites),
                  render_policy.get("maxScheduledSitesPerRun"),
              )
          elif site_input.lower() == "all":
              mode = render_policy.get("manualAllMode") or "regional"
              sites = limit_sites(
                  normalize_sites(regional_sites),
                  render_policy.get("maxManualSitesPerRun"),
              )
          else:
              mode = "manual-specific"
              sites = [normalize_site(site_input)]

          if not sites:
              raise SystemExit("No radar sites configured for rendering")

          print(f"Selected radar render mode: {mode}")
          print(f"Radar render matrix sites: {', '.join(sites)}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"sites={json.dumps(sites)}", file=output)
          PY

  render:
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: ${{ fromJSON(needs.prepare-matrix.outputs.sites) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install radar renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/radar/requirements.txt

      - name: Download latest Level III source
        shell: bash
        run: |
          set -euo pipefail

          SITE_INPUT="${{ matrix.site }}"
          PRODUCT="${{ github.event.inputs.product || 'N0B' }}"
          FORCE_RENDER="${{ github.event.inputs.force_rebuild || 'false' }}"
          SOURCE_DIR="radar/source/level3"

          SITE_INPUT="${SITE_INPUT^^}"
          if [[ "$SITE_INPUT" =~ ^[A-Z0-9]{3}$ ]]; then
            SITE3="$SITE_INPUT"
            SITE4="K${SITE_INPUT}"
          elif [[ "$SITE_INPUT" =~ ^[A-Z0-9]{4}$ ]]; then
            SITE3="${SITE_INPUT:1}"
            SITE4="$SITE_INPUT"
          else
            echo "Unsupported radar site ID: $SITE_INPUT" >&2
            exit 1
          fi

          export SITE3
          export SITE4
          export PRODUCT
          export FORCE_RENDER
          echo "SITE3=${SITE3}" >> "$GITHUB_ENV"
          echo "SITE4=${SITE4}" >> "$GITHUB_ENV"
          echo "PRODUCT=${PRODUCT}" >> "$GITHUB_ENV"
          echo "FORCE_RENDER=${FORCE_RENDER}" >> "$GITHUB_ENV"
          echo "Normalized radar site input: site3=${SITE3} site4=${SITE4} product=${PRODUCT}"
          echo "Force rebuild enabled: ${FORCE_RENDER}"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json
          import os
          import re
          import sys
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          site3 = os.environ["SITE3"]
          site4 = os.environ["SITE4"]
          product = os.environ.get("PRODUCT") or "N0B"

          bucket_url = "https://unidata-nexrad-level3.s3.amazonaws.com"
          namespace = {"s3": "http://s3.amazonaws.com/doc/2006-03-01/"}

          def safe_frame_count(value):
              try:
                  frame_count = int(value)
              except (TypeError, ValueError):
                  return 1

              return frame_count if frame_count > 0 else 1

          def load_frame_count():
              config_path = Path("scripts/radar/radar_config.json")

              try:
                  with config_path.open("r", encoding="utf-8") as handle:
                      config = json.load(handle)
              except Exception as error:
                  print(f"Unable to read {config_path}; defaulting frameCount to 1: {error}", flush=True)
                  return 1

              return safe_frame_count(config.get("frameCount"))

          def build_list_url(prefix, delimiter=None, continuation_token=None):
              params = {
                  "list-type": "2",
                  "prefix": prefix,
              }
              if delimiter is not None:
                  params["delimiter"] = delimiter
              if continuation_token is not None:
                  params["continuation-token"] = continuation_token

              return bucket_url + "/?" + urllib.parse.urlencode(params, safe="/")

          def fetch_listing(prefix, delimiter=None, continuation_token=None):
              list_url = build_list_url(prefix, delimiter, continuation_token)
              with urllib.request.urlopen(list_url, timeout=60) as response:
                  xml_body = response.read()
              return ET.fromstring(xml_body)

          def is_candidate_key(key):
              if not key:
                  return False

              name = Path(key).name

              valid_starts = (
                  f"{site3}_{product}_",
                  f"{site4}_{product}_",
                  "Level3_",
              )

              return f"_{product}_" in name and name.startswith(valid_starts)

          def find_candidate_keys(prefix):
              keys = []
              continuation_token = None

              while True:
                  root = fetch_listing(prefix, continuation_token=continuation_token)

                  keys.extend(
                      item.text
                      for item in root.findall(".//s3:Key", namespace)
                      if item.text and is_candidate_key(item.text)
                  )

                  next_token = root.find("s3:NextContinuationToken", namespace)
                  if next_token is None or not next_token.text:
                      break

                  continuation_token = next_token.text

              return keys

          def print_diagnostic_sample(prefix):
              root = fetch_listing(prefix, delimiter="/")
              keys = [
                  item.text
                  for item in root.findall(".//s3:Key", namespace)
                  if item.text
              ][:20]
              common_prefixes = [
                  item.text
                  for item in root.findall(".//s3:CommonPrefixes/s3:Prefix", namespace)
                  if item.text
              ][:20]

              label = prefix or "root"
              print(f"Diagnostic sample for {label}:", flush=True)
              print(f"  CommonPrefixes ({len(common_prefixes)} shown):", flush=True)
              for common_prefix in common_prefixes:
                  print(f"    {common_prefix}", flush=True)
              print(f"  Keys ({len(keys)} shown):", flush=True)
              for key in keys:
                  print(f"    {key}", flush=True)

          def parsed_time_from_key(key):
              name = Path(key).name

              # Example:
              # FCX_N0B_2026_05_16_13_12_00
              match = re.search(
                  r"_(\d{4})_(\d{2})_(\d{2})_(\d{2})_(\d{2})(?:_(\d{2}))?$",
                  name,
              )

              if match:
                  year, month, day, hour, minute, _second = match.groups()
                  return datetime(
                      int(year),
                      int(month),
                      int(day),
                      int(hour),
                      int(minute),
                      tzinfo=timezone.utc,
                  )

              # Example:
              # Level3_FCX_N0B_20260516_1312.nids
              match = re.search(r"_(\d{8})_(\d{4})", name)
              if match:
                  return datetime.strptime(
                      f"{match.group(1)}{match.group(2)}",
                      "%Y%m%d%H%M",
                  ).replace(tzinfo=timezone.utc)

              return None

          def timestamp_from_key(key):
              parsed_time = parsed_time_from_key(key)
              if parsed_time is None:
                  return datetime.now(timezone.utc).strftime("%Y%m%d_%H%M")

              return parsed_time.strftime("%Y%m%d_%H%M")

          def prefer_key(existing_key, candidate_key):
              existing_name = Path(existing_key).name
              candidate_name = Path(candidate_key).name
              existing_score = 1 if existing_name.startswith(f"{site4}_{product}_") else 0
              candidate_score = 1 if candidate_name.startswith(f"{site4}_{product}_") else 0

              if candidate_score != existing_score:
                  return candidate_key if candidate_score > existing_score else existing_key

              return max(existing_key, candidate_key)

          prefixes = []
          now = datetime.now(timezone.utc)

          for day_offset in range(3):
              date = now - timedelta(days=day_offset)
              date_prefix = date.strftime("%Y_%m_%d")
              prefixes.extend(
                  [
                      f"{site3}_{product}_{date_prefix}_",
                      f"{site4}_{product}_{date_prefix}_",
                  ]
              )

          frame_count = load_frame_count()
          all_candidate_keys = set()

          for prefix in prefixes:
              print(f"Trying prefix: {prefix}", flush=True)
              keys = find_candidate_keys(prefix)
              print(f"Found {len(keys)} candidate Level III files", flush=True)
              all_candidate_keys.update(keys)

          keys_by_time = {}
          skipped_keys = []

          print("Candidate Level III keys with parsed timestamps:", flush=True)
          for key in sorted(all_candidate_keys):
              parsed_time = parsed_time_from_key(key)
              parsed_label = parsed_time.isoformat().replace("+00:00", "Z") if parsed_time else "unparsed"
              print(f"  {parsed_label} {key}", flush=True)

              if parsed_time is None:
                  skipped_keys.append(key)
                  continue

              if parsed_time in keys_by_time:
                  keys_by_time[parsed_time] = prefer_key(keys_by_time[parsed_time], key)
              else:
                  keys_by_time[parsed_time] = key

          sorted_candidate_items = sorted(keys_by_time.items())
          selected_items = sorted_candidate_items[-frame_count:]
          selected_keys = [key for _parsed_time, key in selected_items]

          print(f"Normalized radar site: site3={site3} site4={site4} product={product}", flush=True)
          print(f"frameCount={frame_count}", flush=True)
          print(f"Total unique candidate Level III keys found: {len(all_candidate_keys)}", flush=True)
          print(f"Skipped key count with unparsed timestamps: {len(skipped_keys)}", flush=True)
          print(f"Unique parsed radar timestamps found: {len(sorted_candidate_items)}", flush=True)
          print(f"Selected key count: {len(selected_keys)}", flush=True)
          print("Selected Level III keys:", flush=True)
          for parsed_time, key in selected_items:
              print(f"  {parsed_time.isoformat().replace('+00:00', 'Z')} {key}", flush=True)

          if selected_items:
              newest_selected_time = selected_items[-1][0].isoformat().replace("+00:00", "Z")
              print(f"Newest selected radar timestamp: {newest_selected_time}", flush=True)

          if len(selected_keys) < frame_count:
              print(
                  f"Only {len(selected_keys)} candidate key(s) available for frameCount={frame_count}; downloading available keys.",
                  flush=True,
              )

          if not selected_keys:
              for prefix in ["", f"{product}/", f"{site3}/", f"{site4}/", "Level3_"]:
                  print_diagnostic_sample(prefix)

              print("No candidate Level III files found for any tried date-scoped prefix", file=sys.stderr, flush=True)
              sys.exit(1)

          source_dir = Path("radar/source/level3")
          source_dir.mkdir(parents=True, exist_ok=True)

          for key in selected_keys:
              filename = Path(key).name
              download_path = source_dir / filename

              timestamp = timestamp_from_key(key)
              output_path = source_dir / f"Level3_{site3}_{product}_{timestamp}.nids"

              download_url = bucket_url + "/" + urllib.parse.quote(key, safe="/")

              print(f"Selected key: {key}", flush=True)
              print(f"Downloading: {download_url}", flush=True)
              print(f"Temporary save path: {download_path}", flush=True)
              print(f"Final renderer source path: {output_path}", flush=True)

              urllib.request.urlretrieve(download_url, download_path)

              if download_path != output_path:
                  if output_path.exists():
                      output_path.unlink()
                  download_path.replace(output_path)
          PY

      - name: Restore existing R2 radar catalog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          mkdir -p radar

          if aws s3 cp "s3://${{ secrets.R2_BUCKET }}/radar/frames.json" radar/frames.json --endpoint-url "$R2_ENDPOINT"; then
            python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("radar/frames.json").read_text(encoding="utf-8"))
          site_keys = sorted((catalog.get("frames") or {}).keys())
          print(f"Restored R2 catalog site keys: {', '.join(site_keys) if site_keys else '(none)'}")
          PY
          else
            echo "No existing R2 radar/frames.json found; renderer will create a new catalog."
          fi

      - name: Clean generated radar frame folder
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${FORCE_RENDER}" == "true" ]]; then
            rm -rf "radar/frames/${SITE4}/${PRODUCT}"
          fi
          mkdir -p "radar/frames/${SITE4}/${PRODUCT}"
          echo "Rendered output folder: radar/frames/${SITE4}/${PRODUCT}"

      - name: Render radar frame
        shell: bash
        run: |
          set -euo pipefail

          render_args=(
            --render
            --site "${SITE4}"
            --product "${PRODUCT}"
            --min-visible-dbz "${{ github.event.inputs.min_visible_dbz || '5' }}"
            --min-component-pixels "${{ github.event.inputs.min_component_pixels || '3' }}"
          )

          if [[ "${FORCE_RENDER}" == "true" ]]; then
            render_args+=(--force)
          fi

          python scripts/radar/render_reflectivity.py "${render_args[@]}"

      - name: Show generated radar catalog keys
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          catalog = json.loads(Path("radar/frames.json").read_text(encoding="utf-8"))
          sites = sorted((catalog.get("sites") or {}).keys())
          frames = catalog.get("frames") or {}
          frame_keys = sorted(frames.keys())
          print(f"Generated catalog site keys: {', '.join(sites) if sites else '(none)'}")
          print(f"Generated catalog frame site keys: {', '.join(frame_keys) if frame_keys else '(none)'}")
          for site in frame_keys:
              products = sorted((frames.get(site) or {}).keys())
              print(f"Generated catalog products for {site}: {', '.join(products) if products else '(none)'}")
          PY

      - name: Show generated radar files
        run: |
          echo "Generated radar files:"
          find radar -maxdepth 5 -type f | sort

      - name: Upload JSON-H2 radar output to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"

          aws s3 cp radar/frames.json "s3://${{ secrets.R2_BUCKET }}/radar/frames.json" --endpoint-url "$R2_ENDPOINT"
          sync_args=(
            "radar/frames/${SITE4}/${PRODUCT}"
            "s3://${{ secrets.R2_BUCKET }}/radar/frames/${SITE4}/${PRODUCT}"
            --exclude "*"
            --include "*.webp"
            --endpoint-url "$R2_ENDPOINT"
          )

          if [[ "${FORCE_RENDER}" == "true" ]]; then
            sync_args+=(--delete)
          fi

          aws s3 sync "${sync_args[@]}"

          TMP_CATALOG="$(mktemp)"
          aws s3 cp "s3://${{ secrets.R2_BUCKET }}/radar/frames.json" "$TMP_CATALOG" --endpoint-url "$R2_ENDPOINT"
          python - "$TMP_CATALOG" <<'PY'
          import json
          import sys
          from pathlib import Path

          catalog = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          site_keys = sorted((catalog.get("frames") or {}).keys())
          print(f"Uploaded R2 catalog site keys: {', '.join(site_keys) if site_keys else '(none)'}")
          PY

      - name: Upload JSON-H2 radar artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-json-h2-test-${{ matrix.site }}
          path: |
            radar/frames.json
            radar/frames/**/*.webp
          if-no-files-found: error

      - name: Commit generated radar output
        if: ${{ (github.event.inputs.commit_outputs || 'true') == 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_EDITOR=true
          BACKUP_DIR="$(mktemp -d)"
          trap 'rm -rf "$BACKUP_DIR"' EXIT
          mkdir -p "$BACKUP_DIR/radar/frames/${SITE4}"

          cp radar/frames.json "$BACKUP_DIR/radar/frames.json"
          cp -R "radar/frames/${SITE4}/${PRODUCT}" "$BACKUP_DIR/radar/frames/${SITE4}/${PRODUCT}"

          git fetch origin main
          git reset --hard origin/main

          cp "$BACKUP_DIR/radar/frames.json" radar/frames.json
          rm -rf "radar/frames/${SITE4}/${PRODUCT}"
          mkdir -p "radar/frames/${SITE4}"
          cp -R "$BACKUP_DIR/radar/frames/${SITE4}/${PRODUCT}" "radar/frames/${SITE4}/${PRODUCT}"

          git add radar/frames.json "radar/frames/${SITE4}/${PRODUCT}"

          if git diff --cached --quiet; then
            echo "No generated radar output changes to commit."
            exit 0
          fi

          git commit -m "Update generated radar JSON-H4 output"

          git push origin HEAD:main
