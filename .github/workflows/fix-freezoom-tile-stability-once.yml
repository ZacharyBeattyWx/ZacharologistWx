name: Fix free zoom tile stability once

on:
  push:
    paths:
      - .github/workflows/fix-freezoom-tile-stability-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stabilize free zoom renderer
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py

      - name: Commit stability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/nexrad-freezoom-webgl.js scripts/radar/serve_nexrad_detail_tiles.py
          git diff --cached --quiet && exit 0
          git commit -m "Stabilize free zoom NEXRAD tile handoff"
          git push
