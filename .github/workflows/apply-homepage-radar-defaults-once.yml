name: Apply homepage radar defaults

on:
  push:
    paths:
      - .github/workflows/apply-homepage-radar-defaults-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply homepage radar defaults and uniform 2x rate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          timelapse = Path('scripts/radar/mrms-timelapse-playback.js')
          text = timelapse.read_text(encoding='utf-8')
          text = text.replace('const TARGET_2X_KEYFRAMES = 90;', 'const TIMELAPSE_FRAME_STRIDE = 8;')
          old_stride = '  function playbackStride() {\n    if (speedValue() < 2 || !Array.isArray(frames) || frames.length < 2) return 1;\n    return Math.max(1, Math.ceil(frames.length / TARGET_2X_KEYFRAMES));\n  }'
          new_stride = '  function playbackStride() {\n    if (speedValue() < 2 || !Array.isArray(frames) || frames.length < 2) return 1;\n    // Keep 2x at the same meteorological timelapse rate for every history window.\n    // MRMS is ~2-minute cadence, so 8 scans is ~16 minutes of weather per transition.\n    return Math.max(1, Math.min(TIMELAPSE_FRAME_STRIDE, frames.length - 1));\n  }'
          if old_stride not in text:
              raise SystemExit('Timelapse stride function not found')
          text = text.replace(old_stride, new_stride)
          text = text.replace('target ~${TARGET_2X_KEYFRAMES} key scans per long loop', 'fixed ${TIMELAPSE_FRAME_STRIDE}-scan stride across every history window')
          timelapse.write_text(text, encoding='utf-8')

          home = Path('mosaic-radar-home.html')
          text = home.read_text(encoding='utf-8')
          text = text.replace('minutes === 60 ? " selected" : ""', 'minutes === 180 ? " selected" : ""')
          marker = '        const historySelect = installHistorySelect(doc);\n\n        const oldBadge = doc.getElementById("homeRadarBadge");'
          replacement = '        const historySelect = installHistorySelect(doc);\n\n        // Homepage defaults: full opacity, 3-hour history, and 2x timelapse.\n        const opacityControl = doc.getElementById("radarOpacity");\n        if (opacityControl) {\n          opacityControl.value = "1";\n          opacityControl.dispatchEvent(new Event("input", { bubbles: true }));\n        }\n\n        const speedControl = doc.getElementById("speedSelect");\n        if (speedControl) {\n          speedControl.value = "2";\n          speedControl.dispatchEvent(new Event("change", { bubbles: true }));\n        }\n\n        let startupHistoryApplied = false;\n        const applyStartupHistory = async () => {\n          if (startupHistoryApplied || !historySelect) return;\n          const win = engine.contentWindow;\n          const available = typeof win?.zwxAvailableHistoryMinutes === "function"\n            ? Number(win.zwxAvailableHistoryMinutes())\n            : 0;\n          if (available < 180 || typeof win?.zwxSetHistoryWindow !== "function") return;\n          startupHistoryApplied = true;\n          const selected = await win.zwxSetHistoryWindow(180);\n          historySelect.value = String(selected);\n        };\n\n        const oldBadge = doc.getElementById("homeRadarBadge");'
          if marker not in text:
              raise SystemExit('Homepage install marker not found')
          text = text.replace(marker, replacement)
          old_timer = '        if (historySyncTimer) clearInterval(historySyncTimer);\n        historySyncTimer = setInterval(() => syncHistorySelect(historySelect), 1000);'
          new_timer = '        if (historySyncTimer) clearInterval(historySyncTimer);\n        historySyncTimer = setInterval(() => {\n          syncHistorySelect(historySelect);\n          applyStartupHistory().catch(() => {});\n        }, 1000);\n        applyStartupHistory().catch(() => {});'
          if old_timer not in text:
              raise SystemExit('Homepage history sync timer not found')
          text = text.replace(old_timer, new_timer)
          home.write_text(text, encoding='utf-8')
          PY

      - name: Commit radar defaults
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mosaic-radar-home.html scripts/radar/mrms-timelapse-playback.js
          git diff --cached --quiet && exit 0
          git commit -m "Set homepage radar defaults and uniform 2x timelapse"
          git push
