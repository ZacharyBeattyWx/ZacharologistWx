name: Render Level II Radar

on:
  repository_dispatch:
    types: [radar_level2_cron, radar_level2_scan]
  workflow_dispatch:
    inputs:
      site:
        description: "Optional single radar site, ex: KFCX or KRAX"
        required: false
        default: ""
      source_count:
        description: "Number of latest Level II scans to fetch"
        required: false
        default: "75"
      frame_count:
        description: "Number of final Level II frames to publish"
        required: false
        default: "25"
      force_render:
        description: "Rebuild existing radar outputs instead of reusing restored files"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
      source_count: ${{ steps.sites.outputs.source_count }}
      frame_count: ${{ steps.sites.outputs.frame_count }}
      output_namespace: ${{ steps.sites.outputs.output_namespace }}

    steps:
      - name: Build Level II site matrix
        id: sites
        shell: bash
        run: |
          set -euo pipefail

          SITE_INPUT="${{ github.event.inputs.site || '' }}"
          SOURCE_COUNT_INPUT="${{ github.event.inputs.source_count || github.event.client_payload.source_count || '' }}"
          FRAME_COUNT_INPUT="${{ github.event.inputs.frame_count || github.event.client_payload.frame_count || '' }}"
          EVENT_NAME="${{ github.event_name }}"
          EVENT_ACTION="${{ github.event.action || '' }}"
          REF_NAME="${{ github.ref_name }}"
          export SITE_INPUT SOURCE_COUNT_INPUT FRAME_COUNT_INPUT EVENT_NAME EVENT_ACTION REF_NAME

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          default_sites = ["KFCX", "KRAX", "KGSP", "KLTX", "KMRX", "KJKL", "KRLX", "KLWX", "KMHX", "KAKQ", "KCAE", "KCLX", "KILX", "KIND", "KLOT", "KLSX", "KIWX", "KDVN", "KDMX", "KOAX", "KEAX", "KICT", "KTWX", "KSGF", "KVWX", "KPAH"]

          event_name = os.environ.get("EVENT_NAME", "").strip()
          event_action = os.environ.get("EVENT_ACTION", "").strip()
          ref_name = os.environ.get("REF_NAME", "").strip()
          site_input = os.environ.get("SITE_INPUT", "").strip().upper()
          source_count_input = os.environ.get("SOURCE_COUNT_INPUT", "").strip()
          frame_count_input = os.environ.get("FRAME_COUNT_INPUT", "").strip()
          dispatch_payload_raw = r'''${{ toJson(github.event.client_payload) }}'''

          try:
              dispatch_payload = json.loads(dispatch_payload_raw) if dispatch_payload_raw and dispatch_payload_raw != "null" else {}
          except json.JSONDecodeError:
              dispatch_payload = {}

          if not source_count_input:
              source_count_input = str(
                  dispatch_payload.get("source_count")
                  or dispatch_payload.get("sourceCount")
                  or ""
              ).strip()

          if not frame_count_input:
              frame_count_input = str(
                  dispatch_payload.get("frame_count")
                  or dispatch_payload.get("frameCount")
                  or ""
              ).strip()

          def normalize_site_id(site):
              site = str(site or "").strip().upper()
              if re.fullmatch(r"[A-Z0-9]{3}", site):
                  site = "K" + site
              if not re.fullmatch(r"K[A-Z0-9]{3}", site):
                  raise SystemExit(f"Unsupported radar site: {site}")
              if site not in default_sites:
                  raise SystemExit(f"Radar site is not configured for Level II rendering: {site}")
              return site

          def normalize_dispatch_sites(value):
              if not value:
                  return []

              if isinstance(value, str):
                  raw_sites = [part for part in re.split(r"[,\s]+", value) if part.strip()]
              elif isinstance(value, list):
                  raw_sites = value
              else:
                  raise SystemExit(f"Unsupported dispatch sites payload: {value!r}")

              normalized = []
              for raw_site in raw_sites:
                  site = normalize_site_id(raw_site)
                  if site not in normalized:
                      normalized.append(site)

              return normalized

          payload_sites = normalize_dispatch_sites(
              dispatch_payload.get("sites")
              or dispatch_payload.get("site")
          )

          if site_input:
              sites = [normalize_site_id(site_input)]
          elif event_name == "repository_dispatch":
              # Long-term path: the external dispatcher decides active sites.
              # Safety fallback stays KFCX if an old dispatcher sends no payload.
              sites = payload_sites or ["KFCX"]
          else:
              # Manual workflow_dispatch with no site still supports a full backfill run.
              sites = default_sites

          def parse_positive_int(value: str, fallback: int) -> int:
              if not value:
                  return fallback
              try:
                  return max(1, int(value))
              except ValueError:
                  return fallback

          frame_count = parse_positive_int(frame_count_input, 25)

          # Manual non-main branch runs own an isolated R2 dataset so the
          # default-branch repository_dispatch feed cannot overwrite test assets.
          output_namespace = (
              "test"
              if event_name == "repository_dispatch" or ref_name == "main"
              else "hq-test"
          )
          if not re.fullmatch(r"[A-Za-z0-9_-]+", output_namespace):
              raise SystemExit(
                  f"Unsupported Level II output namespace: {output_namespace!r}"
              )

          # Keep a deeper raw Level II source buffer than the displayed loop.
          # This prevents SAILS/partial newest scans from starving the renderer.
          minimum_source_count = frame_count * 3
          requested_source_count = parse_positive_int(source_count_input, minimum_source_count)
          source_count = max(requested_source_count, minimum_source_count)

          print(f"Level II event_name: {event_name}")
          print(f"Level II event_action: {event_action or '(none)'}")
          print(f"Level II raw site input: {site_input or '(empty)'}")
          print(f"Level II dispatch payload: {dispatch_payload}")
          print(f"Level II dispatch source: {dispatch_payload.get('source', '(none)')}")
          print(f"Level II dispatch reason: {dispatch_payload.get('dispatch_reason', '(none)')}")
          print(f"Level II source key: {dispatch_payload.get('source_key', '(none)')}")
          print(f"Level II sites: {sites}")
          print(f"Level II source_count: {source_count}")
          print(f"Level II frame_count: {frame_count}")
          print(f"Level II output_namespace: {output_namespace}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"sites={json.dumps(sites)}", file=output)
              print(f"source_count={source_count}", file=output)
              print(f"frame_count={frame_count}", file=output)
              print(f"output_namespace={output_namespace}", file=output)
          PY
  render-level2:
    needs: prepare-matrix
    runs-on: ubuntu-latest

    concurrency:
      group: level2-radar-${{ needs.prepare-matrix.outputs.output_namespace }}-${{ matrix.site }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        site: ${{ fromJSON(needs.prepare-matrix.outputs.sites) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Level II renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/radar/requirements.txt

      - name: Restore existing Level II output from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SITE="${{ matrix.site }}"
          NAMESPACE="${{ needs.prepare-matrix.outputs.output_namespace }}"
          LOCAL_DIR="radar/tilesets/${NAMESPACE}/${SITE}/LEVEL2/REF0"
          REMOTE_DIR="s3://${{ secrets.R2_BUCKET }}/radar/tilesets/${NAMESPACE}/${SITE}/LEVEL2/REF0"

          mkdir -p "$LOCAL_DIR"

          if aws s3 ls "$REMOTE_DIR/" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            aws s3 sync "$REMOTE_DIR" "$LOCAL_DIR" \
              --exclude "*" \
              --include "*.tif" \
              --include "*.json" \
              --include "mobile/*.webp" \
              --include "desktop/*.webp" \
              --include "tiles/*/*/*/*.png" \
              --endpoint-url "$R2_ENDPOINT"
          else
            echo "No existing Level II R2 output for ${SITE}; rendering fresh."
          fi

      - name: Render latest Level II frames
        shell: bash
        run: |
          set +e

          render_args=(
            --site "${{ matrix.site }}"
            --output-namespace "${{ needs.prepare-matrix.outputs.output_namespace }}"
            --fetch-latest
            --source-count "${{ needs.prepare-matrix.outputs.source_count }}"
            --max-sources "${{ needs.prepare-matrix.outputs.frame_count }}"
          )

          if [[ "${{ github.event.inputs.force_render || 'false' }}" == "true" ]]; then
            render_args+=(--force)
            echo "forceRender=true"
          else
            echo "forceRender=false"
          fi

          python scripts/radar/render_level2_reflectivity.py \
            "${render_args[@]}" \
            2>&1 | grep -v '^Unknown message: 32$'
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Show generated Level II summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = "${{ matrix.site }}"
          namespace = "${{ needs.prepare-matrix.outputs.output_namespace }}"
          base = Path(f"radar/tilesets/{namespace}/{site}/LEVEL2/REF0")
          manifest = base / "frames.json"
          latest = base / "latest.json"
          mobile = base / "mobile"
          desktop = base / "desktop"
          tiles = base / "tiles"

          frames = json.loads(manifest.read_text(encoding="utf-8"))
          latest_payload = json.loads(latest.read_text(encoding="utf-8"))

          print(f"site={site}")
          print(f"framesCount={len(frames.get('frames') or [])}")
          print(f"latestValidTime={latest_payload.get('validTime')}")
          print(f"jsonFiles={len(list(base.glob('*.json')))}")
          print(f"tifFiles={len(list(base.glob('*.tif')))}")
          print(f"mobileWebpFiles={len(list(mobile.glob('*.webp'))) if mobile.exists() else 0}")
          print(f"desktopWebpFiles={len(list(desktop.glob('*.webp'))) if desktop.exists() else 0}")
          print(f"tileFrameDirs={sum(1 for p in tiles.iterdir() if p.is_dir()) if tiles.exists() else 0}")
          PY
      - name: Upload Level II radar to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SITE="${{ matrix.site }}"
          NAMESPACE="${{ needs.prepare-matrix.outputs.output_namespace }}"
          LOCAL_DIR="radar/tilesets/${NAMESPACE}/${SITE}/LEVEL2/REF0"
          REMOTE_DIR="s3://${{ secrets.R2_BUCKET }}/radar/tilesets/${NAMESPACE}/${SITE}/LEVEL2/REF0"

          # Upload heavy radar assets first. Keep manifests out of this sync so
          # browsers never see a new frames.json before its tile PNGs exist.
          aws s3 sync "$LOCAL_DIR" "$REMOTE_DIR" \
            --exclude "*" \
            --include "*.tif" \
            --include "mobile/*.webp" \
            --include "desktop/*.webp" \
            --include "tiles/*/*/*/*.png" \
            --delete \
            --endpoint-url "$R2_ENDPOINT"

          # Publish manifests last. These are the browser's source of truth.
          aws s3 cp "$LOCAL_DIR/frames.json" "$REMOTE_DIR/frames.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$LOCAL_DIR/latest.json" "$REMOTE_DIR/latest.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$REMOTE_DIR/frames.json" "/tmp/${SITE}-frames.json" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$REMOTE_DIR/latest.json" "/tmp/${SITE}-latest.json" --endpoint-url "$R2_ENDPOINT"

          python - <<'PY'
          import json
          from pathlib import Path

          site = "${{ matrix.site }}"
          frames = json.loads(Path(f"/tmp/{site}-frames.json").read_text(encoding="utf-8"))
          latest = json.loads(Path(f"/tmp/{site}-latest.json").read_text(encoding="utf-8"))

          print(f"Uploaded Level II site: {site}")
          print(f"Uploaded frame count: {len(frames.get('frames') or [])}")
          print(f"Uploaded latest validTime: {latest.get('validTime')}")
          PY
