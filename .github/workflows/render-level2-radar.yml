name: Render Level II Radar

on:
  repository_dispatch:
    types: [radar_level2_cron, radar_level2_scan]
  workflow_dispatch:
    inputs:
      site:
        description: "Optional single radar site, ex: KFCX or KRAX"
        required: false
        default: ""
      source_count:
        description: "Number of latest Level II scans to fetch"
        required: false
        default: "25"

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.sites }}
      source_count: ${{ steps.sites.outputs.source_count }}

    steps:
      - name: Build Level II site matrix
        id: sites
        shell: bash
        run: |
          set -euo pipefail

          SITE_INPUT="${{ github.event.inputs.site || github.event.client_payload.site || '' }}"
          SOURCE_COUNT_INPUT="${{ github.event.inputs.source_count || github.event.client_payload.source_count || '' }}"
          EVENT_NAME="${{ github.event_name }}"
          export SITE_INPUT SOURCE_COUNT_INPUT EVENT_NAME

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          default_sites = ["KFCX", "KRAX", "KGSP", "KLTX", "KMHX", "KAKQ", "KCAE", "KCLX"]

          event_name = os.environ.get("EVENT_NAME", "").strip()
          site_input = os.environ.get("SITE_INPUT", "").strip().upper()
          source_count_input = os.environ.get("SOURCE_COUNT_INPUT", "").strip()

          if site_input:
              if re.fullmatch(r"[A-Z0-9]{3}", site_input):
                  site_input = "K" + site_input
              if not re.fullmatch(r"K[A-Z0-9]{3}", site_input):
                  raise SystemExit(f"Unsupported radar site: {site_input}")
              sites = [site_input]
          elif event_name == "repository_dispatch":
              # Temporary safety fallback while the external dispatcher is upgraded.
              # Do not let old no-site dispatches fan out to every radar.
              sites = ["KFCX"]
          else:
              # Manual workflow_dispatch with no site still supports a full backfill run.
              sites = default_sites

          if source_count_input:
              try:
                  count = max(1, int(source_count_input))
              except ValueError:
                  count = 1 if event_name == "repository_dispatch" else 25
          else:
              count = 1 if event_name == "repository_dispatch" else 25

          print(f"Level II event_name: {event_name}")
          print(f"Level II raw site input: {site_input or '(empty)'}")
          print(f"Level II sites: {sites}")
          print(f"Level II source_count: {count}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"sites={json.dumps(sites)}", file=output)
              print(f"source_count={count}", file=output)
          PY
  render-level2:
    needs: prepare-matrix
    runs-on: ubuntu-latest

    concurrency:
      group: level2-radar-${{ matrix.site }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        site: ${{ fromJSON(needs.prepare-matrix.outputs.sites) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Level II renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/radar/requirements.txt

      - name: Restore existing Level II output from Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SITE="${{ matrix.site }}"
          LOCAL_DIR="radar/tilesets/test/${SITE}/LEVEL2/REF0"
          REMOTE_DIR="s3://${{ secrets.R2_BUCKET }}/radar/tilesets/test/${SITE}/LEVEL2/REF0"

          mkdir -p "$LOCAL_DIR"

          if aws s3 ls "$REMOTE_DIR/" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            aws s3 sync "$REMOTE_DIR" "$LOCAL_DIR" \
              --exclude "*" \
              --include "*.tif" \
              --include "*.json" \
              --include "mobile/*.webp" \
              --include "tiles/*/*/*/*.png" \
              --endpoint-url "$R2_ENDPOINT"
          else
            echo "No existing Level II R2 output for ${SITE}; rendering fresh."
          fi

      - name: Render latest Level II frames
        shell: bash
        run: |
          set +e
          python scripts/radar/render_level2_reflectivity.py \
            --site "${{ matrix.site }}" \
            --fetch-latest \
            --source-count "${{ needs.prepare-matrix.outputs.source_count }}" \
            --max-sources "${{ needs.prepare-matrix.outputs.source_count }}" \
            2>&1 | grep -v '^Unknown message: 32$'
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Show generated Level II summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = "${{ matrix.site }}"
          base = Path(f"radar/tilesets/test/{site}/LEVEL2/REF0")
          manifest = base / "frames.json"
          latest = base / "latest.json"
          mobile = base / "mobile"
          tiles = base / "tiles"

          frames = json.loads(manifest.read_text(encoding="utf-8"))
          latest_payload = json.loads(latest.read_text(encoding="utf-8"))

          print(f"site={site}")
          print(f"framesCount={len(frames.get('frames') or [])}")
          print(f"latestValidTime={latest_payload.get('validTime')}")
          print(f"jsonFiles={len(list(base.glob('*.json')))}")
          print(f"tifFiles={len(list(base.glob('*.tif')))}")
          print(f"mobileWebpFiles={len(list(mobile.glob('*.webp'))) if mobile.exists() else 0}")
          print(f"tileFrameDirs={sum(1 for p in tiles.iterdir() if p.is_dir()) if tiles.exists() else 0}")
          PY
      - name: Upload Level II radar to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          R2_ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          SITE="${{ matrix.site }}"
          LOCAL_DIR="radar/tilesets/test/${SITE}/LEVEL2/REF0"
          REMOTE_DIR="s3://${{ secrets.R2_BUCKET }}/radar/tilesets/test/${SITE}/LEVEL2/REF0"

          # Upload heavy radar assets first. Keep manifests out of this sync so
          # browsers never see a new frames.json before its tile PNGs exist.
          aws s3 sync "$LOCAL_DIR" "$REMOTE_DIR" \
            --exclude "*" \
            --include "*.tif" \
            --include "mobile/*.webp" \
            --include "tiles/*/*/*/*.png" \
            --delete \
            --endpoint-url "$R2_ENDPOINT"

          # Publish manifests last. These are the browser's source of truth.
          aws s3 cp "$LOCAL_DIR/frames.json" "$REMOTE_DIR/frames.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$LOCAL_DIR/latest.json" "$REMOTE_DIR/latest.json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "application/json" \
            --endpoint-url "$R2_ENDPOINT"

          aws s3 cp "$REMOTE_DIR/frames.json" "/tmp/${SITE}-frames.json" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$REMOTE_DIR/latest.json" "/tmp/${SITE}-latest.json" --endpoint-url "$R2_ENDPOINT"

          python - <<'PY'
          import json
          from pathlib import Path

          site = "${{ matrix.site }}"
          frames = json.loads(Path(f"/tmp/{site}-frames.json").read_text(encoding="utf-8"))
          latest = json.loads(Path(f"/tmp/{site}-latest.json").read_text(encoding="utf-8"))

          print(f"Uploaded Level II site: {site}")
          print(f"Uploaded frame count: {len(frames.get('frames') or [])}")
          print(f"Uploaded latest validTime: {latest.get('validTime')}")
          PY
