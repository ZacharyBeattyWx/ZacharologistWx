name: Patch satellite playback preload gate

on:
  push:
    paths:
      - '.github/workflows/patch-satellite-playback.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch satellite playback
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_satellite.py
          python3 /tmp/patch_satellite.py

      - name: Validate embedded viewer JavaScript
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; t=Path("weather-viewer.html").read_text(encoding="utf-8"); Path("/tmp/weather-viewer.js").write_text(t.rsplit("<script>",1)[1].split("</script>",1)[0], encoding="utf-8")'
          node --check /tmp/weather-viewer.js
          grep -F 'await warmSatelliteFrames(generation,context);' weather-viewer.html
          grep -F 'satPlayPreparing=true;' weather-viewer.html

      - name: Commit satellite playback change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather-viewer.html
          git commit -m "Preload satellite loop before playback"
          git push
