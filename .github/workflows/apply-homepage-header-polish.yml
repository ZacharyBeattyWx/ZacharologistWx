name: Apply homepage header polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-homepage-header-polish.yml
      - scripts/apply_homepage_header_polish.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Apply homepage header and mobile polish
        run: python scripts/apply_homepage_header_polish.py

      - name: Commit homepage polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage header changes needed"
            exit 0
          fi
          git commit -m "Polish homepage navigation across breakpoints"
          git push origin HEAD:main
