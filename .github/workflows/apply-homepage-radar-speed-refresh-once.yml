name: Apply homepage radar speed refresh once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-homepage-radar-speed-refresh-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Patch homepage radar speed and refresh versions
        run: python scripts/radar/patch_homepage_radar_speed_once.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/radar/mrms-timelapse-playback-v2.js scripts/radar/mrms-playback-performance.js mapbox-token.js mosaic-radar-canvas-test.html index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Speed up 2x radar playback and refresh homepage map"
          git push origin main
