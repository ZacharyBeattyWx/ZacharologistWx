<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZacharologistWx Level II Radar Test</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>
  <script src="https://unpkg.com/geotiff/dist-browser/geotiff.js"></script>
  <script src="mapbox-token.local.js"></script>
  <script>
    if (!window.MAPBOX_PUBLIC_TOKEN) {
      document.write('<script src="mapbox-token.js"><\/script>');
    }
  </script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #061025; color: #f8fafc; font-family: Arial, sans-serif; }
    #map { position: fixed; inset: 0; }
    #radarOverlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #radarWebglCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; display: none; }
    #alertOverlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
    #radarCanvas {
      position: fixed;
      left: -99999px;
      top: -99999px;
      width: 4096px;
      height: 4096px;
      opacity: 0;
      pointer-events: none;
    }
    .panel {
      position: fixed;
      z-index: 20;
      background: rgba(5, 10, 22, 0.88);
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(10px);
    }
    .right-ui-rail {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 21;
      width: clamp(340px, 26vw, 430px);
      max-height: calc(100vh - 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: none;
    }
    .right-ui-rail > .panel {
      position: relative;
      width: 100%;
      pointer-events: auto;
    }
    .control-card {
      max-height: min(52vh, 440px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
      overflow-y: auto;
    }
    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }
    .card-title { margin: 0; color: #fff; font-size: 0.92rem; font-weight: 700; line-height: 1.2; }
    .status { color: #cbd5e1; font-size: 0.78rem; line-height: 1.35; min-height: 1.35em; overflow-wrap: anywhere; }
    .readout { color: #e2e8f0; font-size: 0.76rem; line-height: 1.35; overflow-wrap: anywhere; }
    .alert-readout { color: #bfdbfe; }
    .toolbar-field { min-width: 0; }
    .primary-controls-row, .select-row { display: grid; grid-template-columns: minmax(120px, 1fr) auto; gap: 8px; align-items: end; }
    .select-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .speed-toolbar, .opacity-toolbar, .alert-opacity-toolbar {
      display: grid; gap: 6px; align-items: center; min-width: 0;
    }
    .speed-toolbar, .opacity-toolbar { grid-template-columns: auto minmax(90px, 1fr) auto; }
    .alert-opacity-toolbar { grid-template-columns: auto auto minmax(80px, 1fr) auto; }
    .speed-toolbar span, .opacity-toolbar span, .alert-opacity-toolbar span {
      color: #93c5fd; font-size: 0.72rem; font-weight: 800; white-space: nowrap;
    }
    .speed-toolbar output, .opacity-toolbar output, .alert-opacity-toolbar output {
      color: #fff; font-size: 0.78rem; text-align: right; font-variant-numeric: tabular-nums;
    }
    .speed-toolbar-tail {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      min-width: 0;
    }
    .compact-site-field {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #93c5fd;
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .compact-site-label {
      font-size: 0.68rem;
      color: #93c5fd;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .compact-site-field select {
      min-width: 0;
      height: 28px;
      padding: 2px 6px;
      font-size: 0.72rem;
    }
    label { display: grid; gap: 5px; font-size: 0.76rem; color: #93c5fd; font-weight: 700; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    input[type="range"] { width: 100%; }
    output { font-size: 0.78rem; color: #f8fafc; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .error-panel {
      display: none; margin-top: 2px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.9); background: rgba(127, 29, 29, 0.82);
      color: #fee2e2; font-size: 0.78rem; line-height: 1.3;
    }
    .mapboxgl-popup { z-index: 12; }
    .mapboxgl-popup.level2-alert-popup {
      z-index: 5000 !important;
    }
    .mapboxgl-popup.level2-alert-popup .mapboxgl-popup-content,
    .mapboxgl-popup.level2-alert-popup .mapboxgl-popup-tip {
      position: relative;
      z-index: 5001;
    }
    .playback-controls { display: inline-flex; gap: 6px; align-items: center; }
    .playback-controls button { min-width: 56px; padding: 7px 8px; }
    .mobile-radar-options-toggle {
      display: none;
      width: 34px;
      height: 34px;
      min-width: 34px;
      min-height: 34px;
      border-radius: 999px;
      font-size: 1.05rem;
      line-height: 1;
      padding: 0;
    }
    #mobileRadarOptionsPanel {
      display: contents;
    }
    .level2-alert-popup .mapboxgl-popup-content {
      width: 300px;
      max-width: calc(100vw - 28px);
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #f8fafc;
      box-shadow: none;
      overflow: visible;
    }
    .level2-alert-popup .mapboxgl-popup-tip { display: none; }
    .level2-alert-popup .mapboxgl-popup-close-button {
      top: 4px;
      right: 5px;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      line-height: 17px;
    }
    .level2-alert-popup .mapboxgl-popup-close-button:hover { background: rgba(0, 0, 0, 0.34); color: #ffffff; }
    .level2-alert-popup-wrap {
      position: relative;
      width: 300px;
      max-width: calc(100vw - 28px);
      min-width: 0;
      overflow-wrap: anywhere;
      overflow: visible;
    }
    .level2-alert-popup .omega-alert-popup {
      position: relative;
      width: 100%;
      max-width: 100%;
      overflow: visible;
      background: rgba(8, 14, 28, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.42);
      pointer-events: auto;

    }
    .level2-alert-popup .omega-alert-stack { display: grid; gap: 8px; background: transparent; }
    .level2-alert-popup .omega-alert-item { position: relative; }
    .level2-alert-popup .omega-alert-card { background: transparent; }
    .level2-alert-popup .omega-alert-header {
      position: relative;
      height: 30px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--alert-color, #7c4dff);
      color: #ffffff;
      font-size: 0.78rem;
      font-weight: 800;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.42);
      overflow-wrap: anywhere;
      border-radius: 12px 12px 0 0;
    }
    .level2-alert-popup .omega-alert-title {
      min-width: 0;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .level2-alert-popup .omega-alert-body {
      height: 48px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), rgba(7, 12, 24, 0.72);
      backdrop-filter: blur(5px);
      border-radius: 0 0 12px 12px;
    }
    .level2-alert-popup .omega-alert-expires {
      color: #f8fafc;
      font-size: 0.78rem;
      font-weight: 700;
      line-height: 1.25;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
      flex: 0 1 auto;
      padding-right: 44px;
    }
    .level2-alert-popup .omega-alert-actions {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
    }
    .level2-alert-popup .omega-alert-icon-btn {
      width: 32px;
      height: 32px;
      min-height: 32px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
    }
    .level2-alert-popup .omega-alert-icon-btn:hover { border-color: var(--alert-color, #7c4dff); background: #1b1d21; }
    .level2-alert-popup .level2-alert-detail-panel {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 0;
      width: min(520px, calc(100vw - 40px));
      max-height: min(420px, 48vh);
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 4;
      display: none;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(3, 7, 18, 0.96);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.42);
      padding: 12px;
      overscroll-behavior: contain;
    }
    .level2-alert-popup .level2-alert-detail-panel.is-open { display: block; }
    .level2-alert-popup .level2-alert-detail-panel::-webkit-scrollbar { width: 10px; }
    .level2-alert-popup .level2-alert-detail-panel::-webkit-scrollbar-track {
      background: rgba(2, 6, 23, 0.62);
      border-radius: 999px;
    }
    .level2-alert-popup .level2-alert-detail-panel::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.72);
      border: 2px solid rgba(2, 6, 23, 0.62);
      border-radius: 999px;
    }
    .level2-alert-popup .level2-alert-detail-panel::-webkit-scrollbar-thumb:hover { background: rgba(129, 140, 155, 0.82); }
    .level2-alert-popup .alert-detail-card { display: grid; gap: 12px; }
    .level2-alert-popup .alert-detail-hero { display: grid; gap: 8px; }
    .level2-alert-popup .alert-detail-headline {
      padding: 10px 12px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-left: 4px solid color-mix(in srgb, var(--alert-color, #7c4dff) 65%, transparent);
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-weight: 800;
      line-height: 1.38;
      overflow-wrap: anywhere;
    }
    .level2-alert-popup .alert-detail-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .level2-alert-popup .alert-detail-metric {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), transparent), rgba(15, 23, 42, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    }
    .level2-alert-popup .alert-detail-metric-label,
    .level2-alert-popup .alert-detail-section-title {
      color: #93c5fd;
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .level2-alert-popup .alert-detail-metric-value {
      margin-top: 4px;
      color: #ffffff;
      font-size: 0.8rem;
      font-weight: 750;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .level2-alert-popup .alert-detail-section {
      padding: 11px 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.55);
    }
    .level2-alert-popup .alert-detail-text {
      margin-top: 7px;
      color: #e5edf8;
      line-height: 1.48;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      font-size: 0.84rem;
    }
    @media (max-width: 720px) {
      html, body {
        height: 100dvh;
      }
      #map, #radarOverlayCanvas, #radarWebglCanvas, #alertOverlayCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
      }
      .right-ui-rail {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100dvh !important;
        pointer-events: none !important;
        z-index: 20 !important;
      }
      .control-card {
        position: fixed !important;
        left: 50% !important;
        right: auto !important;
        top: auto !important;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px) !important;
        width: min(92vw, 390px) !important;
        max-width: 390px !important;
        transform: translateX(-50%) !important;
        box-sizing: border-box !important;
        pointer-events: auto !important;
      }
      .card-header,
      .desktop-product-field {
        display: none !important;
      }
      .speed-toolbar {
        display: grid !important;
        grid-template-columns: auto minmax(0, 1fr) auto !important;
        align-items: center !important;
        gap: 8px !important;
        width: 100% !important;
        padding: 0 !important;
      }
      .primary-controls-row {
        display: grid !important;
        grid-template-columns: 42px minmax(0, 1fr) !important;
        align-items: center !important;
        gap: 8px !important;
        width: 100% !important;
      }
      .mobile-radar-options-toggle {
        display: grid !important;
        place-items: center !important;
        width: 42px !important;
        height: 42px !important;
        min-width: 42px !important;
        min-height: 42px !important;
        border-radius: 999px !important;
        padding: 0 !important;
      }
      .playback-controls {
        display: grid !important;
        grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        gap: 8px !important;
        width: 100% !important;
      }
      .playback-controls button {
        min-width: 0 !important;
        min-height: 38px !important;
        padding: 5px 8px !important;
        border-radius: 12px !important;
        font-size: 0.88rem !important;
      }
      #mobileRadarOptionsPanel {
        display: none !important;
      }
      body.mobile-radar-options-open #mobileRadarOptionsPanel {
        display: grid !important;
        gap: 8px !important;
        border-top: 1px solid rgba(148, 163, 184, 0.28) !important;
        padding-top: 8px !important;
      }
      body.mobile-radar-options-open #mobileRadarOptionsPanel .toolbar-field {
        width: 160px !important;
        max-width: 160px !important;
      }
      body.mobile-radar-options-open #siteSelect {
        width: 160px !important;
      }
      .control-card .select-row,
      .control-card .opacity-toolbar,
      .control-card .alert-opacity-toolbar,
      .control-card #statusText,
      .control-card #frameReadout,
      .control-card #alertsStatusRow,
      .control-card #errorPanel {
        display: none;
      }
      body.mobile-radar-options-open .control-card .select-row,
      body.mobile-radar-options-open .control-card .opacity-toolbar,
      body.mobile-radar-options-open .control-card .alert-opacity-toolbar,
      body.mobile-radar-options-open .control-card #statusText,
      body.mobile-radar-options-open .control-card #frameReadout,
      body.mobile-radar-options-open .control-card #alertsStatusRow,
      body.mobile-radar-options-open .control-card #errorPanel {
        display: grid;
      }
      body.mobile-radar-options-open .control-card #errorPanel {

      .level2-alert-popup-wrap { width: min(300px, calc(100vw - 24px)); }

      }

      }
      .level2-alert-popup .mapboxgl-popup-content {
        width: min(86vw, 330px) !important;
        max-width: 330px !important;

      }

      }

        font-size: 0.82rem !important;

      }
      .level2-alert-summary-card .alert-expires {
        font-size: 0.8rem !important;
      }

      .level2-alert-summary-card .alert-detail-button {

<body>
  <div id="map"></div>
  <canvas id="radarOverlayCanvas"></canvas>
  <canvas id="radarWebglCanvas"></canvas>
  <canvas id="alertOverlayCanvas"></canvas>
  <canvas id="radarCanvas"></canvas>

  <div class="right-ui-rail">
    <section class="panel control-card" aria-label="Radar controls">
      <div class="card-header">
        <h1 class="card-title">Mapbox Radar + Alerts</h1>
      </div>
      <div class="speed-toolbar">
        <span>Playback speed</span>
        <input id="playbackSpeedSlider" type="range" min="0.5" max="6" step="0.25" value="1" aria-label="Playback speed">
        <output id="playbackSpeedValue">1x</output>
      </div>
      <label class="toolbar-field desktop-product-field">Product
        <select id="productSelect"><option value="LEVEL2_REF0">LEVEL2_REF0</option></select>
      </label>
      <div class="primary-controls-row">
        <button id="mobileRadarOptionsButton" class="mobile-radar-options-toggle" type="button" aria-controls="mobileRadarOptionsPanel" aria-expanded="false" aria-label="Radar options">&hellip;</button>
        <div class="playback-controls" aria-label="Radar playback controls">
          <button id="previousFrameButton" type="button">Prev</button>
          <button id="playPauseButton" type="button" aria-pressed="false">Play</button>
          <button id="nextFrameButton" type="button">Next</button>
        </div>
      </div>
      <div id="mobileRadarOptionsPanel">
        <label class="toolbar-field">Site
          <select id="siteSelect"><option value="KFCX">KFCX</option><option value="KRAX">KRAX</option><option value="KGSP">KGSP</option><option value="KLTX">KLTX</option><option value="KMHX">KMHX</option><option value="KAKQ">KAKQ</option><option value="KCAE">KCAE</option><option value="KCLX">KCLX</option></select>
        </label>
        <div class="select-row">
          <label class="toolbar-field">Frame
            <select id="frameSelect"></select>
          </label>
        </div>
        <div class="opacity-toolbar">
          <span>Radar opacity</span>
          <input id="opacityRange" type="range" min="0" max="1" step="0.01" value="1">
          <output id="opacityValue">100%</output>
        </div>
        <div class="alert-opacity-toolbar">
          <span>Alerts</span>
          <button id="toggleAlertOverlayButton" type="button" aria-pressed="true">Alerts On</button>
          <input id="alertOpacityRange" type="range" min="0" max="1" step="0.05" value="0.75">
          <output id="alertOpacityValue">75%</output>
        </div>
        <div class="status" id="statusText">Loading map...</div>
        <div class="readout" id="frameReadout">Frame time unavailable</div>
        <div class="readout alert-readout" id="alertsStatusRow">Alerts: loading...</div>
        <div id="errorPanel" class="error-panel"></div>
      </div>
    </section>
  </div>

  <script>
    const MAPBOX_TOKEN = window.MAPBOX_PUBLIC_TOKEN;
    const MAPBOX_STYLE = "mapbox://styles/zacharybeattywx/cmpdipwzh00fq01sccdj806xy";
    const LEVEL2_SUPPORTED_SITES = ["KFCX", "KRAX", "KGSP", "KLTX", "KMHX", "KAKQ", "KCAE", "KCLX"];
    const DEFAULT_LEVEL2_SITE = "KFCX";
    const LEVEL2_PRODUCT = "LEVEL2_REF0";
    const LEVEL2_REMOTE_BASE_URL = "https://radar.zacharologistwx.com";
    const FALLBACK_LEVEL2_TIF = "/radar/tilesets/test/KFCX/LEVEL2/REF0/KFCX_20260528_191913_projected_dbz.tif";
    const FRAME_REFRESH_MS = 60000;
    const ALERT_REFRESH_MS = 60000;
    const PLAYBACK_INTERVAL_MS = 900;
    const MOBILE_LEVEL2_RASTER_SCALE = 0.5;
    const MOBILE_LEVEL2_RENDER_CACHE_LIMIT = 3;
    const DESKTOP_LEVEL2_RENDER_CACHE_LIMIT = 6;
    const MOBILE_UNCACHED_FRAME_MIN_INTERVAL_MS = 1800;
    const DISPLAY_MIN_DBZ = -32;
    const DEBUG_ALERT_STACKING = false;
    const ALERT_SCREEN_HIT_TOLERANCE_PX = 12;
    const FORCE_DEBUG_RADAR_COLORS = false;
    const ENABLE_WEAK_DESPECKLE = false;
    const USE_STEPPED_REFLECTIVITY_PALETTE = false;
    const NODATA_DEFAULT = -9999;

    function compileRadarWebglShader(gl, type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        const message = gl.getShaderInfoLog(shader) || "unknown shader compile error";
        gl.deleteShader(shader);
        throw new Error(message);
      }
      return shader;
    }

    function initRadarWebglOverlay() {
      const gl = radarWebglContext;
      if (!gl || radarWebglState.initialized) return Boolean(gl && radarWebglState.initialized);

      const vertexShader = compileRadarWebglShader(gl, gl.VERTEX_SHADER, `
        attribute vec2 a_position;
        attribute vec2 a_texCoord;
        varying vec2 v_texCoord;
        void main() {
          gl_Position = vec4(a_position, 0.0, 1.0);
          v_texCoord = a_texCoord;
        }
      `);

      const fragmentShader = compileRadarWebglShader(gl, gl.FRAGMENT_SHADER, `
        precision mediump float;
        uniform sampler2D u_texture;
        uniform float u_opacity;
        varying vec2 v_texCoord;
        void main() {
          vec4 color = texture2D(u_texture, v_texCoord);
          gl_FragColor = vec4(color.rgb, color.a * u_opacity);
        }
      `);

      const program = gl.createProgram();
      gl.attachShader(program, vertexShader);
      gl.attachShader(program, fragmentShader);
      gl.linkProgram(program);

      gl.deleteShader(vertexShader);
      gl.deleteShader(fragmentShader);

      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        const message = gl.getProgramInfoLog(program) || "unknown WebGL program link error";
        gl.deleteProgram(program);
        throw new Error(message);
      }

      radarWebglState.program = program;
      radarWebglState.positionLocation = gl.getAttribLocation(program, "a_position");
      radarWebglState.texCoordLocation = gl.getAttribLocation(program, "a_texCoord");
      radarWebglState.opacityLocation = gl.getUniformLocation(program, "u_opacity");
      radarWebglState.textureLocation = gl.getUniformLocation(program, "u_texture");
      radarWebglState.positionBuffer = gl.createBuffer();
      radarWebglState.texCoordBuffer = gl.createBuffer();
      radarWebglState.texture = gl.createTexture();

      gl.bindTexture(gl.TEXTURE_2D, radarWebglState.texture);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

      radarWebglState.initialized = true;
      return true;

    function drawRadarWebglOverlay(width, height, dpr) {
      if (!USE_WEBGL_RADAR_OVERLAY) return false;
      if (!map || !radarBounds || !syncRadarWebglTexture()) return false;

      const gl = radarWebglContext;
      resizeRadarWebglCanvas(width, height);

      const south = radarBounds[0][0];
      const east = radarBounds[1][1];
      const north = radarBounds[1][0];

      const nw = map.project([west, north]);
      const ne = map.project([east, north]);
      const sw = map.project([west, south]);
      const se = map.project([east, south]);

      const toClip = (point) => [
        (point.x * dpr / width) * 2 - 1,
        1 - (point.y * dpr / height) * 2
      ];

      const pNW = toClip(nw);
      const pNE = toClip(ne);
      const pSW = toClip(sw);
      const pSE = toClip(se);

      const positions = new Float32Array([
        pNW[0], pNW[1],
        pSW[0], pSW[1],
        pNE[0], pNE[1],
        pNE[0], pNE[1],
        pSW[0], pSW[1],
        pSE[0], pSE[1]
      ]);

      const texCoords = new Float32Array([
        0, 0,
        0, 1,
        1, 0,
        1, 0,
        0, 1,
        1, 1
      ]);

      gl.viewport(0, 0, width, height);

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      gl.useProgram(radarWebglState.program);

      gl.bindBuffer(gl.ARRAY_BUFFER, radarWebglState.positionBuffer);

      gl.enableVertexAttribArray(radarWebglState.positionLocation);

      gl.bindBuffer(gl.ARRAY_BUFFER, radarWebglState.texCoordBuffer);

      gl.enableVertexAttribArray(radarWebglState.texCoordLocation);
      gl.vertexAttribPointer(radarWebglState.texCoordLocation, 2, gl.FLOAT, false, 0, 0);

      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, radarWebglState.texture);

      gl.drawArrays(gl.TRIANGLES, 0, 6);
      return true;

    function parseHexColor(hex) {
      if (typeof hex !== "string") {
        throw new Error("hex color must be a string");
      }
      const cleaned = hex.trim().replace(/^#/, "");
      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        throw new Error(`invalid hex color: ${hex}`);
      }
      return {
        r: parseInt(cleaned.slice(0, 2), 16),
        g: parseInt(cleaned.slice(2, 4), 16),
        b: parseInt(cleaned.slice(4, 6), 16)
      };
    }

    function normalizePaletteStop(stop) {
      let vRaw;
      let rRaw;
      let gRaw;
      let bRaw;
      let alphaCandidate = 255;

      if (Array.isArray(stop)) {
        if (stop.length < 2) throw new Error("array palette stop must include at least value + color");
        vRaw = stop[0];
        if (typeof stop[1] === "string") {
          const rgb = parseHexColor(stop[1]);
          rRaw = rgb.r;
          gRaw = rgb.g;
          bRaw = rgb.b;
          alphaCandidate = stop.length >= 3 ? stop[2] : 255;
        } else {
          if (stop.length < 5) throw new Error("numeric array palette stop must be [dbz,r,g,b,a]");
          rRaw = stop[1];
          gRaw = stop[2];
          bRaw = stop[3];
          alphaCandidate = stop[4];
        }
      } else if (stop && typeof stop === "object") {
        vRaw = stop.v ?? stop.dbz ?? stop.value;
        if (stop.color != null) {
          const rgb = parseHexColor(stop.color);
          rRaw = rgb.r;
          gRaw = rgb.g;
          bRaw = rgb.b;
        } else {
          rRaw = stop.r;
          gRaw = stop.g;
          bRaw = stop.b;
        }
        const alphaValue = stop.a ?? stop.alpha ?? stop.opacity ?? 255;
        alphaCandidate = alphaValue;
      } else {
        throw new Error("palette stop must be an object or array");
      }

      const v = Number(vRaw);
      const r = Number(rRaw);
      const g = Number(gRaw);
      const b = Number(bRaw);
      let aNum = Number(alphaCandidate);

      if (!Number.isFinite(v)) throw new Error(`invalid stop value: ${String(vRaw)}`);
      if (!Number.isFinite(r) || !Number.isFinite(g) || !Number.isFinite(b)) {
        throw new Error("invalid RGB channel");
      }
      if (!Number.isFinite(aNum)) aNum = 255;
      if (aNum >= 0 && aNum <= 1) aNum *= 255;

      return {
        v,
        r: clamp255(r),
        g: clamp255(g),
        b: clamp255(b),
        a: clamp255(aNum)
      };
    }

    function normalizeRadarPalette(stops) {
      if (!Array.isArray(stops) || stops.length === 0) {

      }
      const normalized = stops.map(normalizePaletteStop).sort((a, b) => a.v - b.v);
      return normalized;
    }
