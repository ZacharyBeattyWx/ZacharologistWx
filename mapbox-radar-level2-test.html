<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

    #map { position: fixed; inset: 0; }
    #radarOverlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #alertOverlayCanvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 6; }
    #radarCanvas { display: none; }
    .panel {
      position: fixed; top: 16px; right: 16px; z-index: 20; width: min(340px, calc(100vw - 32px));
      max-width: min(420px, calc(100vw - 24px));
      padding: 12px; border-radius: 12px; border: 1px solid rgba(148, 163, 184, 0.36);
      background: rgba(8, 16, 32, 0.9); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
      box-sizing: border-box; overflow: hidden;
      backdrop-filter: blur(8px); display: grid; gap: 10px;
    }
    .title { margin: 0; font-size: 0.96rem; font-weight: 700; }
    .meta { display: grid; gap: 3px; font-size: 0.78rem; color: #cbd5e1; line-height: 1.3; }
    .meta, #sourceRow, #statusRow, #frameInfoRow {
      min-width: 0;
      max-width: 100%;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    label { display: grid; gap: 5px; font-size: 0.76rem; color: #93c5fd; font-weight: 700; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    input[type="range"] { width: 100%; }
    output { font-size: 0.78rem; color: #f8fafc; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
    .error-panel {
      display: none; margin-top: 2px; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(248, 113, 113, 0.9); background: rgba(127, 29, 29, 0.82);
      color: #fee2e2; font-size: 0.78rem; line-height: 1.3;
    }
    .mapboxgl-popup { z-index: 12; }
    .playback-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .playback-controls button {
      width: 100%;
      min-width: 0;
      min-height: 32px;
    }
    .level2-alert-popup .mapboxgl-popup-content {
      width: 340px;
      max-width: calc(100vw - 28px);
      padding: 0;
      background: transparent;
      border: 0;
      border-radius: 10px;
      color: #f8fafc;
      box-shadow: none;
    }
    .level2-alert-popup .mapboxgl-popup-tip { display: none; }
    .level2-alert-popup .mapboxgl-popup-close-button {
      top: 4px;
      right: 5px;
      width: 19px;
      height: 19px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.2);
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      line-height: 17px;
    }
    .level2-alert-popup .mapboxgl-popup-close-button:hover { background: rgba(0, 0, 0, 0.34); color: #ffffff; }
    .level2-alert-popup-wrap {
      position: relative;
      width: min(340px, calc(100vw - 24px));
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .level2-alert-popup .omega-alert-popup {
      position: relative;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
      background: #303236;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;

    .level2-alert-popup .omega-alert-stack { display: grid; background: #303236; }
    .level2-alert-popup .omega-alert-card { background: #303236; }
    .level2-alert-popup .omega-alert-header {

      align-items: center;

    .level2-alert-popup .omega-alert-title {

    .level2-alert-popup .omega-alert-expires {

    .level2-alert-popup .level2-popup-details {
      position: absolute;
      bottom: calc(100% + 10px);

      width: min(520px, calc(100vw - 36px));

    .level2-alert-popup .alert-detail-section {
      padding: 11px 12px;
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 12px;
      background: rgba(2, 6, 23, 0.55);

    .level2-alert-popup .alert-detail-text {
      margin-top: 7px;
      color: #e5edf8;
      line-height: 1.48;
      overflow-wrap: anywhere;

    @media (max-width: 720px) {
      .level2-alert-popup-wrap { width: min(340px, calc(100vw - 24px)); }
      .level2-alert-popup .level2-popup-details { width: min(340px, calc(100vw - 24px)); max-height: 55vh; }
      .level2-alert-popup .alert-detail-metrics { grid-template-columns: 1fr; }
    }
  </style>

<body>
  <div id="map"></div>
  <canvas id="radarOverlayCanvas"></canvas>
  <canvas id="alertOverlayCanvas"></canvas>
  <canvas id="radarCanvas"></canvas>

  <div class="panel">
    <p class="title">ZacharologistWx Level II Radar Test</p>
    <div class="meta">
      <div>Site: KFCX</div>
      <div>Product: Level II Reflectivity</div>
      <div>Renderer: projected dBZ GeoTIFF + external canvas</div>
      <div id="validTimeRow">Valid time: loading...</div>
      <div id="sourceRow">Radar source: loading...</div>
      <div id="alertsStatusRow">Alerts: loading...</div>
      <div id="statusRow">Renderer status: loading...</div>
    </div>
    <div id="errorPanel" class="error-panel"></div>
    <label for="opacitySlider">
      Opacity
      <div class="row">
        <input id="opacitySlider" type="range" min="0" max="1" step="0.01" value="1">
        <output id="opacityValue">100%</output>
      </div>
    </label>
    <div class="playback-controls">
      <button id="previousFrameButton" type="button">Prev</button>
      <button id="playPauseButton" type="button" aria-pressed="false">Play</button>
      <button id="nextFrameButton" type="button">Next</button>
    </div>
    <div id="frameInfoRow" class="meta">Frame: loading...</div>
  </div>

  <script>
    const MAPBOX_TOKEN = window.MAPBOX_PUBLIC_TOKEN;
    const MAPBOX_STYLE = "mapbox://styles/zacharybeattywx/cmpdipwzh00fq01sccdj806xy";

    const LEVEL2_META_URL = "/radar/tilesets/test/KFCX/LEVEL2/REF0/latest.json";
    const LEVEL2_FRAMES_URL = "/radar/tilesets/test/KFCX/LEVEL2/REF0/frames.json";
    const FALLBACK_LEVEL2_TIF = "/radar/tilesets/test/KFCX/LEVEL2/REF0/KFCX_20260527_153300_projected_dbz.tif";
    const FRAME_REFRESH_MS = 60000;
    const PLAYBACK_INTERVAL_MS = 900;
    const DISPLAY_MIN_DBZ = -32;
    const FORCE_DEBUG_RADAR_COLORS = false;
    const ENABLE_WEAK_DESPECKLE = false;
    const USE_STEPPED_REFLECTIVITY_PALETTE = false;
    const NODATA_DEFAULT = -9999;
    const RADAR_OVERLAY_VERTICAL_STRIPS = 96;
    const PALETTE_SOURCE_FILE = "scripts/radar/radar_config.json";

    const ALERT_SOURCE_ID = "nws-alert-polygons";
    const ALERT_FILL_LAYER_ID = "nws-alert-polygons-fill-hitbox";
    const ALERT_LINE_LAYER_ID = "nws-alert-polygons-line";
    const NWS_ALERT_AREAS = [
      "AL", "AR", "DC", "DE", "FL", "GA",
      "IN", "KY", "LA", "MD", "MO", "MS",
      "NC", "NJ", "NY", "OH", "PA", "SC",
      "TN", "VA", "WV"
    ];

    const SITE_SOURCE_ID = "weatherwise-radar-sites";
    const SITE_CIRCLE_LAYER_ID = "weatherwise-radar-sites-circle";
    const SITE_LABEL_LAYER_ID = "weatherwise-radar-sites-label";

    function cacheBustUrl(url) {
      const separator = url.includes("?") ? "&" : "?";
      return `${url}${separator}v=${Date.now()}`;
    }

    // Copied from ZacharologistWx main radar renderer color table
    const RADAR_DBZ_PALETTE = [
      { v: -32, r: 88, g: 54, b: 128, a: 8 },
      { v: -30, r: 96, g: 62, b: 138, a: 10 },
      { v: -28, r: 105, g: 72, b: 145, a: 12 },
      { v: -26, r: 116, g: 85, b: 150, a: 15 },
      { v: -24, r: 128, g: 99, b: 153, a: 18 },
      { v: -22, r: 139, g: 113, b: 153, a: 22 },
      { v: -20, r: 148, g: 128, b: 150, a: 28 },
      { v: -18, r: 155, g: 140, b: 145, a: 34 },
      { v: -16, r: 160, g: 150, b: 138, a: 42 },
      { v: -14, r: 163, g: 157, b: 130, a: 52 },
      { v: -12, r: 160, g: 158, b: 123, a: 62 },
      { v: -10, r: 156, g: 155, b: 119, a: 72 },
      { v: -8, r: 167, g: 167, b: 136, a: 80 },
      { v: -6, r: 175, g: 176, b: 150, a: 88 },
      { v: -4, r: 158, g: 163, b: 150, a: 98 },
      { v: -2, r: 135, g: 144, b: 145, a: 108 },
      { v: 0, r: 115, g: 128, b: 142, a: 120 },
      { v: 2, r: 92, g: 109, b: 137, a: 132 },
      { v: 4, r: 73, g: 93, b: 133, a: 144 },
      { v: 6, r: 55, g: 81, b: 132, a: 156 },
      { v: 8, r: 63, g: 97, b: 141, a: 168 },
      { v: 10, r: 73, g: 117, b: 152, a: 180 },
      { v: 15, r: 76, g: 165, b: 142, a: 205 },
      { v: 20, r: 18, g: 118, b: 24, a: 230 },
      { v: 25, r: 203, g: 222, b: 1, a: 245 },
      { v: 30, r: 215, g: 203, b: 0, a: 255 },
      { v: 35, r: 227, g: 129, b: 3, a: 255 },
      { v: 40, r: 185, g: 95, b: 10, a: 255 },
      { v: 45, r: 192, g: 37, b: 20, a: 255 },
      { v: 50, r: 202, g: 153, b: 180, a: 255 },
      { v: 55, r: 196, g: 74, b: 138, a: 255 },
      { v: 60, r: 139, g: 32, b: 210, a: 255 },
      { v: 65, r: 86, g: 20, b: 162, a: 255 },
      { v: 70, r: 111, g: 210, b: 219, a: 255 },
      { v: 75, r: 74, g: 132, b: 154, a: 255 },
      { v: 80, r: 115, g: 10, b: 1, a: 255 },
      { v: 85, r: 235, g: 190, b: 255, a: 255 },
      { v: 90, r: 255, g: 230, b: 245, a: 255 },
      { v: 95, r: 255, g: 255, b: 255, a: 255 }
    ];
    let RADAR_DBZ_PALETTE_NORMALIZED = [];
    const LOW_DBZ_OPACITY_TAPER = [
      { dbz: -32, opacity: 0.0 },
      { dbz: -20, opacity: 0.01 },
      { dbz: -10, opacity: 0.04 },
      { dbz: 0, opacity: 0.12 },
      { dbz: 5, opacity: 0.32 },
      { dbz: 10, opacity: 0.7 },
      { dbz: 15, opacity: 1.0 }
    ];

    const radarOverlayCanvas = document.getElementById("radarOverlayCanvas");
    const radarOverlayContext = radarOverlayCanvas.getContext("2d");
    const alertOverlayCanvas = document.getElementById("alertOverlayCanvas");
    const alertOverlayContext = alertOverlayCanvas.getContext("2d");
    const radarCanvas = document.getElementById("radarCanvas");
    const radarContext = radarCanvas.getContext("2d", { willReadFrequently: true });

    const opacitySlider = document.getElementById("opacitySlider");
    const opacityValue = document.getElementById("opacityValue");
    const validTimeRow = document.getElementById("validTimeRow");
    const sourceRow = document.getElementById("sourceRow");
    const alertsStatusRow = document.getElementById("alertsStatusRow");
    const statusRow = document.getElementById("statusRow");
    const errorPanel = document.getElementById("errorPanel");
    const previousFrameButton = document.getElementById("previousFrameButton");
    const playPauseButton = document.getElementById("playPauseButton");
    const nextFrameButton = document.getElementById("nextFrameButton");
    const frameInfoRow = document.getElementById("frameInfoRow");

    let map;
    let popup;
    let radarBounds = [[32.2, -86.6], [42.2, -73.4]];
    let activeAlertFeatures = [];
    let activeAlertsWithoutGeometry = [];
    let level2Frames = [];
    let currentFrameIndex = 0;
    let isPlaying = false;
    let playbackTimer = null;
    let frameRefreshTimer = null;
    let paletteLogPrinted = false;
    let colorizerSmokeLogged = false;

    function clamp255(value) {
      return Math.max(0, Math.min(255, Math.round(value)));
    }

    function parseHexColor(hex) {
      if (typeof hex !== "string") {
        throw new Error("hex color must be a string");
      }
      const cleaned = hex.trim().replace(/^#/, "");
      if (!/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        throw new Error(`invalid hex color: ${hex}`);
      }
      return {
        r: parseInt(cleaned.slice(0, 2), 16),
        g: parseInt(cleaned.slice(2, 4), 16),
        b: parseInt(cleaned.slice(4, 6), 16)
      };
    }

    function normalizePaletteStop(stop) {
      let vRaw;
      let rRaw;
      let gRaw;
      let bRaw;
      let alphaCandidate = 255;

      if (Array.isArray(stop)) {
        if (stop.length < 2) throw new Error("array palette stop must include at least value + color");
        vRaw = stop[0];
        if (typeof stop[1] === "string") {
          const rgb = parseHexColor(stop[1]);
          rRaw = rgb.r;
          gRaw = rgb.g;
          bRaw = rgb.b;
          alphaCandidate = stop.length >= 3 ? stop[2] : 255;
        } else {
          if (stop.length < 5) throw new Error("numeric array palette stop must be [dbz,r,g,b,a]");
          rRaw = stop[1];
          gRaw = stop[2];
          bRaw = stop[3];
          alphaCandidate = stop[4];
        }
      } else if (stop && typeof stop === "object") {
        vRaw = stop.v ?? stop.dbz ?? stop.value;
        if (stop.color != null) {
          const rgb = parseHexColor(stop.color);
          rRaw = rgb.r;
          gRaw = rgb.g;
          bRaw = rgb.b;
        } else {
          rRaw = stop.r;
          gRaw = stop.g;
          bRaw = stop.b;
        }
        const alphaValue = stop.a ?? stop.alpha ?? stop.opacity ?? 255;
        alphaCandidate = alphaValue;
      } else {
        throw new Error("palette stop must be an object or array");
      }

      const v = Number(vRaw);
      const r = Number(rRaw);
      const g = Number(gRaw);
      const b = Number(bRaw);
      let aNum = Number(alphaCandidate);

      if (!Number.isFinite(v)) throw new Error(`invalid stop value: ${String(vRaw)}`);
      if (!Number.isFinite(r) || !Number.isFinite(g) || !Number.isFinite(b)) {
        throw new Error("invalid RGB channel");
      }
      if (!Number.isFinite(aNum)) aNum = 255;
      if (aNum >= 0 && aNum <= 1) aNum *= 255;

      return {
        v,
        r: clamp255(r),
        g: clamp255(g),
        b: clamp255(b),
        a: clamp255(aNum)
      };
    }

    function normalizeRadarPalette(stops) {
      if (!Array.isArray(stops) || stops.length === 0) {
        throw new Error("palette is empty");
      }
      const normalized = stops.map(normalizePaletteStop).sort((a, b) => a.v - b.v);
      return normalized;
    }

    function updateOpacity() {
      const value = Number(opacitySlider.value);
      opacityValue.textContent = `${Math.round(value * 100)}%`;
      redrawRadarOverlay();
    }

    function normalizeLevel2Frame(meta) {
      if (!meta?.path) return null;
      const bounds = meta?.bounds;
      const hasBounds = bounds &&
        Number.isFinite(bounds.west) &&
        Number.isFinite(bounds.south) &&
        Number.isFinite(bounds.east) &&
        Number.isFinite(bounds.north);
      const validTimeDate = new Date(meta.validTime || "");
      return {
        path: meta.path,
        validTime: meta.validTime || "",
        validTimeDate,
        bounds: hasBounds ? [[bounds.south, bounds.west], [bounds.north, bounds.east]] : null
      };
    }

    function upsertLevel2Frame(frame) {
      if (!frame?.path) return;
      const existingIndex = level2Frames.findIndex((candidate) => candidate.path === frame.path);
      if (existingIndex >= 0) {
        level2Frames[existingIndex] = frame;
      } else {
        level2Frames.push(frame);
      }
      level2Frames.sort((a, b) => {
        const aTime = Number.isFinite(a.validTimeDate?.getTime?.()) ? a.validTimeDate.getTime() : 0;
        const bTime = Number.isFinite(b.validTimeDate?.getTime?.()) ? b.validTimeDate.getTime() : 0;
        return aTime - bTime;
      });
    }

    function updatePlaybackButton() {
      playPauseButton.textContent = isPlaying ? "Pause" : "Play";
      playPauseButton.setAttribute("aria-pressed", String(isPlaying));
    }

    function updateFrameInfoRow() {
      if (!level2Frames.length) {
        frameInfoRow.textContent = "Frame: none";
        return;
      }
      const frame = level2Frames[currentFrameIndex];
      const validText = frame?.validTime ? new Date(frame.validTime).toLocaleString() : "Unknown";
      if (level2Frames.length === 1) {
        frameInfoRow.textContent = `Frame 1/1 · waiting for more frames · ${validText}`;
        return;
      }
      frameInfoRow.textContent = `Frame ${currentFrameIndex + 1}/${level2Frames.length} · ${validText}`;
    }

    function clearPlaybackTimer() {
      if (playbackTimer !== null) {
        window.clearTimeout(playbackTimer);
        playbackTimer = null;
      }
    }

    function lockOrientation() {
      if (!map) return;
      if (Math.abs(map.getPitch()) > 0.01) map.setPitch(0);
      if (Math.abs(map.getBearing()) > 0.01) map.setBearing(0);
    }

    function colorForDbz(dbz) {
      if (!Number.isFinite(dbz) || dbz < DISPLAY_MIN_DBZ) return { r: 0, g: 0, b: 0, a: 0 };
      if (FORCE_DEBUG_RADAR_COLORS) {
        if (dbz < 10) return { r: 0, g: 255, b: 255, a: 255 };
        if (dbz < 20) return { r: 0, g: 255, b: 0, a: 255 };
        if (dbz < 35) return { r: 255, g: 255, b: 0, a: 255 };
        return { r: 255, g: 0, b: 255, a: 255 };
      }
      const stops = RADAR_DBZ_PALETTE_NORMALIZED;
      if (!Array.isArray(stops) || stops.length === 0) return { r: 0, g: 0, b: 0, a: 0 };
      if (dbz <= stops[0].v) return { r: stops[0].r, g: stops[0].g, b: stops[0].b, a: stops[0].a };
      if (dbz >= stops[stops.length - 1].v) {
        const last = stops[stops.length - 1];
        return { r: last.r, g: last.g, b: last.b, a: last.a };
      }
      if (USE_STEPPED_REFLECTIVITY_PALETTE) {
        for (let i = stops.length - 1; i >= 0; i -= 1) {
          const stop = stops[i];
          if (dbz >= stop.v) {
            return {
              r: stop.r,
              g: stop.g,
              b: stop.b,
              a: stop.a
            };
          }
        }
      }
      for (let i = 0; i < stops.length - 1; i += 1) {
        const lower = stops[i];
        const upper = stops[i + 1];
        if (dbz >= lower.v && dbz <= upper.v) {
          const span = upper.v - lower.v;
          const t = span === 0 ? 0 : (dbz - lower.v) / span;
          const r = Math.round(lower.r + (upper.r - lower.r) * t);
          const g = Math.round(lower.g + (upper.g - lower.g) * t);
          const b = Math.round(lower.b + (upper.b - lower.b) * t);
          const alpha = Math.round(lower.a + (upper.a - lower.a) * t);
          return {
            r,
            g,
            b,
            a: alpha
          };
        }
      }
      return { r: 0, g: 0, b: 0, a: 0 };
    }

    function opacityMultiplierForDbz(dbz) {
      if (!Number.isFinite(dbz) || !LOW_DBZ_OPACITY_TAPER.length) return 1;
      const points = LOW_DBZ_OPACITY_TAPER;
      if (dbz <= points[0].dbz) return points[0].opacity;
      if (dbz >= points[points.length - 1].dbz) return points[points.length - 1].opacity;
      for (let i = 0; i < points.length - 1; i += 1) {
        const lower = points[i];
        const upper = points[i + 1];
        if (dbz >= lower.dbz && dbz <= upper.dbz) {
          const span = upper.dbz - lower.dbz;
          const t = span === 0 ? 0 : (dbz - lower.dbz) / span;
          return lower.opacity + (upper.opacity - lower.opacity) * t;
        }
      }
      return 1;
    }

    async function fetchLatestLevel2Frame() {
      const response = await fetch(cacheBustUrl(LEVEL2_META_URL), { cache: "no-store" });
      if (!response.ok) throw new Error(`metadata fetch failed (${response.status})`);
      const meta = await response.json();
      return normalizeLevel2Frame(meta);
    }

    async function fetchLevel2FramesCatalog() {
      const response = await fetch(cacheBustUrl(LEVEL2_FRAMES_URL), { cache: "no-store" });
      if (!response.ok) throw new Error(`frames catalog fetch failed (${response.status})`);
      const payload = await response.json();
      const rawFrames = Array.isArray(payload?.frames) ? payload.frames : [];
      return rawFrames.map(normalizeLevel2Frame).filter(Boolean);
    }

    function currentFrame() {
      return level2Frames[currentFrameIndex] || null;
    }

    async function renderLevel2Dbz(frame = currentFrame()) {
      try {
        try {
          RADAR_DBZ_PALETTE_NORMALIZED = normalizeRadarPalette(RADAR_DBZ_PALETTE);
        } catch (error) {
          throw new Error(`Palette normalization failed: ${error?.message || "unknown error"}`);
        }
        if (!paletteLogPrinted) {
          console.log("Normalized Level II palette:", RADAR_DBZ_PALETTE_NORMALIZED);
          paletteLogPrinted = true;
        }
        if (!colorizerSmokeLogged) {
          console.log("Colorizer smoke test:", {
            minus10: colorForDbz(-10),
            zero: colorForDbz(0),
            ten: colorForDbz(10),
            thirtyFive: colorForDbz(35)
          });
          colorizerSmokeLogged = true;
        }

        const tifPath = frame?.path || FALLBACK_LEVEL2_TIF;
        if (frame?.bounds) {
          radarBounds = frame.bounds;
        }
        validTimeRow.textContent = `Valid time: ${frame?.validTime || "Unknown"}`;
        updateFrameInfoRow();
        sourceRow.textContent = "Radar source: latest Level II GeoTIFF";
        sourceRow.title = tifPath;

        const response = await fetch(tifPath, { cache: "no-store" });
        if (!response.ok) throw new Error(`GeoTIFF fetch failed: ${response.status} ${response.statusText}`);
        const buffer = await response.arrayBuffer();
        const tiff = await GeoTIFF.fromArrayBuffer(buffer);
        const image = await tiff.getImage();
        const width = image.getWidth();
        const height = image.getHeight();
        const nodataRaw = image.getGDALNoData();
        const nodata = Number.isFinite(Number(nodataRaw)) ? Number(nodataRaw) : NODATA_DEFAULT;
        const dbz = await image.readRasters({ samples: [0], interleave: true });
        if (!dbz || dbz.length !== width * height) {
          throw new Error(`invalid raster length (${dbz ? dbz.length : "none"}), expected ${width * height}`);
        }

        radarCanvas.width = width;
        radarCanvas.height = height;
        const imageData = radarContext.createImageData(width, height);
        const data = imageData.data;
        data.fill(0);
        const weakMask = new Uint8Array(width * height);
        const validMask = new Uint8Array(width * height);
        let belowDisplayMin = 0;
        let negativeVisible = 0;
        let zeroToFive = 0;
        let fiveToFifteen = 0;
        let fifteenToThirty = 0;
        let thirtyPlus = 0;
        let colored = 0;
        let transparent = 0;

        for (let i = 0, p = 0; i < dbz.length; i += 1, p += 4) {
          const value = dbz[i];
          const isNoData = !Number.isFinite(value) || value === nodata;
          if (isNoData) {
            data[p] = 0; data[p + 1] = 0; data[p + 2] = 0; data[p + 3] = 0;
            transparent += 1;
            continue;
          }
          if (value < DISPLAY_MIN_DBZ) {
            belowDisplayMin += 1;
            data[p] = 0; data[p + 1] = 0; data[p + 2] = 0; data[p + 3] = 0;
            transparent += 1;
            continue;
          }
          validMask[i] = 1;
          if (ENABLE_WEAK_DESPECKLE && value >= 0 && value < 8) weakMask[i] = 1;
          if (value < 0) negativeVisible += 1;
          else if (value < 5) zeroToFive += 1;
          else if (value < 15) fiveToFifteen += 1;
          else if (value < 30) fifteenToThirty += 1;
          else thirtyPlus += 1;
          const color = colorForDbz(value);
          const baseAlpha = color.a;
          const taperOpacity = opacityMultiplierForDbz(value);
          const finalAlpha = Math.max(0, Math.min(255, Math.round(baseAlpha * taperOpacity)));
          data[p] = color.r;
          data[p + 1] = color.g;
          data[p + 2] = color.b;
          data[p + 3] = finalAlpha;
          if (finalAlpha > 0) colored += 1;
          else transparent += 1;
        }

        if (ENABLE_WEAK_DESPECKLE) {
        for (let y = 1; y < height - 1; y += 1) {
          for (let x = 1; x < width - 1; x += 1) {
            const idx = y * width + x;
            if (!weakMask[idx]) continue;
            let neighbors = 0;
            for (let oy = -1; oy <= 1; oy += 1) {
              for (let ox = -1; ox <= 1; ox += 1) {
                if (ox === 0 && oy === 0) continue;
                const nIdx = (y + oy) * width + (x + ox);
                if (validMask[nIdx]) neighbors += 1;
              }
            }
            if (neighbors === 0) {
              const p = idx * 4;
              if (data[p + 3] > 0) {
                data[p] = 0;
                data[p + 1] = 0;
                data[p + 2] = 0;
                data[p + 3] = 0;
                colored = Math.max(0, colored - 1);
                transparent += 1;
              }
            }
          }
        }
        }

        let blackPixelsClearedBySafetyPass = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 0 && data[i + 3] > 0) {
            data[i + 3] = 0;
            blackPixelsClearedBySafetyPass += 1;
            colored = Math.max(0, colored - 1);
            transparent += 1;
          }
        }

        radarContext.putImageData(imageData, 0, 0);
        const readback = radarContext.getImageData(0, 0, width, height).data;
        let blackNonTransparentPixelsAfterCleanup = 0;
        for (let i = 0; i < readback.length; i += 4) {
          const r = readback[i];
          const g = readback[i + 1];
          const b = readback[i + 2];
          const alphaReadback = readback[i + 3];
          if (alphaReadback > 0 && r === 0 && g === 0 && b === 0) blackNonTransparentPixelsAfterCleanup += 1;
        }
        if (blackNonTransparentPixelsAfterCleanup > 0) {
          console.warn("Black radar pixels still remain after cleanup", blackNonTransparentPixelsAfterCleanup);
        }
        console.log("Level II dBZ renderer diagnostics:", {
          paletteSourceFileFound: PALETTE_SOURCE_FILE,
          displayMinDbz: DISPLAY_MIN_DBZ,
          belowDisplayMin,
          negativeVisible,
          zeroToFive,
          fiveToFifteen,
          fifteenToThirty,
          thirtyPlus,
          colored,
          transparent,
          blackNonTransparentPixelsAfterCleanup
        });
        redrawRadarOverlay();
        statusRow.textContent = "Renderer status: success";
      } catch (error) {
        console.error("Level II render failed", error);
        throw error;
      }
    }

    async function refreshLevel2Frames() {
      const wasAtLatest = currentFrameIndex === Math.max(0, level2Frames.length - 1);
      const previousLatestPath = level2Frames[level2Frames.length - 1]?.path || "";
      try {
        const catalogFrames = await fetchLevel2FramesCatalog();
        if (catalogFrames.length > 0) {
          level2Frames = catalogFrames.sort((a, b) => {
            const aTime = Number.isFinite(a.validTimeDate?.getTime?.()) ? a.validTimeDate.getTime() : 0;
            const bTime = Number.isFinite(b.validTimeDate?.getTime?.()) ? b.validTimeDate.getTime() : 0;
            return aTime - bTime;
          });
        } else {
          const latestFrame = await fetchLatestLevel2Frame();
          if (latestFrame) upsertLevel2Frame(latestFrame);
        }
      } catch (_error) {
        try {
          const latestFrame = await fetchLatestLevel2Frame();
          if (latestFrame) upsertLevel2Frame(latestFrame);
        } catch (_latestError) {
          if (level2Frames.length === 0) {
            upsertLevel2Frame({
              path: FALLBACK_LEVEL2_TIF,
              validTime: "",
              validTimeDate: new Date(""),
              bounds: radarBounds
            });
          }
        }
      }
      if (level2Frames.length === 0) return false;

      if (wasAtLatest) {
        currentFrameIndex = level2Frames.length - 1;
      } else {
        currentFrameIndex = Math.max(0, Math.min(currentFrameIndex, level2Frames.length - 1));
      }
      updateFrameInfoRow();
      return previousLatestPath !== (level2Frames[level2Frames.length - 1]?.path || "");
    }

    async function renderCurrentFrame() {
      const frame = currentFrame();
      if (!frame) return;
      await renderLevel2Dbz(frame);
    }

    async function stepFrame(direction) {
      if (!level2Frames.length) return;
      currentFrameIndex = (currentFrameIndex + direction + level2Frames.length) % level2Frames.length;
      await renderCurrentFrame();
    }

    function stopPlayback() {
      clearPlaybackTimer();
      isPlaying = false;
      updatePlaybackButton();
    }

    async function playbackTick() {
      if (!isPlaying) return;
      if (level2Frames.length > 1) {
        await stepFrame(1);
      }
      if (!isPlaying) return;
      playbackTimer = window.setTimeout(playbackTick, PLAYBACK_INTERVAL_MS);
    }

    function startPlayback() {
      if (isPlaying || level2Frames.length < 2) return;
      isPlaying = true;
      updatePlaybackButton();
      clearPlaybackTimer();
      playbackTimer = window.setTimeout(playbackTick, PLAYBACK_INTERVAL_MS);
    }

    function togglePlayback() {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback();
      }
    }

    function startFrameRefresh() {
      if (frameRefreshTimer !== null) {
        window.clearInterval(frameRefreshTimer);
      }
      frameRefreshTimer = window.setInterval(async () => {
        const latestChanged = await refreshLevel2Frames();
        if (latestChanged && currentFrameIndex === level2Frames.length - 1) {
          await renderCurrentFrame();
        }
        if (!isPlaying && level2Frames.length >= 2) {
          startPlayback();
        }
      }, FRAME_REFRESH_MS);
    }

    function redrawRadarOverlay() {
      if (!map || radarCanvas.width === 0 || radarCanvas.height === 0 || !radarBounds) return;

      const dpr = window.devicePixelRatio || 1;
      const container = map.getContainer();
      const width = Math.max(1, Math.round(container.clientWidth * dpr));
      const height = Math.max(1, Math.round(container.clientHeight * dpr));

      if (radarOverlayCanvas.width !== width || radarOverlayCanvas.height !== height) {
        radarOverlayCanvas.width = width;
        radarOverlayCanvas.height = height;
      }

      radarOverlayContext.clearRect(0, 0, width, height);
      radarOverlayContext.globalAlpha = Number(opacitySlider.value);
      radarOverlayContext.imageSmoothingEnabled = false;

      const west = radarBounds[0][1];
      const south = radarBounds[0][0];
      const east = radarBounds[1][1];
      const north = radarBounds[1][0];
      const latSpan = north - south;

      for (let strip = 0; strip < RADAR_OVERLAY_VERTICAL_STRIPS; strip += 1) {
        const t0 = strip / RADAR_OVERLAY_VERTICAL_STRIPS;
        const t1 = (strip + 1) / RADAR_OVERLAY_VERTICAL_STRIPS;
        const srcY = t0 * radarCanvas.height;
        const srcH = (t1 - t0) * radarCanvas.height;

        const stripNorth = north - t0 * latSpan;
        const stripSouth = north - t1 * latSpan;
        const nw = map.project([west, stripNorth]);
        const se = map.project([east, stripSouth]);

        radarOverlayContext.drawImage(
          radarCanvas,
          0, srcY, radarCanvas.width, srcH,
          nw.x * dpr,
          nw.y * dpr,
          (se.x - nw.x) * dpr,
          (se.y - nw.y) * dpr
        );
      }
      radarOverlayContext.globalAlpha = 1;
    }

    function drawAlertOverlay() {
      if (!map) return;

      const dpr = window.devicePixelRatio || 1;
      const container = map.getContainer();
      const width = Math.max(1, Math.round(container.clientWidth * dpr));
      const height = Math.max(1, Math.round(container.clientHeight * dpr));

      if (alertOverlayCanvas.width !== width || alertOverlayCanvas.height !== height) {
        alertOverlayCanvas.width = width;
        alertOverlayCanvas.height = height;
      }

      alertOverlayContext.clearRect(0, 0, width, height);
      if (!activeAlertFeatures.length) return;

      alertOverlayContext.lineJoin = "round";
      alertOverlayContext.lineCap = "round";

      const drawRing = (ring) => {
        if (!Array.isArray(ring) || ring.length < 2) return;
        ring.forEach((coord, index) => {
          if (!Array.isArray(coord) || coord.length < 2) return;
          const point = map.project([coord[0], coord[1]]);
          const x = point.x * dpr;
          const y = point.y * dpr;
          if (index === 0) {
            alertOverlayContext.moveTo(x, y);
          } else {
            alertOverlayContext.lineTo(x, y);
          }
        });
        alertOverlayContext.closePath();
      };

      const drawPolygon = (polygonCoordinates) => {
        if (!Array.isArray(polygonCoordinates) || !polygonCoordinates.length) return;
        alertOverlayContext.beginPath();
        polygonCoordinates.forEach(drawRing);
        alertOverlayContext.stroke();
      };

      activeAlertFeatures.forEach((feature) => {
        const properties = feature.properties || {};
        const isFallback = properties._fallbackGeometry === true;
        const visibleStorm = properties._visibleStormPolygon === true;
        const lineOpacity = visibleStorm ? 1 : (isFallback ? 0.42 : 0.55);
        const lineWidth = visibleStorm ? 3.1 : (isFallback ? 1.35 : 1.7);
        alertOverlayContext.strokeStyle = properties._alertColor || "#58b7ff";
        alertOverlayContext.globalAlpha = lineOpacity;
        alertOverlayContext.lineWidth = lineWidth * dpr;
        if (isFallback) {
          alertOverlayContext.setLineDash([4 * dpr, 3 * dpr]);
        } else {
          alertOverlayContext.setLineDash([]);
        }

        const geometry = feature.geometry;
        if (geometry?.type === "Polygon") {
          drawPolygon(geometry.coordinates);
        } else if (geometry?.type === "MultiPolygon") {
          geometry.coordinates.forEach(drawPolygon);
        }
      });
      alertOverlayContext.setLineDash([]);
      alertOverlayContext.globalAlpha = 1;
    }

    // Homepage source-of-truth event color mapping (index.html getAlertColor).
    function alertColor(eventName) {
      const event = String(eventName || "");
      if (!event) return "#58b7ff";
      if (event.includes("Tornado Emergency")) return "#ff00ff";
      if (event.includes("Tornado Watch")) return "#f000ff";
      if (event.includes("Severe Thunderstorm Watch")) return "#bd8bff";
      if (event.includes("Tornado Warning") || event.includes("Particularly Dangerous Situation")) return "#ff3b3b";
      if (event.includes("Severe Thunderstorm")) return "#ffb21c";
      if (event.includes("Flash Flood")) return "#00c4a7";
      if (event.includes("Flood")) return "#00aa08";
      if (event.includes("Winter Storm")) return "#df74d7";
      if (event.includes("Winter Weather")) return "#ab7cff";
      if (event.includes("Freeze")) return "#6edce4";
      if (event.includes("Frost")) return "#4e8de6";
      if (event.includes("Blizzard")) return "#748cff";
      if (event.includes("Red Flag") || event.includes("Fire Weather")) return "#ff5d00";
      return "#58b7ff";
    }

    function compactAlertSummary(props) {
      const eventName = String(props?.event || "");
      if (eventName.includes("Flash Flood")) return "Flash flooding possible.";
      if (eventName.includes("Tornado")) return "Take shelter immediately.";
      if (eventName.includes("Severe Thunderstorm")) return "Damaging winds and hail possible.";
      if (eventName.includes("Special Marine")) return "Hazardous marine conditions possible.";
      const headline = String(props?.headline || "").trim();
      if (!headline) return "Active weather alert.";
      return headline.length > 84 ? `${headline.slice(0, 84).trim()}...` : headline;
    }
    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }
    function formatPopupExpires(value) {
      if (!value) return "Unknown";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function alertValue(value) {
      const text = String(value || "").trim();
      return text || "N/A";
    }

    function isVisibleStormPolygon(eventName) {
      const event = String(eventName || "");
      return (
        event === "Tornado Warning" ||
        event === "Severe Thunderstorm Warning" ||
        event === "Flash Flood Warning" ||
        event === "Special Marine Warning"
      );
    }

    function addAlertLayers() {
      map.addSource(ALERT_SOURCE_ID, { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      // Transparent fill hitbox keeps polygon interiors clickable while visible outlines are drawn on alertOverlayCanvas.
      map.addLayer({
        id: ALERT_FILL_LAYER_ID,
        type: "fill",
        source: ALERT_SOURCE_ID,
        paint: {
          "fill-color": ["to-color", ["coalesce", ["get", "_alertColor"], "#58b7ff"]],
          "fill-opacity": 0
        }
      });
      map.addLayer({
        id: ALERT_LINE_LAYER_ID,
        type: "line",
        source: ALERT_SOURCE_ID,
        filter: ["==", ["get", "_visibleStormPolygon"], true],
        paint: {
          "line-color": ["to-color", ["coalesce", ["get", "_alertColor"], "#58b7ff"]],
          "line-opacity": 0,
          "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.5, 8, 2.8]
        }
      });
      map.moveLayer(ALERT_FILL_LAYER_ID);
      map.moveLayer(ALERT_LINE_LAYER_ID);

      const onInteract = (event) => {
        const feature = event?.features?.[0];
        if (!feature) return;
        const props = feature.properties || {};
        const eventName = props.event || "Unknown Event";
        const alertHex = props._alertColor || alertColor(eventName);
        const expires = formatPopupExpires(props.expires || props.ends);
        const summary = compactAlertSummary(props);
        const html = `
          <div class="level2-alert-popup-wrap" style="--alert-color:${escapeHtml(alertHex)};">
            <div class="level2-popup-details">
              <div class="alert-detail-card">
                <div class="alert-detail-headline">${escapeHtml(alertValue(props.headline || summary))}</div>
                <div class="alert-detail-metrics">
                  <div class="alert-detail-metric">
                    <div class="alert-detail-metric-label">Event</div>
                    <div class="alert-detail-metric-value">${escapeHtml(alertValue(eventName))}</div>
                  </div>
                  <div class="alert-detail-metric">
                    <div class="alert-detail-metric-label">Severity</div>
                    <div class="alert-detail-metric-value">${escapeHtml(alertValue(props.severity))}</div>
                  </div>
                  <div class="alert-detail-metric">
                    <div class="alert-detail-metric-label">Source</div>
                    <div class="alert-detail-metric-value">${escapeHtml(alertValue(props.senderName || "National Weather Service"))}</div>
                  </div>
                  <div class="alert-detail-metric">
                    <div class="alert-detail-metric-label">Expires</div>
                    <div class="alert-detail-metric-value">${escapeHtml(alertValue(expires))}</div>
                  </div>
                </div>
                <section class="alert-detail-section">
                  <div class="alert-detail-section-title">Area</div>
                  <div class="alert-detail-text">${escapeHtml(alertValue(props.areaDesc))}</div>
                </section>
                <section class="alert-detail-section">
                  <div class="alert-detail-section-title">Description</div>
                  <div class="alert-detail-text">${escapeHtml(alertValue(props.description || summary))}</div>
                </section>
                ${props.instruction ? `
                <section class="alert-detail-section">
                  <div class="alert-detail-section-title">Instruction</div>
                  <div class="alert-detail-text">${escapeHtml(props.instruction)}</div>
                </section>` : ""}
              </div>
            </div>
            <div class="omega-alert-popup">
              <div class="omega-alert-stack">
                <div class="omega-alert-card">
                  <div class="omega-alert-header"><span class="omega-alert-title">${escapeHtml(eventName)}</span></div>
                  <div class="omega-alert-body">
                    <div class="omega-alert-summary-row">
                      <div class="omega-alert-headline">${escapeHtml(summary)}</div>
                      <div class="omega-alert-actions">
                        <button class="omega-alert-icon-btn omega-alert-details-btn" type="button" aria-expanded="false" title="Details">></button>
                      </div>
                    </div>
                    <div class="omega-alert-expires">Expires: ${escapeHtml(expires)}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
        if (popup) popup.remove();
        popup = new mapboxgl.Popup({ className: "level2-alert-popup", closeButton: true, closeOnClick: true, maxWidth: "360px" })
          .setLngLat(event.lngLat)
          .setHTML(html)
          .addTo(map);
        const popupEl = popup.getElement();
        const detailsButton = popupEl?.querySelector(".omega-alert-details-btn");
        const detailCard = popupEl?.querySelector(".level2-popup-details");
        detailsButton?.addEventListener("click", (clickEvent) => {
          clickEvent.preventDefault();
          clickEvent.stopPropagation();
          if (!detailCard) return;
          const open = detailCard.classList.toggle("is-open");
          detailsButton.setAttribute("aria-expanded", String(open));
          detailsButton.textContent = open ? "×" : ">";
        });
      };
      map.on("mouseenter", ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("mouseenter", ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("click", ALERT_FILL_LAYER_ID, onInteract);
      map.on("click", ALERT_LINE_LAYER_ID, onInteract);
      map.on("touchstart", ALERT_FILL_LAYER_ID, onInteract);
      map.on("touchstart", ALERT_LINE_LAYER_ID, onInteract);
    }

    function addRadarSiteLabels() {
      const sites = {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { id: "KFCX" }, geometry: { type: "Point", coordinates: [-80.273, 37.024] } },
          { type: "Feature", properties: { id: "KRAX" }, geometry: { type: "Point", coordinates: [-78.49, 35.665] } },
          { type: "Feature", properties: { id: "KGSP" }, geometry: { type: "Point", coordinates: [-82.22, 34.883] } },
          { type: "Feature", properties: { id: "KLTX" }, geometry: { type: "Point", coordinates: [-78.429, 33.989] } },
          { type: "Feature", properties: { id: "KMHX" }, geometry: { type: "Point", coordinates: [-76.877, 34.775] } },
          { type: "Feature", properties: { id: "KAKQ" }, geometry: { type: "Point", coordinates: [-77.007, 36.983] } }
        ]
      };

      map.addSource(SITE_SOURCE_ID, { type: "geojson", data: sites });
      map.addLayer({ id: SITE_CIRCLE_LAYER_ID, type: "circle", source: SITE_SOURCE_ID, paint: { "circle-radius": 16, "circle-color": "#0b1f3f", "circle-opacity": 0.96, "circle-stroke-color": "rgba(148,163,184,0.72)", "circle-stroke-width": 1 } });
      map.addLayer({ id: SITE_LABEL_LAYER_ID, type: "symbol", source: SITE_SOURCE_ID, layout: { "text-field": ["get", "id"], "text-size": 10, "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"], "text-allow-overlap": true, "text-ignore-placement": true }, paint: { "text-color": "#ffffff" } });
    }

    function isValidGeometry(geometry) {
      if (!geometry || typeof geometry !== "object") return false;
      if (geometry.type === "Polygon") return Array.isArray(geometry.coordinates) && geometry.coordinates.length > 0;
      if (geometry.type === "MultiPolygon") return Array.isArray(geometry.coordinates) && geometry.coordinates.length > 0;
      return false;
    }

    function normalizeAlertFeature(feature, index) {
      const properties = feature.properties || {};
      const alertId = String(feature.id || properties.id || `${properties.event || "alert"}-${index}`);
      return {
        ...feature,
        id: alertId,
        properties: {
          ...properties,
          _alertId: alertId,
          _alertColor: alertColor(properties.event || ""),
          _visibleStormPolygon: isVisibleStormPolygon(properties.event || "")
        }
      };
    }

    function dedupeAlertFeaturesById(features) {
      const seen = new Set();
      return features.filter((feature) => {
        const alertId = feature.properties?._alertId || feature.id;
        if (!alertId || seen.has(alertId)) return false;
        seen.add(alertId);
        return true;
      });
    }

    function polygonCoordinatesFromGeometry(geometry) {
      if (geometry?.type === "Polygon" && Array.isArray(geometry.coordinates)) return [geometry.coordinates];
      if (geometry?.type === "MultiPolygon" && Array.isArray(geometry.coordinates)) return geometry.coordinates;
      return [];
    }

    async function fetchAffectedZoneGeometry(zoneUrl) {
      try {
        const response = await fetch(zoneUrl, { headers: { Accept: "application/geo+json" }, cache: "no-cache" });
        if (!response.ok) {
          return { zoneUrl, ok: false, status: response.status, geometry: null };
        }
        const zone = await response.json();
        return { zoneUrl, ok: true, status: response.status, geometry: zone?.geometry || null };
      } catch (_error) {
        return { zoneUrl, ok: false, status: "", geometry: null };
      }
    }

    async function fallbackFeaturesFromAffectedZones(feature) {
      const affectedZones = Array.isArray(feature.properties?.affectedZones) ? feature.properties.affectedZones : [];
      const zoneUrls = [...new Set(affectedZones.filter(Boolean))];
      if (!zoneUrls.length) return { fallbackFeatures: [] };

      const zoneResults = await Promise.allSettled(zoneUrls.map(fetchAffectedZoneGeometry));
      const zoneFetches = zoneResults.map((result, index) => result.status === "fulfilled"
        ? result.value
        : { zoneUrl: zoneUrls[index], ok: false, status: "", geometry: null });
      const seenZoneGeometry = new Set();
      const fallbackFeatures = zoneFetches
        .filter((zoneResult) => zoneResult.ok && polygonCoordinatesFromGeometry(zoneResult.geometry).length)
        .filter((zoneResult) => {
          const key = JSON.stringify(zoneResult.geometry);
          if (seenZoneGeometry.has(key)) return false;
          seenZoneGeometry.add(key);
          return true;
        })
        .map((zoneResult, index) => ({
          ...feature,
          id: `${feature.id}-zone-fallback-${index}`,
          geometry: zoneResult.geometry,
          properties: {
            ...feature.properties,
            _fallbackGeometry: true,
            _fallbackZoneUrl: zoneResult.zoneUrl
          }
        }));

      return { fallbackFeatures };
    }

    async function resolveFallbackAlertGeometries(featuresWithoutGeometry) {
      const results = await Promise.all(
        featuresWithoutGeometry.map(async (feature) => {
          const result = await fallbackFeaturesFromAffectedZones(feature).catch(() => ({ fallbackFeatures: [] }));
          return { original: feature, ...result };
        })
      );
      return {
        fallbackFeatures: results.flatMap((result) => result.fallbackFeatures),
        listedOnlyFeatures: results.filter((result) => !result.fallbackFeatures.length).map((result) => result.original)
      };
    }

    function nwsAlertsUrlForArea(area) {
      return `https://api.weather.gov/alerts/active?area=${encodeURIComponent(area)}`;
    }

    async function fetchNwsAlertsForAreas() {
      const areaResults = await Promise.allSettled(
        NWS_ALERT_AREAS.map(async (area) => {
          const response = await fetch(nwsAlertsUrlForArea(area), { headers: { Accept: "application/geo+json" }, cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const collection = await response.json();
          return Array.isArray(collection.features) ? collection.features : [];
        })
      );
      const allFeatures = [];
      areaResults.forEach((result) => {
        if (result.status === "fulfilled") allFeatures.push(...result.value);
      });
      const seenAlertIds = new Set();
      const deduped = [];
      allFeatures.forEach((feature, index) => {
        const alertId = String(feature?.id || feature?.properties?.id || `unknown-alert-${index}`);
        if (seenAlertIds.has(alertId)) return;
        seenAlertIds.add(alertId);
        deduped.push(feature);
      });
      return deduped;
    }

    async function loadAlerts() {
      const fetchedFeatures = await fetchNwsAlertsForAreas();
      const normalizedFetchedFeatures = fetchedFeatures.map(normalizeAlertFeature);
      const featuresWithGeometry = dedupeAlertFeaturesById(
        normalizedFetchedFeatures.filter((feature) => isValidGeometry(feature.geometry))
      );
      const directGeometryAlertIds = new Set(
        featuresWithGeometry.map((feature) => feature.properties?._alertId)
      );
      const normalizedFeaturesWithoutGeometry = dedupeAlertFeaturesById(
        normalizedFetchedFeatures.filter((feature) =>
          !isValidGeometry(feature.geometry) &&
          !directGeometryAlertIds.has(feature.properties?._alertId)
        )
      );
      const { fallbackFeatures, listedOnlyFeatures } = await resolveFallbackAlertGeometries(normalizedFeaturesWithoutGeometry);

      activeAlertFeatures = [...featuresWithGeometry, ...fallbackFeatures];
      activeAlertsWithoutGeometry = listedOnlyFeatures;
      map.getSource(ALERT_SOURCE_ID).setData({ type: "FeatureCollection", features: activeAlertFeatures });
      map.moveLayer(ALERT_FILL_LAYER_ID);
      map.moveLayer(ALERT_LINE_LAYER_ID);
      drawAlertOverlay();
      const stormCount = activeAlertFeatures.filter((feature) => feature.properties?._visibleStormPolygon === true).length;
      const fallbackCount = activeAlertFeatures.filter((feature) => feature.properties?._fallbackGeometry === true).length;
      alertsStatusRow.textContent = `Alerts: ${fetchedFeatures.length} active · ${stormCount} storm polygons · ${fallbackCount} zone fallback · ${activeAlertsWithoutGeometry.length} listed only`;
    }

    function initializeMap() {
      if (!MAPBOX_TOKEN || !String(MAPBOX_TOKEN).startsWith("pk.")) {
        statusRow.textContent = "Renderer status: missing Mapbox token";
        return;
      }

      mapboxgl.accessToken = MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: "map",
        style: MAPBOX_STYLE,
        center: [-80.5, 37.43],
        zoom: 4.92,
        projection: "mercator",
        renderWorldCopies: false,
        bearing: 0,
        pitch: 0,
        pitchWithRotate: false,
        attributionControl: true
      });
      window.zachLevel2RadarMap = map;

      map.addControl(new mapboxgl.NavigationControl(), "top-left");
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      if (map.setMaxPitch) map.setMaxPitch(0);
      map.on("rotate", lockOrientation);
      map.on("pitch", lockOrientation);
      map.on("move", () => {
        redrawRadarOverlay();
        drawAlertOverlay();
      });
      map.on("zoom", () => {
        redrawRadarOverlay();
        drawAlertOverlay();
      });
      map.on("resize", () => {
        redrawRadarOverlay();
        drawAlertOverlay();
      });

      map.on("load", async () => {
        try {
          addAlertLayers();
          addRadarSiteLabels();
          setStatusText("loading frame list");
          await refreshLevel2Frames();
          currentFrameIndex = Math.max(0, level2Frames.length - 1);
          await Promise.all([renderCurrentFrame(), loadAlerts()]);
          startFrameRefresh();
          if (level2Frames.length >= 2) {
            startPlayback();
          }
        } catch (error) {
          const message = error?.message || "error";
          statusRow.textContent = `Renderer status: failed: ${message}`;
          errorPanel.style.display = "block";
          errorPanel.textContent = `Level II renderer failed: ${message}`;
        }
      });
    }

    function setStatusText(text) {
      statusRow.textContent = `Renderer status: ${text}`;
    }

    previousFrameButton.addEventListener("click", async () => {
      stopPlayback();
      await stepFrame(-1);
    });
    nextFrameButton.addEventListener("click", async () => {
      stopPlayback();
      await stepFrame(1);
    });
    playPauseButton.addEventListener("click", togglePlayback);
    opacitySlider.addEventListener("input", updateOpacity);
    updateOpacity();
    updatePlaybackButton();
    updateFrameInfoRow();
    initializeMap();
  </script>
</body>
</html>
