    function colorForDbz(dbz) {
      if (!Number.isFinite(dbz) || dbz < DISPLAY_MIN_DBZ) return { r: 0, g: 0, b: 0, a: 0 };
      if (FORCE_DEBUG_RADAR_COLORS) {
        if (dbz < 10) return { r: 0, g: 255, b: 255, a: 255 };
        if (dbz < 20) return { r: 0, g: 255, b: 0, a: 255 };
        if (dbz < 35) return { r: 255, g: 255, b: 0, a: 255 };
        return { r: 255, g: 0, b: 255, a: 255 };
      }
      const stops = RADAR_DBZ_PALETTE_NORMALIZED;
      if (!Array.isArray(stops) || stops.length === 0) return { r: 0, g: 0, b: 0, a: 0 };
      if (dbz <= stops[0].v) return { r: stops[0].r, g: stops[0].g, b: stops[0].b, a: stops[0].a };
      if (dbz >= stops[stops.length - 1].v) {
        const last = stops[stops.length - 1];
        return { r: last.r, g: last.g, b: last.b, a: last.a };
      }
      if (USE_STEPPED_REFLECTIVITY_PALETTE) {
        for (let i = stops.length - 1; i >= 0; i -= 1) {
          const stop = stops[i];
          if (dbz >= stop.v) {
            return {
              r: stop.r,
              g: stop.g,
              b: stop.b,
              a: stop.a
            };
          }
        }
      }
      for (let i = 0; i < stops.length - 1; i += 1) {
        const lower = stops[i];
        const upper = stops[i + 1];
        if (dbz >= lower.v && dbz <= upper.v) {
          const span = upper.v - lower.v;
          const t = span === 0 ? 0 : (dbz - lower.v) / span;
          const r = Math.round(lower.r + (upper.r - lower.r) * t);
          const g = Math.round(lower.g + (upper.g - lower.g) * t);
          const b = Math.round(lower.b + (upper.b - lower.b) * t);
          const alpha = Math.round(lower.a + (upper.a - lower.a) * t);
          return {
            r,
            g,
            b,
            a: alpha
          };
        }
      }
      return { r: 0, g: 0, b: 0, a: 0 };
    }

    function opacityMultiplierForDbz(dbz) {
      if (!Number.isFinite(dbz) || !LOW_DBZ_OPACITY_TAPER.length) return 1;
      const points = LOW_DBZ_OPACITY_TAPER;
      if (dbz <= points[0].dbz) return points[0].opacity;
      if (dbz >= points[points.length - 1].dbz) return points[points.length - 1].opacity;
      for (let i = 0; i < points.length - 1; i += 1) {
        const lower = points[i];
        const upper = points[i + 1];
        if (dbz >= lower.dbz && dbz <= upper.dbz) {
          const span = upper.dbz - lower.dbz;
          const t = span === 0 ? 0 : (dbz - lower.dbz) / span;
          return lower.opacity + (upper.opacity - lower.opacity) * t;
        }
      }
      return 1;
    }

    async function fetchLatestLevel2Frame() {
      const response = await fetch(level2MetaUrl(), { cache: "no-store" });
      if (!response.ok) throw new Error(`metadata fetch failed (${response.status})`);
      const meta = await response.json();
      return normalizeLevel2Frame(meta);
    }

    async function fetchLevel2FramesCatalog() {
      const response = await fetch(minuteCacheBustUrl(level2FramesUrl()), { cache: "no-store" });
      if (!response.ok) throw new Error(`frames catalog fetch failed (${response.status})`);
      const payload = await response.json();
      const rawFrames = Array.isArray(payload?.frames) ? payload.frames : [];
      return rawFrames.map(normalizeLevel2Frame).filter(Boolean);
    }

    function currentFrame() {
      return level2Frames[currentFrameIndex] || null;
    }

    async function buildLevel2RenderedSurface(frame = currentFrame(), options = {}) {
      try {
        try {
          RADAR_DBZ_PALETTE_NORMALIZED = normalizeRadarPalette(RADAR_DBZ_PALETTE);
        } catch (error) {
          throw new Error(`Palette normalization failed: ${error?.message || "unknown error"}`);
        }

        const shouldLog = options.logDiagnostics !== false;

        if (shouldLog && !paletteLogPrinted) {
          console.log("Normalized Level II palette:", RADAR_DBZ_PALETTE_NORMALIZED);
          paletteLogPrinted = true;
        }

        if (shouldLog && !colorizerSmokeLogged) {
          console.log("Colorizer smoke test:", {
            minus10: colorForDbz(-10),
            zero: colorForDbz(0),
            ten: colorForDbz(10),
            thirtyFive: colorForDbz(35)
          });
          colorizerSmokeLogged = true;
        }

        const tifPath = frame?.path || level2DataUrl(FALLBACK_LEVEL2_TIF);
        const tifFetchUrl = new URL(tifPath, window.location.href);
        tifFetchUrl.searchParams.set("cb", String(Date.now()));
        const response = await fetch(tifFetchUrl.toString(), { cache: "no-store" });
        if (!response.ok) {
          const error = new Error(`GeoTIFF fetch failed: ${response.status} ${response.statusText} (${tifPath})`);
          error.status = response.status;
          error.path = tifPath;
          throw error;
        }

        const buffer = await response.arrayBuffer();
        const tiff = await GeoTIFF.fromArrayBuffer(buffer);
        const image = await tiff.getImage();

        const sourceWidth = image.getWidth();
        const sourceHeight = image.getHeight();
        const scale = isMobileLevel2Mode() ? MOBILE_LEVEL2_RASTER_SCALE : 1;
        const width = Math.max(1, Math.round(sourceWidth * scale));
        const height = Math.max(1, Math.round(sourceHeight * scale));

        const nodataRaw = image.getGDALNoData();
        const nodata = Number.isFinite(Number(nodataRaw)) ? Number(nodataRaw) : NODATA_DEFAULT;

        const dbz = await image.readRasters({
          samples: [0],
          interleave: true,
          width,
          height
        });

        if (!dbz || dbz.length !== width * height) {
          throw new Error(`invalid raster length (${dbz ? dbz.length : "none"}), expected ${width * height}`);
        }

        const targetCanvas = options.canvas || document.createElement("canvas");
        const targetContext = options.context || targetCanvas.getContext("2d", { willReadFrequently: true });

        targetCanvas.width = width;
        targetCanvas.height = height;

        const imageData = targetContext.createImageData(width, height);
        const data = imageData.data;
        data.fill(0);

        const weakMask = new Uint8Array(width * height);
        const validMask = new Uint8Array(width * height);

        let belowDisplayMin = 0;
        let negativeVisible = 0;
        let zeroToFive = 0;
        let fiveToFifteen = 0;
        let fifteenToThirty = 0;
        let thirtyPlus = 0;
        let colored = 0;
        let transparent = 0;

        for (let i = 0, p = 0; i < dbz.length; i += 1, p += 4) {
          const value = dbz[i];
          const isNoData = !Number.isFinite(value) || value === nodata;

          if (isNoData || value < DISPLAY_MIN_DBZ) {
            if (!isNoData) belowDisplayMin += 1;
            data[p] = 0;
            data[p + 1] = 0;
            data[p + 2] = 0;
            data[p + 3] = 0;
            transparent += 1;
            continue;
          }

          validMask[i] = 1;
          if (ENABLE_WEAK_DESPECKLE && value >= 0 && value < 8) weakMask[i] = 1;

          if (value < 0) negativeVisible += 1;
          else if (value < 5) zeroToFive += 1;
          else if (value < 15) fiveToFifteen += 1;
          else if (value < 30) fifteenToThirty += 1;
          else thirtyPlus += 1;

          const color = colorForDbz(value);
          const baseAlpha = color.a;
          const taperOpacity = opacityMultiplierForDbz(value);
          const finalAlpha = Math.max(0, Math.min(255, Math.round(baseAlpha * taperOpacity)));

          data[p] = color.r;
          data[p + 1] = color.g;
          data[p + 2] = color.b;
          data[p + 3] = finalAlpha;

          if (finalAlpha > 0) colored += 1;
          else transparent += 1;
        }

        if (ENABLE_WEAK_DESPECKLE) {
          for (let y = 1; y < height - 1; y += 1) {
            for (let x = 1; x < width - 1; x += 1) {
              const idx = y * width + x;
              if (!weakMask[idx]) continue;

              let neighbors = 0;
              for (let oy = -1; oy <= 1; oy += 1) {
                for (let ox = -1; ox <= 1; ox += 1) {
                  if (ox === 0 && oy === 0) continue;
                  const nIdx = (y + oy) * width + (x + ox);
                  if (validMask[nIdx]) neighbors += 1;
                }
              }

              if (neighbors === 0) {
                const p = idx * 4;
                if (data[p + 3] > 0) {
                  data[p] = 0;
                  data[p + 1] = 0;
                  data[p + 2] = 0;
                  data[p + 3] = 0;
                  colored = Math.max(0, colored - 1);
                  transparent += 1;
                }
              }
            }
          }
        }

        let blackPixelsClearedBySafetyPass = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 0 && data[i + 3] > 0) {
            data[i + 3] = 0;
            blackPixelsClearedBySafetyPass += 1;
            colored = Math.max(0, colored - 1);
            transparent += 1;
          }
        }

        targetContext.putImageData(imageData, 0, 0);

        if (shouldLog) {
          console.log("Level II dBZ renderer diagnostics:", {
            paletteSourceFileFound: PALETTE_SOURCE_FILE,
            displayMinDbz: DISPLAY_MIN_DBZ,
            sourceWidth,
            sourceHeight,
            renderedWidth: width,
            renderedHeight: height,
            mobileScale: scale,
            belowDisplayMin,
            negativeVisible,
            zeroToFive,
            fiveToFifteen,
            fifteenToThirty,
            thirtyPlus,
            colored,
            transparent,
            blackPixelsClearedBySafetyPass
          });
        }

        return {
          canvas: targetCanvas,
          width,
          height,
          bounds: frame?.bounds || radarBounds,
          path: tifPath,
          validTime: frame?.validTime || ""
        };
      } catch (error) {
        throw error;
      }
    }

    async function renderLevel2DbzUncached(frame = currentFrame()) {
      try {
        if (frame?.bounds) {
          radarBounds = frame.bounds;
        }

        frameReadout.textContent = `Radar: updated ${frame?.validTime || "Unknown"}`;
        updateFrameInfoRow();

        const surface = await buildLevel2RenderedSurface(frame, {
          canvas: radarCanvas,
          context: radarContext,
          logDiagnostics: true
        });
        radarImageRevision += 1;

        radarBounds = surface.bounds || radarBounds;

        const validText = frame?.validTime ? new Date(frame.validTime).toLocaleString() : "unknown";
        if (typeof validTimeRow !== "undefined" && validTimeRow) {
          validTimeRow.textContent = `Valid time: ${validText}`;
        }
        if (typeof sourceRow !== "undefined" && sourceRow) {
          sourceRow.textContent = `Radar source: ${frame?.path || surface.path}`;
        }
        statusText.textContent = `Radar frame loaded: ${selectedLevel2Site()} ${LEVEL2_PRODUCT}`;

        updateFrameInfoRow();
        syncFrameSelect();
        redrawRadarOverlay();
        return frame;
      } catch (error) {
        if (error?.status !== 404) {
          console.error("Level II render failed", error);
        }
        throw error;
      }
    }

    function isMobileLevel2Mode() {
      return window.matchMedia("(max-width: 760px)").matches;
    }

    function level2RenderCacheLimit() {
      return isMobileLevel2Mode() ? MOBILE_LEVEL2_RENDER_CACHE_LIMIT : DESKTOP_LEVEL2_RENDER_CACHE_LIMIT;
    }

    function level2FrameCacheKey(frame) {
      return frame?.path || "";
    }

    function clampCurrentFrameIndex() {
      if (!level2Frames.length) {
        currentFrameIndex = 0;
        return;
      }
      currentFrameIndex = Math.max(0, Math.min(currentFrameIndex, level2Frames.length - 1));
    }

    function pruneRenderedFrameCache() {
      const limit = level2RenderCacheLimit();
      const validPaths = new Set(level2Frames.map((frame) => frame.path).filter(Boolean));
      const currentKey = level2FrameCacheKey(currentFrame());

      for (const key of Array.from(renderedFrameCache.keys())) {
        if (!validPaths.has(key)) renderedFrameCache.delete(key);
      }

      for (const key of Array.from(renderedFrameCache.keys())) {
        if (renderedFrameCache.size <= limit) break;
        if (key !== currentKey) renderedFrameCache.delete(key);
      }
    }

    function applyRenderedFrameCache(frame, cachedFrame) {
      if (!frame || !cachedFrame?.canvas) return false;

      radarCanvas.width = cachedFrame.width;
      radarCanvas.height = cachedFrame.height;
      radarContext.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
      radarContext.drawImage(cachedFrame.canvas, 0, 0);
      radarImageRevision += 1;

      radarBounds = cachedFrame.bounds || frame.bounds || radarBounds;

      const validText = frame.validTime ? new Date(frame.validTime).toLocaleString() : "unknown";
      if (typeof validTimeRow !== "undefined" && validTimeRow) {
        validTimeRow.textContent = `Valid time: ${validText}`;
      }
      if (typeof sourceRow !== "undefined" && sourceRow) {
        sourceRow.textContent = `Radar source: ${frame.path}`;
      }
      setStatusText("cached frame loaded");
      updateFrameInfoRow();
      syncFrameSelect();
      redrawRadarOverlay();

      return true;
    }

    async function renderLevel2Dbz(frame = currentFrame()) {
      let selectedFrame = frame;
      let cacheKey = level2FrameCacheKey(selectedFrame);

      if (cacheKey && renderedFrameCache.has(cacheKey)) {
        const cachedFrame = renderedFrameCache.get(cacheKey);
        renderedFrameCache.delete(cacheKey);
        renderedFrameCache.set(cacheKey, cachedFrame);
        applyRenderedFrameCache(selectedFrame, cachedFrame);
        return "cache";
      }

      for (;;) {
        try {
          selectedFrame = await renderLevel2DbzUncached(selectedFrame);
          cacheKey = level2FrameCacheKey(selectedFrame);
          break;
        } catch (error) {
          if (error?.status === 404) {
            const stalePath = error.path || selectedFrame?.path || "";
            const pruneResult = pruneStaleLevel2Frame(stalePath, { allowRemoveCurrent: true });
            if (pruneResult.removed && level2Frames.length > 0) {
              setStatusText("stale frame pruned after 404; rendering nearest available frame");
              selectedFrame = currentFrame();
              cacheKey = level2FrameCacheKey(selectedFrame);
              continue;
            }
            if (level2Frames.length === 0) {
              errorPanel.style.display = "block";
              errorPanel.textContent = "Level II renderer failed: no frames remain after removing stale frame(s).";
              throw new Error("No Level II frames remain after removing stale frame(s).");
            }
          }
          throw error;
        }
      }

      if (cacheKey && radarCanvas.width > 0 && radarCanvas.height > 0) {
        const cachedCanvas = document.createElement("canvas");
        cachedCanvas.width = radarCanvas.width;
        cachedCanvas.height = radarCanvas.height;

        const cachedContext = cachedCanvas.getContext("2d");
        cachedContext.drawImage(radarCanvas, 0, 0);

        renderedFrameCache.set(cacheKey, {
          canvas: cachedCanvas,
          width: radarCanvas.width,
          height: radarCanvas.height,
          bounds: selectedFrame?.bounds || radarBounds
        });

        pruneRenderedFrameCache();
      }

      updateFrameInfoRow();
      syncFrameSelect();
      return "rendered";
    }


    function storeRenderedFrameSurface(frame, surface) {
      const cacheKey = level2FrameCacheKey(frame);
      if (!cacheKey || !surface?.canvas) return;

      renderedFrameCache.set(cacheKey, {
        canvas: surface.canvas,
        width: surface.width,
        height: surface.height,
        bounds: surface.bounds || frame.bounds || radarBounds
      });

      pruneRenderedFrameCache();
    }

    function buildLevel2WarmOrder(startIndex = currentFrameIndex) {
      const order = [];
      if (!level2Frames.length) return order;

      if (isMobileLevel2Mode()) {
        const mobileOffsets = [1, -1, 2, -2];
        for (const offset of mobileOffsets) {
          const index = (startIndex + offset + level2Frames.length) % level2Frames.length;
          if (!order.includes(index) && index !== startIndex) {
            order.push(index);
          }
        }
        return order;
      }

      for (let offset = 1; offset < level2Frames.length; offset += 1) {
        order.push((startIndex + offset) % level2Frames.length);
      }

      return order;
    }

    function scheduleLevel2FrameWarmup(options = {}) {
      if (!level2Frames.length) return;

      if (level2WarmupTimer !== null) {
        window.clearTimeout(level2WarmupTimer);
        level2WarmupTimer = null;
      }

      const startIndex = Number.isFinite(options.aroundIndex) ? options.aroundIndex : currentFrameIndex;
      const delayMs = Number.isFinite(options.delayMs) ? options.delayMs : 700;
      const token = ++level2WarmupToken;
      const order = buildLevel2WarmOrder(startIndex);
      let cursor = 0;

      const tick = async () => {
        if (token !== level2WarmupToken) return;

        while (cursor < order.length) {
          const frame = level2Frames[order[cursor]];
          const key = level2FrameCacheKey(frame);

          if (key && !renderedFrameCache.has(key)) break;
          cursor += 1;
        }

        if (cursor >= order.length) return;

        if (level2WarmupBusy || (isMobileLevel2Mode() && isMapInteracting)) {
          level2WarmupTimer = window.setTimeout(tick, 650);
          return;
        }

        const frameIndex = order[cursor];
        const frame = level2Frames[frameIndex];
        cursor += 1;

        try {
          level2WarmupBusy = true;
          const surface = await buildLevel2RenderedSurface(frame, { logDiagnostics: false });

          if (token === level2WarmupToken) {
            storeRenderedFrameSurface(frame, surface);
            setStatusText(`warming frame cache ${renderedFrameCache.size}/${level2Frames.length}`);
          }
        } catch (error) {
          if (error?.status === 404) {
            const missingPath = error.path || frame?.path || "";
            if (missingPath && !warmupMissingFrameWarned.has(missingPath)) {
              warmupMissingFrameWarned.add(missingPath);
              console.warn(`Level II warm cache missing frame (404): ${missingPath}`);
            }
            pruneStaleLevel2Frame(missingPath, { allowRemoveCurrent: false });
          } else {
            console.warn("Level II warm cache failed", error);
          }
        } finally {
          level2WarmupBusy = false;
        }

        if (token !== level2WarmupToken) return;

        const nextDelay = isMobileLevel2Mode() ? 850 : 220;
        level2WarmupTimer = window.setTimeout(tick, nextDelay);
      };

      level2WarmupTimer = window.setTimeout(tick, delayMs);
    }

    async function refreshLevel2Frames() {
      const wasAtLatest = currentFrameIndex === Math.max(0, level2Frames.length - 1);
      const previousLatestPath = level2Frames[level2Frames.length - 1]?.path || "";
      try {
        const catalogFrames = await fetchLevel2FramesCatalog();
        if (catalogFrames.length > 0) {
          level2Frames = catalogFrames.sort((a, b) => {
            const aTime = Number.isFinite(a.validTimeDate?.getTime?.()) ? a.validTimeDate.getTime() : 0;
            const bTime = Number.isFinite(b.validTimeDate?.getTime?.()) ? b.validTimeDate.getTime() : 0;
            return aTime - bTime;
          });
          if (isMobileLevel2Mode() && level2Frames.length > 15) {
            level2Frames = level2Frames.slice(-15);
          }
        } else {
          const latestFrame = await fetchLatestLevel2Frame();
          if (latestFrame) upsertLevel2Frame(latestFrame);
        }
      } catch (_error) {
        try {
          const latestFrame = await fetchLatestLevel2Frame();
          if (latestFrame) upsertLevel2Frame(latestFrame);
        } catch (_latestError) {
          if (level2Frames.length === 0) {
            upsertLevel2Frame({
              path: level2DataUrl(FALLBACK_LEVEL2_TIF),
              validTime: "",
              validTimeDate: new Date(""),
              bounds: radarBounds
            });
          }
        }
      }
      if (level2Frames.length === 0) return false;

      if (wasAtLatest) {
        currentFrameIndex = level2Frames.length - 1;
      } else {
        currentFrameIndex = Math.max(0, Math.min(currentFrameIndex, level2Frames.length - 1));
      }
      syncFrameSelect();
      updateFrameInfoRow();
      return previousLatestPath !== (level2Frames[level2Frames.length - 1]?.path || "");
    }

    async function renderCurrentFrame() {
      const frame = currentFrame();
      if (!frame) return null;

      const renderMode = await renderLevel2Dbz(frame);

      scheduleLevel2FrameWarmup({
        aroundIndex: currentFrameIndex,
        delayMs: isPlaying ? 1200 : 650
      });

      return renderMode;
    }

    async function stepFrame(direction) {
      if (!level2Frames.length) return;
      currentFrameIndex = (currentFrameIndex + direction + level2Frames.length) % level2Frames.length;
      await renderCurrentFrame();
    }

    function stopPlayback() {
      clearPlaybackTimer();
      isPlaying = false;
      updatePlaybackButton();
    }

    async function playbackTick() {
      if (!isPlaying) return;
      if (level2Frames.length > 1) {
        await stepFrame(1);
      }
      if (!isPlaying) return;
      clearPlaybackTimer();
      playbackTimer = window.setTimeout(playbackTick, playbackIntervalMs);
    }

    function startPlayback(options = {}) {
      const userRequested = options && options.userRequested === true;
      if (!userRequested && !playbackWasUserRequested) return;
      if (isPlaying || level2Frames.length < 2) return;
      playbackWasUserRequested = true;
      isPlaying = true;
      updatePlaybackButton();
      clearPlaybackTimer();
      playbackTimer = window.setTimeout(playbackTick, playbackIntervalMs);
    }

    function togglePlayback() {
      if (isPlaying) {
        stopPlayback();
      } else {
        startPlayback({ userRequested: true });
      }
    }

    async function changeLevel2Site(site) {
      const nextSite = sanitizeLevel2Site(site);
      if (siteSelect) siteSelect.value = nextSite;
      stopPlayback();
      renderedFrameCache.clear();
      level2Frames = [];
      currentFrameIndex = 0;
      syncFrameSelect();
      updateFrameInfoRow();

      if (radarCanvas.width && radarCanvas.height) {
        radarContext.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
      }
      radarImageRevision += 1;
      syncedRadarImageRevision = -1;
      syncedRadarImageSizeKey = "";
      radarOverlayContext.clearRect(0, 0, radarOverlayCanvas.width, radarOverlayCanvas.height);

      setStatusText(`loading ${nextSite} frame list`);
      try {
        await refreshLevel2Frames();
        currentFrameIndex = Math.max(0, level2Frames.length - 1);
        await renderCurrentFrame();
        setStatusText(`loaded ${nextSite} ${LEVEL2_PRODUCT}`);
      } catch (error) {
        const message = error?.message || "error";
        console.error("Level II site change failed", error);
        setStatusText(`failed loading ${nextSite}: ${message}`);
        errorPanel.style.display = "block";
        errorPanel.textContent = `Level II ${nextSite} failed: ${message}`;
      }
    }

    function startFrameRefresh() {
      if (frameRefreshTimer !== null) {
        window.clearInterval(frameRefreshTimer);
      }
      frameRefreshTimer = window.setInterval(async () => {
        const latestChanged = await refreshLevel2Frames();
        if (latestChanged && currentFrameIndex === level2Frames.length - 1) {
          await renderCurrentFrame();
        }
        // Manual playback only: do not auto-start after refresh.
      }, FRAME_REFRESH_MS);
    }

    function startAlertRefresh() {
      if (alertRefreshTimer !== null) {
        window.clearInterval(alertRefreshTimer);
      }
      alertRefreshTimer = window.setInterval(async () => {
        try {
          await loadAlerts();
        } catch (error) {
          console.warn("Alert refresh failed", error);
          alertsStatusRow.textContent = "Alerts: refresh failed";
        }
      }, ALERT_REFRESH_MS);
    }

    function level2RadarImageCoordinates(bounds = radarBounds) {
      if (!bounds) return null;
      const west = bounds[0][1];
      const south = bounds[0][0];
      const east = bounds[1][1];
      const north = bounds[1][0];
      return [
        [west, north],
        [east, north],
        [east, south],
        [west, south]
      ];
    }

    function syncLevel2RadarMapLayer() {
      if (!map) return;
      if (map.getLayer(LEVEL2_RADAR_LAYER_ID)) {
        map.removeLayer(LEVEL2_RADAR_LAYER_ID);
      }
      if (map.getSource(LEVEL2_RADAR_SOURCE_ID)) {
        map.removeSource(LEVEL2_RADAR_SOURCE_ID);
      }
    }

    function pruneStaleLevel2Frame(stalePath, options = {}) {
      if (!stalePath) return { removed: false, removedCurrent: false };

      const staleIndex = level2Frames.findIndex((frame) => frame?.path === stalePath);
      renderedFrameCache.delete(stalePath);
      if (staleIndex < 0) return { removed: false, removedCurrent: false };

      const allowRemoveCurrent = options.allowRemoveCurrent !== false;
      const currentPath = currentFrame()?.path || "";
      const removedCurrent = currentPath === stalePath;
      if (removedCurrent && !allowRemoveCurrent) {
        return { removed: false, removedCurrent: true };
      }

      const wasAtLatest = currentFrameIndex === Math.max(0, level2Frames.length - 1);
      level2Frames.splice(staleIndex, 1);

      if (level2Frames.length === 0) {
        currentFrameIndex = 0;
        syncFrameSelect();
        updateFrameInfoRow();
        return { removed: true, removedCurrent };
      }

      if (wasAtLatest) {
        currentFrameIndex = level2Frames.length - 1;
      } else if (!removedCurrent && currentPath) {
        const currentPathIndex = level2Frames.findIndex((frame) => frame?.path === currentPath);
        currentFrameIndex = currentPathIndex >= 0 ? currentPathIndex : Math.min(staleIndex, level2Frames.length - 1);
      } else {
        currentFrameIndex = Math.min(staleIndex, level2Frames.length - 1);
      }

      clampCurrentFrameIndex();
      pruneRenderedFrameCache();
      syncFrameSelect();
      updateFrameInfoRow();
      return { removed: true, removedCurrent };
    }

    function redrawRadarOverlay() {
      syncLevel2RadarMapLayer();

      if (!map || radarCanvas.width === 0 || radarCanvas.height === 0 || !radarBounds) return;

      const dpr = overlayDevicePixelRatio();
      const container = map.getContainer();
      const width = Math.max(1, Math.round(container.clientWidth * dpr));
      const height = Math.max(1, Math.round(container.clientHeight * dpr));


      if (drawRadarWebglOverlay(width, height, dpr)) {
        radarOverlayCanvas.style.display = "none";
        radarWebglCanvas.style.display = "block";
        return;
      }

      radarWebglCanvas.style.display = "none";
      radarOverlayCanvas.style.display = "block";

      if (radarOverlayCanvas.width !== width || radarOverlayCanvas.height !== height) {
        radarOverlayCanvas.width = width;
        radarOverlayCanvas.height = height;
      }

      radarOverlayContext.clearRect(0, 0, width, height);
      radarOverlayContext.globalAlpha = Number(opacitySlider.value);
      radarOverlayContext.imageSmoothingEnabled = false;

      const west = radarBounds[0][1];
      const south = radarBounds[0][0];
      const east = radarBounds[1][1];
      const north = radarBounds[1][0];
      const latSpan = north - south;

      for (let strip = 0; strip < RADAR_OVERLAY_VERTICAL_STRIPS; strip += 1) {
        const t0 = strip / RADAR_OVERLAY_VERTICAL_STRIPS;
        const t1 = (strip + 1) / RADAR_OVERLAY_VERTICAL_STRIPS;
        const srcY = t0 * radarCanvas.height;
        const srcH = (t1 - t0) * radarCanvas.height;

        const stripNorth = north - t0 * latSpan;
        const stripSouth = north - t1 * latSpan;
        const nw = map.project([west, stripNorth]);
        const se = map.project([east, stripSouth]);

        radarOverlayContext.drawImage(
          radarCanvas,
          0, srcY, radarCanvas.width, srcH,
          nw.x * dpr,
          nw.y * dpr,
          (se.x - nw.x) * dpr,
          (se.y - nw.y) * dpr
        );
      }

      radarOverlayContext.globalAlpha = 1;
    }

    function drawAlertOverlay() {
      if (!map) return;

      const dpr = overlayDevicePixelRatio();
      const container = map.getContainer();
      const width = Math.max(1, Math.round(container.clientWidth * dpr));
      const height = Math.max(1, Math.round(container.clientHeight * dpr));


      if (alertOverlayCanvas.width !== width || alertOverlayCanvas.height !== height) {
        alertOverlayCanvas.width = width;
        alertOverlayCanvas.height = height;
      }

      alertOverlayContext.clearRect(0, 0, width, height);
      if (!activeAlertFeatures.length || !isAlertOverlayVisible) return;

      alertOverlayContext.lineJoin = "round";
      alertOverlayContext.lineCap = "round";

      const drawRing = (ring) => {
        if (!Array.isArray(ring) || ring.length < 2) return;
        ring.forEach((coord, index) => {
          if (!Array.isArray(coord) || coord.length < 2) return;
          const point = map.project([coord[0], coord[1]]);
          const x = point.x * dpr;
          const y = point.y * dpr;
          if (index === 0) {
            alertOverlayContext.moveTo(x, y);
          } else {
            alertOverlayContext.lineTo(x, y);
          }
        });
        alertOverlayContext.closePath();
      };

      const drawPolygon = (polygonCoordinates) => {
        if (!Array.isArray(polygonCoordinates) || !polygonCoordinates.length) return;
        alertOverlayContext.beginPath();
        polygonCoordinates.forEach(drawRing);
      };

      const bucketFallback = [];
      const bucketOther = [];
      const bucketStorm = [];
      activeAlertFeatures.forEach((feature) => {
        const properties = feature?.properties || {};
        const isFallback = properties._fallbackGeometry === true;
        const visibleStorm = properties._visibleStormPolygon === true;
        if (visibleStorm) bucketStorm.push(feature);
        else if (isFallback) bucketFallback.push(feature);
        else bucketOther.push(feature);
      });

      const drawFeatureFill = (feature) => {
        const properties = feature?.properties || {};
        const isFallback = properties._fallbackGeometry === true;
        const visibleStorm = properties._visibleStormPolygon === true;
        const hydroVisual = isHydroAlert(properties.event || "") ? alertFallbackStyle(properties.event || "") : null;
        const fallbackVisual = isFallback ? alertFallbackStyle(properties.event || "") : null;
        const directAlertPolygon = !isFallback && isStormStyleAlertPolygonEvent(properties.event || "");
        const fillOpacity = (
          directAlertPolygon ? 0.22 :
          isFallback ? (fallbackVisual?.fillOpacity ?? 0.2) :
          hydroVisual ? (hydroVisual.fillOpacity ?? 0.18) :
          0.12
        ) * alertOverlayOpacity;
        const geometry = feature?.geometry;
        if (!geometry) return;

        const parentAlertColor = properties._alertColor || alertColor(properties.event || "");
        alertOverlayContext.fillStyle = parentAlertColor;
        alertOverlayContext.globalAlpha = fillOpacity;
        alertOverlayContext.setLineDash([]);

        if (geometry.type === "Polygon") {
          drawPolygon(geometry.coordinates);
          alertOverlayContext.fill("evenodd");
        } else if (geometry.type === "MultiPolygon") {
          geometry.coordinates.forEach((polygon) => {
            drawPolygon(polygon);
            alertOverlayContext.fill("evenodd");
          });
        }
      };

      const drawFeatureStroke = (feature) => {
        const properties = feature.properties || {};
        const isFallback = properties._fallbackGeometry === true;
        const visibleStorm = properties._visibleStormPolygon === true;
        const isFlashFloodWarning = String(properties.event || "").includes("Flash Flood Warning");
        const hydroVisual = isHydroAlert(properties.event || "") ? alertFallbackStyle(properties.event || "") : null;
        const fallbackVisual = isFallback ? alertFallbackStyle(properties.event || "") : null;
        const zoom = map.getZoom();
        const styleVisual = isFallback ? fallbackVisual : hydroVisual;
        const visualMinWidth = styleVisual?.minWidth ?? 0.8;
        const visualMaxWidth = styleVisual?.maxWidth ?? 1.4;
        const hydroLineWidth = Math.max(
          visualMinWidth,
          Math.min(visualMaxWidth, visualMinWidth + ((zoom - 4) / 7) * (visualMaxWidth - visualMinWidth))
        );
        const directAlertPolygon = !isFallback && isStormStyleAlertPolygonEvent(properties.event || "");
        const lineOpacity = (
          directAlertPolygon ? 1 :
          isFallback ? (fallbackVisual?.lineOpacity ?? 0.52) :
          hydroVisual ? (hydroVisual.lineOpacity ?? 0.58) :
          0.55
        ) * alertOverlayOpacity;
        const lineWidth = directAlertPolygon ? 2.4 : ((isFallback || hydroVisual) ? hydroLineWidth : 1.7);
        const parentAlertColor = properties._alertColor || alertColor(properties.event || "");
        alertOverlayContext.strokeStyle = parentAlertColor;
        alertOverlayContext.globalAlpha = lineOpacity;
        alertOverlayContext.lineWidth = lineWidth * dpr;
        if (isFallback) {
          alertOverlayContext.setLineDash([4 * dpr, 3 * dpr]);
        } else {
          alertOverlayContext.setLineDash([]);
        }

        const geometry = feature.geometry;
        if (geometry?.type === "Polygon") {
          drawPolygon(geometry.coordinates);
          alertOverlayContext.stroke();
        } else if (geometry?.type === "MultiPolygon") {
          geometry.coordinates.forEach((polygon) => {
            drawPolygon(polygon);
            alertOverlayContext.stroke();
          });
        }
      };

      // Fill pass: fallback below storm polygons.
      bucketFallback.forEach(drawFeatureFill);
      bucketOther.forEach(drawFeatureFill);
      bucketStorm.forEach(drawFeatureFill);

      // Outline pass above fills, with storm outlines on top.
      bucketFallback.forEach(drawFeatureStroke);
      bucketOther.forEach(drawFeatureStroke);
      bucketStorm.forEach(drawFeatureStroke);

      alertOverlayContext.setLineDash([]);
      alertOverlayContext.globalAlpha = 1;
    }

    // Homepage source-of-truth event color mapping (index.html getAlertColor).
    function alertColor(eventName) {
      const event = String(eventName || "");
      if (!event) return "#58b7ff";

      if (event.includes("Tornado Emergency")) return "#ff00ff";
      if (event.includes("Tornado Watch")) return "#A11D33";
      if (event.includes("Severe Thunderstorm Watch")) return "#FFBB00";

      if (
        event.includes("Tornado Warning") ||
        event.includes("Particularly Dangerous Situation")
      ) {
        return "#E01E37";
      }

      if (event.includes("Severe Thunderstorm")) return "#FFD900";
      if (event.includes("Flash Flood")) return "#00c4a7";
      if (event.includes("Flood")) return "#00aa08";

      if (event.includes("Winter Storm")) return "#df74d7";
      if (event.includes("Winter Weather")) return "#ab7cff";
      if (event.includes("Freeze")) return "#6edce4";
      if (event.includes("Frost")) return "#4e8de6";
      if (event.includes("Blizzard")) return "#748cff";

      if (event.includes("Red Flag") || event.includes("Fire Weather")) return "#ff5d00";

      return "#58b7ff";
    }

    function alertFallbackStyle(eventName) {
      const event = String(eventName || "");
      const base = alertColor(event);

      let fillOpacity = 0.24;
      let lineOpacity = 0.72;
      let minWidth = 0.9;
      let maxWidth = 1.6;

      if (event.includes("Warning")) {
        fillOpacity = 0.30;
        lineOpacity = 0.86;
        minWidth = 1.4;
        maxWidth = 2.4;
      } else if (event.includes("Watch")) {
        fillOpacity = 0.20;
        lineOpacity = 0.68;
        minWidth = 1.0;
        maxWidth = 1.8;
      } else if (event.includes("Advisory")) {
        fillOpacity = 0.24;
        lineOpacity = 0.74;
        minWidth = 1.0;
        maxWidth = 1.8;
      } else if (event.includes("Statement")) {
        fillOpacity = 0.20;
        lineOpacity = 0.62;
        minWidth = 0.8;
        maxWidth = 1.4;
      }

      return {
        fill: base,
        outline: base,
        fillOpacity,
        lineOpacity,
        minWidth,
        maxWidth
      };
    }

    function alertDrawRank(eventName) {
      const event = String(eventName || "");
      if (event.includes("Flash Flood Warning")) return 500;
      if (event.includes("Flood Warning")) return 420;
      if (event.includes("Flood Advisory")) return 320;
      if (event.includes("Flood Watch")) return 220;
      if (event.includes("Flash Flood Discussion")) return 180;
      if (event.includes("Warning")) return 300;
      if (event.includes("Advisory")) return 220;
      if (event.includes("Watch")) return 180;
      return 120;
    }

    function isHydroAlert(eventName) {
      const event = String(eventName || "");
      return (
        event.includes("Flash Flood") ||
        event.includes("Flood Warning") ||
        event.includes("Flood Advisory") ||
        event.includes("Flood Watch") ||
        event.includes("Flood")
      );
    }

    function compactAlertSummary(props) {
      const eventName = String(props?.event || "");
      if (eventName.includes("Flash Flood")) return "Flash flooding possible.";
      if (eventName.includes("Tornado")) return "Take shelter immediately.";
      if (eventName.includes("Severe Thunderstorm")) return "Damaging winds and hail possible.";
      if (eventName.includes("Special Marine")) return "Hazardous marine conditions possible.";
      const headline = String(props?.headline || "").trim();
      if (!headline) return "Active weather alert.";
      return headline.length > 84 ? `${headline.slice(0, 84).trim()}...` : headline;
    }
    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }
    function formatPopupExpires(value) {
      if (!value) return "Unknown";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }
    function formatPopupExpiresIn(value) {
      if (!value) return "Expires in Unknown.";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return `Expires in ${String(value)}.`;
      const deltaMs = date.getTime() - Date.now();
      if (deltaMs <= 0) return "Expired.";
      const totalMinutes = Math.max(1, Math.round(deltaMs / 60000));
      const hours = Math.floor(totalMinutes / 60);
      const minutes = totalMinutes % 60;
      if (hours <= 0) return `Expires in ${minutes} min${minutes === 1 ? "" : "s"}.`;
      return `Expires in ${hours} hr${hours === 1 ? "" : "s"}, ${minutes} min${minutes === 1 ? "" : "s"}.`;
    }
    function alertValue(value) {
      const text = String(value || "").trim();
      return text || "N/A";
    }
    function isVisibleStormPolygon(eventName) {
      const event = String(eventName || "");
      return (
        event === "Tornado Warning" ||
        event === "Severe Thunderstorm Warning" ||
        event === "Flash Flood Warning" ||
        event === "Special Marine Warning"
      );
    }

    function isStormStyleAlertPolygonEvent(eventName) {
      const event = String(eventName || "");
      return (
        event === "Tornado Warning" ||
        event === "Severe Thunderstorm Warning" ||
        event === "Flash Flood Warning" ||
        event === "Special Marine Warning" ||
        event === "Special Weather Statement" ||
        event === "Marine Weather Statement"
      );
    }

    function addAlertLayers() {
      map.addSource(ALERT_SOURCE_ID, { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      // Transparent fill hitbox keeps polygon interiors clickable while visible outlines are drawn on alertOverlayCanvas.
      map.addLayer({
        id: ALERT_FILL_LAYER_ID,
        type: "fill",
        source: ALERT_SOURCE_ID,
        layout: {
          "fill-sort-key": ["coalesce", ["get", "_alertDrawRank"], 0]
        },
        paint: {
          "fill-color": ["to-color", ["coalesce", ["get", "_alertColor"], ["literal", "#ffffff"]]],
          "fill-opacity": 0
        }
      });
      map.addLayer({
        id: ALERT_STORM_HITBOX_LAYER_ID,
        type: "fill",
        source: ALERT_SOURCE_ID,
        filter: ["==", ["get", "_visibleStormPolygon"], true],
        layout: {
          "fill-sort-key": ["coalesce", ["get", "_alertDrawRank"], 0]
        },
        paint: {
          "fill-color": ["to-color", ["coalesce", ["get", "_alertColor"], ["literal", "#ffffff"]]],
          "fill-opacity": 0
        }
      });
      map.addLayer({
        id: ALERT_LINE_LAYER_ID,
        type: "line",
        source: ALERT_SOURCE_ID,
        filter: ["==", ["get", "_visibleStormPolygon"], true],
        layout: {
          "line-sort-key": ["coalesce", ["get", "_alertDrawRank"], 0]
        },
        paint: {
          "line-color": ["to-color", ["coalesce", ["get", "_alertColor"], ["literal", "#ffffff"]]],
          "line-opacity": 0,
          "line-width": ["interpolate", ["linear"], ["zoom"], 4, 1.5, 8, 2.8]
        }
      });
      map.moveLayer(ALERT_FILL_LAYER_ID);
      map.moveLayer(ALERT_STORM_HITBOX_LAYER_ID);
      map.moveLayer(ALERT_LINE_LAYER_ID);

      const onInteract = (event) => {
        const alertLayerIds = (map.getStyle()?.layers || [])
          .filter((layer) => layer?.source === ALERT_SOURCE_ID)
          .map((layer) => layer.id)
          .filter(Boolean);
        const renderedFeatures = map.queryRenderedFeatures(event.point, {
          layers: alertLayerIds
        });
        const clickPoint = [event?.lngLat?.lng, event?.lngLat?.lat];
        const useFallbackPasses = renderedFeatures.length === 0;
        const geometryContainedFeatures = useFallbackPasses
          ? (Array.isArray(activeAlertFeatures) ? activeAlertFeatures : [])
            .filter((feature) => pointInFeatureGeometry(clickPoint, feature?.geometry))
          : [];
        const screenSpaceHits = useFallbackPasses
          ? (Array.isArray(activeAlertFeatures) ? activeAlertFeatures : [])
            .filter((feature) => {
              const props = feature?.properties || {};
              if (props._visibleStormPolygon !== true) return false;
              return screenFeatureHitTest([event.point.x, event.point.y], feature?.geometry, ALERT_SCREEN_HIT_TOLERANCE_PX);
            })
          : [];
        const sourceDataFeatures = useFallbackPasses
          ? (() => {
            const source = map.getSource(ALERT_SOURCE_ID);
            const sourceData = source?._data;
            if (!sourceData || !Array.isArray(sourceData.features)) return [];
            return sourceData.features.filter((feature) => pointInFeatureGeometry(clickPoint, feature?.geometry));
          })()
          : [];
        const clickedFeatures = useFallbackPasses
          ? [...geometryContainedFeatures, ...sourceDataFeatures, ...screenSpaceHits]
          : renderedFeatures;
        if (!clickedFeatures.length) return;

        const dedupedByAlert = [];
        const seenAlertKeys = new Set();
        clickedFeatures.forEach((feature, index) => {
          const props = feature?.properties || {};
          const dedupeKey = String(
            props._alertId ||
            props.id ||
            `${props.event || "alert"}|${props.effective || ""}|${props.expires || props.ends || ""}`
          );
          if (seenAlertKeys.has(dedupeKey)) return;
          seenAlertKeys.add(dedupeKey);
          dedupedByAlert.push(feature);
        });
        if (!dedupedByAlert.length) return;
        const eventPriority = (eventName) => {
          const value = String(eventName || "");
          if (value.includes("Tornado Warning")) return 0;
          if (value.includes("Severe Thunderstorm Warning")) return 1;
          if (value.includes("Flash Flood Warning")) return 2;
          if (value.includes("Special Marine Warning")) return 3;
          if (value.includes("Flood Warning")) return 4;
          if (value.includes("Flood Advisory")) return 5;
          if (value.includes("Flood Watch")) return 6;
          if (value.includes("Warning")) return 4;
          if (value.includes("Watch")) return 7;
          if (value.includes("Advisory")) return 8;
          return 9;
        };

        const sortedFeatures = dedupedByAlert.slice().sort((a, b) => {
          const aProps = a?.properties || {};
          const bProps = b?.properties || {};
          const priorityDiff = eventPriority(aProps.event) - eventPriority(bProps.event);
          if (priorityDiff !== 0) return priorityDiff;
          if (aProps._fallbackGeometry === true && bProps._fallbackGeometry !== true) return 1;
          if (bProps._fallbackGeometry === true && aProps._fallbackGeometry !== true) return -1;
          return String(aProps.event || "").localeCompare(String(bProps.event || ""));
        });
        if (DEBUG_ALERT_STACKING) {
          console.log("[AlertStacking]", {
            alertLayerIds,
            usedFallbackPasses: useFallbackPasses,
            renderedCount: renderedFeatures.length,
            renderedEvents: renderedFeatures.map((feature) => feature?.properties?.event || "Unknown Event"),
            activeContainedCount: geometryContainedFeatures.length,
            sourceContainedCount: sourceDataFeatures.length,
            screenHitCount: screenSpaceHits.length,
            dedupedEvents: dedupedByAlert.map((feature) => feature?.properties?.event || "Unknown Event"),
            sortedEvents: sortedFeatures.map((feature) => feature?.properties?.event || "Unknown Event")
          });
        }

        const cardsHtml = sortedFeatures.map((feature, index) => {
          const props = feature.properties || {};
          const eventName = props.event || "Unknown Event";
          const alertHex = props._alertColor || alertColor(eventName);
          const expires = formatPopupExpires(props.expires || props.ends);
          const effective = formatPopupExpires(props.effective);
          const summary = compactAlertSummary(props);
          const expiresIn = formatPopupExpiresIn(props.expires || props.ends);
          return `
            <div class="omega-alert-item" style="--alert-color:${escapeHtml(alertHex)};">
              <div class="level2-alert-detail-panel" data-alert-detail-index="${index}">
                <div class="alert-detail-card">
                  <div class="alert-detail-hero">
                    <div class="alert-detail-headline">${escapeHtml(alertValue(props.headline || summary))}</div>
                    <div class="alert-detail-metrics">
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Event</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(eventName))}</div>
                      </div>
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Severity</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(props.severity))}</div>
                      </div>
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Urgency</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(props.urgency))}</div>
                      </div>
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Certainty</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(props.certainty))}</div>
                      </div>
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Effective</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(effective))}</div>
                      </div>
                      <div class="alert-detail-metric">
                        <div class="alert-detail-metric-label">Expires</div>
                        <div class="alert-detail-metric-value">${escapeHtml(alertValue(expires))}</div>
                      </div>
                    </div>
                  </div>
                  <section class="alert-detail-section">
                    <div class="alert-detail-section-title">Area</div>
                    <div class="alert-detail-text">${escapeHtml(alertValue(props.areaDesc))}</div>
                  </section>
                  <section class="alert-detail-section">
                    <div class="alert-detail-section-title">Source</div>
                    <div class="alert-detail-text">${escapeHtml(alertValue(props.senderName || "National Weather Service"))}</div>
                  </section>
                  <section class="alert-detail-section">
                    <div class="alert-detail-section-title">Description</div>
                    <div class="alert-detail-text">${escapeHtml(alertValue(props.description || summary))}</div>
                  </section>
                  ${props.instruction ? `
                  <section class="alert-detail-section">
                    <div class="alert-detail-section-title">Instruction</div>
                    <div class="alert-detail-text">${escapeHtml(props.instruction)}</div>
                  </section>` : ""}
                </div>
              </div>
              <div class="omega-alert-card" style="--alert-color: ${escapeHtml(alertHex)};">
                <div class="omega-alert-header" style="background: ${escapeHtml(alertHex)};"><span class="omega-alert-title">${escapeHtml(eventName)}</span></div>
                <div class="omega-alert-body">
                  <div class="omega-alert-expires">${escapeHtml(expiresIn)}</div>
                  <div class="omega-alert-actions">
                    <button class="omega-alert-icon-btn omega-alert-details-btn" type="button" aria-expanded="false" title="Details" data-alert-detail-index="${index}">></button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join("");

        const html = `
          <div class="level2-alert-popup-wrap">
            <div class="omega-alert-popup">
              <div class="omega-alert-stack">
                ${cardsHtml}
              </div>
            </div>
          </div>
        `;
        if (popup) popup.remove();
        popup = new mapboxgl.Popup({ className: "level2-alert-popup", closeButton: true, closeOnClick: true, maxWidth: "none", anchor: "bottom", offset: [0, -24] })
          .setLngLat(event.lngLat)
          .setHTML(html)
          .addTo(map);
        const popupEl = popup.getElement();
        if (popupEl && popupEl.parentElement !== document.body) {
          document.body.appendChild(popupEl);
        }
        const detailsButtons = popupEl?.querySelectorAll(".omega-alert-details-btn") || [];
        detailsButtons.forEach((detailsButton) => {
          detailsButton.addEventListener("click", (clickEvent) => {
            clickEvent.preventDefault();
            clickEvent.stopPropagation();
            const detailIndex = detailsButton.getAttribute("data-alert-detail-index");
            if (!detailIndex) return;
            const detailCard = popupEl?.querySelector(`.level2-alert-detail-panel[data-alert-detail-index="${detailIndex}"]`);
            if (!detailCard) return;
            const open = detailCard.classList.toggle("is-open");
            detailsButton.setAttribute("aria-expanded", String(open));
            detailsButton.textContent = open ? "X" : ">";
          });
        });
      };
      map.on("mouseenter", ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", ALERT_FILL_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("mouseenter", ALERT_STORM_HITBOX_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", ALERT_STORM_HITBOX_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("mouseenter", ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "pointer";
      });
      map.on("mouseleave", ALERT_LINE_LAYER_ID, () => {
        map.getCanvas().style.cursor = "";
      });
      map.on("click", ALERT_FILL_LAYER_ID, onInteract);
      map.on("click", ALERT_STORM_HITBOX_LAYER_ID, onInteract);
      map.on("click", ALERT_LINE_LAYER_ID, onInteract);
      map.on("touchstart", ALERT_FILL_LAYER_ID, onInteract);
      map.on("touchstart", ALERT_STORM_HITBOX_LAYER_ID, onInteract);
      map.on("touchstart", ALERT_LINE_LAYER_ID, onInteract);
    }

    function addRadarSiteLabels() {
      const sites = {
        type: "FeatureCollection",
        features: [
          { type: "Feature", properties: { id: "KFCX" }, geometry: { type: "Point", coordinates: [-80.273, 37.024] } },
          { type: "Feature", properties: { id: "KRAX" }, geometry: { type: "Point", coordinates: [-78.49, 35.665] } },
          { type: "Feature", properties: { id: "KGSP" }, geometry: { type: "Point", coordinates: [-82.22, 34.883] } },
          { type: "Feature", properties: { id: "KCAE" }, geometry: { type: "Point", coordinates: [-81.118, 33.949] } },
          { type: "Feature", properties: { id: "KCLX" }, geometry: { type: "Point", coordinates: [-81.042, 32.656] } },
          { type: "Feature", properties: { id: "KLTX" }, geometry: { type: "Point", coordinates: [-78.429, 33.989] } },
          { type: "Feature", properties: { id: "KMHX" }, geometry: { type: "Point", coordinates: [-76.877, 34.775] } },
          { type: "Feature", properties: { id: "KAKQ" }, geometry: { type: "Point", coordinates: [-77.007, 36.983] } }
        ]
      };

      map.addSource(SITE_SOURCE_ID, { type: "geojson", data: sites });
      map.addLayer({ id: SITE_CIRCLE_LAYER_ID, type: "circle", source: SITE_SOURCE_ID, paint: { "circle-radius": 16, "circle-color": "#0b1f3f", "circle-opacity": 0.96, "circle-stroke-color": "rgba(148,163,184,0.72)", "circle-stroke-width": 1 } });
      map.addLayer({ id: SITE_LABEL_LAYER_ID, type: "symbol", source: SITE_SOURCE_ID, layout: { "text-field": ["get", "id"], "text-size": 10, "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"], "text-allow-overlap": true, "text-ignore-placement": true }, paint: { "text-color": "#ffffff" } });
    }

    function isValidGeometry(geometry) {
      if (!geometry || typeof geometry !== "object") return false;
      if (geometry.type === "Polygon") return Array.isArray(geometry.coordinates) && geometry.coordinates.length > 0;
      if (geometry.type === "MultiPolygon") return Array.isArray(geometry.coordinates) && geometry.coordinates.length > 0;
      return false;
    }

    function isTestOrExerciseAlertFeature(feature) {
      const properties = feature?.properties || {};
      const status = String(properties.status || "").trim().toLowerCase();
      if (status === "test" || status === "exercise" || status === "draft") return true;

      const messageType = String(
        properties.messageType ||
        properties.message_type ||
        properties.msgType ||
        ""
      ).trim().toLowerCase();
      if (messageType === "test") return true;

      const eventText = String(properties.event || "").toLowerCase();
      const headlineText = String(properties.headline || "").toLowerCase();
      const hasTestText = (text) =>
        text.includes("test message") ||
        text.includes("required weekly test") ||
        text.includes("required monthly test");
      return hasTestText(eventText) || hasTestText(headlineText);
    }

    // Alerts shown on the radar should match the homepage Active Weather Alerts categories.
    // Do not show random NWS products here just because they have county/zone geometry.
    const HOMEPAGE_RADAR_ALERT_EVENTS = new Set([
      "Tornado Warning",
      "Severe Thunderstorm Warning",
      "Flash Flood Warning",
      "Flash Flood Watch",
      "Tornado Watch",
      "Severe Thunderstorm Watch",
      "Special Marine Warning",
      "Marine Weather Statement",
      "Flash Flood Statement",

      "Hurricane Warning",
      "Tropical Storm Warning",
      "Storm Surge Warning",

      "Winter Storm Warning",
      "Blizzard Warning",
      "Ice Storm Warning",
      "Winter Weather Advisory",
      "Freeze Warning",
      "Frost Advisory",

      "Flood Warning",
      "Flood Watch",
      "Coastal Flood Warning",
      "Flood Advisory",
      "Areal Flood Warning",
      "Areal Flood Watch",

      "Red Flag Warning",
      "Fire Weather Watch"
    ]);

    function isHomepageVisibleRadarAlertFeature(feature) {
      const event = feature?.properties?.event;
      if (!event) return false;

      // Homepage only treats Special Weather Statement as storm-category
      // when it has a real storm-based polygon.
      if (event === "Special Weather Statement") {
        return isValidGeometry(feature.geometry);
      }

      return HOMEPAGE_RADAR_ALERT_EVENTS.has(event);
    }

    function normalizeAlertFeature(feature, index) {
      if (isTestOrExerciseAlertFeature(feature)) {
        return null;
      }
      const properties = feature.properties || {};
      const alertId = String(feature.id || properties.id || `${properties.event || "alert"}-${index}`);
      const fallbackStyle = alertFallbackStyle(properties.event || "");
      const drawRank = alertDrawRank(properties.event || "");
      return {
        ...feature,
        id: alertId,
        properties: {
          ...properties,
          _alertId: alertId,
          _alertColor: alertColor(properties.event || ""),
          _alertFallbackFillColor: fallbackStyle.fill,
          _alertFillColor: fallbackStyle.fill,
          _alertFallbackLineColor: fallbackStyle.outline,
          _alertFallbackFillOpacity: fallbackStyle.fillOpacity,
          _alertFallbackLineOpacity: fallbackStyle.lineOpacity,
          _alertFallbackMinWidth: fallbackStyle.minWidth,
          _alertFallbackMaxWidth: fallbackStyle.maxWidth,
          _alertDrawRank: drawRank,
          _visibleStormPolygon: isVisibleStormPolygon(properties.event || "")
        }
      };
    }

    function dedupeAlertFeaturesById(features) {
      const seen = new Set();
      return features.filter((feature) => {
        const alertId = feature.properties?._alertId || feature.id;
        if (!alertId || seen.has(alertId)) return false;
        seen.add(alertId);
        return true;
      });
    }

    function polygonCoordinatesFromGeometry(geometry) {
      if (geometry?.type === "Polygon" && Array.isArray(geometry.coordinates)) return [geometry.coordinates];
      if (geometry?.type === "MultiPolygon" && Array.isArray(geometry.coordinates)) return geometry.coordinates;
      return [];
    }

    function pointOnSegment(point, a, b) {
      const [px, py] = point;
      const [ax, ay] = a;
      const [bx, by] = b;
      const cross = (px - ax) * (by - ay) - (py - ay) * (bx - ax);
      if (Math.abs(cross) > 1e-12) return false;
      const dot = (px - ax) * (bx - ax) + (py - ay) * (by - ay);
      if (dot < 0) return false;
      const lenSq = (bx - ax) * (bx - ax) + (by - ay) * (by - ay);
      return dot <= lenSq;
    }

    function pointInRing(point, ring) {
      if (!Array.isArray(ring) || ring.length < 3) return false;
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const a = ring[i];
        const b = ring[j];
        if (!Array.isArray(a) || !Array.isArray(b) || a.length < 2 || b.length < 2) continue;
        if (pointOnSegment(point, [a[0], a[1]], [b[0], b[1]])) return true;
        const yi = a[1];
        const yj = b[1];
        const xi = a[0];
        const xj = b[0];
        const intersects = ((yi > point[1]) !== (yj > point[1])) &&
          (point[0] < ((xj - xi) * (point[1] - yi)) / ((yj - yi) || Number.EPSILON) + xi);
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function pointInPolygon(point, polygonCoordinates) {
      if (!Array.isArray(polygonCoordinates) || !polygonCoordinates.length) return false;
      if (!pointInRing(point, polygonCoordinates[0])) return false;
      for (let i = 1; i < polygonCoordinates.length; i++) {
        if (pointInRing(point, polygonCoordinates[i])) return false;
      }
      return true;
    }

    function pointInFeatureGeometry(point, geometry) {
      if (!Array.isArray(point) || point.length < 2 || !geometry || typeof geometry !== "object") return false;
      if (geometry.type === "Polygon") return pointInPolygon(point, geometry.coordinates);
      if (geometry.type === "MultiPolygon") {
        return Array.isArray(geometry.coordinates) && geometry.coordinates.some((polygon) => pointInPolygon(point, polygon));
      }
      return false;
    }

    function distancePointToSegmentPx(point, a, b) {
      const [px, py] = point;
      const [ax, ay] = a;
      const [bx, by] = b;
      const abx = bx - ax;
      const aby = by - ay;
      const abLenSq = abx * abx + aby * aby;
      if (abLenSq <= 1e-12) return Math.hypot(px - ax, py - ay);
      let t = ((px - ax) * abx + (py - ay) * aby) / abLenSq;
      t = Math.max(0, Math.min(1, t));
      const cx = ax + t * abx;
      const cy = ay + t * aby;
      return Math.hypot(px - cx, py - cy);
    }

    function pointInScreenRing(point, ringPoints) {
      if (!Array.isArray(ringPoints) || ringPoints.length < 3) return false;
      let inside = false;
      for (let i = 0, j = ringPoints.length - 1; i < ringPoints.length; j = i++) {
        const a = ringPoints[i];
        const b = ringPoints[j];
        const intersects = ((a[1] > point[1]) !== (b[1] > point[1])) &&
          (point[0] < ((b[0] - a[0]) * (point[1] - a[1])) / ((b[1] - a[1]) || Number.EPSILON) + a[0]);
        if (intersects) inside = !inside;
      }
      return inside;
    }

    function screenFeatureHitTest(point, geometry, tolerancePx) {
      if (!map || !geometry || typeof geometry !== "object") return false;
      const screenHitPolygon = (polygonCoordinates) => {
        if (!Array.isArray(polygonCoordinates) || !polygonCoordinates.length) return false;
        const projectedRings = polygonCoordinates
          .map((ring) => Array.isArray(ring)
            ? ring
              .filter((coord) => Array.isArray(coord) && coord.length >= 2)
              .map((coord) => {
                const projected = map.project([coord[0], coord[1]]);
                return [projected.x, projected.y];
              })
            : [])
          .filter((ring) => ring.length >= 3);
        if (!projectedRings.length) return false;

        const inOuter = pointInScreenRing(point, projectedRings[0]);
        let inHole = false;
        for (let i = 1; i < projectedRings.length; i++) {
          if (pointInScreenRing(point, projectedRings[i])) {
            inHole = true;
            break;
          }
        }
        if (inOuter && !inHole) return true;

        for (const ring of projectedRings) {
          for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
            if (distancePointToSegmentPx(point, ring[j], ring[i]) <= tolerancePx) return true;
          }
        }
        return false;
      };

      if (geometry.type === "Polygon") return screenHitPolygon(geometry.coordinates);
      if (geometry.type === "MultiPolygon") {
        return Array.isArray(geometry.coordinates) && geometry.coordinates.some((polygon) => screenHitPolygon(polygon));
      }
      return false;
    }

    async function fetchAffectedZoneGeometry(zoneUrl) {
      try {
        const response = await fetch(zoneUrl, { headers: { Accept: "application/geo+json" }, cache: "no-cache" });
        if (!response.ok) {
          return { zoneUrl, ok: false, status: response.status, geometry: null };
        }
        const zone = await response.json();
        return { zoneUrl, ok: true, status: response.status, geometry: zone?.geometry || null };
      } catch (_error) {
        return { zoneUrl, ok: false, status: "", geometry: null };
      }
    }

    async function fallbackFeaturesFromAffectedZones(feature) {
      const affectedZones = Array.isArray(feature.properties?.affectedZones) ? feature.properties.affectedZones : [];
      const zoneUrls = [...new Set(affectedZones.filter(Boolean))];
      if (!zoneUrls.length) return { fallbackFeatures: [] };

      const zoneResults = await Promise.allSettled(zoneUrls.map(fetchAffectedZoneGeometry));
      const zoneFetches = zoneResults.map((result, index) => result.status === "fulfilled"
        ? result.value
        : { zoneUrl: zoneUrls[index], ok: false, status: "", geometry: null });
      const seenZoneGeometry = new Set();
      const fallbackFeatures = zoneFetches
        .filter((zoneResult) => zoneResult.ok && polygonCoordinatesFromGeometry(zoneResult.geometry).length)
        .filter((zoneResult) => {
          const key = JSON.stringify(zoneResult.geometry);
          if (seenZoneGeometry.has(key)) return false;
          seenZoneGeometry.add(key);
          return true;
        })
        .map((zoneResult, index) => ({
          ...feature,
          id: `${feature.id}-zone-fallback-${index}`,
          geometry: zoneResult.geometry,
          properties: {
            ...feature.properties,
            _alertColor: feature.properties?._alertColor || alertColor(feature.properties?.event || ""),
            _alertFallbackFillColor: feature.properties?._alertFallbackFillColor || alertFallbackStyle(feature.properties?.event || "").fill,
            _alertFillColor: feature.properties?._alertFillColor || alertFallbackStyle(feature.properties?.event || "").fill,
            _alertFallbackLineColor: feature.properties?._alertFallbackLineColor || alertFallbackStyle(feature.properties?.event || "").outline,
            _alertFallbackFillOpacity: feature.properties?._alertFallbackFillOpacity ?? alertFallbackStyle(feature.properties?.event || "").fillOpacity,
            _alertFallbackLineOpacity: feature.properties?._alertFallbackLineOpacity ?? alertFallbackStyle(feature.properties?.event || "").lineOpacity,
            _alertFallbackMinWidth: feature.properties?._alertFallbackMinWidth ?? alertFallbackStyle(feature.properties?.event || "").minWidth,
            _alertFallbackMaxWidth: feature.properties?._alertFallbackMaxWidth ?? alertFallbackStyle(feature.properties?.event || "").maxWidth,
            _alertDrawRank: feature.properties?._alertDrawRank ?? alertDrawRank(feature.properties?.event || ""),
            _fallbackGeometry: true,
            _fallbackZoneUrl: zoneResult.zoneUrl
          }
        }));

      return { fallbackFeatures };
    }

    async function resolveFallbackAlertGeometries(featuresWithoutGeometry) {
      const results = await Promise.all(
        featuresWithoutGeometry.map(async (feature) => {
          const result = await fallbackFeaturesFromAffectedZones(feature).catch(() => ({ fallbackFeatures: [] }));
          return { original: feature, ...result };
        })
      );
      return {
        fallbackFeatures: results.flatMap((result) => result.fallbackFeatures),
        listedOnlyFeatures: results.filter((result) => !result.fallbackFeatures.length).map((result) => result.original)
      };
    }

    function nwsAlertsUrlForArea(area) {
      return `https://api.weather.gov/alerts/active?area=${encodeURIComponent(area)}`;
    }

    async function fetchNwsAlertsForAreas() {
      const areaResults = await Promise.allSettled(
        NWS_ALERT_AREAS.map(async (area) => {
          const response = await fetch(nwsAlertsUrlForArea(area), { headers: { Accept: "application/geo+json" }, cache: "no-cache" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const collection = await response.json();
          return Array.isArray(collection.features) ? collection.features : [];
        })
      );
      const allFeatures = [];
      areaResults.forEach((result) => {
        if (result.status === "fulfilled") allFeatures.push(...result.value);
      });
      const seenAlertIds = new Set();
      const deduped = [];
      allFeatures.forEach((feature, index) => {
        const alertId = String(feature?.id || feature?.properties?.id || `unknown-alert-${index}`);
        if (seenAlertIds.has(alertId)) return;
        seenAlertIds.add(alertId);
        deduped.push(feature);
      });
      return deduped;
    }

    async function loadAlerts() {
      const fetchedFeatures = await fetchNwsAlertsForAreas();
      const homepageVisibleFeatures = fetchedFeatures.filter(isHomepageVisibleRadarAlertFeature);
      const normalizedFetchedFeatures = homepageVisibleFeatures.map(normalizeAlertFeature).filter(Boolean);
      const featuresWithGeometry = dedupeAlertFeaturesById(
        normalizedFetchedFeatures.filter((feature) => isValidGeometry(feature.geometry))
      );
      const directGeometryAlertIds = new Set(
        featuresWithGeometry.map((feature) => feature.properties?._alertId)
      );
      const normalizedFeaturesWithoutGeometry = dedupeAlertFeaturesById(
        normalizedFetchedFeatures.filter((feature) =>
          !isValidGeometry(feature.geometry) &&
          !directGeometryAlertIds.has(feature.properties?._alertId)
        )
      );
      const { fallbackFeatures, listedOnlyFeatures } = await resolveFallbackAlertGeometries(normalizedFeaturesWithoutGeometry);

      activeAlertFeatures = [...featuresWithGeometry, ...fallbackFeatures];
      activeAlertsWithoutGeometry = listedOnlyFeatures;
      map.getSource(ALERT_SOURCE_ID).setData({ type: "FeatureCollection", features: activeAlertFeatures });
      map.moveLayer(ALERT_FILL_LAYER_ID);
      map.moveLayer(ALERT_STORM_HITBOX_LAYER_ID);
      map.moveLayer(ALERT_LINE_LAYER_ID);
      drawAlertOverlay();
      const stormCount = activeAlertFeatures.filter((feature) => feature.properties?._visibleStormPolygon === true).length;
      const fallbackCount = activeAlertFeatures.filter((feature) => feature.properties?._fallbackGeometry === true).length;
      alertsStatusRow.textContent = `Homepage radar alerts: ${homepageVisibleFeatures.length} active - ${stormCount} storm polygons - ${fallbackCount} zone fallback - ${activeAlertsWithoutGeometry.length} listed only`;
    }

    function initializeMap() {
      if (!MAPBOX_TOKEN || !String(MAPBOX_TOKEN).startsWith("pk.")) {
        statusText.textContent = "Renderer status: missing Mapbox token";
        return;
      }

      mapboxgl.accessToken = MAPBOX_TOKEN;
      map = new mapboxgl.Map({
        container: "map",
        style: MAPBOX_STYLE,
        center: [-80.5, 37.43],
        zoom: 4.92,
        projection: "mercator",
        renderWorldCopies: false,
        bearing: 0,
        pitch: 0,
        pitchWithRotate: false,
        dragRotate: false,
        touchPitch: false,
        antialias: false,
        fadeDuration: 0,
        attributionControl: true
      });
      window.zachLevel2RadarMap = map;

      map.addControl(new mapboxgl.NavigationControl(), "top-left");
      map.dragRotate.disable();
      map.touchZoomRotate.disableRotation();
      if (map.setMaxPitch) map.setMaxPitch(0);
      map.on("rotate", lockOrientation);
      map.on("pitch", lockOrientation);
      map.on("movestart", () => {
        isMapInteracting = true;
      });
      map.on("zoomstart", () => {
        isMapInteracting = true;
      });
      map.on("moveend", () => {
        isMapInteracting = false;
        scheduleLevel2FrameWarmup({ aroundIndex: currentFrameIndex, delayMs: 900 });
      });
      map.on("zoomend", () => {
        isMapInteracting = false;
        scheduleLevel2FrameWarmup({ aroundIndex: currentFrameIndex, delayMs: 900 });
      });
      map.on("move", () => {
        // Diagnostic: skip overlay redraw during movement.
      });
      map.on("zoom", () => {
        // Diagnostic: skip overlay redraw during zoom.
      });
      map.on("resize", () => {
        redrawRadarOverlay();
        drawAlertOverlay();
      });

      map.on("load", async () => {
        try {
          addAlertLayers();
          addRadarSiteLabels();
          setStatusText("loading frame list");
          await refreshLevel2Frames();
          currentFrameIndex = Math.max(0, level2Frames.length - 1);
          await Promise.all([renderCurrentFrame(), loadAlerts()]);
          startFrameRefresh();
          startAlertRefresh();
          // Manual playback only: show latest frame and wait for Play.
        } catch (error) {
          const message = error?.message || "error";
          statusText.textContent = `Renderer status: failed: ${message}`;
          errorPanel.style.display = "block";
          errorPanel.textContent = `Level II renderer failed: ${message}`;
        }
      });
    }

    function setStatusText(text) {
      statusText.textContent = `Renderer status: ${text}`;
    }

    function setMobileRadarOptionsOpen(isOpen) {
      document.body.classList.toggle("mobile-radar-options-open", isOpen);
      if (mobileRadarOptionsButton) {
        mobileRadarOptionsButton.setAttribute("aria-expanded", isOpen ? "true" : "false");
      }
    }

    mobileRadarOptionsButton?.addEventListener("click", () => {
      const nextOpen = !document.body.classList.contains("mobile-radar-options-open");
      setMobileRadarOptionsOpen(nextOpen);
    });


    previousFrameButton.addEventListener("click", async () => {
      stopPlayback();
      await stepFrame(-1);
    });
    nextFrameButton.addEventListener("click", async () => {
      stopPlayback();
      await stepFrame(1);
    });
    playPauseButton.addEventListener("click", togglePlayback);
    frameSelect?.addEventListener("change", async () => {
      stopPlayback();
      currentFrameIndex = Math.max(0, Math.min(level2Frames.length - 1, Number(frameSelect.value) || 0));
      await renderCurrentFrame();
    });
    playbackSpeedSlider?.addEventListener("input", () => {
      updatePlaybackSpeedDisplay();
      if (isPlaying) {
        clearPlaybackTimer();
        playbackTimer = window.setTimeout(playbackTick, playbackIntervalMs);
      }
    });
    siteSelect?.addEventListener("change", async () => {
      await changeLevel2Site(siteSelect.value);
    });
    productSelect?.addEventListener("change", () => {
      productSelect.value = "LEVEL2_REF0";
      setStatusText("Product fixed to LEVEL2_REF0");
    });
    opacitySlider.addEventListener("input", updateOpacity);
    alertOpacityRange?.addEventListener("input", updateAlertOverlayVisibility);
    toggleAlertOverlayButton?.addEventListener("click", toggleAlertOverlayVisibility);
    updateOpacity();
    updatePlaybackSpeedDisplay();
    updateAlertOverlayControls();
    updatePlaybackButton();
    updateFrameInfoRow();
    initializeMap();
  </script>
</body>
