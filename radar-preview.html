<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Preview</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQv5uSD2G3HRrA9T6QTApN6TqM6pF4M="
    crossorigin=""
  >
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #05080d;
      color: #edf2f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #05080d;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #05080d;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container img {
      max-width: none !important;
    }

    .info-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      width: min(320px, calc(100vw - 32px));
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      background: rgba(12, 18, 28, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      padding: 14px;
      backdrop-filter: blur(8px);
    }

    .info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .info-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .refresh-button {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: #1f2937;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 10px;
    }

    .refresh-button:hover {
      background: #334155;
    }

    .info-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 7px 12px;
      font-size: 13px;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #f8fafc;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin: 12px 0;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding: 12px 0;
      font-size: 13px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
    }

    .control-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
    }

    .opacity-control {
      display: grid;
      gap: 7px;
    }

    .opacity-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #e2e8f0;
    }

    .opacity-control input[type="range"] {
      width: 100%;
    }

    .playback-controls {
      display: grid;
      gap: 8px;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .playback-button {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: #1f2937;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 10px;
    }

    .playback-button:hover {
      background: #334155;
    }

    .playback-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .frame-status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.35;
    }

    .status.error {
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <section class="info-panel" aria-live="polite">
    <div class="info-header">
      <h1 class="info-title">Radar Preview</h1>
      <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
    </div>
    <div class="info-grid" id="infoGrid"></div>
    <div class="controls">
      <label class="control-row" for="debugToggle">
        <span>Show debug overlays</span>
        <input id="debugToggle" type="checkbox" checked>
      </label>
      <label class="opacity-control" for="opacitySlider">
        <span class="opacity-label">
          <span>Radar opacity</span>
          <span id="opacityValue">1.00</span>
        </span>
        <input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="1">
      </label>
      <div class="playback-controls">
        <div class="playback-buttons">
          <button class="playback-button" id="prevFrameButton" type="button">Previous</button>
          <button class="playback-button" id="playPauseButton" type="button">Play</button>
          <button class="playback-button" id="nextFrameButton" type="button">Next</button>
          <button class="playback-button" id="resetViewButton" type="button">Reset View</button>
        </div>
        <div class="frame-status">
          <span id="frameTimeLabel">Frame time unavailable</span>
          <span id="frameCountLabel">0 / 0</span>
        </div>
      </div>
    </div>
    <div class="status" id="status">Loading radar catalog...</div>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const SITE = 'KFCX';
    const PRODUCT = 'N0B';
    const CATALOG_URL = './radar/frames.json';

    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
    }).setView([37.0, -80.2], 7);

    map.createPane('radarPane');
    map.getPane('radarPane').style.zIndex = 350;

    map.createPane('debugPane');
    map.getPane('debugPane').style.zIndex = 650;

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 19,
    }).addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 0);

    const infoGrid = document.getElementById('infoGrid');
    const statusEl = document.getElementById('status');
    const refreshButton = document.getElementById('refreshButton');
    const debugToggle = document.getElementById('debugToggle');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const prevFrameButton = document.getElementById('prevFrameButton');
    const playPauseButton = document.getElementById('playPauseButton');
    const nextFrameButton = document.getElementById('nextFrameButton');
    const resetViewButton = document.getElementById('resetViewButton');
    const frameTimeLabel = document.getElementById('frameTimeLabel');
    const frameCountLabel = document.getElementById('frameCountLabel');
    const PLAY_INTERVAL_MS = 850;
    let radarLayer = null;
    let radarSiteMarker = null;
    let overlayBoundsRectangle = null;
    let overlayCenterMarker = null;
    let currentCatalog = null;
    let catalogFramesNewestFirst = [];
    let playbackFrames = [];
    let playbackIndex = 0;
    let playbackTimer = null;
    let latestFrame = null;
    let latestBounds = null;
    let radarBounds = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function radarOpacity() {
      return Number(opacitySlider.value);
    }

    function updateOpacityLabel() {
      opacityValue.textContent = radarOpacity().toFixed(2);
    }

    function formatNumber(value, digits = 2) {
      return typeof value === 'number' && Number.isFinite(value)
        ? value.toFixed(digits)
        : null;
    }

    function setInfo(catalog, frame) {
      const stats = frame.stats || {};
      const debug = frame.debug || {};
      const rows = [
        ['site', SITE],
        ['product', PRODUCT],
        ['validTime', frame.validTime],
        ['generatedAt', catalog.generatedAt],
      ];
      const imageAspect = frame.width && frame.height
        ? frame.width / frame.height
        : null;

      if (frame.width !== undefined) {
        rows.push(['frame width', String(frame.width)]);
      }

      if (frame.height !== undefined) {
        rows.push(['frame height', String(frame.height)]);
      }

      if (imageAspect !== null) {
        rows.push(['imageAspect', formatNumber(imageAspect, 4) || String(imageAspect)]);
      }

      if (stats.minVisibleDbz !== undefined) {
        rows.push(['minVisibleDbz', String(stats.minVisibleDbz)]);
      }

      if (stats.minComponentPixels !== undefined) {
        rows.push(['minComponentPixels', String(stats.minComponentPixels)]);
      }

      if (stats.visibleCoveragePercent !== undefined) {
        rows.push(['visibleCoveragePercent', formatNumber(stats.visibleCoveragePercent, 4) || String(stats.visibleCoveragePercent)]);
      }

      if (debug.radarLat !== undefined) {
        rows.push(['radarLat', formatNumber(debug.radarLat, 5) || String(debug.radarLat)]);
      }

      if (debug.radarLon !== undefined) {
        rows.push(['radarLon', formatNumber(debug.radarLon, 5) || String(debug.radarLon)]);
      }

      if (debug.maxRangeKm !== undefined) {
        rows.push(['maxRangeKm', formatNumber(debug.maxRangeKm, 2) || String(debug.maxRangeKm)]);
      }

      if (debug.projectionMode !== undefined) {
        rows.push(['projectionMode', String(debug.projectionMode)]);
      }

      if (debug.mappedShape !== undefined) {
        rows.push(['mappedShape', Array.isArray(debug.mappedShape) ? debug.mappedShape.join(' x ') : String(debug.mappedShape)]);
      }

      infoGrid.replaceChildren(
        ...rows.flatMap(([label, value]) => {
          const labelEl = document.createElement('div');
          labelEl.className = 'info-label';
          labelEl.textContent = label;

          const valueEl = document.createElement('div');
          valueEl.className = 'info-value';
          valueEl.textContent = value || 'unavailable';

          return [labelEl, valueEl];
        })
      );
    }

    function catalogFrames(catalog) {
      const frames = catalog &&
        catalog.frames &&
        catalog.frames[SITE] &&
        catalog.frames[SITE][PRODUCT];

      if (!Array.isArray(frames) || !frames.length) {
        throw new Error('Missing frames.KFCX.N0B[] in radar/frames.json.');
      }

      frames.forEach((frame, index) => {
        if (!Array.isArray(frame.bounds) || frame.bounds.length !== 2) {
          throw new Error(`Radar frame ${index + 1} is missing usable bounds.`);
        }

        if (!frame.url) {
          throw new Error(`Radar frame ${index + 1} is missing a WebP URL.`);
        }
      });

      return frames;
    }

    function frameImageUrl(frame) {
      return `${frame.url.replace(/^\//, './')}?t=${Date.now()}`;
    }

    function catalogUrl() {
      return `${CATALOG_URL}?v=${Date.now()}`;
    }

    function formatFrameTime(frame) {
      const validTime = new Date(frame.validTime);

      if (Number.isNaN(validTime.getTime())) {
        return frame.validTime || 'Frame time unavailable';
      }

      return validTime.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function stopPlayback() {
      if (playbackTimer) {
        clearInterval(playbackTimer);
        playbackTimer = null;
      }

      playPauseButton.textContent = 'Play';
    }

    function updatePlaybackLabels() {
      const frame = playbackFrames[playbackIndex];

      frameTimeLabel.textContent = frame ? formatFrameTime(frame) : 'Frame time unavailable';
      frameCountLabel.textContent = playbackFrames.length
        ? `${playbackIndex + 1} / ${playbackFrames.length}`
        : '0 / 0';

      const hasMultipleFrames = playbackFrames.length > 1;
      prevFrameButton.disabled = !hasMultipleFrames;
      playPauseButton.disabled = !hasMultipleFrames;
      nextFrameButton.disabled = !hasMultipleFrames;
      resetViewButton.disabled = !radarBounds;
    }

    function resetMapView() {
      if (!radarBounds) return;

      map.fitBounds(radarBounds, { padding: [24, 24] });
      setTimeout(() => {
        map.invalidateSize();
      }, 50);
    }

    function showFrame(index) {
      if (!playbackFrames.length) {
        updatePlaybackLabels();
        return;
      }

      playbackIndex = (index + playbackFrames.length) % playbackFrames.length;
      const frame = playbackFrames[playbackIndex];
      const bounds = L.latLngBounds(frame.bounds);
      latestFrame = frame;
      latestBounds = bounds;

      if (radarLayer) {
        radarLayer.remove();
      }

      radarLayer = L.imageOverlay(frameImageUrl(frame), bounds, {
        opacity: radarOpacity(),
        interactive: false,
        pane: 'radarPane',
      }).addTo(map);

      radarLayer.once('load', () => {
        setStatus(`Radar frame loaded (${playbackIndex + 1} / ${playbackFrames.length}).`);
      });

      radarLayer.once('error', () => {
        setStatus('Radar image failed to load.', true);
      });

      updateDebugLayers(frame, bounds);
      setInfo(currentCatalog, frame);
      updatePlaybackLabels();
    }

    function stepFrame(offset) {
      stopPlayback();
      showFrame(playbackIndex + offset);
    }

    function togglePlayback() {
      if (playbackTimer) {
        stopPlayback();
        return;
      }

      if (playbackFrames.length < 2) return;

      playPauseButton.textContent = 'Pause';
      playbackTimer = setInterval(() => {
        showFrame(playbackIndex + 1);
      }, PLAY_INTERVAL_MS);
    }

    function removeDebugLayers() {
      if (radarSiteMarker) {
        radarSiteMarker.remove();
        radarSiteMarker = null;
      }

      if (overlayBoundsRectangle) {
        overlayBoundsRectangle.remove();
        overlayBoundsRectangle = null;
      }

      if (overlayCenterMarker) {
        overlayCenterMarker.remove();
        overlayCenterMarker = null;
      }
    }

    function updateDebugLayers(frame, bounds) {
      const debug = frame.debug || {};
      const lat = Number(debug.radarLat);
      const lon = Number(debug.radarLon);

      removeDebugLayers();

      if (!debugToggle.checked) {
        return;
      }

      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        radarSiteMarker = L.circleMarker([lat, lon], {
          radius: 9,
          color: '#38bdf8',
          weight: 3,
          fillColor: '#0ea5e9',
          fillOpacity: 1,
          pane: 'debugPane',
        })
          .bindTooltip('KFCX', {
            permanent: true,
            direction: 'top',
            offset: [0, -10],
          })
          .bindPopup('KFCX radar site')
          .addTo(map);
      }

      overlayBoundsRectangle = L.rectangle(bounds, {
        color: '#facc15',
        weight: 2,
        opacity: 0.95,
        fillOpacity: 0,
        pane: 'debugPane',
      })
        .bindPopup('Current image overlay bounds')
        .addTo(map);

      overlayCenterMarker = L.circleMarker(bounds.getCenter(), {
        radius: 6,
        color: '#f87171',
        weight: 2,
        fillColor: '#ef4444',
        fillOpacity: 1,
        pane: 'debugPane',
      })
        .bindTooltip('Bounds center', {
          permanent: true,
          direction: 'top',
          offset: [0, -8],
        })
        .bindPopup('Current overlay bounds center')
        .addTo(map);
    }

    async function loadRadar() {
      refreshButton.disabled = true;
      setStatus('Loading radar catalog...');

      try {
        const response = await fetch(catalogUrl(), {
          cache: 'no-store',
        });

        if (!response.ok) {
          throw new Error(`Unable to load radar/frames.json (${response.status}).`);
        }

        const catalog = await response.json();
        currentCatalog = catalog;
        catalogFramesNewestFirst = [...catalogFrames(catalog)].sort((a, b) => {
          return new Date(b.validTime) - new Date(a.validTime);
        });
        playbackFrames = [...catalogFramesNewestFirst].reverse();
        stopPlayback();
        showFrame(playbackFrames.length - 1);
        radarBounds = latestBounds;
        resetMapView();
      } catch (error) {
        stopPlayback();
        if (radarLayer) {
          radarLayer.remove();
          radarLayer = null;
        }

        removeDebugLayers();
        currentCatalog = null;
        catalogFramesNewestFirst = [];
        playbackFrames = [];
        playbackIndex = 0;
        latestFrame = null;
        latestBounds = null;
        radarBounds = null;

        infoGrid.replaceChildren();
        updatePlaybackLabels();
        setStatus(error.message || 'Radar preview failed to load.', true);
      } finally {
        refreshButton.disabled = false;
      }
    }

    debugToggle.addEventListener('change', () => {
      if (debugToggle.checked && latestFrame && latestBounds) {
        updateDebugLayers(latestFrame, latestBounds);
        return;
      }

      removeDebugLayers();
    });

    opacitySlider.addEventListener('input', () => {
      updateOpacityLabel();

      if (radarLayer) {
        radarLayer.setOpacity(radarOpacity());
      }
    });

    updateOpacityLabel();
    updatePlaybackLabels();
    prevFrameButton.addEventListener('click', () => stepFrame(-1));
    playPauseButton.addEventListener('click', togglePlayback);
    nextFrameButton.addEventListener('click', () => stepFrame(1));
    resetViewButton.addEventListener('click', resetMapView);
    refreshButton.addEventListener('click', loadRadar);
    loadRadar();
  </script>
</body>
</html>
