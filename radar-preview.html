<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>High-Res KFCX Radar</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  >
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #061a33 !important;
      color: #edf2f7;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #061a33 !important;
    }

    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #05080d;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-container img {
      max-width: none !important;
    }

    .radar-image-layer {
      transition: none !important;
      animation: none !important;
    }

    #radarMap .leaflet-image-layer,
    #radarMap .leaflet-overlay-pane img {
      transition: none !important;
      animation: none !important;
    }

    .leaflet-fade-anim .radar-image-layer {
      transition: none !important;
      animation: none !important;
    }

    .radar-animation-layer,
    .radar-animation-buffer {
      background: transparent !important;
    }

    .radar-animation-layer {
      pointer-events: none;
      overflow: hidden;
      position: absolute;
    }

    .radar-animation-buffer {
      display: block;
      height: 100%;
      left: 0;
      max-width: none !important;
      position: absolute;
      top: 0;
      transition: none !important;
      animation: none !important;
      width: 100%;
    }

    .info-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 1000;
      width: min(320px, calc(100vw - 32px));
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      background: rgba(12, 18, 28, 0.92);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
      padding: 14px;
      backdrop-filter: blur(8px);
    }

    .info-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .info-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .refresh-button {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: #1f2937;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 10px;
    }

    .refresh-button:hover {
      background: #334155;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .details-toggle {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.9);
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 10px;
    }

    .details-toggle:hover {
      background: #334155;
    }

    .info-panel.details-collapsed .details-region {
      display: none;
    }

    .info-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 7px 12px;
      font-size: 13px;
    }

    .info-label {
      color: #94a3b8;
    }

    .info-value {
      min-width: 0;
      overflow-wrap: anywhere;
      color: #f8fafc;
    }

    .controls {
      display: grid;
      gap: 10px;
      margin: 12px 0;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding: 12px 0;
      font-size: 13px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      color: #e2e8f0;
    }

    .control-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
    }

    .opacity-control {
      display: grid;
      gap: 7px;
    }

    .opacity-label {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #e2e8f0;
    }

    .opacity-control input[type="range"] {
      width: 100%;
    }

    .playback-controls {
      display: grid;
      gap: 8px;
    }

    .playback-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .playback-button {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: #1f2937;
      color: #f8fafc;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 8px 10px;
    }

    .playback-button:hover {
      background: #334155;
    }

    .playback-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .speed-control select {
      border: 1px solid rgba(148, 163, 184, 0.55);
      border-radius: 6px;
      background: #1f2937;
      color: #f8fafc;
      font-size: 13px;
      line-height: 1;
      padding: 7px 8px;
    }

    .frame-status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: #cbd5e1;
      font-size: 13px;
    }

    .status {
      margin-top: 12px;
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.35;
    }

    .status.error {
      color: #fca5a5;
    }

    #map,
    #map.leaflet-container {
      background: #061a33 !important;
    }

    #map .navy-road-basemap {
      filter: grayscale(1) invert(1) sepia(0.65) saturate(2.8) hue-rotate(175deg) brightness(0.72) contrast(1.35);
    }

    @media (max-width: 768px) {
      .info-panel {
        top: auto;
        right: 8px;
        bottom: 8px;
        left: 8px;
        width: auto;
        max-height: 34vh;
        padding: 8px;
        overflow: hidden;
      }

      .info-header,
      .details-region,
      .control-row,
      .opacity-control,
      .feed-age-row,
      .last-checked-row,
      .status {
        display: none;
      }

      .controls {
        margin: 0;
        border: 0;
        padding: 0;
      }

      .playback-controls {
        gap: 6px;
      }

      .playback-buttons {
        justify-content: center;
        gap: 5px;
      }

      .playback-button {
        min-width: 64px;
        padding: 9px 8px;
      }

      #resetViewButton {
        display: none;
      }

      .speed-control {
        gap: 4px;
        font-size: 12px;
      }

      .speed-control select {
        font-size: 12px;
        padding: 7px 6px;
      }

      .frame-time-row {
        font-size: 12px;
        justify-content: center;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <section class="info-panel" aria-live="polite">
    <div class="info-header">
      <h1 class="info-title">High-Res KFCX Radar</h1>
      <div class="header-actions">
        <button class="details-toggle" id="detailsToggle" type="button" aria-controls="detailsRegion" aria-expanded="true">Hide Details</button>
        <button class="refresh-button" id="refreshButton" type="button">Refresh</button>
      </div>
    </div>
    <div class="details-region" id="detailsRegion">
      <div class="info-grid" id="infoGrid"></div>
    </div>
    <div class="controls">
      <label class="control-row" for="debugToggle">
        <span>Show radar range box</span>
        <input id="debugToggle" type="checkbox">
      </label>
      <label class="opacity-control" for="opacitySlider">
        <span class="opacity-label">
          <span>Radar opacity</span>
          <span id="opacityValue">1.00</span>
        </span>
        <input id="opacitySlider" type="range" min="0" max="1" step="0.05" value="1">
      </label>
      <div class="playback-controls">
        <div class="playback-buttons">
          <button class="playback-button" id="prevFrameButton" type="button">Previous</button>
          <button class="playback-button" id="playPauseButton" type="button">Play</button>
          <button class="playback-button" id="nextFrameButton" type="button">Next</button>
          <button class="playback-button" id="resetViewButton" type="button">Reset View</button>
          <label class="speed-control" for="playbackSpeedSelect">
            <span>Speed</span>
            <select id="playbackSpeedSelect">
              <option value="0.5">0.5x</option>
              <option value="1">1x</option>
              <option value="2" selected>2x</option>
              <option value="3">3x</option>
              <option value="4">4x</option>
            </select>
          </label>
        </div>
        <div class="frame-status frame-time-row">
          <span id="frameTimeLabel">Frame time unavailable</span>
          <span id="frameCountLabel">0 / 0</span>
        </div>
        <div class="frame-status feed-age-row">
          <span id="feedAgeLabel">Radar scan age: unavailable</span>
        </div>
        <div class="frame-status last-checked-row">
          <span id="lastCheckedLabel">Last checked: unavailable</span>
        </div>
      </div>
    </div>
    <div class="status" id="status">Loading radar catalog...</div>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const SITE = 'KFCX';
    const PRODUCT = 'N0B';
    const RADAR_DATA_BASE_URL = 'https://radar.zacharologistwx.com';
    const CATALOG_URL = `${RADAR_DATA_BASE_URL}/radar/frames.json`;
    const CATALOG_POLL_INTERVAL_MS = 60000;
    const FRAME_CACHE_BUSTER = Date.now();

    const map = L.map('map', {
      zoomControl: true,
      attributionControl: true,
      fadeAnimation: false,
      zoomAnimation: false,
      markerZoomAnimation: false,
      zoomSnap: 0,
      zoomDelta: 0.25,
      wheelPxPerZoomLevel: 180,
      wheelDebounceTime: 40,
    }).setView([37.0, -80.2], 7);

    map.createPane('radarPane');
    map.getPane('radarPane').style.zIndex = 350;

    map.createPane('debugPane');
    map.getPane('debugPane').style.zIndex = 650;

    const roadBaseLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19,
      opacity: 0.82,
      className: 'navy-road-basemap',
    }).addTo(map);

    setTimeout(() => {
      map.invalidateSize();
    }, 0);

    const RadarAnimationLayer = L.Layer.extend({
      initialize(options = {}) {
        this._map = null;
        this._container = null;
        this._bounds = null;
        this._canvas = null;
        this._backingCanvas = null;
        this._swapToken = 0;
        this._opacity = Number.isFinite(options.opacity) ? options.opacity : 1;
      },

      onAdd(layerMap) {
        this._map = layerMap;
        this._container = L.DomUtil.create('div', 'radar-animation-layer');
        this._container.style.opacity = String(this._opacity);
        this._canvas = L.DomUtil.create('canvas', 'radar-animation-buffer', this._container);
        this._backingCanvas = document.createElement('canvas');

        layerMap.getPane('radarPane').appendChild(this._container);
        layerMap.on('move zoom viewreset resize zoomend moveend', this._reset, this);
        this._reset();
      },

      onRemove(layerMap) {
        layerMap.off('move zoom viewreset resize zoomend moveend', this._reset, this);
        if (this._container) {
          this._container.remove();
        }
        this._container = null;
        this._canvas = null;
        this._backingCanvas = null;
        this._map = null;
      },

      setBounds(bounds) {
        this._bounds = L.latLngBounds(bounds);
        this._reset();
      },

      setOpacity(opacity) {
        this._opacity = opacity;
        if (this._container) {
          this._container.style.opacity = String(opacity);
        }
      },

      async showFrame(frame, preparedFrame) {
        if (!this._container || !this._canvas || !this._backingCanvas || !preparedFrame) return false;
        if (!preparedFrame.width || !preparedFrame.height || !preparedFrame.source) return false;

        this._swapToken += 1;
        this.setBounds(frame.bounds);
        const context = this._canvas.getContext('2d');
        const backingContext = this._backingCanvas.getContext('2d');

        if (!context || !backingContext) return false;

        if (this._canvas.width !== preparedFrame.width) {
          this._canvas.width = preparedFrame.width;
        }
        if (this._canvas.height !== preparedFrame.height) {
          this._canvas.height = preparedFrame.height;
        }
        if (this._backingCanvas.width !== preparedFrame.width) {
          this._backingCanvas.width = preparedFrame.width;
        }
        if (this._backingCanvas.height !== preparedFrame.height) {
          this._backingCanvas.height = preparedFrame.height;
        }

        backingContext.imageSmoothingEnabled = true;
        backingContext.clearRect(0, 0, this._backingCanvas.width, this._backingCanvas.height);
        backingContext.drawImage(preparedFrame.source, 0, 0, this._backingCanvas.width, this._backingCanvas.height);

        context.imageSmoothingEnabled = true;
        context.globalCompositeOperation = 'copy';
        context.drawImage(this._backingCanvas, 0, 0);
        context.globalCompositeOperation = 'source-over';
        return true;
      },

      clear() {
        this._swapToken += 1;
        if (!this._canvas) return;

        const backingContext = this._backingCanvas ? this._backingCanvas.getContext('2d') : null;
        if (backingContext) {
          backingContext.clearRect(0, 0, this._backingCanvas.width, this._backingCanvas.height);
        }
      },

      _reset() {
        if (!this._map || !this._container || !this._bounds) return;

        const northWest = this._map.latLngToLayerPoint(this._bounds.getNorthWest());
        const southEast = this._map.latLngToLayerPoint(this._bounds.getSouthEast());
        const size = southEast.subtract(northWest);

        L.DomUtil.setPosition(this._container, northWest);
        this._container.style.width = `${Math.max(0, size.x)}px`;
        this._container.style.height = `${Math.max(0, size.y)}px`;
      },
    });

    const infoGrid = document.getElementById('infoGrid');
    const statusEl = document.getElementById('status');
    const refreshButton = document.getElementById('refreshButton');
    const detailsToggle = document.getElementById('detailsToggle');
    const infoPanel = document.querySelector('.info-panel');
    const debugToggle = document.getElementById('debugToggle');
    const opacitySlider = document.getElementById('opacitySlider');
    const opacityValue = document.getElementById('opacityValue');
    const prevFrameButton = document.getElementById('prevFrameButton');
    const playPauseButton = document.getElementById('playPauseButton');
    const nextFrameButton = document.getElementById('nextFrameButton');
    const resetViewButton = document.getElementById('resetViewButton');
    const playbackSpeedSelect = document.getElementById('playbackSpeedSelect');
    const frameTimeLabel = document.getElementById('frameTimeLabel');
    const frameCountLabel = document.getElementById('frameCountLabel');
    const feedAgeLabel = document.getElementById('feedAgeLabel');
    const lastCheckedLabel = document.getElementById('lastCheckedLabel');
    const BASE_PLAY_INTERVAL_MS = 850;
    const MIN_PLAY_INTERVAL_MS = 180;
    const MIN_MOBILE_PLAY_INTERVAL_MS = 25;
    const LOOP_END_PAUSE_MS = 1200;
    const MOBILE_PLAYBACK_FRAME_LIMIT = 12;
    const MOBILE_DECODED_CACHE_LIMIT = 2;
    const MOBILE_BREAKPOINT_QUERY = '(max-width: 768px)';
    const MOBILE_RESIZE_DEBOUNCE_MS = 250;
    const mobilePlaybackQuery = window.matchMedia(MOBILE_BREAKPOINT_QUERY);
    let radarAnimationLayer = null;
    let radarSiteMarker = null;
    let overlayBoundsRectangle = null;
    let overlayCenterMarker = null;
    let preparedFrameCache = new Map();
    let currentCatalog = null;
    let catalogFramesNewestFirst = [];
    let playbackFrames = [];
    let playbackIndex = 0;
    let visibleRadarLayerIndex = -1;
    let playbackTimer = null;
    let isPlaybackActive = false;
    let playbackPreloadPromise = null;
    let playbackStartToken = 0;
    let frameSwapToken = 0;
    let isAdvancingPlayback = false;
    let isFrameSwapInProgress = false;
    let pendingCatalogApply = null;
    let catalogPollTimer = null;
    let isLoadingRadar = false;
    let isCheckingRadarUpdate = false;
    let latestFrame = null;
    let latestBounds = null;
    let radarBounds = null;
    let playbackModeIsMobile = isMobilePlaybackMode();
    let playbackModeChangeTimer = null;

    function setStatus(message, isError = false) {
      statusEl.textContent = message;
      statusEl.classList.toggle('error', isError);
    }

    function radarOpacity() {
      return Number(opacitySlider.value);
    }

    function updateOpacityLabel() {
      opacityValue.textContent = radarOpacity().toFixed(2);
    }

    function isMobilePlaybackMode() {
      return mobilePlaybackQuery.matches || window.matchMedia('(pointer: coarse)').matches;
    }

    function formatNumber(value, digits = 2) {
      return typeof value === 'number' && Number.isFinite(value)
        ? value.toFixed(digits)
        : null;
    }

    function setInfo(catalog, frame) {
      const stats = frame.stats || {};
      const debug = frame.debug || {};
      const rows = [
        ['site', SITE],
        ['product', PRODUCT],
        ['validTime', frame.validTime],
        ['generatedAt', catalog.generatedAt],
      ];
      const imageAspect = frame.width && frame.height
        ? frame.width / frame.height
        : null;

      if (frame.width !== undefined) {
        rows.push(['frame width', String(frame.width)]);
      }

      if (frame.height !== undefined) {
        rows.push(['frame height', String(frame.height)]);
      }

      if (imageAspect !== null) {
        rows.push(['imageAspect', formatNumber(imageAspect, 4) || String(imageAspect)]);
      }

      if (stats.minVisibleDbz !== undefined) {
        rows.push(['minVisibleDbz', String(stats.minVisibleDbz)]);
      }

      if (stats.minComponentPixels !== undefined) {
        rows.push(['minComponentPixels', String(stats.minComponentPixels)]);
      }

      if (stats.visibleCoveragePercent !== undefined) {
        rows.push(['visibleCoveragePercent', formatNumber(stats.visibleCoveragePercent, 4) || String(stats.visibleCoveragePercent)]);
      }

      if (debug.radarLat !== undefined) {
        rows.push(['radarLat', formatNumber(debug.radarLat, 5) || String(debug.radarLat)]);
      }

      if (debug.radarLon !== undefined) {
        rows.push(['radarLon', formatNumber(debug.radarLon, 5) || String(debug.radarLon)]);
      }

      if (debug.radarOriginPixel !== undefined) {
        rows.push([
          'radarOriginPixel',
          Array.isArray(debug.radarOriginPixel)
            ? debug.radarOriginPixel.map((value) => formatNumber(value, 2) || String(value)).join(', ')
            : String(debug.radarOriginPixel),
        ]);
      }

      if (debug.maxRangeKm !== undefined) {
        rows.push(['maxRangeKm', formatNumber(debug.maxRangeKm, 2) || String(debug.maxRangeKm)]);
      }

      if (debug.renderMode !== undefined) {
        rows.push(['renderMode', String(debug.renderMode)]);
      }

      if (debug.configuredOutputSize !== undefined) {
        rows.push(['configuredOutputSize', String(debug.configuredOutputSize)]);
      }

      if (debug.radialBinsDrawn !== undefined) {
        rows.push(['radialBinsDrawn', String(debug.radialBinsDrawn)]);
      }

      if (debug.nativePolarEnabled !== undefined) {
        rows.push(['nativePolarEnabled', String(debug.nativePolarEnabled)]);
      }

      if (debug.centerNoDataMaskEnabled !== undefined) {
        rows.push(['centerNoDataMaskEnabled', String(debug.centerNoDataMaskEnabled)]);
      }

      if (debug.centerNoDataMaskRadiusKm !== undefined) {
        rows.push(['centerNoDataMaskRadiusKm', formatNumber(debug.centerNoDataMaskRadiusKm, 2) || String(debug.centerNoDataMaskRadiusKm)]);
      }

      if (debug.centerNoDataMaskPixelRadius !== undefined) {
        rows.push(['centerNoDataMaskPixelRadius', formatNumber(debug.centerNoDataMaskPixelRadius, 2) || String(debug.centerNoDataMaskPixelRadius)]);
      }

      if (debug.projectionMode !== undefined) {
        rows.push(['projectionMode', String(debug.projectionMode)]);
      }

      if (debug.mappedShape !== undefined) {
        rows.push(['mappedShape', Array.isArray(debug.mappedShape) ? debug.mappedShape.join(' x ') : String(debug.mappedShape)]);
      }

      infoGrid.replaceChildren(
        ...rows.flatMap(([label, value]) => {
          const labelEl = document.createElement('div');
          labelEl.className = 'info-label';
          labelEl.textContent = label;

          const valueEl = document.createElement('div');
          valueEl.className = 'info-value';
          valueEl.textContent = value || 'unavailable';

          return [labelEl, valueEl];
        })
      );
    }

    function catalogFrames(catalog) {
      const frames = catalog &&
        catalog.frames &&
        catalog.frames[SITE] &&
        catalog.frames[SITE][PRODUCT];

      if (!Array.isArray(frames) || !frames.length) {
        throw new Error('Missing frames.KFCX.N0B[] in radar/frames.json.');
      }

      frames.forEach((frame, index) => {
        if (!Array.isArray(frame.bounds) || frame.bounds.length !== 2) {
          throw new Error(`Radar frame ${index + 1} is missing usable bounds.`);
        }

        if (!frame.url) {
          throw new Error(`Radar frame ${index + 1} is missing a WebP URL.`);
        }
      });

      return frames;
    }

    function playbackFramesForDevice(framesNewestFirst) {
      if (!isMobilePlaybackMode()) {
        return [...framesNewestFirst].reverse();
      }

      return framesNewestFirst.slice(0, MOBILE_PLAYBACK_FRAME_LIMIT).reverse();
    }

    function cacheBustedUrl(url) {
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}v=${Date.now()}`;
    }

    function radarDataUrl(path) {
      const normalizedPath = String(path || '').replace(/^https?:\/\/[^/]+/i, '');
      return new URL(normalizedPath, `${RADAR_DATA_BASE_URL}/`).toString();
    }

    function catalogUrl() {
      return cacheBustedUrl(CATALOG_URL);
    }

    function frameImageUrl(frame) {
      return `${radarDataUrl(frame.url)}?v=${FRAME_CACHE_BUSTER}`;
    }

    function formatFrameTime(frame) {
      const validTime = new Date(frame.validTime);

      if (Number.isNaN(validTime.getTime())) {
        return frame.validTime || 'Frame time unavailable';
      }

      return validTime.toLocaleString([], {
        month: 'short',
        day: 'numeric',
        hour: 'numeric',
        minute: '2-digit',
      });
    }

    function updateFeedAgeLabel(newestFrame) {
      const validTime = newestFrame ? new Date(newestFrame.validTime) : null;

      if (!validTime || Number.isNaN(validTime.getTime())) {
        feedAgeLabel.textContent = 'Radar scan age: unavailable';
        return;
      }

      const ageMinutes = Math.max(0, Math.round((Date.now() - validTime.getTime()) / 60000));
      feedAgeLabel.textContent = ageMinutes >= 25
        ? `Radar scan age: ${ageMinutes} min - Radar feed may be stale`
        : `Radar scan age: ${ageMinutes} min`;
    }

    function formatClockTime(date) {
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      const seconds = String(date.getSeconds()).padStart(2, '0');
      return `${hours}:${minutes}:${seconds}`;
    }

    function updateLastCheckedLabel(date = new Date()) {
      lastCheckedLabel.textContent = `Last checked: ${formatClockTime(date)}`;
    }

    function setDetailsCollapsed(isCollapsed) {
      infoPanel.classList.toggle('details-collapsed', isCollapsed);
      detailsToggle.setAttribute('aria-expanded', String(!isCollapsed));
      detailsToggle.textContent = isCollapsed ? 'Show Details' : 'Hide Details';
    }

    function toggleDetails() {
      setDetailsCollapsed(!infoPanel.classList.contains('details-collapsed'));
    }

    function stopPlayback() {
      playbackStartToken += 1;
      isPlaybackActive = false;

      if (playbackTimer) {
        clearTimeout(playbackTimer);
        playbackTimer = null;
      }

      playPauseButton.textContent = 'Play';
      applyPendingCatalogIfIdle();
    }

    function applyPendingCatalogIfIdle() {
      if (!pendingCatalogApply || isPlaybackActive || isAdvancingPlayback || isFrameSwapInProgress) return;

      const pendingApply = pendingCatalogApply;
      pendingCatalogApply = null;
      applyRadarCatalog(pendingApply.catalog, pendingApply.options);
      setStatus('Radar catalog updated.');
    }

    function getPlaybackIntervalMs() {
      const speed = Number(playbackSpeedSelect.value);
      const safeSpeed = Number.isFinite(speed) && speed > 0 ? speed : 2;
      const minimumInterval = isMobilePlaybackMode()
        ? MIN_MOBILE_PLAY_INTERVAL_MS
        : MIN_PLAY_INTERVAL_MS;
      return Math.max(minimumInterval, Math.round(BASE_PLAY_INTERVAL_MS / safeSpeed));
    }

    function getNextPlaybackDelayMs() {
      return playbackFrames.length > 1 && playbackIndex === playbackFrames.length - 1
        ? LOOP_END_PAUSE_MS
        : getPlaybackIntervalMs();
    }

    async function startPlayback() {
      if (playbackFrames.length < 2) return;

      if (playbackTimer) {
        clearTimeout(playbackTimer);
        playbackTimer = null;
      }

      playPauseButton.textContent = 'Pause';
      isPlaybackActive = true;
      const startToken = ++playbackStartToken;
      const allFramesReady = await preloadPlaybackFrames();

      if (startToken !== playbackStartToken || playbackFrames.length < 2) return;
      if (!allFramesReady) {
        isPlaybackActive = false;
        playPauseButton.textContent = 'Play';
        return;
      }

      schedulePlaybackTick(startToken, getNextPlaybackDelayMs());
    }

    function schedulePlaybackTick(startToken, delayMs) {
      if (!isPlaybackActive || startToken !== playbackStartToken) return;

      playbackTimer = setTimeout(async () => {
        playbackTimer = null;
        if (!isPlaybackActive || startToken !== playbackStartToken) return;

        await advancePlaybackFrame();

        if (!isPlaybackActive || startToken !== playbackStartToken) return;

        schedulePlaybackTick(startToken, getNextPlaybackDelayMs());
      }, delayMs);
    }

    function updatePlaybackLabels() {
      const frame = playbackFrames[playbackIndex];

      frameTimeLabel.textContent = frame ? formatFrameTime(frame) : 'Frame time unavailable';
      frameCountLabel.textContent = playbackFrames.length
        ? `${playbackIndex + 1} / ${playbackFrames.length}`
        : '0 / 0';

      const hasMultipleFrames = playbackFrames.length > 1;
      prevFrameButton.disabled = !hasMultipleFrames;
      playPauseButton.disabled = !hasMultipleFrames;
      nextFrameButton.disabled = !hasMultipleFrames;
      resetViewButton.disabled = !radarBounds;
    }

    function resetMapView() {
      if (!radarBounds) return;

      map.fitBounds(radarBounds, { padding: [24, 24] });
      setTimeout(() => {
        map.invalidateSize();
      }, 50);
    }

    async function preloadFrameImage(url) {
      const image = new Image();
      image.decoding = 'async';
      image.src = url;

      try {
        if (image.decode) {
          await image.decode();
          return image;
        }
      } catch (_error) {
        // Fall through to load/error events for browsers that reject decode early.
      }

      if (image.complete) return image;

      await new Promise((resolve, reject) => {
        image.onload = resolve;
        image.onerror = reject;
      });

      return image;
    }

    async function prepareFrameSurface(url) {
      const image = await preloadFrameImage(url);

      if (window.createImageBitmap) {
        try {
          const bitmap = await createImageBitmap(image);
          return {
            source: bitmap,
            width: bitmap.width,
            height: bitmap.height,
            url,
          };
        } catch (_error) {
          // Fall back to an offscreen canvas below.
        }
      }

      const canvas = document.createElement('canvas');
      canvas.width = image.naturalWidth;
      canvas.height = image.naturalHeight;
      const context = canvas.getContext('2d');
      if (!context) throw new Error('Unable to prepare radar frame surface.');

      context.imageSmoothingEnabled = true;
      context.drawImage(image, 0, 0, canvas.width, canvas.height);
      return {
        source: canvas,
        width: canvas.width,
        height: canvas.height,
        url,
      };
    }

    function releasePreparedFrame(preparedFrame) {
      if (!preparedFrame) return;

      if (preparedFrame.source && typeof preparedFrame.source.close === 'function') {
        preparedFrame.source.close();
        return;
      }

      if (preparedFrame.source && preparedFrame.source instanceof HTMLCanvasElement) {
        preparedFrame.source.width = 0;
        preparedFrame.source.height = 0;
      }
    }

    function releasePreparedFrameCache() {
      preparedFrameCache.forEach((preparedFrame) => {
        releasePreparedFrame(preparedFrame);
      });
      preparedFrameCache = new Map();
    }

    function frameIndexUrl(index) {
      return frameImageUrl(playbackFrames[index]);
    }

    function mobileCacheTargetIndexes(index, direction = 'next') {
      if (!playbackFrames.length) return [];

      const frameCount = playbackFrames.length;
      const current = ((index % frameCount) + frameCount) % frameCount;
      const neighbor = direction === 'previous'
        ? (current - 1 + frameCount) % frameCount
        : (current + 1) % frameCount;

      if (neighbor === current) {
        return [current];
      }

      return [current, neighbor];
    }

    function mobileCacheTargetUrls(index = playbackIndex, direction = 'next') {
      return new Set(
        mobileCacheTargetIndexes(index, direction)
          .slice(0, MOBILE_DECODED_CACHE_LIMIT)
          .map((frameIndex) => frameIndexUrl(frameIndex))
      );
    }

    function prunePreparedFrameCache(keepUrls = new Set()) {
      if (!isMobilePlaybackMode()) return;

      preparedFrameCache.forEach((preparedFrame, url) => {
        if (keepUrls.has(url)) return;

        releasePreparedFrame(preparedFrame);
        preparedFrameCache.delete(url);
      });
    }

    async function preloadFrameWindow(index = playbackIndex, direction = 'next') {
      if (!playbackFrames.length) return true;

      const keepUrls = mobileCacheTargetUrls(index, direction);
      const currentUrl = frameIndexUrl(index);
      prunePreparedFrameCache(keepUrls);
      const preloadResults = await Promise.allSettled(
        [...keepUrls].map(async (url) => {
          if (preparedFrameCache.has(url)) return true;

          const preparedFrame = await prepareFrameSurface(url);
          preparedFrameCache.set(url, preparedFrame);
          return true;
        })
      );

      return preparedFrameCache.has(currentUrl) ||
        preloadResults.every((result) => result.status === 'fulfilled' && result.value === true);
    }

    function warmFrameWindow(index = playbackIndex, direction = 'next') {
      if (!isMobilePlaybackMode()) return;

      preloadFrameWindow(index, direction).catch(() => {});
    }

    function waitForNextPaint(cycles = 2) {
      return new Promise((resolve) => {
        const wait = (remainingCycles) => {
          if (remainingCycles <= 0) {
            resolve();
            return;
          }

          requestAnimationFrame(() => wait(remainingCycles - 1));
        };

        wait(cycles);
      });
    }

    function ensureRadarAnimationLayer() {
      if (!radarAnimationLayer) {
        radarAnimationLayer = new RadarAnimationLayer({ opacity: radarOpacity() }).addTo(map);
      }
    }

    function clearRadarAnimationLayer() {
      frameSwapToken += 1;
      pendingCatalogApply = null;
      releasePreparedFrameCache();
      visibleRadarLayerIndex = -1;
      playbackPreloadPromise = null;
      if (radarAnimationLayer) {
        radarAnimationLayer.remove();
        radarAnimationLayer = null;
      }
    }

    function resetRadarFrameCache() {
      releasePreparedFrameCache();
      playbackPreloadPromise = null;
    }

    async function preloadPlaybackFrames() {
      if (!playbackFrames.length) return Promise.resolve();
      if (playbackPreloadPromise) return playbackPreloadPromise;

      if (isMobilePlaybackMode()) {
        setStatus('Preloading nearby radar frames...');
        playbackPreloadPromise = preloadFrameWindow(playbackIndex, 'next').then((allFramesReady) => {
          if (!allFramesReady) {
            setStatus('Some nearby radar frames failed to preload.', true);
          }

          return allFramesReady;
        });
        return playbackPreloadPromise;
      }

      setStatus('Preloading radar frames...');
      playbackPreloadPromise = Promise.allSettled(
        playbackFrames.map(async (frame) => {
          const url = frameImageUrl(frame);
          const preparedFrame = await prepareFrameSurface(url);
          preparedFrameCache.set(url, preparedFrame);
          return true;
        })
      ).then((results) => {
        const failedCount = results.filter((result) => {
          return result.status === 'rejected' || result.value !== true;
        }).length;

        if (failedCount) {
          setStatus(`${failedCount} radar frame image(s) failed to preload.`, true);
        }

        return failedCount === 0;
      });

      return playbackPreloadPromise;
    }

    async function showFrame(index, { mobileWarmDirection = 'next' } = {}) {
      if (!playbackFrames.length) {
        updatePlaybackLabels();
        return false;
      }

      const targetIndex = (index + playbackFrames.length) % playbackFrames.length;
      const frame = playbackFrames[targetIndex];
      const frameUrl = frameImageUrl(frame);
      const swapToken = ++frameSwapToken;
      isFrameSwapInProgress = true;

      if (isMobilePlaybackMode()) {
        const keepUrls = new Set([frameUrl]);
        if (visibleRadarLayerIndex >= 0 && visibleRadarLayerIndex < playbackFrames.length) {
          keepUrls.add(frameIndexUrl(visibleRadarLayerIndex));
        }
        prunePreparedFrameCache(keepUrls);
      }

      let preparedFrame = preparedFrameCache.get(frameUrl);
      if (!preparedFrame) {
        try {
          preparedFrame = await prepareFrameSurface(frameUrl);
          preparedFrameCache.set(frameUrl, preparedFrame);
        } catch (_error) {
          isFrameSwapInProgress = false;
          applyPendingCatalogIfIdle();
          setStatus('Next radar frame failed to load; keeping current frame visible.', true);
          return false;
        }

        if (swapToken !== frameSwapToken) {
          isFrameSwapInProgress = false;
          applyPendingCatalogIfIdle();
          return false;
        }
      }

      ensureRadarAnimationLayer();
      const bounds = L.latLngBounds(frame.bounds);

      const didSwap = await radarAnimationLayer.showFrame(frame, preparedFrame);
      if (!didSwap || swapToken !== frameSwapToken) {
        isFrameSwapInProgress = false;
        applyPendingCatalogIfIdle();
        return false;
      }

      playbackIndex = targetIndex;
      latestFrame = frame;
      latestBounds = bounds;
      visibleRadarLayerIndex = playbackIndex;
      isFrameSwapInProgress = false;
      applyPendingCatalogIfIdle();
      if (isMobilePlaybackMode()) {
        playbackPreloadPromise = null;
      }
      warmFrameWindow(playbackIndex, mobileWarmDirection);

      updateDebugLayers(frame, bounds);
      setInfo(currentCatalog, frame);
      updatePlaybackLabels();
      setStatus(`Radar frame loaded (${playbackIndex + 1} / ${playbackFrames.length}).`);
      return true;
    }

    function stepFrame(offset) {
      stopPlayback();
      showFrame(playbackIndex + offset, {
        mobileWarmDirection: offset < 0 ? 'previous' : 'next',
      });
    }

    function togglePlayback() {
      if (isPlaybackActive) {
        stopPlayback();
        return;
      }

      startPlayback();
    }

    async function advancePlaybackFrame() {
      if (isAdvancingPlayback) return;

      isAdvancingPlayback = true;
      try {
        await showFrame(playbackIndex + 1, { mobileWarmDirection: 'next' });
      } finally {
        isAdvancingPlayback = false;
      }
    }

    function removeDebugLayers() {
      if (radarSiteMarker) {
        radarSiteMarker.remove();
        radarSiteMarker = null;
      }

      if (overlayBoundsRectangle) {
        overlayBoundsRectangle.remove();
        overlayBoundsRectangle = null;
      }

      if (overlayCenterMarker) {
        overlayCenterMarker.remove();
        overlayCenterMarker = null;
      }
    }

    function updateDebugLayers(frame, bounds) {
      const debug = frame.debug || {};
      const lat = Number(debug.radarLat);
      const lon = Number(debug.radarLon);

      removeDebugLayers();

      if (!debugToggle.checked) {
        return;
      }

      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        radarSiteMarker = L.circleMarker([lat, lon], {
          radius: 9,
          color: '#38bdf8',
          weight: 3,
          fillColor: '#0ea5e9',
          fillOpacity: 1,
          pane: 'debugPane',
        })
          .bindTooltip(`${SITE} radar origin`, {
            permanent: true,
            direction: 'top',
            offset: [0, -10],
          })
          .bindPopup(`${SITE} radar origin`)
          .addTo(map);
      }

      overlayBoundsRectangle = L.rectangle(bounds, {
        color: '#facc15',
        weight: 2,
        opacity: 0.95,
        fillOpacity: 0,
        pane: 'debugPane',
      })
        .bindPopup('Current image overlay bounds')
        .addTo(map);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
        overlayCenterMarker = L.circleMarker(bounds.getCenter(), {
          radius: 6,
          color: '#f87171',
          weight: 2,
          fillColor: '#ef4444',
          fillOpacity: 1,
          pane: 'debugPane',
        })
          .bindTooltip('Bounds center fallback', {
            permanent: true,
            direction: 'top',
            offset: [0, -8],
          })
          .bindPopup('Current overlay bounds center fallback')
          .addTo(map);
      }
    }

    async function fetchRadarCatalog() {
      const response = await fetch(catalogUrl(), {
        cache: 'no-store',
      });

      if (!response.ok) {
        throw new Error(`Unable to load radar/frames.json (${response.status}).`);
      }

      updateLastCheckedLabel();
      return response.json();
    }

    function applyRadarCatalog(catalog, { resetView = true, stopPlaybackForLoad = true } = {}) {
      if (!stopPlaybackForLoad && (isPlaybackActive || isAdvancingPlayback || isFrameSwapInProgress)) {
        pendingCatalogApply = {
          catalog,
          options: { resetView, stopPlaybackForLoad },
        };
        setStatus('Radar catalog update ready; applying when playback stops.');
        return false;
      }

      const previousPlaybackIndex = playbackIndex;
      const wasViewingNewest = playbackFrames.length > 0 &&
        previousPlaybackIndex === playbackFrames.length - 1;

      currentCatalog = catalog;
      playbackModeIsMobile = isMobilePlaybackMode();
      catalogFramesNewestFirst = [...catalogFrames(catalog)].sort((a, b) => {
        return new Date(b.validTime) - new Date(a.validTime);
      });
      updateFeedAgeLabel(catalogFramesNewestFirst[0]);
      playbackFrames = playbackFramesForDevice(catalogFramesNewestFirst);
      const nextPlaybackIndex = stopPlaybackForLoad
        ? playbackFrames.length - 1
        : wasViewingNewest
          ? playbackFrames.length - 1
          : Math.min(previousPlaybackIndex, Math.max(0, playbackFrames.length - 1));

      if (stopPlaybackForLoad) {
        stopPlayback();
      }

      resetRadarFrameCache();
      ensureRadarAnimationLayer();
      const preloadPromise = isMobilePlaybackMode()
        ? Promise.resolve(true)
        : preloadPlaybackFrames();
      radarBounds = playbackFrames[nextPlaybackIndex]
        ? L.latLngBounds(playbackFrames[nextPlaybackIndex].bounds)
        : null;

      showFrame(nextPlaybackIndex).then((didSwap) => {
        if (!didSwap) return;
        preloadPromise.catch(() => {});
      });

      if (resetView) {
        resetMapView();
      }

      return true;
    }

    async function loadRadar() {
      if (isLoadingRadar) return;

      isLoadingRadar = true;
      refreshButton.disabled = true;
      setStatus('Loading radar catalog...');

      try {
        const catalog = await fetchRadarCatalog();
        applyRadarCatalog(catalog);
      } catch (error) {
        stopPlayback();
        clearRadarAnimationLayer();

        removeDebugLayers();
        currentCatalog = null;
        catalogFramesNewestFirst = [];
        playbackFrames = [];
        playbackIndex = 0;
        visibleRadarLayerIndex = -1;
        latestFrame = null;
        latestBounds = null;
        radarBounds = null;

        infoGrid.replaceChildren();
        updateFeedAgeLabel(null);
        updatePlaybackLabels();
        setStatus(error.message || 'Radar preview failed to load.', true);
      } finally {
        isLoadingRadar = false;
        refreshButton.disabled = false;
      }
    }

    async function checkForRadarUpdate() {
      if (isLoadingRadar || isCheckingRadarUpdate) return;

      isCheckingRadarUpdate = true;

      try {
        const catalog = await fetchRadarCatalog();
        if (isLoadingRadar) return;

        if (!currentCatalog || catalog.generatedAt !== currentCatalog.generatedAt) {
          const didApplyCatalog = applyRadarCatalog(catalog, {
            resetView: false,
            stopPlaybackForLoad: false,
          });
          if (didApplyCatalog) {
            setStatus('Radar catalog updated.');
          }
          return;
        }

        if (catalogFramesNewestFirst.length) {
          updateFeedAgeLabel(catalogFramesNewestFirst[0]);
        }
      } catch (error) {
        setStatus(error.message || 'Radar update check failed.', true);
      } finally {
        isCheckingRadarUpdate = false;
      }
    }

    function handlePlaybackDeviceModeChange() {
      if (playbackModeChangeTimer) {
        clearTimeout(playbackModeChangeTimer);
      }

      playbackModeChangeTimer = setTimeout(() => {
        playbackModeChangeTimer = null;

        if (!currentCatalog || isLoadingRadar || isCheckingRadarUpdate || isFrameSwapInProgress) return;

        const nextModeIsMobile = isMobilePlaybackMode();
        if (nextModeIsMobile === playbackModeIsMobile) return;

        applyRadarCatalog(currentCatalog, {
          resetView: false,
          stopPlaybackForLoad: true,
        });
      }, MOBILE_RESIZE_DEBOUNCE_MS);
    }

    debugToggle.addEventListener('change', () => {
      if (debugToggle.checked && latestFrame && latestBounds) {
        updateDebugLayers(latestFrame, latestBounds);
        return;
      }

      removeDebugLayers();
    });

    opacitySlider.addEventListener('input', () => {
      updateOpacityLabel();

      if (radarAnimationLayer) {
        radarAnimationLayer.setOpacity(radarOpacity());
      }
    });

    updateOpacityLabel();
    updatePlaybackLabels();
    setDetailsCollapsed(window.matchMedia('(max-width: 768px)').matches);
    prevFrameButton.addEventListener('click', () => stepFrame(-1));
    playPauseButton.addEventListener('click', togglePlayback);
    nextFrameButton.addEventListener('click', () => stepFrame(1));
    resetViewButton.addEventListener('click', resetMapView);
    playbackSpeedSelect.addEventListener('change', () => {
      if (isPlaybackActive) {
        startPlayback();
      }
    });
    detailsToggle.addEventListener('click', toggleDetails);
    refreshButton.addEventListener('click', loadRadar);
    if (typeof mobilePlaybackQuery.addEventListener === 'function') {
      mobilePlaybackQuery.addEventListener('change', handlePlaybackDeviceModeChange);
    } else if (typeof mobilePlaybackQuery.addListener === 'function') {
      mobilePlaybackQuery.addListener(handlePlaybackDeviceModeChange);
    }
    loadRadar();
    catalogPollTimer = setInterval(checkForRadarUpdate, CATALOG_POLL_INTERVAL_MS);
  </script>
</body>
</html>
